// 予約枠の時間単位（分）を指定して時間の選択肢を生成する
function buildSlots(unit){
  unit = unit || DEFAULT_SLOT_UNIT;
  const slots=[];
  for(let h=9;h<=19;h++){
    for(let m=0;m<60;m+=unit){
      if(h===19&&m>0) break;
      slots.push(`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`);
    }
  }
  return slots;
}

function toMin(t){
  var parts = t.split(":");
  return parseInt(parts[0])*60 + parseInt(parts[1]);
}
function fmtDate(d){
  return d.getFullYear()+"-"+
    String(d.getMonth()+1).padStart(2,"0")+"-"+
    String(d.getDate()).padStart(2,"0");
}
function fmtDateJP(d){
  return (d.getMonth()+1)+"月"+d.getDate()+"日（"+DAYS_JP[d.getDay()]+"）";
}
function getDays(n){
  var arr=[];
  for(var i=0;i<n;i++){
    var d=new Date();
    d.setDate(d.getDate()+i);
    arr.push(d);
  }
  return arr;
}

  // 営業時間・臨時休業日を取得（1回だけ）
  // 店舗名「香里園」で該当店舗を検索し、この予約フォーム専用の店舗として使う。

  useEffect(function(){

    var wd = getWeekDays(weekStart);

  // ===== 営業時間ヘルパー =====
  function getDayHours(dayOfWeek){
    for(var i=0;i<businessHours.length;i++){
      if(businessHours[i].day_of_week===dayOfWeek) return businessHours[i];
    }
    return null;

  function getClosureForDate(ds){
    for(var i=0;i<closures.length;i++){
      if(closures[i].date===ds) return closures[i];
    }
    return null;
  }
  function isClosedDate(d){
    var ds = fmtDate(d);
    if(pageSettings.bookingMinDate && ds < pageSettings.bookingMinDate) return true; // 受付開始日より前は常にクローズ扱い
    var today0=new Date();today0.setHours(0,0,0,0);
    if(pageSettings.allowSameDay===false && ds===fmtDate(today0)) return true; // 当日予約を許可しない設定
    if(pageSettings.daysAhead){
      var maxD=new Date(today0);maxD.setDate(maxD.getDate()+pageSettings.daysAhead);
      if(ds > fmtDate(maxD)) return true; // 「何日先まで予約可能か」を超えている
    }
    var closureEntry = getClosureForDate(ds);
    if(closureEntry && closureEntry.is_closed!==false) return true; // 終日休業（is_closedがfalseの行＝営業時間変更は除く）
    // イベント期間中（10/1〜10/4）は曜日にかかわらず必ず営業（定休日等の通常設定より優先）
    if(isEventDate(d)) return false;
    if(closureEntry && closureEntry.is_closed===false) return false; // 営業時間変更日は「開いている」扱い（時間はisTimeAllowedForDateで判定）
    // 営業時間データが未設定の場合は制限しない（フェイルセーフ）
    if(businessHours.length===0) return false;
    var dh = getDayHours(d.getDay());
    if(!dh) return false;
    return dh.is_open===false;
  }
  function isTimeAllowedForDate(d,t){
    var ds = fmtDate(d);
    var closureEntry = getClosureForDate(ds);
    // 「営業時間だけ変更」の日は、通常の曜日設定ではなくこの時間帯を使う（イベント期間中でも優先）
    if(closureEntry && closureEntry.is_closed===false && closureEntry.open_time && closureEntry.close_time){
      var tmC = toMin(t);
      return tmC>=toMin(closureEntry.open_time) && tmC<toMin(closureEntry.close_time);
    }
    // イベント期間中（10/1〜10/4）は曜日にかかわらず10:00〜20:00で固定
    if(isEventDate(d)){
      var tmE = toMin(t);
      return tmE>=toMin("10:00") && tmE<toMin("20:00");
    }
    if(businessHours.length===0) return true;
    var dh = getDayHours(d.getDay());
    if(!dh || dh.is_open===false) return false;
    var tm = toMin(t);
    var openM = toMin(dh.open_time||"09:00");
    var closeM = toMin(dh.close_time||"19:00");
    if(tm<openM || tm>=closeM) return false;
    var brs = dh.break_times||[];
    for(var i=0;i<brs.length;i++){
      var bs=toMin(brs[i].start), be=toMin(brs[i].end);
      if(tm>=bs && tm<be) return false;
    }
    return true;
  }
  function isPastSlotForDate(d,t){
    var now = new Date();
    var slotDateTime = new Date(fmtDate(d)+"T"+t+":00");
    // 「何時間前まで予約可能か」の設定を考慮（0＝制限なし＝今の瞬間までOK）
    var cutoff = new Date(now.getTime() + (pageSettings.hoursBefore||0)*60*60*1000);
    return slotDateTime <= cutoff;

  // bookingsテーブルに duration が保存されている場合はそちらを優先する。
  var DURATION_MAP = {
    "鍼灸併用 3割 初診":20,"鍼灸併用 3割 2回目以降":20,"鍼灸のみ 3割 初診":20,"鍼灸のみ 3割 2回目以降":20,
    "鍼灸併用 2割 初診":20,"鍼灸併用 2割 2回目以降":20,"鍼灸のみ 2割 初診":20,"鍼灸のみ 2割 2回目以降":20,
    "鍼灸併用 1割 初診":20,"鍼灸併用 1割 2回目以降":20,"鍼灸のみ 1割 初診":20,"鍼灸のみ 1割 2回目以降":20,

    "手技療法 2割 初診":20,"手技療法 2割 2回目":20,"手技療法 2割 3回目":20,"手技療法 2割 4回目以降":20,
    "手技療法 1割 初診":20,"手技療法 1割 2回目":20,"手技療法 1割 3回目":20,"手技療法 1割 4回目以降":20,

    "アジャスト・超音波 5回券":20,"アジャスト・超音波 11回券":20,"アジャスト・超音波 23回券":20,
    "鍼治療・ハイボルテージ 5回券":20,"鍼治療・ハイボルテージ 11回券":20,"鍼治療・ハイボルテージ 23回券":20,
    "姿勢矯正・骨盤矯正・ストレッチ・鍼治療 8回券":30,"姿勢矯正・骨盤矯正・ストレッチ・鍼治療 16回券":30,"姿勢矯正・骨盤矯正・ストレッチ・鍼治療 24回券":30,
    "フリーパス 1ヶ月":30,"フリーパス 3ヶ月":30,"フリーパス 6ヶ月":30,"フリーパス 12ヶ月":30,
    "無料カウンセリング":60,"体験施術":60,
    "初めての方（初診）":60,"久しぶりの方（要確認）":40,"2回目以降の方":30,
  };
  // 表記上は「60分（カウンセリング込み）」だが、実際に予約枠として確保する時間は40分
  DURATION_MAP[pageSettings.eventMenuName]=40;
  DURATION_MAP["再診（30分）"]=30;
  function getBookingDuration(b){
    return b.duration || DURATION_MAP[b.menu] || 30;
  }
  // イベント期間終了後（10/5以降）に選んでいただく3パターン
  var PATIENT_TYPE_OPTIONS = [
    {label:"初めての方",menu:"初めての方（初診）",desc:"当院へのご来院が初めての方"},
    {label:"久しぶりの方",menu:"久しぶりの方（要確認）",desc:"しばらく期間が空いている方（最終来院から30日以上など）"},
    {label:"2回目以降の方",menu:"2回目以降の方",desc:"継続して通院されている方"},
  ];
  // 予約の施術時間が、患者ページの1枠（20分）と時間的に重なっているかどうか
  function overlapsSlot(b,t){
    var bs=toMin(b.time), be=bs+getBookingDuration(b);
    var ss=toMin(t), se=ss+20;
    return bs<se && ss<be;
  }
  // 指定した日時に既に入っている予約数（キャンセル除く・施術時間の重なりも考慮）
  function getBookedCountAt(d,t){
    var ds = fmtDate(d);
    return weekData.booked.filter(function(b){return b.date===ds && overlapsSlot(b,t);}).length;
  }
  // 指定した日時に対応可能なスタッフ一覧（休憩・既存予約が入っている人を除く。施術時間の重なりも考慮）
  function getFreeStaffListFor(d,t){
    var ds = fmtDate(d);
    var unavail = {};
    weekData.booked.forEach(function(b){if(b.date===ds&&overlapsSlot(b,t)) unavail[b.staff_id]=true;});
    weekData.breaks.forEach(function(b){if(b.date===ds&&b.time===t) unavail[b.staff_id]=true;});
    return STAFF.filter(function(s){return !unavail[s.id];});
  }
  // 指定した日時の残り受付可能数（「1枠あたりの上限」と「対応できるスタッフの人数」のうち小さい方）
  function getRemainingCount(d,t){
    var capacity = getSlotCapacity(fmtDate(d));
    var capacityLeft = capacity - getBookedCountAt(d,t);
    var freeStaffCount = getFreeStaffListFor(d,t).length;
    return Math.max(0, Math.min(capacityLeft, freeStaffCount));
  }
  function getAvailableStaffIdFor(d,t){
    if(getRemainingCount(d,t)<=0) return null;
    var free = getFreeStaffListFor(d,t);
    return free.length>0 ? free[0].id : null;
  }

  function getAvailableStaffId(t){
    if(!selDate) return null;
    return getAvailableStaffIdFor(selDate,t);
  }

  // 予約を確定する直前に、その場でもう一度Supabaseへ空き状況を問い合わせて確認する。
  // 画面表示中の空き情報は多少タイムラグがあるため、ほぼ同時に他の方が同じ枠を
  // 予約してしまう「かぶり」を防ぐための最終チェック。
  // 空いていれば staff_id を、埋まっていれば null を返す。
  function checkStaffAvailabilityNow(dateStr,time){
    return Promise.all([
      sb.select("bookings","?date=eq."+dateStr),
      sb.select("staff_breaks","?date=eq."+dateStr+"&time=eq."+time)
    ]).then(function(results){
      var dayBookings = Array.isArray(results[0]) ? results[0] : [];
      var dayBreaks = Array.isArray(results[1]) ? results[1] : [];
      var activeOverlapping = dayBookings.filter(function(b){return !b.cancelled && overlapsSlot(b,time);});

      // 1枠あたりの上限に達していないか確認（施術時間の重なりも考慮）
      var capacity = getSlotCapacity(dateStr);
      if(activeOverlapping.length >= capacity) return null;

      var unavail = {};
      activeOverlapping.forEach(function(b){ unavail[b.staff_id]=true; });
      dayBreaks.forEach(function(b){ unavail[b.staff_id]=true; });
      var found = STAFF.find(function(s){return !unavail[s.id];});
      return found ? found.id : null;
    }).catch(function(){
      return undefined; // 通信エラー時は判定不能。呼び出し側でフォールバックする
    });
  }


  function formatBodyParts(parts,other){

    if(pageSettings.eventMenuPrice<=0){
      return "🎁 "+pageSettings.eventMenuName+"　無料";
    }
    return isReferred()
      ? "🎁 "+pageSettings.eventMenuName+"　紹介特典で無料！"
      : "🪙 "+pageSettings.eventMenuName+"　¥"+pageSettings.eventMenuPrice;
  }

      var staffId = (freshStaffId===undefined) ? getAvailableStaffId(selTime) : freshStaffId;
      if(!staffId){
        setSubmitting(false);
        setSlotFullMsg("大変申し訳ございません、ちょうどこの日時が埋まってしまいました。お手数ですが別の日時をお選びください。");

      reminded:false,

      medical_history:form.medicalHistory,

        newBookingId = result[0].id;

      // グループLINEへ通知

        "👤 "+form.name+" 様\n"+
        "📞 "+form.phone+"\n"+

      fetch("/api/line-notify",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({groupId:LINE_GROUP_ID, message:msg})
      }).catch(function(){});

      // LINE連携済みの患者へ予約確認メッセージを送信
      if(lineUserId && newBookingId){
        console.log("send-confirmation呼び出し:", {userId: lineUserId, bookingId: newBookingId});
        fetch("/api/send-confirmation",{
          method:"POST",
          headers:{"Content-Type":"application/json"},

            userId: lineUserId,
            bookingId: newBookingId,
            patientName: form.name,
            date: fmtDateJP(selDate),

          console.error("send-confirmation error:", e);
        });
      } else {
        console.log("QR送信スキップ:", {lineUserId: lineUserId, bookingId: newBookingId});
      }
    }).catch(function(){}).finally(function(){
      setDone(true);
      setSubmitting(false);
    });
  }
