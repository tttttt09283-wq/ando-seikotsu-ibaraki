}
function StaffOffConflictsPanel({bookings,weeklyShifts,dateOverrides,storeStaff,onReassign,onReschedule,todayStr}){
  const [savingId,setSavingId]=React.useState(null);
  const [rescheduleForm,setRescheduleForm]=React.useState({}); // {bookingId: {date, time}}
    function isWorkingLocal(staffId,dateStr){
    const dov=(dateOverrides||[]).find(o=>o.staff_id===staffId&&o.date===dateStr);
    if(dov) return dov.is_working!==false;
    const monthKey=dateStr.slice(0,7);
    try{
      const raw=localStorage.getItem("shifts_"+monthKey);
      if(raw){
        const map=JSON.parse(raw);
        const val=map[staffId+"_"+dateStr];
        if(val) return val==="出勤";
      }
    }catch(e){}
    const dow=new Date(dateStr+"T00:00:00").getDay();
    const ws=weeklyShifts.find(w=>w.staff_id===staffId&&w.day_of_week===dow);
    if(ws) return ws.is_working!==false;
    return true;
  }
  const conflicts=React.useMemo(()=>{
    return bookings.filter(b=>!b.cancelled&&b.date>=todayStr&&!isWorkingLocal(b.staff_id,b.date))
      .sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time));
  },[bookings,weeklyShifts,todayStr]);
  async function reassign(booking,newStaffId){
    setSavingId(booking.id);
    await onReassign(booking,Number(newStaffId));
    setSavingId(null);
  }
  async function reschedule(booking){
    const f=rescheduleForm[booking.id];
    if(!f||!f.date||!f.time){ return; }
    setSavingId(booking.id);
    await onReschedule(booking,f.date,f.time);
    setSavingId(null);
  }
  function updateRescheduleField(bookingId,key,val){
    setRescheduleForm(prev=>({...prev,[bookingId]:{...(prev[bookingId]||{}),[key]:val}}));
  }
  return(
    <div style={{maxWidth:1000,margin:"0 auto"}}>
      <div className="card" style={{marginBottom:14}}>
        <div style={{padding:"14px 16px",borderBottom:"1px solid #f1f5f9",background:"linear-gradient(135deg,#d97706,#b45309)"}}>
          <div style={{color:"white",fontWeight:800,fontSize:15}}>⚠ 休みスタッフの予約（要対応）</div>
          <div style={{color:"rgba(255,255,255,.85)",fontSize:12,marginTop:2}}>担当スタッフがその日休みに設定されているため、カレンダー上では表示されていない予約です。出勤しているスタッフへ振り替えるか、別の日に移動してください。</div>
        </div>

      <div className="card">
        <div style={{padding:"12px 16px",borderBottom:"1px solid #f1f5f9",fontWeight:800,fontSize:13,color:"#1e3a5f"}}>対象の予約（{conflicts.length}件）</div>
        <div style={{padding:"8px 16px"}}>
          {conflicts.length===0?(
            <div style={{textAlign:"center",padding:30,color:"#94a3b8",fontSize:13}}>対象の予約はありません🎉</div>
          ):conflicts.map(b=>{
            const oldStaff=STAFF_ACCOUNTS.find(s=>s.id===b.staff_id)||{name:"不明",color:"#888"};
            const workingStaff=(storeStaff||STAFF_ACCOUNTS).filter(s=>isWorkingLocal(s.id,b.date));
            const rf=rescheduleForm[b.id]||{date:"",time:""};
            return(
              <div key={b.id} style={{padding:"12px 0",borderBottom:"1px solid #f1f5f9"}}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,flexWrap:"wrap",marginBottom:10}}>
                  <div>
                    <div style={{fontWeight:700,fontSize:14,color:"#1e293b"}}>{b.patient_name}</div>
                    <div style={{fontSize:12,color:"#64748b"}}>{b.date} {b.time}　{b.menu}</div>
                    <div style={{fontSize:11,color:"#d97706",fontWeight:700,marginTop:2}}>現在の担当：{oldStaff.name}（この日休み）</div>
                  </div>
                  <div style={{display:"flex",gap:6,alignItems:"center"}}>
                    <select disabled={savingId===b.id} onChange={e=>{if(e.target.value)reassign(b,e.target.value);}} defaultValue=""
                      style={{padding:"7px 10px",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:12,fontFamily:"inherit"}}>
                      <option value="" disabled>同じ日で担当を選ぶ</option>
                      {workingStaff.length===0?<option disabled>この日出勤スタッフなし</option>:workingStaff.map(s=>(<option key={s.id} value={s.id}>{s.name}</option>))}
                    </select>
                  </div>
                </div>
                <div style={{background:"#fffbeb",border:"1px dashed #fde68a",borderRadius:8,padding:"10px 12px",display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
                  <span style={{fontSize:11,fontWeight:700,color:"#92400e",whiteSpace:"nowrap"}}>📅 別の日に移動：</span>

                    style={{padding:"6px 8px",border:"1.5px solid #e2e8f0",borderRadius:6,fontSize:12,fontFamily:"inherit"}}/>
                  <select value={rf.time} onChange={e=>updateRescheduleField(b.id,"time",e.target.value)}
                    style={{padding:"6px 8px",border:"1.5px solid #e2e8f0",borderRadius:6,fontSize:12,fontFamily:"inherit"}}>
                    <option value="">時間を選ぶ</option>

                  </select>
                  <button disabled={savingId===b.id||!rf.date||!rf.time} onClick={()=>reschedule(b)}
                    style={{padding:"6px 14px",background:"#d97706",color:"white",border:"none",borderRadius:6,fontSize:12,fontWeight:700,cursor:(savingId===b.id||!rf.date||!rf.time)?"not-allowed":"pointer",opacity:(savingId===b.id||!rf.date||!rf.time)?0.5:1,fontFamily:"inherit"}}>

}
function CareerWeightPanel({bookings,payments,storeStaff,selStoreId,todayStr}){
  const [passes,setPasses]=React.useState([]);
  const [selMonth,setSelMonth]=React.useState(todayStr.slice(0,7));

  React.useEffect(()=>{
    sb.select("passes","?order=expiry_date.asc.nullslast").then(rows=>{
      setPasses(Array.isArray(rows)?rows:[]);
    }).catch(()=>setPasses([]));
  },[]);

  const [y,m]=selMonth.split("-").map(Number);
  const rangeStart=`${y}-${String(m).padStart(2,"0")}-01`;
  const lastDay=new Date(y,m,0).getDate();
  const rangeEnd=`${y}-${String(m).padStart(2,"0")}-${String(lastDay).padStart(2,"0")}`;
  const inRange=(d)=>d>=rangeStart&&d<=rangeEnd;

  const firstStoreId=1;
  const scopedBookings=React.useMemo(()=>bookings.filter(b=>(b.store_id||firstStoreId)===selStoreId),[bookings,selStoreId]);

  const patientHistory=React.useMemo(()=>{
    const map={};
    [...scopedBookings].filter(b=>!b.cancelled).sort((a,b)=>a.date.localeCompare(b.date)).forEach(b=>{
      if(!map[b.patient_name]) map[b.patient_name]={dates:[],firstStaffId:b.staff_id,firstDate:b.date};
      map[b.patient_name].dates.push(b.date);
    });
    return map;
  },[scopedBookings]);

  const newPatients=React.useMemo(()=>{
    return Object.entries(patientHistory)
      .filter(([name,h])=>inRange(h.firstDate))
      .map(([name,h])=>({name,staffId:h.firstStaffId,totalVisits:h.dates.length}));
  },[patientHistory,rangeStart,rangeEnd]);

  const bookingByIdMap=React.useMemo(()=>{
    const map={};
    scopedBookings.forEach(b=>{map[b.id]=b;});
    return map;
  },[scopedBookings]);
  const scopedPayments=React.useMemo(()=>{
    const ids=new Set(scopedBookings.map(b=>b.id));
    return payments.filter(p=>ids.has(p.booking_id)&&p.payment_date&&inRange(p.payment_date));
  },[payments,scopedBookings,rangeStart,rangeEnd]);

  function staffSalesActual(staffId){
    return scopedPayments.filter(p=>{const b=bookingByIdMap[p.booking_id];return b&&b.staff_id===staffId;}).reduce((s,p)=>s+(p.total_amount||0),0);
  }
  function staffSalesTarget(staffId){
    try{
      const key=`ando_sales_target_staff_${selStoreId||"all"}_${staffId}_${selMonth}`;
      return Number(localStorage.getItem(key))||0;
    }catch(e){ return 0; }
  }

  function staffMetrics(staffId){
    const mine=newPatients.filter(p=>p.staffId===staffId);
    const assignedCount=mine.length;
    const continuedCount=mine.filter(p=>p.totalVisits>=2).length;
    const contractedCount=mine.filter(p=>passes.some(ps=>ps.patient_name===p.name&&ps.purchased_date&&inRange(ps.purchased_date))).length;
    return {assignedCount,continuedCount,contractedCount};
  }

  const activePasses=passes.filter(p=>p.active!==false);
  const ticketPasses=activePasses.filter(p=>!(p.pass_type||"").includes("フリーパス"));
  const fpPasses=activePasses.filter(p=>(p.pass_type||"").includes("フリーパス"));
  const ticketPatientCount=new Set(ticketPasses.map(p=>p.patient_name)).size;
  const fpPatientCount=new Set(fpPasses.map(p=>p.patient_name)).size;
  const ticketLowCount=ticketPasses.filter(p=>(p.remaining_count||0)<=2).length;

  function daysUntil(dateStr){
    if(!dateStr) return null;
    return Math.ceil((new Date(dateStr+"T00:00:00")-new Date())/86400000);
  }
  const fpExpiringSoonCount=fpPasses.filter(p=>{const d=daysUntil(p.expiry_date);return d!=null&&d<=7&&d>=0;}).length;

  const insuranceOnlyCount=React.useMemo(()=>{
    const byPatient={};
    scopedPayments.forEach(p=>{
      const b=bookingByIdMap[p.booking_id];
      if(!b) return;
      if(!byPatient[b.patient_name]) byPatient[b.patient_name]={ins:0,jifee:0};
      byPatient[b.patient_name].ins+=(p.insurance_amount||0);
      byPatient[b.patient_name].jifee+=(p.jifee_amount||0);
    });
    return Object.values(byPatient).filter(v=>v.ins>0&&v.jifee===0).length;
  },[scopedPayments,bookingByIdMap]);

  return(
    <div style={{maxWidth:1300,margin:"0 auto"}}>
      <div className="card" style={{marginBottom:14,padding:"14px 16px"}}>
        <div style={{fontWeight:800,fontSize:15,color:"#1e3a5f",marginBottom:10}}>📊 評価用サマリー</div>
        <div style={{fontSize:12,color:"#94a3b8",marginBottom:10}}>ここで見えている数値を、評価シートへの入力にそのままお使いください。</div>
        <input type="month" value={selMonth} onChange={e=>setSelMonth(e.target.value)}
          style={{padding:"6px 10px",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:13,fontWeight:700}}/>
      </div>

      <div className="card" style={{marginBottom:14}}>
        <div style={{padding:"12px 16px",borderBottom:"1px solid #f1f5f9",fontWeight:800,fontSize:13,color:"#1e3a5f"}}>スタッフ別 実績（{selMonth}）</div>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:12,minWidth:800}}>
            <thead>
              <tr style={{background:"#f8fafc",borderBottom:"2px solid #e2e8f0"}}>
                {["スタッフ","新患担当数","継続数","成約数","個人目標","個人実績"].map(h=>(
                  <th key={h} style={{padding:"8px 10px",textAlign:"left",fontWeight:800,color:"#64748b"}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {(storeStaff||[]).map(s=>{
                const met=staffMetrics(s.id);
                const target=staffSalesTarget(s.id);
                const actual=staffSalesActual(s.id);
                return(
                  <tr key={s.id} style={{borderBottom:"1px solid #f1f5f9"}}>
                    <td style={{padding:"8px 10px",fontWeight:700}}>{s.name}</td>
                    <td style={{padding:"8px 10px"}}>{met.assignedCount}人</td>
                    <td style={{padding:"8px 10px"}}>{met.continuedCount}人</td>
                    <td style={{padding:"8px 10px"}}>{met.contractedCount}人</td>
                    <td style={{padding:"8px 10px"}}>{target>0?"¥"+target.toLocaleString():"未設定"}</td>
                    <td style={{padding:"8px 10px",fontWeight:700,color:"#059669"}}>¥{actual.toLocaleString()}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
        <div style={{padding:"10px 16px",fontSize:11,color:"#94a3b8"}}>
          ・新患担当数／継続数／成約数は、その月に初来院した患者を初回担当スタッフに紐づけて集計しています<br/>
          ・個人目標は「予約分析・サマリー」で設定した個人目標売上をそのまま表示しています
        </div>
      </div>

      <div className="card" style={{padding:"14px 16px"}}>
        <div style={{fontWeight:800,fontSize:15,color:"#1e3a5f",marginBottom:4}}>🎫 パス・保険サマリー</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginTop:10,marginBottom:10}}>
          <div style={{background:"#f8fafc",borderRadius:10,padding:"12px",textAlign:"center"}}>
            <div style={{fontSize:24,fontWeight:800,color:"#2563eb"}}>{insuranceOnlyCount}</div>
            <div style={{fontSize:11,color:"#64748b",fontWeight:700}}>保険のみ患者数（{selMonth}）</div>
          </div>
          <div style={{background:"#f8fafc",borderRadius:10,padding:"12px",textAlign:"center"}}>
            <div style={{fontSize:24,fontWeight:800,color:"#d97706"}}>{ticketPatientCount}</div>
            <div style={{fontSize:11,color:"#64748b",fontWeight:700}}>回数券実施中の患者数</div>
          </div>
          <div style={{background:"#f8fafc",borderRadius:10,padding:"12px",textAlign:"center"}}>
            <div style={{fontSize:24,fontWeight:800,color:"#7c3aed"}}>{fpPatientCount}</div>
            <div style={{fontSize:11,color:"#64748b",fontWeight:700}}>フリーパス実施中の患者数</div>
          </div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:10}}>
          <div style={{background:"#fef2f2",borderRadius:10,padding:"12px",textAlign:"center",border:"1px solid #fecaca"}}>
            <div style={{fontSize:24,fontWeight:800,color:"#dc2626"}}>{ticketLowCount}</div>
            <div style={{fontSize:11,color:"#991b1b",fontWeight:700}}>回数券 残りわずか（2回以下）</div>
          </div>
          <div style={{background:"#fef2f2",borderRadius:10,padding:"12px",textAlign:"center",border:"1px solid #fecaca"}}>
            <div style={{fontSize:24,fontWeight:800,color:"#dc2626"}}>{fpExpiringSoonCount}</div>
            <div style={{fontSize:11,color:"#991b1b",fontWeight:700}}>フリーパス 期限間近（7日以内）</div>
          </div>
        </div>
      </div>
    </div>
  );
}

  React.useEffect(()=>{
    Promise.all([
      sb.select("treatments","?order=treated_at.desc"),
      sb.select("passes","?order=purchased_date.desc.nullslast"),
    ]).then(([t,p])=>{
      setTreatments(Array.isArray(t)?t:[]);
      setPassesRaw(Array.isArray(p)?p:[]);
      setLoading(false);
    }).catch(()=>setLoading(false));
  },[]);
  // トレーニングモードの表示中は練習用の回数券・FPだけを、通常時は本番のものだけを集計対象にする
  const passes=React.useMemo(()=>passesRaw.filter(p=>!!p.is_training===!!trainingMode),[passesRaw,trainingMode]);

  const [y,m]=selMonth.split("-").map(Number);
  const monthStart=`${y}-${String(m).padStart(2,"0")}-01`;
  // 集計開始日（10/5）より前は含めない：選んだ月の開始日と集計開始日の遅いほうから数える
  const rangeStart=monthStart<STAFF_KPI_START?STAFF_KPI_START:monthStart;
  const lastDay=new Date(y,m,0).getDate();
  const rangeEnd=`${y}-${String(m).padStart(2,"0")}-${String(lastDay).padStart(2,"0")}`;
  const inRange=d=>d>=rangeStart&&d<=rangeEnd;

  const firstStoreId=1;
  // 集計開始日より前の予約は、新患／再診の判定（初回来院日）にも使わない＝10/5以降の最初の来院を新患として数える
  // さらに、集計開始日より前（10/1〜10/4のプレオープン期間）に来院履歴がある患者様は、KPIの対象から丸ごと除外する
  const scopedBookings=React.useMemo(()=>{
    const storeBookings=bookings.filter(b=>(b.store_id||firstStoreId)===selStoreId&&!b.cancelled);
    // 「来院した」＝会計が済んでいる予約。予約だけで未来院（これから・来なかった）の人は、プレオープン期間の履歴にも数えない
    const paidIds=new Set(payments.map(p=>p.booking_id).filter(Boolean));
    const preStartNames=new Set(storeBookings.filter(b=>b.date<STAFF_KPI_START&&paidIds.has(b.id)).map(b=>b.patient_name));
    return storeBookings.filter(b=>b.date>=STAFF_KPI_START&&!preStartNames.has(b.patient_name));
  },[bookings,payments,selStoreId]);

  // 会計が済んだ（＝実際に来院した）予約だけ。KPIの対象はこれのみ（会計が終わるまではカウントしない）
  const completedBookings=React.useMemo(()=>{
    const paidIds=new Set(payments.map(p=>p.booking_id).filter(Boolean));
    return scopedBookings.filter(b=>paidIds.has(b.id));
  },[scopedBookings,payments]);

  // 患者ごとの全来院日（会計済みのみ・店舗内）を古い順に並べる。新患／再診の判定に使う
  const historyByPatient=React.useMemo(()=>{
    const map={};
    [...completedBookings].sort((a,b)=>a.date.localeCompare(b.date)).forEach(b=>{
      if(!map[b.patient_name]) map[b.patient_name]=[];
      map[b.patient_name].push(b);
    });
    return map;
  },[completedBookings]);

  const treatByBookingId=React.useMemo(()=>{
    const map={};
    treatments.forEach(t=>{ if(!map[t.booking_id]) map[t.booking_id]=t; });
    return map;
  },[treatments]);

  const paymentByBookingId=React.useMemo(()=>{
    const map={};
    payments.forEach(p=>{ if(!map[p.booking_id]) map[p.booking_id]=p; });
    return map;
  },[payments]);

  // その月に来院した予約のうち、新患／再診の判定（患者の初回来院日と一致するか）
  const visitsInMonth=React.useMemo(()=>{
    return completedBookings.filter(b=>inRange(b.date)).map(b=>{
      const hist=historyByPatient[b.patient_name]||[];
      const isFirstVisitEver=hist.length>0&&hist[0].id===b.id;
      // 再診＝前回の来院から1ヶ月以上空いた方（前回来院日の1ヶ月後の日付以降に来院）／それ以外の通院中は「継続」
      const prevVisit=[...hist].reverse().find(h=>h.date<b.date);
      let isReturnAfterGap=false;
      if(prevVisit){
        const lim=new Date(prevVisit.date+"T00:00:00");lim.setMonth(lim.getMonth()+1);
        const limStr=lim.getFullYear()+"-"+String(lim.getMonth()+1).padStart(2,"0")+"-"+String(lim.getDate()).padStart(2,"0");
        isReturnAfterGap=limStr<=b.date;
      }
      const hasNext=scopedBookings.some(h=>h.patient_name===b.patient_name&&h.date>b.date); // 次回予約は、まだ来院していない先の予約も含めて見る
      const pay=paymentByBookingId[b.id];
      const treat=treatByBookingId[b.id];
      const jifeeAmount=pay?(pay.jifee_amount||0):0;
      const didJifee=jifeeAmount>0;
      const isContracted=treat&&treat.result==="成約";
      return {booking:b,isFirstVisitEver,isReturnAfterGap,hasNext,didJifee,isContracted};
    });
  },[completedBookings,scopedBookings,rangeStart,rangeEnd,historyByPatient,paymentByBookingId,treatByBookingId]);

  // 患者ごとの、当月時点までの自費（回数券・FP以外の単発自費）来院回数（自費単発継続の判定用）
  function priorJifeeSingleCount(patientName,beforeDate){
    const hist=historyByPatient[patientName]||[];
    return hist.filter(h=>h.date<beforeDate&&(paymentByBookingId[h.id]?.jifee_amount||0)>0).length;
  }

  // kind: "new"（新患）／"return"（再診＝1ヶ月以上空いて来院）／"keep"（継続＝それ以外の通院中）
  function calcCategory(kind){
    const list=visitsInMonth.filter(v=>kind==="new"?v.isFirstVisitEver:kind==="return"?(!v.isFirstVisitEver&&v.isReturnAfterGap):(!v.isFirstVisitEver&&!v.isReturnAfterGap));
    const byStaff={};
    storeStaff.forEach(s=>{ byStaff[s.id]={staff:s,taiou:0,nextYes:0,jifeeCount:0,contractCount:0,fpLongCount:0,fpMonthCount:0,ticketCount:0,jifeeContinueCount:0}; });
    list.forEach(v=>{
      const sid=v.booking.staff_id;
      if(!byStaff[sid]) return; // 対象店舗のスタッフでなければスキップ
      const row=byStaff[sid];
      row.taiou++;
      if(v.hasNext) row.nextYes++;
      if(v.didJifee) row.jifeeCount++;
      if(v.isContracted) row.contractCount++;
      // このタイミングで購入されたパス（回数券・FP）を集計
      const boughtPasses=passes.filter(p=>p.patient_name===v.booking.patient_name&&p.purchased_date&&p.purchased_date.slice(0,10)===v.booking.date);
      boughtPasses.forEach(p=>{
        const isFP=(p.pass_type||"").includes("フリーパス");
        if(isFP){
          if((p.pass_type||"").includes("1ヶ月")) row.fpMonthCount++;
          else row.fpLongCount++; // 3・6・12ヶ月
        }else{
          row.ticketCount++; // 回数券
        }
      });
      // 自費単発継続：パス購入なしで自費を実施し、かつ過去にも自費単発の来院歴がある場合
      if(v.didJifee&&boughtPasses.length===0&&priorJifeeSingleCount(v.booking.patient_name,v.booking.date)>0){
        row.jifeeContinueCount++;
      }
    });
    return Object.values(byStaff);
  }

  function pct(n,d){ return d>0?Math.round(n/d*1000)/10:0; }

  function renderTable(title,rows){
    const total=rows.reduce((acc,r)=>{
      Object.keys(r).forEach(k=>{ if(typeof r[k]==="number") acc[k]=(acc[k]||0)+r[k]; });
      return acc;
    },{});
    return(
      <div className="card" style={{marginBottom:14}}>
        <div style={{padding:"12px 16px",borderBottom:"1px solid #f1f5f9",fontWeight:800,fontSize:13,color:"#1e3a5f"}}>{title}</div>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:12,minWidth:1200}}>
            <thead>
              <tr style={{background:"#f8fafc",borderBottom:"2px solid #e2e8f0"}}>
                {["スタッフ","対応数","次回あり数","次回あり率","次回なし","自費実施数","自費実施率","自費成約数","自費成約率","FP長期数","FP長期率","FP単月数","FP単月率","回数券数","回数券率","自費単発継続数","自費単発継続率"].map(h=>(
                  <th key={h} style={{padding:"8px 10px",textAlign:"left",fontWeight:800,color:"#64748b",whiteSpace:"nowrap"}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {rows.map(r=>(
                <tr key={r.staff.id} style={{borderBottom:"1px solid #f1f5f9"}}>
                  <td style={{padding:"8px 10px",fontWeight:700}}>{r.staff.name}</td>
                  <td style={{padding:"8px 10px"}}>{r.taiou}</td>
                  <td style={{padding:"8px 10px"}}>{r.nextYes}</td>
                  <td style={{padding:"8px 10px"}}>{pct(r.nextYes,r.taiou)}%</td>
                  <td style={{padding:"8px 10px"}}>{r.taiou-r.nextYes}</td>
                  <td style={{padding:"8px 10px"}}>{r.jifeeCount}</td>
                  <td style={{padding:"8px 10px"}}>{pct(r.jifeeCount,r.taiou)}%</td>
                  <td style={{padding:"8px 10px"}}>{r.contractCount}</td>
                  <td style={{padding:"8px 10px"}}>{pct(r.contractCount,r.taiou)}%</td>
                  <td style={{padding:"8px 10px"}}>{r.fpLongCount}</td>
                  <td style={{padding:"8px 10px"}}>{pct(r.fpLongCount,r.taiou)}%</td>
                  <td style={{padding:"8px 10px"}}>{r.fpMonthCount}</td>
                  <td style={{padding:"8px 10px"}}>{pct(r.fpMonthCount,r.taiou)}%</td>
                  <td style={{padding:"8px 10px"}}>{r.ticketCount}</td>
                  <td style={{padding:"8px 10px"}}>{pct(r.ticketCount,r.taiou)}%</td>
                  <td style={{padding:"8px 10px"}}>{r.jifeeContinueCount}</td>
                  <td style={{padding:"8px 10px"}}>{pct(r.jifeeContinueCount,r.taiou)}%</td>
                </tr>
              ))}
              <tr style={{background:"#f0fdf4",borderTop:"2px solid #86efac"}}>
                <td style={{padding:"10px",fontWeight:800,color:"#065f46"}}>合計</td>
                <td style={{padding:"10px",fontWeight:800}}>{total.taiou||0}</td>
                <td style={{padding:"10px",fontWeight:800}}>{total.nextYes||0}</td>
                <td style={{padding:"10px",fontWeight:800}}>{pct(total.nextYes,total.taiou)}%</td>
                <td style={{padding:"10px",fontWeight:800}}>{(total.taiou||0)-(total.nextYes||0)}</td>
                <td style={{padding:"10px",fontWeight:800}}>{total.jifeeCount||0}</td>
                <td style={{padding:"10px",fontWeight:800}}>{pct(total.jifeeCount,total.taiou)}%</td>
                <td style={{padding:"10px",fontWeight:800}}>{total.contractCount||0}</td>
                <td style={{padding:"10px",fontWeight:800}}>{pct(total.contractCount,total.taiou)}%</td>
                <td style={{padding:"10px",fontWeight:800}}>{total.fpLongCount||0}</td>
                <td style={{padding:"10px",fontWeight:800}}>{pct(total.fpLongCount,total.taiou)}%</td>
                <td style={{padding:"10px",fontWeight:800}}>{total.fpMonthCount||0}</td>
                <td style={{padding:"10px",fontWeight:800}}>{pct(total.fpMonthCount,total.taiou)}%</td>
                <td style={{padding:"10px",fontWeight:800}}>{total.ticketCount||0}</td>
                <td style={{padding:"10px",fontWeight:800}}>{pct(total.ticketCount,total.taiou)}%</td>
                <td style={{padding:"10px",fontWeight:800}}>{total.jifeeContinueCount||0}</td>
                <td style={{padding:"10px",fontWeight:800}}>{pct(total.jifeeContinueCount,total.taiou)}%</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    );
  }

  // 離反：先月来院していたが今月来院していないスタッフ担当患者
  function calcChurn(){
    const [py,pm]=m===1?[y-1,12]:[y,m-1];
    const prevStart=`${py}-${String(pm).padStart(2,"0")}-01`;
    const prevLastDay=new Date(py,pm,0).getDate();
    const prevEnd=`${py}-${String(pm).padStart(2,"0")}-${String(prevLastDay).padStart(2,"0")}`;
    const byStaff={};
    storeStaff.forEach(s=>{ byStaff[s.id]={staff:s,churnCount:0,baseCount:0}; });
    Object.entries(historyByPatient).forEach(([name,hist])=>{
      const prevVisits=hist.filter(h=>h.date>=prevStart&&h.date<=prevEnd);
      if(prevVisits.length===0) return;
      const lastPrevStaff=prevVisits[prevVisits.length-1].staff_id;
      if(!byStaff[lastPrevStaff]) return;
      byStaff[lastPrevStaff].baseCount++;
      const cameThisMonth=hist.some(h=>inRange(h.date));
      if(!cameThisMonth) byStaff[lastPrevStaff].churnCount++;
    });
    return Object.values(byStaff);
  }

  const newRows=calcCategory("new");
  const repeatRows=calcCategory("return");
  const keepRows=calcCategory("keep");
  const churnRows=calcChurn();

  return(
    <div style={{maxWidth:1400,margin:"0 auto"}}>
      <div className="card" style={{marginBottom:14,padding:"14px 16px"}}>
        <div style={{fontWeight:800,fontSize:15,color:"#1e3a5f",marginBottom:10}}>📊 スタッフKPI管理</div>
        <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
          <input type="month" value={selMonth} min={STAFF_KPI_START.slice(0,7)} onChange={e=>setSelMonth(e.target.value<STAFF_KPI_START.slice(0,7)?STAFF_KPI_START.slice(0,7):e.target.value)}
            style={{padding:"6px 10px",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:13,fontWeight:700}}/>
          <span style={{fontSize:12,fontWeight:700,color:"#1d4ed8",background:"#eff6ff",padding:"4px 12px",borderRadius:20}}>
            集計期間：{Number(rangeStart.slice(5,7))}/{Number(rangeStart.slice(8,10))}〜{Number(rangeEnd.slice(5,7))}/{Number(rangeEnd.slice(8,10))}
          </span>
        </div>
        <div style={{fontSize:11,color:"#94a3b8",marginTop:8}}>※10/5以降の来院から集計しています（10/1〜10/4に来院履歴のある患者様は集計に含みません）</div>
      </div>
      {loading?(
        <div style={{textAlign:"center",padding:40,color:"#94a3b8"}}>読み込み中...</div>
      ):(
        <>
          {renderTable("新患（"+selMonth+"）",newRows)}
          {renderTable("再診＝前回から1ヶ月以上空いた方（"+selMonth+"）",repeatRows)}
          {renderTable("継続＝通院中の方（"+selMonth+"）",keepRows)}
          <div className="card">
            <div style={{padding:"12px 16px",borderBottom:"1px solid #f1f5f9",fontWeight:800,fontSize:13,color:"#1e3a5f"}}>離反（前月来院者のうち今月未来院）</div>
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:12,minWidth:400}}>
                <thead>
                  <tr style={{background:"#f8fafc",borderBottom:"2px solid #e2e8f0"}}>
                    {["スタッフ","離反数","離反率"].map(h=>(<th key={h} style={{padding:"8px 10px",textAlign:"left",fontWeight:800,color:"#64748b"}}>{h}</th>))}
                  </tr>
                </thead>
                <tbody>
                  {churnRows.map(r=>(
                    <tr key={r.staff.id} style={{borderBottom:"1px solid #f1f5f9"}}>
                      <td style={{padding:"8px 10px",fontWeight:700}}>{r.staff.name}</td>
                      <td style={{padding:"8px 10px"}}>{r.churnCount}</td>
                      <td style={{padding:"8px 10px"}}>{pct(r.churnCount,r.baseCount)}%</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
          <div style={{fontSize:11,color:"#94a3b8",marginTop:12,lineHeight:1.9}}>
            ・対応数＝その月に来院した新患／再診の人数（新患＝患者の初回来院と一致する予約）<br/>
            ・次回あり数＝その来院時点で、以降の日付の予約が存在する人数<br/>
            ・自費実施数＝その来院の会計で自費金額が発生した人数<br/>
            ・自費成約数＝その来院の施術記録で「成約」と記録された人数（施術記録画面での入力が必要です）<br/>
            ・FP長期＝3・6・12ヶ月フリーパスの新規購入、FP単月＝1ヶ月フリーパスの購入（サブスクかどうかの区別は今のデータでは行っていません）<br/>
            ・回数券＝回数券の新規購入<br/>
            ・自費単発継続＝パスを買わず自費のみで、かつ過去にも自費単発の来院歴がある人数<br/>
            ・離反率は「前月最後に来院した際の担当スタッフ」を基準に、今月来院が無かった人数の割合です
          </div>
        </>
      )}
    </div>
  );
}
function PassHoldersPanel({payments,bookings,trainingMode}){
  const [passes,setPasses]=React.useState([]);
  const [loading,setLoading]=React.useState(true);
  const [selMonth,setSelMonth]=React.useState(()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;});
  React.useEffect(()=>{
    sb.select("passes","?order=expiry_date.asc.nullslast").then(rows=>{
      setPasses(Array.isArray(rows)?rows:[]);setLoading(false);
    }).catch(()=>setLoading(false));
  },[]);
  // トレーニングモードの表示中は練習用の回数券・FPだけを、通常時は本番のものだけを表示する
  const activePasses=passes.filter(p=>p.active!==false&&!!p.is_training===!!trainingMode);
  const ticketPasses=activePasses.filter(p=>!(p.pass_type||"").includes("フリーパス")).sort((a,b)=>(a.remaining_count||0)-(b.remaining_count||0));
  const fpPasses=activePasses.filter(p=>(p.pass_type||"").includes("フリーパス")).sort((a,b)=>(a.expiry_date||"").localeCompare(b.expiry_date||""));
  function daysUntil(dateStr){ if(!dateStr) return null; return Math.ceil((new Date(dateStr+"T00:00:00")-new Date())/86400000); }
  const ticketPatientCount=new Set(ticketPasses.map(p=>p.patient_name)).size;
  const fpPatientCount=new Set(fpPasses.map(p=>p.patient_name)).size;
  const ticketLowCount=ticketPasses.filter(p=>(p.remaining_count||0)<=2).length;
  const fpExpiringSoonCount=fpPasses.filter(p=>{const d=daysUntil(p.expiry_date);return d!=null&&d<=7&&d>=0;}).length;
  // 保険のみ患者数（選択した月・全店舗合算）：その月に会計があった患者のうち、自費金額が一切発生していない人数
  const insuranceOnlyCount=(()=>{
    const inRange=d=>!!d&&d.slice(0,7)===selMonth;
    const bookingById={}; (bookings||[]).forEach(b=>{bookingById[b.id]=b;});
    const byPatient={};
    (payments||[]).filter(p=>inRange(p.payment_date)).forEach(p=>{
      const b=bookingById[p.booking_id];
      if(!b) return;
      if(!byPatient[b.patient_name]) byPatient[b.patient_name]={ins:0,jifee:0};
      byPatient[b.patient_name].ins+=(p.insurance_amount||0);
      byPatient[b.patient_name].jifee+=(p.jifee_amount||0);
    });
    return Object.values(byPatient).filter(v=>v.ins>0&&v.jifee===0).length;
  })();
  function toCSV(rows,headers){
    const esc=v=>{ const s=(v==null?"":String(v)); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
    return[headers.map(esc).join(","),...rows.map(r=>r.map(esc).join(","))].join("\r\n");
  }
  function downloadCSV(filename,csv){
    const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download=filename;document.body.appendChild(a);a.click();
    document.body.removeChild(a);URL.revokeObjectURL(url);
  }
  function exportPassesCSV(){
    const headers=["区分","患者名","電話番号","種類","金額","残数","残日数","有効期限","購入日"];
    const rows=[
      ...ticketPasses.map(p=>["回数券",p.patient_name,p.phone||"",p.pass_type,p.amount||0,(p.remaining_count||0)+"/"+(p.total_count||0),"",p.expiry_date||"",p.purchased_date||""]),
      ...fpPasses.map(p=>["フリーパス",p.patient_name,p.phone||"",p.pass_type,p.amount||0,"",daysUntil(p.expiry_date)!=null?daysUntil(p.expiry_date):"",p.expiry_date||"",p.purchased_date||""]),
    ];
    downloadCSV("回数券・フリーパス対象者一覧.csv",toCSV(rows,headers));
  }
  return(
    <div style={{maxWidth:1000,margin:"0 auto"}}>
      <div className="card" style={{marginBottom:14,padding:"14px 16px"}}>
        <div style={{fontWeight:800,fontSize:15,color:"#1e3a5f",marginBottom:10}}>🎫 パス・保険サマリー</div>
        <input type="month" value={selMonth} onChange={e=>setSelMonth(e.target.value)}
          style={{padding:"6px 10px",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:13,fontWeight:700,marginBottom:10}}/>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:10}}>
          <div style={{background:"#f8fafc",borderRadius:10,padding:"12px",textAlign:"center"}}>
            <div style={{fontSize:24,fontWeight:800,color:"#2563eb"}}>{insuranceOnlyCount}</div>
            <div style={{fontSize:11,color:"#64748b",fontWeight:700}}>保険のみ患者数（{selMonth}）</div>
          </div>
          <div style={{background:"#f8fafc",borderRadius:10,padding:"12px",textAlign:"center"}}>
            <div style={{fontSize:24,fontWeight:800,color:"#d97706"}}>{ticketPatientCount}</div>
            <div style={{fontSize:11,color:"#64748b",fontWeight:700}}>回数券実施中の患者数</div>
          </div>
          <div style={{background:"#f8fafc",borderRadius:10,padding:"12px",textAlign:"center"}}>

}
function ReferralMgmtPanel({bookings,payments}){
  const [referrals,setReferrals]=React.useState([]);
  const [codes,setCodes]=React.useState([]);
  const [loading,setLoading]=React.useState(true);
  const [rangeStart,setRangeStart]=React.useState("");
  const [rangeEnd,setRangeEnd]=React.useState("");
  const [savingId,setSavingId]=React.useState(null);
  const [identifyingId,setIdentifyingId]=React.useState(null); // 「紹介者を特定」を開いている紹介のid
  const [searchQ,setSearchQ]=React.useState("");
  const [searchResults,setSearchResults]=React.useState([]);
  const [searching,setSearching]=React.useState(false);

  function openIdentify(referralId){
    setIdentifyingId(referralId);
    setSearchQ("");
    setSearchResults([]);
  }
  function searchCandidates(q){
    setSearchQ(q);
    if(!q||q.trim().length<1){ setSearchResults([]); return; }
    setSearching(true);
    sb.select("bookings",`?patient_name=ilike.*${encodeURIComponent(q.trim())}*&select=patient_name,phone&order=date.desc&limit=50`).then(rows=>{
      const seen=new Set(); const list=[];
      (Array.isArray(rows)?rows:[]).forEach(r=>{
        const key=r.patient_name+"_"+r.phone;
        if(!r.patient_name||!r.phone||seen.has(key)) return;
        seen.add(key); list.push(r);
      });
      setSearchResults(list.slice(0,8));
      setSearching(false);
    }).catch(()=>setSearching(false));
  }
  async function confirmReferrer(referral,candidate){
    setSavingId(referral.id);
    try{
      await sb.update("referrals",referral.id,{referrer_name:candidate.patient_name,referrer_phone:candidate.phone});
      setIdentifyingId(null);
      fetchAll();
    }catch(e){}
    setSavingId(null);
  }

  function fetchAll(){
    setLoading(true);
    Promise.all([
      sb.select("referrals","?order=created_at.desc"),
      sb.select("patient_referral_codes","?order=created_at.desc"),
    ]).then(([r,c])=>{
      setReferrals(Array.isArray(r)?r:[]);
      setCodes(Array.isArray(c)?c:[]);
      setLoading(false);
    }).catch(()=>setLoading(false));
  }
  React.useEffect(()=>{ fetchAll(); },[]);

  const filtered=referrals.filter(r=>{
    if(rangeStart&&r.created_at&&r.created_at.slice(0,10)<rangeStart) return false;
    if(rangeEnd&&r.created_at&&r.created_at.slice(0,10)>rangeEnd) return false;
    return true;
  });
  const campaignReferrals=filtered.filter(r=>r.is_event_campaign);

  const bookingById={}; (bookings||[]).forEach(b=>{bookingById[b.id]=b;});
  const paymentByBookingId={}; (payments||[]).forEach(p=>{ if(p.booking_id!=null) paymentByBookingId[p.booking_id]=p; });

  function currentTierFor(phone){
    const count=referrals.filter(r=>r.referrer_phone===phone&&r.is_event_campaign&&r.visited_at).length;
    if(count>=3) return 3000; if(count===2) return 2000; if(count===1) return 1000; return 0;
  }

  async function markVisited(r){
    setSavingId(r.id);
    try{
      const reward=currentTierFor(r.referrer_phone)>0?currentTierFor(r.referrer_phone):1000; // これが確定すれば少なくとも1人分=1000円
      // 実際にはこの紹介を含めた新しい合計で再計算する
      const willBeCount=referrals.filter(x=>x.referrer_phone===r.referrer_phone&&x.is_event_campaign&&x.visited_at&&x.id!==r.id).length+1;
      const newReward=willBeCount>=3?3000:willBeCount===2?2000:1000;
      await sb.update("referrals",r.id,{visited_at:new Date().toISOString(),reward_amount:newReward,reward_status:"granted"});
      fetchAll();
    }catch(e){}
    setSavingId(null);
  }
  async function undoVisited(r){
    setSavingId(r.id);
    try{
      await sb.update("referrals",r.id,{visited_at:null,reward_amount:null,reward_status:"pending"});
      fetchAll();
    }catch(e){}
    setSavingId(null);
  }

  // ===== KPI =====
  const issuedCodesCount=codes.length;
  const referredBookingsCount=campaignReferrals.length;
  const referredVisitsCount=campaignReferrals.filter(r=>r.visited_at).length;
  const conversionRate=referredBookingsCount>0?Math.round(referredVisitsCount/referredBookingsCount*100):0;
  const referredRevenue=campaignReferrals.reduce((sum,r)=>{
    const b=bookingById[r.referred_booking_id];
    const p=b?paymentByBookingId[b.id]:null;
    return sum+(p?(p.total_amount||0):0);
  },0);
  const rankingMap={};
  campaignReferrals.filter(r=>r.visited_at).forEach(r=>{
    if(!rankingMap[r.referrer_name]) rankingMap[r.referrer_name]={name:r.referrer_name,phone:r.referrer_phone,count:0};
    rankingMap[r.referrer_name].count++;
  });
  const ranking=Object.values(rankingMap).sort((a,b)=>b.count-a.count).slice(0,10);

  function fmt(n){return"¥"+Number(n||0).toLocaleString();}

  return(
    <div style={{maxWidth:1300,margin:"0 auto"}}>
      <div className="card" style={{marginBottom:14,padding:"14px 16px"}}>
        <div style={{fontWeight:800,fontSize:15,color:"#1e3a5f",marginBottom:10}}>🎁 紹介キャンペーン管理</div>
        <div style={{fontSize:11,color:"#94a3b8",marginBottom:10}}>キャンペーン名：香里園院 無料体験会 紹介キャンペーン（紹介URL経由のみを集計。紹介者名の手入力分は含みません）</div>
        <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
          <span style={{fontSize:12,color:"#64748b",fontWeight:700}}>期間：</span>
          <input type="date" value={rangeStart} onChange={e=>setRangeStart(e.target.value)} style={{padding:"6px 8px",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:12}}/>
          <span style={{color:"#94a3b8"}}>〜</span>
          <input type="date" value={rangeEnd} onChange={e=>setRangeEnd(e.target.value)} style={{padding:"6px 8px",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:12}}/>
          {(rangeStart||rangeEnd)&&<button onClick={()=>{setRangeStart("");setRangeEnd("");}} style={{padding:"6px 10px",background:"white",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>クリア</button>}
        </div>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:14}}>
        {[
          {label:"紹介URL発行人数",value:issuedCodesCount+"人",color:"#2563eb"},
          {label:"紹介予約数",value:referredBookingsCount+"件",color:"#7c3aed"},
          {label:"紹介来院数",value:referredVisitsCount+"件",color:"#059669"},
          {label:"紹介成立率",value:conversionRate+"%",color:"#d97706"},
          {label:"紹介経由売上",value:fmt(referredRevenue),color:"#dc2626"},
          {label:"来院確認待ち",value:(referredBookingsCount-referredVisitsCount)+"件",color:"#64748b"},
        ].map(item=>(
          <div key={item.label} className="card" style={{padding:"14px",textAlign:"center",marginBottom:0}}>
            <div style={{fontSize:11,color:"#94a3b8",fontWeight:700,marginBottom:4}}>{item.label}</div>
            <div style={{fontSize:22,fontWeight:800,color:item.color}}>{item.value}</div>
          </div>
        ))}
      </div>

      <div className="card" style={{marginBottom:14}}>
        <div style={{padding:"12px 16px",borderBottom:"1px solid #f1f5f9",fontWeight:800,fontSize:13,color:"#1e3a5f"}}>紹介者ランキング（来院確認済み・上位10名）</div>
        <div style={{padding:"8px 16px"}}>
          {ranking.length===0?(
            <div style={{textAlign:"center",padding:16,color:"#94a3b8",fontSize:12}}>まだ実績がありません</div>
          ):ranking.map((r,i)=>(
            <div key={r.name+r.phone} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 0",borderBottom:"1px solid #f1f5f9"}}>
              <div style={{width:22,fontWeight:800,color:i<3?"#d97706":"#94a3b8",fontSize:13}}>{i+1}</div>
              <div style={{flex:1,fontSize:13,fontWeight:700,color:"#1e293b"}}>{r.name}</div>
              <div style={{fontSize:12,color:"#059669",fontWeight:800}}>{r.count}人成立</div>
            </div>
          ))}
        </div>
      </div>

      <div className="card">
        <div style={{padding:"12px 16px",borderBottom:"1px solid #f1f5f9",fontWeight:800,fontSize:13,color:"#1e3a5f"}}>紹介一覧（{filtered.length}件）</div>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:12,minWidth:1100}}>
            <thead>
              <tr style={{background:"#f8fafc",borderBottom:"2px solid #e2e8f0"}}>
                {["紹介者","紹介コード","被紹介者","予約日","予約状況","来院","紹介成立数","付与OFF","特典状況","操作"].map(h=>(
                  <th key={h} style={{padding:"8px 10px",textAlign:"left",fontWeight:800,color:"#64748b",whiteSpace:"nowrap"}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {loading?(
                <tr><td colSpan={10} style={{padding:20,textAlign:"center",color:"#94a3b8"}}>読み込み中...</td></tr>
              ):filtered.length===0?(
                <tr><td colSpan={10} style={{padding:20,textAlign:"center",color:"#94a3b8"}}>対象データがありません</td></tr>
              ):filtered.map(r=>{
                const b=bookingById[r.referred_booking_id];
                const tierNow=currentTierFor(r.referrer_phone);
                return(
                  <tr key={r.id} style={{borderBottom:"1px solid #f1f5f9",opacity:b&&b.cancelled?0.5:1}}>
                    <td style={{padding:"8px 10px",fontWeight:700,minWidth:180}}>
                      {r.referrer_phone?r.referrer_name:(
                        <div>
                          <div style={{color:"#92400e"}}>{r.referrer_name}<span style={{fontSize:10,fontWeight:800,background:"#fef3c7",color:"#92400e",borderRadius:8,padding:"1px 6px",marginLeft:6}}>要確認</span></div>
                          {identifyingId!==r.id?(
                            <button onClick={()=>openIdentify(r.id)} style={{marginTop:4,padding:"3px 8px",background:"white",border:"1.5px solid #f59e0b",borderRadius:6,fontSize:10,fontWeight:700,color:"#92400e",cursor:"pointer",fontFamily:"inherit"}}>🔍 紹介者を特定する</button>
                          ):(
                            <div style={{marginTop:6,background:"#fffbeb",border:"1px solid #fde68a",borderRadius:8,padding:8,width:220}}>
                              <input autoFocus value={searchQ} onChange={e=>searchCandidates(e.target.value)} placeholder="患者様のお名前で検索"
                                style={{width:"100%",padding:"5px 7px",border:"1.5px solid #e2e8f0",borderRadius:6,fontSize:11,marginBottom:6,boxSizing:"border-box"}}/>
                              {searching?(
                                <div style={{fontSize:10,color:"#94a3b8"}}>検索中...</div>
                              ):searchResults.length===0?(
                                <div style={{fontSize:10,color:"#94a3b8"}}>{searchQ?"該当なし":"1文字以上入力してください"}</div>
                              ):searchResults.map((c,i)=>(
                                <div key={i} onClick={()=>confirmReferrer(r,c)} style={{padding:"5px 6px",fontSize:11,cursor:"pointer",borderRadius:5,background:"white",marginBottom:3}}
                                  onMouseOver={e=>e.currentTarget.style.background="#fef3c7"} onMouseOut={e=>e.currentTarget.style.background="white"}>
                                  {c.patient_name}　<span style={{color:"#94a3b8"}}>{c.phone}</span>
                                </div>

                              <button onClick={()=>setIdentifyingId(null)} style={{marginTop:4,padding:"3px 8px",background:"none",border:"none",color:"#94a3b8",fontSize:10,cursor:"pointer",fontFamily:"inherit"}}>閉じる</button>
                            </div>
                          )}
                        </div>
                      )}
                    </td>
                    <td style={{padding:"8px 10px",color:"#64748b"}}>{r.referral_code||(r.source==="name"?"（手入力）":"—")}</td>
                    <td style={{padding:"8px 10px",fontWeight:700}}>{r.referred_patient_name}</td>
                    <td style={{padding:"8px 10px"}}>{b?b.date+" "+b.time:"—"}</td>
                    <td style={{padding:"8px 10px"}}>{b?(b.cancelled?<span className="badge badge-red">キャンセル</span>:<span className="badge badge-blue">予約中</span>):"—"}</td>
                    <td style={{padding:"8px 10px"}}>{r.visited_at?<span className="badge badge-green">来院済み</span>:<span className="badge badge-gray">未来院</span>}</td>
                    <td style={{padding:"8px 10px"}}>{r.is_event_campaign?tierNow>0?Math.min(3,Math.round(tierNow/1000))+"人目安":"0":"—"}</td>
                    <td style={{padding:"8px 10px",fontWeight:700,color:"#d97706"}}>{r.reward_amount?fmt(r.reward_amount):"—"}</td>
                    <td style={{padding:"8px 10px"}}>{r.reward_status==="granted"?<span className="badge badge-green">付与済み</span>:<span className="badge badge-yellow">未付与</span>}</td>
                    <td style={{padding:"8px 10px"}}>
                      {!r.is_event_campaign?(

                      ):b&&b.cancelled?(
                        <span style={{fontSize:11,color:"#94a3b8"}}>キャンセル済み</span>
                      ):r.visited_at?(
                        <button onClick={()=>undoVisited(r)} disabled={savingId===r.id} style={{padding:"5px 10px",background:"white",border:"1.5px solid #e2e8f0",borderRadius:6,fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit",color:"#374151"}}>取り消す</button>
                      ):(
                        <button onClick={()=>markVisited(r)} disabled={savingId===r.id} style={{padding:"5px 10px",background:"#059669",border:"none",borderRadius:6,fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit",color:"white"}}>{savingId===r.id?"処理中...":"来院済みにする"}</button>
                      )}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
        <div style={{padding:"10px 16px",fontSize:11,color:"#94a3b8",lineHeight:1.8}}>
          ・紹介者名を手入力された予約は、フルネームが分からない等で自動特定できないことがあるため、まず「要確認」として記録されます。「🔍 紹介者を特定する」から、実際の患者様を検索して選ぶと確定します（この検索・候補一覧は管理画面だけの表示で、患者様には一切見えません）<br/>
          ・「来院済みにする」を押すと、その紹介が成立扱いになり、紹介者のその時点での紹介成立数に応じてOFF金額（1人1,000円／2人2,000円／3人以上3,000円）が自動計算されます<br/>
          ・キャンセルされた予約は「来院済みにする」ボタンが出ないようになっています（誤って成立扱いにならないようにするためです）<br/>
          ・付与されたOFF金額は、紹介者様の次回ご来院時のお会計で、スタッフが手動で割引を適用してください（現時点では会計画面への自動連携はしていません）
        </div>
      </div>
    </div>
  );
}
function AttendancePunchPanel({currentUser,isAdmin}){
  const [records,setRecords]=React.useState([]);
  const [loading,setLoading]=React.useState(true);
  const [selMonth,setSelMonth]=React.useState(()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;});
  const [saving,setSaving]=React.useState(false);
  const [selectedStaffId,setSelectedStaffId]=React.useState(currentUser.id); // 打刻する対象スタッフ（誰でも選べる）
  const [editing,setEditing]=React.useState(null); // 編集中の記録（新規追加の場合は id:null）
  const todayStrLocal=fmtDate(new Date());
  const selectedStaff=STAFF_ACCOUNTS.find(s=>s.id===selectedStaffId)||currentUser;

  function fetchRecords(){
    setLoading(true);
    sb.select("attendance_records","?order=date.desc,clock_in.desc").then(rows=>{
      setRecords(Array.isArray(rows)?rows:[]);
      setLoading(false);
    }).catch(()=>setLoading(false));
  }
  React.useEffect(()=>{ fetchRecords(); },[]);

  const breaksOf=r=>Array.isArray(r.breaks)?r.breaks:[];
  // 今日の打刻中の記録（退勤前）
  const myOpenRecord=records.find(r=>r.staff_id===selectedStaffId&&r.date===todayStrLocal&&r.clock_in&&!r.clock_out);
  const onBreak=!!(myOpenRecord&&breaksOf(myOpenRecord).some(b=>b.start&&!b.end));
  const myTodayRecords=records.filter(r=>r.staff_id===selectedStaffId&&r.date===todayStrLocal);
  // 前日以前で退勤が未入力のまま残っている記録（退勤の押し忘れ）
  const forgotten=records.filter(r=>r.clock_in&&!r.clock_out&&r.date<todayStrLocal);

  async function clockIn(){
    setSaving(true);
    try{
      await sb.insert("attendance_records",{staff_id:selectedStaffId,date:todayStrLocal,clock_in:new Date().toISOString(),breaks:[]});
      fetchRecords();
    }catch(e){}
    setSaving(false);
  }
  async function clockOut(){
    if(!myOpenRecord) return;
    setSaving(true);
    try{
      // 休憩中のまま退勤した場合は、休憩を自動で終了させる
      const nowIso=new Date().toISOString();
      const bs=breaksOf(myOpenRecord).map(b=>(b.start&&!b.end)?{...b,end:nowIso}:b);
      await sb.update("attendance_records",myOpenRecord.id,{clock_out:nowIso,breaks:bs});
      fetchRecords();
    }catch(e){}
    setSaving(false);
  }
  async function startBreak(){
    if(!myOpenRecord) return;
    setSaving(true);
    try{
      await sb.update("attendance_records",myOpenRecord.id,{breaks:[...breaksOf(myOpenRecord),{start:new Date().toISOString(),end:null}]});
      fetchRecords();
    }catch(e){}
    setSaving(false);
  }
  async function endBreak(){
    if(!myOpenRecord) return;
    setSaving(true);
    try{
      const nowIso=new Date().toISOString();
      const bs=breaksOf(myOpenRecord).map(b=>(b.start&&!b.end)?{...b,end:nowIso}:b);
      await sb.update("attendance_records",myOpenRecord.id,{breaks:bs});
      fetchRecords();
    }catch(e){}
    setSaving(false);
  }

  function fmtTime(iso){
    if(!iso) return"—";
    const d=new Date(iso);
    return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  }
  // 休憩の合計時間（時間）。終了していない休憩は数えない
  function breakHoursOf(r){
    return breaksOf(r).reduce((s,b)=>(b.start&&b.end)?s+(new Date(b.end)-new Date(b.start))/3600000:s,0);
  }
  // 実働時間＝出勤〜退勤−休憩
  function hoursOf(r){
    if(!r.clock_in||!r.clock_out) return null;
    return Math.max(0,(new Date(r.clock_out)-new Date(r.clock_in))/3600000-breakHoursOf(r));
  }
  function fmtHM(h){ const m=Math.round(h*60); return `${Math.floor(m/60)}:${String(m%60).padStart(2,"0")}`; }

  const monthRecords=records.filter(r=>r.date&&r.date.slice(0,7)===selMonth);

  // スタッフ別の月間合計時間
  const totalsByStaff={};
  monthRecords.forEach(r=>{
    const h=hoursOf(r);
    if(h==null) return;
    if(!totalsByStaff[r.staff_id]) totalsByStaff[r.staff_id]=0;
    totalsByStaff[r.staff_id]+=h;
  });

  // ===== 編集（入力漏れの修正・追加） =====
  // ISO(UTC) → 画面の「HH:MM」(端末のローカル時刻)、およびその逆
  const isoToHM=iso=>{ if(!iso) return""; const d=new Date(iso); return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };
  const hmToIso=(date,hm)=>hm?new Date(`${date}T${hm}:00`).toISOString():null;
  function openEdit(r){
    setEditing({
      id:r.id,staff_id:r.staff_id,date:r.date,
      clockIn:isoToHM(r.clock_in),clockOut:isoToHM(r.clock_out),
      breaks:breaksOf(r).map(b=>({start:isoToHM(b.start),end:isoToHM(b.end)})),
    });
  }
  function openAdd(){
    setEditing({id:null,staff_id:selectedStaffId,date:todayStrLocal,clockIn:"09:00",clockOut:"18:00",breaks:[]});
  }
  async function saveEdit(){
    const e=editing;
    if(!e.date||!e.clockIn){ alert("日付と出勤時刻を入力してください"); return; }
    if(e.clockOut&&e.clockOut<=e.clockIn){ alert("退勤時刻は出勤時刻より後にしてください"); return; }
    for(const b of e.breaks){
      if(!b.start){ alert("休憩の開始時刻を入力してください"); return; }
      if(b.end&&b.end<=b.start){ alert("休憩の終了時刻は開始時刻より後にしてください"); return; }
    }
    setSaving(true);
    try{
      const payload={
        staff_id:e.staff_id,date:e.date,
        clock_in:hmToIso(e.date,e.clockIn),
        clock_out:hmToIso(e.date,e.clockOut),
        breaks:e.breaks.map(b=>({start:hmToIso(e.date,b.start),end:hmToIso(e.date,b.end)})),
      };
      if(e.id==null) await sb.insert("attendance_records",payload);
      else await sb.update("attendance_records",e.id,payload);
      setEditing(null);
      fetchRecords();
    }catch(err){ alert("保存に失敗しました"); }
    setSaving(false);
  }
  async function deleteRecord(){
    if(!editing||editing.id==null) return;
    if(!confirm("この打刻記録を削除します。よろしいですか？")) return;
    setSaving(true);
    try{ await sb.delete("attendance_records",editing.id); setEditing(null); fetchRecords(); }
    catch(err){ alert("削除に失敗しました"); }
    setSaving(false);
  }

  function toCSV(rows,headers){
    const esc=v=>{ const s=(v==null?"":String(v)); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
    return[headers.map(esc).join(","),...rows.map(r=>r.map(esc).join(","))].join("\r\n");
  }
  function downloadCSV(filename,csv){
    const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8;"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download=filename;document.body.appendChild(a);a.click();
    document.body.removeChild(a);URL.revokeObjectURL(url);
  }
  function exportCSV(){
    const headers=["スタッフ","日付","出勤","退勤","休憩(時間)","実働(時間)"];
    const sorted=[...monthRecords].sort((a,b)=>a.date.localeCompare(b.date)||(a.staff_id-b.staff_id));

    });
    downloadCSV("勤怠記録_"+selMonth+".csv",toCSV(rows,headers));
  }

  const bigBtn=(bg,shadow)=>({padding:"16px 10px",flex:1,minWidth:120,background:bg,color:"white",border:"none",borderRadius:14,fontSize:15,fontWeight:800,cursor:"pointer",fontFamily:"inherit",boxShadow:`0 4px 14px ${shadow}`});
  const inp={padding:"7px 8px",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:14,fontFamily:"inherit"};

  return(
    <div style={{maxWidth:1100,margin:"0 auto"}}>

        <div style={{fontWeight:800,fontSize:15,color:"#1e3a5f",marginBottom:10}}>⏰ 出退勤・休憩の打刻</div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap",justifyContent:"center",marginBottom:16}}>

            <button key={s.id} onClick={()=>setSelectedStaffId(s.id)} style={{padding:"6px 14px",borderRadius:20,border:"2px solid "+s.color,background:selectedStaffId===s.id?s.color:"white",color:selectedStaffId===s.id?"white":s.color,fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",boxShadow:selectedStaffId===s.id?`0 2px 8px ${s.color}66`:"none"}}>
              {s.name}
            </button>

        </div>
        <div style={{fontWeight:800,fontSize:14,color:"#1e293b",marginBottom:2}}>{selectedStaff.name} さんの本日の打刻</div>
        <div style={{fontSize:13,color:"#94a3b8",marginBottom:10}}>{todayStrLocal}</div>
        <div style={{display:"inline-block",padding:"5px 16px",borderRadius:20,fontSize:13,fontWeight:800,marginBottom:14,

          {!myOpenRecord?(myTodayRecords.length>0?"退勤済み":"未出勤"):onBreak?"☕ 休憩中":"🟢 勤務中"}
        </div>
        {myTodayRecords.length>0&&(
          <div style={{marginBottom:14,display:"flex",flexDirection:"column",gap:6,maxWidth:360,marginLeft:"auto",marginRight:"auto"}}>
            {myTodayRecords.map(r=>(

                <div style={{display:"flex",justifyContent:"space-between"}}>

        <div style={{display:"flex",gap:10,flexWrap:"wrap",justifyContent:"center"}}>

          {myOpenRecord&&onBreak&&(

          )}
          {myOpenRecord&&(
            <button onClick={clockOut} disabled={saving} style={bigBtn("linear-gradient(135deg,#dc2626,#991b1b)","rgba(220,38,38,.3)")}>{saving?"処理中...":"🔴 退勤する"}</button>
          )}
        </div>
        <div style={{marginTop:14}}>
          <button onClick={openAdd} style={{padding:"8px 18px",borderRadius:8,border:"1.5px solid #cbd5e1",background:"white",color:"#334155",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>✏️ 入力漏れの記録を追加</button>
        </div>
      </div>

      {forgotten.length>0&&(
        <div className="card" style={{marginBottom:14,padding:"12px 16px",border:"2px solid #f59e0b",background:"#fffbeb"}}>
          <div style={{fontWeight:800,fontSize:13,color:"#92400e",marginBottom:8}}>⚠ 退勤が未入力の記録があります（{forgotten.length}件）</div>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {forgotten.map(r=>{
              const s=STAFF_ACCOUNTS.find(x=>x.id===r.staff_id)||{name:"不明"};
              return(
                <div key={r.id} style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",background:"white",borderRadius:8,padding:"8px 12px",fontSize:13}}>
                  <span style={{fontWeight:700}}>{s.name}</span><span>{r.date}</span><span>出勤 {fmtTime(r.clock_in)}</span>
                  <button onClick={()=>openEdit(r)} style={{marginLeft:"auto",padding:"5px 14px",borderRadius:8,border:"none",background:"#f59e0b",color:"white",fontSize:12,fontWeight:800,cursor:"pointer",fontFamily:"inherit"}}>退勤時刻を入力</button>
                </div>
              );
            })}
          </div>
        </div>
      )}

      <div className="card" style={{marginBottom:14,padding:"14px 16px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
          <div>
            <div style={{fontWeight:800,fontSize:15,color:"#1e3a5f",marginBottom:8}}>📊 月間勤務時間集計（全スタッフ・休憩を除く実働）</div>
            <input type="month" value={selMonth} onChange={e=>setSelMonth(e.target.value)}
              style={{padding:"6px 10px",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:13,fontWeight:700}}/>

        </div>
        <div style={{display:"flex",flexWrap:"wrap",gap:10,marginTop:14}}>
          {STAFF_ACCOUNTS.map(s=>(
            <div key={s.id} style={{background:"#f8fafc",borderRadius:10,padding:"10px 16px",minWidth:130}}>
              <div style={{fontSize:11,color:"#64748b",fontWeight:700}}>{s.name}</div>
              <div style={{fontSize:18,fontWeight:800,color:s.color}}>{(totalsByStaff[s.id]||0).toFixed(1)}<span style={{fontSize:11,color:"#94a3b8"}}>時間</span></div>
            </div>
          ))}
        </div>
      </div>

      <div className="card">
        <div style={{padding:"12px 16px",borderBottom:"1px solid #f1f5f9",fontWeight:800,fontSize:13,color:"#1e3a5f"}}>打刻履歴（{monthRecords.length}件）</div>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:12,minWidth:700}}>
            <thead>
              <tr style={{background:"#f8fafc",borderBottom:"2px solid #e2e8f0"}}>
                {["スタッフ","日付","出勤","退勤","休憩","実働",""].map((h,i)=>(
                  <th key={i} style={{padding:"8px 10px",textAlign:"left",fontWeight:800,color:"#64748b"}}>{h}</th>
                ))}

            <tbody>
              {loading?(
                <tr><td colSpan={7} style={{padding:20,textAlign:"center",color:"#94a3b8"}}>読み込み中...</td></tr>

                <tr><td colSpan={7} style={{padding:20,textAlign:"center",color:"#94a3b8"}}>対象データがありません</td></tr>
              ):[...monthRecords].sort((a,b)=>b.date.localeCompare(a.date)||(b.clock_in||"").localeCompare(a.clock_in||"")).map(r=>{
                const s=STAFF_ACCOUNTS.find(x=>x.id===r.staff_id)||{name:"不明",color:"#888"};

                  <tr key={r.id} style={{borderBottom:"1px solid #f1f5f9"}}>

                    <td style={{padding:"8px 10px"}}>{fmtTime(r.clock_in)}</td>
                    <td style={{padding:"8px 10px"}}>{r.clock_out?fmtTime(r.clock_out):<span style={{color:"#d97706",fontWeight:700}}>勤務中</span>}</td>
                    <td style={{padding:"8px 10px",color:"#92400e"}}>{breaksOf(r).length>0?fmtHM(bh):"—"}</td>
                    <td style={{padding:"8px 10px",fontWeight:700}}>{h!=null?h.toFixed(2)+"時間":"—"}</td>
                    <td style={{padding:"8px 10px"}}>
                      <button onClick={()=>openEdit(r)} style={{padding:"4px 12px",borderRadius:6,border:"1.5px solid #cbd5e1",background:"white",color:"#334155",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>編集</button>

          <div onClick={e=>e.stopPropagation()} style={{background:"white",borderRadius:16,padding:"20px 22px",width:"100%",maxWidth:420,maxHeight:"90vh",overflowY:"auto"}}>

            <div style={{display:"grid",gridTemplateColumns:"90px 1fr",gap:10,alignItems:"center",marginBottom:10}}>
              <label style={{fontSize:12,fontWeight:700,color:"#64748b"}}>スタッフ</label>
              <select value={editing.staff_id} onChange={e=>setEditing(p=>({...p,staff_id:Number(e.target.value)}))} style={inp}>
                {STAFF_ACCOUNTS.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
              </select>

              <label style={{fontSize:12,fontWeight:700,color:"#64748b"}}>退勤</label>

                <span>〜</span>

                <button onClick={()=>setEditing(p=>({...p,breaks:p.breaks.filter((_,j)=>j!==i)}))} style={{border:"none",background:"#fee2e2",color:"#dc2626",borderRadius:6,padding:"6px 10px",cursor:"pointer",fontWeight:800}}>✕</button>
              </div>

            <button onClick={()=>setEditing(p=>({...p,breaks:[...p.breaks,{start:"12:00",end:"13:00"}]}))} style={{padding:"6px 14px",borderRadius:8,border:"1.5px dashed #d97706",background:"white",color:"#92400e",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>＋ 休憩を追加</button>
            <div style={{display:"flex",gap:8,marginTop:20}}>
              {editing.id!=null&&isAdmin&&<button onClick={deleteRecord} disabled={saving} style={{padding:"10px 14px",borderRadius:10,border:"none",background:"#fee2e2",color:"#dc2626",fontSize:13,fontWeight:800,cursor:"pointer",fontFamily:"inherit"}}>削除</button>}
              <button onClick={()=>setEditing(null)} disabled={saving} style={{marginLeft:"auto",padding:"10px 18px",borderRadius:10,border:"1.5px solid #e2e8f0",background:"white",color:"#334155",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>キャンセル</button>
              <button onClick={saveEdit} disabled={saving} style={{padding:"10px 22px",borderRadius:10,border:"none",background:"#1e3a5f",color:"white",fontSize:13,fontWeight:800,cursor:"pointer",fontFamily:"inherit"}}>{saving?"保存中...":"保存"}</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}
// ===== 勤怠：個人別の月一括管理（1か月分を一覧で確認・まとめて入力／修正） =====
function AttendanceMonthly({currentUser,isAdmin}){
  const [records,setRecords]=React.useState([]);
  const [loading,setLoading]=React.useState(true);
  const [staffId,setStaffId]=React.useState(currentUser.id);
  const [ym,setYm]=React.useState(()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;});
  const [draft,setDraft]=React.useState({}); // {日付: {inT,outT,bs,be}}
  const [saving,setSaving]=React.useState(false);
  const [fill,setFill]=React.useState({inT:"09:00",outT:"18:00",bs:"12:00",be:"13:00",days:[1,2,3,4,5,6]}); // 一括入力の標準時間・対象曜日（0=日）
  const todayStr=fmtDate(new Date());
  const staff=STAFF_ACCOUNTS.find(s=>s.id===staffId)||currentUser;

  function load(){
    setLoading(true);
    sb.select("attendance_records","?order=date.asc,clock_in.asc").then(rows=>{
      setRecords(Array.isArray(rows)?rows:[]);
      setLoading(false);
    }).catch(()=>setLoading(false));
  }
  React.useEffect(()=>{ load(); },[]);

  const isoToHM=iso=>{ if(!iso) return""; const d=new Date(iso); return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; };
  const hmToIso=(date,hm)=>hm?new Date(`${date}T${hm}:00`).toISOString():null;
  const breaksOf=r=>Array.isArray(r.breaks)?r.breaks:[];

  const [y,m]=ym.split("-").map(Number);
  const daysInMonth=new Date(y,m,0).getDate();
  const dates=Array.from({length:daysInMonth},(_,i)=>`${ym}-${String(i+1).padStart(2,"0")}`);
  const DOW=["日","月","火","水","木","金","土"];

  // その人の、その月の記録を日付ごとに
  const recsByDate=React.useMemo(()=>{
    const map={};
    records.filter(r=>r.staff_id===staffId&&r.date&&r.date.slice(0,7)===ym).forEach(r=>{ (map[r.date]=map[r.date]||[]).push(r); });
    return map;
  },[records,staffId,ym]);

  // 記録が読み込まれた/人・月が変わったら、入力欄の初期値を作り直す
  const origOf=ds=>{
    const rs=recsByDate[ds]||[];
    if(rs.length!==1) return {inT:"",outT:"",bs:"",be:""};
    const r=rs[0], b=breaksOf(r)[0]||{};
    return {inT:isoToHM(r.clock_in),outT:isoToHM(r.clock_out),bs:isoToHM(b.start),be:isoToHM(b.end)};
  };
  React.useEffect(()=>{
    const d={};
    dates.forEach(ds=>{ d[ds]=origOf(ds); });
    setDraft(d);
  },[recsByDate]);

  const rowOf=ds=>draft[ds]||origOf(ds);
  const setCell=(ds,key,val)=>setDraft(p=>({...p,[ds]:{...(p[ds]||origOf(ds)),[key]:val}}));
  // 同じ日に複数の記録がある日は、ここでは編集せず（「打刻・履歴」の編集から修正）表示だけにする
  const locked=ds=>(recsByDate[ds]||[]).length>1;
  const sameRow=(a,b)=>a.inT===b.inT&&a.outT===b.outT&&a.bs===b.bs&&a.be===b.be;
  const changedDates=dates.filter(ds=>!locked(ds)&&draft[ds]&&!sameRow(draft[ds],origOf(ds)));

  // 2回目以降の休憩（打刻で記録されたもの）の合計時間。表では編集できないが、実働・休憩の計算には含める
  function extraBreakHours(ds){
    const ex=(recsByDate[ds]||[])[0];
    if(!ex) return 0;
    return breaksOf(ex).slice(1).reduce((s,x)=>(x.start&&x.end)?s+(new Date(x.end)-new Date(x.start))/3600000:s,0);
  }
  function workedHours(row,ds){
    if(!row.inT||!row.outT) return null;
    const a=new Date(`${ds}T${row.inT}:00`),b=new Date(`${ds}T${row.outT}:00`);
    let h=(b-a)/3600000;
    if(row.bs&&row.be){ h-=(new Date(`${ds}T${row.be}:00`)-new Date(`${ds}T${row.bs}:00`))/3600000; }
    h-=extraBreakHours(ds);
    return Math.max(0,h);
  }
  function breakHours(row,ds){
    let h=extraBreakHours(ds);
    if(row.bs&&row.be) h+=Math.max(0,(new Date(`${ds}T${row.be}:00`)-new Date(`${ds}T${row.bs}:00`))/3600000);
    return h;
  }
  const fmtHM=h=>{ const mm=Math.round(h*60); return `${Math.floor(mm/60)}:${String(mm%60).padStart(2,"0")}`; };

  // 月間合計（画面上の入力内容ベース＝保存前でも見える）
  let workDays=0,totalH=0,totalBreakH=0;
  dates.forEach(ds=>{
    const rs=recsByDate[ds]||[];
    if(locked(ds)){
      rs.forEach(r=>{
        if(r.clock_in&&r.clock_out){
          const bh=breaksOf(r).reduce((s,b)=>(b.start&&b.end)?s+(new Date(b.end)-new Date(b.start))/3600000:s,0);
          totalH+=Math.max(0,(new Date(r.clock_out)-new Date(r.clock_in))/3600000-bh); totalBreakH+=bh;
        }
      });
      workDays++;
      return;
    }
    const row=rowOf(ds);
    if(row.inT) workDays++;
    const h=workedHours(row,ds);
    if(h!=null){ totalH+=h; totalBreakH+=breakHours(row,ds); }
  });

  // 標準時間を、空欄の日（今日まで）にまとめて入力（保存はまだしない）
  function applyFill(){
    setDraft(p=>{
      const next={...p};
      dates.forEach(ds=>{
        if(ds>todayStr||locked(ds)) return;
        const dow=new Date(ds+"T00:00:00").getDay();
        if(!fill.days.includes(dow)) return;
        const cur=next[ds]||origOf(ds);
        if(cur.inT||cur.outT) return; // すでに入力がある日は上書きしない
        next[ds]={inT:fill.inT,outT:fill.outT,bs:fill.bs,be:fill.be};
      });
      return next;
    });
  }

  async function saveAll(){
    // 入力チェック
    for(const ds of changedDates){
      const r=draft[ds];
      if(r.outT&&!r.inT){ alert(`${ds}：出勤時刻が空欄です`); return; }
      if(r.inT&&r.outT&&r.outT<=r.inT){ alert(`${ds}：退勤は出勤より後の時刻にしてください`); return; }
      if((r.bs&&!r.be)||(!r.bs&&r.be)){ alert(`${ds}：休憩は開始と終了の両方を入力してください`); return; }
      if(r.bs&&r.be&&r.be<=r.bs){ alert(`${ds}：休憩の終了は開始より後の時刻にしてください`); return; }
    }
    if(changedDates.length===0) return;
    const delCount=changedDates.filter(ds=>!draft[ds].inT&&!draft[ds].outT).length;
    if(!confirm(`${staff.name}さんの ${changedDates.length}日分を保存します。`+(delCount>0?`\n（うち${delCount}日分は空欄なので記録を削除します）`:"")+"\nよろしいですか？")) return;
    setSaving(true);
    try{
      for(const ds of changedDates){
        const r=draft[ds];
        const rs=recsByDate[ds]||[];
        const existing=rs[0];
        if(!r.inT&&!r.outT){
          if(existing) await sb.delete("attendance_records",existing.id);
          continue;
        }
        // 2つ目以降の休憩（打刻で記録されたもの）は残し、1つ目だけを入力内容に置き換える
        const restBreaks=existing?breaksOf(existing).slice(1):[];
        const firstBreak=(r.bs&&r.be)?[{start:hmToIso(ds,r.bs),end:hmToIso(ds,r.be)}]:[];
        const payload={
          staff_id:staffId,date:ds,
          clock_in:hmToIso(ds,r.inT),clock_out:hmToIso(ds,r.outT),
          breaks:[...firstBreak,...restBreaks],
        };
        if(existing) await sb.update("attendance_records",existing.id,payload);
        else await sb.insert("attendance_records",payload);
      }
      load();
    }catch(e){ alert("保存に失敗しました。もう一度お試しください。"); }
    setSaving(false);
  }

  function shiftMonth(delta){
    if(changedDates.length>0&&!confirm("保存していない変更があります。月を移動すると破棄されます。よろしいですか？")) return;
    const d=new Date(y,m-1+delta,1);
    setYm(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`);
  }
  function pickStaff(id){
    if(changedDates.length>0&&!confirm("保存していない変更があります。スタッフを切り替えると破棄されます。よろしいですか？")) return;
    setStaffId(id);
  }

  const inp={padding:"5px 6px",border:"1.5px solid #e2e8f0",borderRadius:6,fontSize:13,fontFamily:"inherit",width:98};
  const th={padding:"8px 8px",textAlign:"left",fontWeight:800,color:"#64748b",fontSize:12,whiteSpace:"nowrap"};
  const td={padding:"5px 8px",borderBottom:"1px solid #f1f5f9",fontSize:13,whiteSpace:"nowrap"};

  return(
    <div style={{maxWidth:1100,margin:"0 auto"}}>
      <div className="card" style={{marginBottom:14,padding:"14px 16px"}}>
        <div style={{fontWeight:800,fontSize:15,color:"#1e3a5f",marginBottom:10}}>🗓 個人別 月一括管理</div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}}>
          {STAFF_ACCOUNTS.map(s=>(
            <button key={s.id} onClick={()=>pickStaff(s.id)} style={{padding:"6px 14px",borderRadius:20,border:"2px solid "+s.color,background:staffId===s.id?s.color:"white",color:staffId===s.id?"white":s.color,fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{s.name}</button>
          ))}
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
          <button onClick={()=>shiftMonth(-1)} style={{padding:"5px 12px",borderRadius:8,border:"1.5px solid #e2e8f0",background:"white",cursor:"pointer"}}>◀</button>
          <span style={{fontWeight:800,fontSize:15}}>{y}年{m}月</span>
          <button onClick={()=>shiftMonth(1)} style={{padding:"5px 12px",borderRadius:8,border:"1.5px solid #e2e8f0",background:"white",cursor:"pointer"}}>▶</button>
          <div style={{display:"flex",gap:10,flexWrap:"wrap",marginLeft:"auto"}}>
            <span style={{background:"#eff6ff",color:"#1d4ed8",padding:"4px 12px",borderRadius:20,fontSize:12,fontWeight:800}}>出勤 {workDays}日</span>
            <span style={{background:"#ecfdf5",color:"#047857",padding:"4px 12px",borderRadius:20,fontSize:12,fontWeight:800}}>実働 {fmtHM(totalH)}（{totalH.toFixed(1)}時間）</span>
            <span style={{background:"#fef3c7",color:"#92400e",padding:"4px 12px",borderRadius:20,fontSize:12,fontWeight:800}}>休憩 {fmtHM(totalBreakH)}</span>
          </div>
        </div>
      </div>

      <div className="card" style={{marginBottom:14,padding:"12px 16px"}}>
        <div style={{fontWeight:800,fontSize:13,color:"#1e3a5f",marginBottom:8}}>⚡ 標準の勤務時間を空欄の日にまとめて入力（今日まで）</div>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          <span style={{fontSize:12,color:"#64748b"}}>出勤</span><input type="time" value={fill.inT} onChange={e=>setFill(p=>({...p,inT:e.target.value}))} style={inp}/>
          <span style={{fontSize:12,color:"#64748b"}}>退勤</span><input type="time" value={fill.outT} onChange={e=>setFill(p=>({...p,outT:e.target.value}))} style={inp}/>
          <span style={{fontSize:12,color:"#64748b"}}>休憩</span><input type="time" value={fill.bs} onChange={e=>setFill(p=>({...p,bs:e.target.value}))} style={inp}/>
          <span>〜</span><input type="time" value={fill.be} onChange={e=>setFill(p=>({...p,be:e.target.value}))} style={inp}/>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",marginTop:8}}>
          <span style={{fontSize:12,color:"#64748b"}}>対象の曜日</span>
          {DOW.map((n,i)=>(
            <label key={i} style={{display:"flex",alignItems:"center",gap:3,fontSize:12,fontWeight:700,color:i===0?"#dc2626":i===6?"#7c3aed":"#334155",cursor:"pointer"}}>
              <input type="checkbox" checked={fill.days.includes(i)} onChange={e=>setFill(p=>({...p,days:e.target.checked?[...p.days,i]:p.days.filter(x=>x!==i)}))}/>{n}
            </label>
          ))}
          <button onClick={applyFill} style={{marginLeft:"auto",padding:"7px 16px",borderRadius:8,border:"none",background:"#0891b2",color:"white",fontSize:12,fontWeight:800,cursor:"pointer",fontFamily:"inherit"}}>空欄の日に入力する</button>
        </div>
        <div style={{fontSize:11,color:"#94a3b8",marginTop:6}}>※入力済みの日は上書きしません。入力後、下の「保存」を押すまで記録には反映されません。</div>
      </div>

      <div className="card">
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",minWidth:760}}>
            <thead>
              <tr style={{background:"#f8fafc",borderBottom:"2px solid #e2e8f0"}}>
                {["日付","出勤","退勤","休憩開始","休憩終了","実働"].map(h=><th key={h} style={th}>{h}</th>)}
              </tr>
            </thead>
            <tbody>
              {loading?(
                <tr><td colSpan={6} style={{padding:20,textAlign:"center",color:"#94a3b8"}}>読み込み中...</td></tr>
              ):dates.map(ds=>{
                const dow=new Date(ds+"T00:00:00").getDay();
                const isLocked=locked(ds);
                const row=rowOf(ds);
                const h=isLocked?null:workedHours(row,ds);
                const changed=changedDates.includes(ds);
                const future=ds>todayStr;
                const dc=dow===0?"#dc2626":dow===6?"#7c3aed":"#1e293b";
                if(isLocked){
                  const rs=recsByDate[ds];
                  return(
                    <tr key={ds} style={{background:"#f8fafc"}}>
                      <td style={{...td,fontWeight:700,color:dc}}>{Number(ds.slice(8))}（{DOW[dow]}）</td>
                      <td colSpan={5} style={{...td,color:"#64748b",fontSize:12}}>この日は打刻が{rs.length}件あります：{rs.map(r=>`${isoToHM(r.clock_in)}〜${r.clock_out?isoToHM(r.clock_out):"勤務中"}`).join(" / ")}（「打刻・履歴」の編集から修正できます）</td>
                    </tr>
                  );
                }
                return(
                  <tr key={ds} style={{background:changed?"#fffbeb":(dow===0?"#fff7f7":"white"),opacity:future&&!row.inT?0.55:1}}>
                    <td style={{...td,fontWeight:700,color:dc}}>{Number(ds.slice(8))}（{DOW[dow]}）{ds===todayStr&&<span style={{marginLeft:6,fontSize:10,background:"#d97706",color:"white",borderRadius:8,padding:"1px 6px"}}>今日</span>}</td>
                    <td style={td}><input type="time" value={row.inT} onChange={e=>setCell(ds,"inT",e.target.value)} style={inp}/></td>
                    <td style={td}><input type="time" value={row.outT} onChange={e=>setCell(ds,"outT",e.target.value)} style={inp}/></td>
                    <td style={td}><input type="time" value={row.bs} onChange={e=>setCell(ds,"bs",e.target.value)} style={inp}/></td>
                    <td style={td}><input type="time" value={row.be} onChange={e=>setCell(ds,"be",e.target.value)} style={inp}/></td>
                    <td style={{...td,fontWeight:700}}>{h!=null?fmtHM(h):(row.inT&&!row.outT?<span style={{color:"#d97706"}}>退勤未入力</span>:"—")}{extraBreakHours(ds)>0&&<span style={{marginLeft:6,fontSize:10,color:"#92400e",fontWeight:700}}>（打刻の休憩+{fmtHM(extraBreakHours(ds))}含む）</span>}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>

      <div style={{position:"sticky",bottom:0,background:"white",borderTop:"1px solid #e2e8f0",padding:"12px 16px",marginTop:14,display:"flex",alignItems:"center",gap:12,borderRadius:"0 0 12px 12px"}}>
        <span style={{fontSize:13,fontWeight:700,color:changedDates.length>0?"#92400e":"#94a3b8"}}>{changedDates.length>0?`${changedDates.length}日分の変更が未保存です`:"変更はありません"}</span>
        {changedDates.length>0&&<button onClick={()=>setDraft(Object.fromEntries(dates.map(ds=>[ds,origOf(ds)])))} disabled={saving} style={{padding:"9px 16px",borderRadius:10,border:"1.5px solid #e2e8f0",background:"white",color:"#334155",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>元に戻す</button>}
        <button onClick={saveAll} disabled={saving||changedDates.length===0} style={{marginLeft:"auto",padding:"11px 28px",borderRadius:10,border:"none",background:changedDates.length>0?"#1e3a5f":"#cbd5e1",color:"white",fontSize:14,fontWeight:800,cursor:changedDates.length>0?"pointer":"default",fontFamily:"inherit"}}>{saving?"保存中...":"まとめて保存"}</button>
      </div>
    </div>
  );
}

// 勤怠管理：「打刻・履歴」と「個人別 月一括管理」の切り替え
function AttendancePanel({currentUser,isAdmin}){
  const [tab,setTab]=React.useState("punch");
  const tabBtn=(id,label)=>(
    <button onClick={()=>setTab(id)} style={{padding:"9px 20px",borderRadius:10,border:"2px solid "+(tab===id?"#1e3a5f":"#e2e8f0"),background:tab===id?"#1e3a5f":"white",color:tab===id?"white":"#334155",fontSize:13,fontWeight:800,cursor:"pointer",fontFamily:"inherit"}}>{label}</button>
  );
  return(
    <div>
      <div style={{maxWidth:1100,margin:"0 auto 14px",display:"flex",gap:8}}>
        {tabBtn("punch","⏰ 打刻・履歴")}
        {tabBtn("monthly","🗓 個人別 月一括管理")}
      </div>
      {tab==="punch"?<AttendancePunchPanel currentUser={currentUser} isAdmin={isAdmin}/>:<AttendanceMonthly currentUser={currentUser} isAdmin={isAdmin}/>}
