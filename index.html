<script>
// あんど整骨院：管理画面から直接レジドロアを開けるための処理（会計を介さない、両替などの操作用）
// pos.html（会計画面）で使っているのと同じStarWebPRNT SDKを使用
function openAdminCashDrawer(){
  const isInWebPRNTApp=navigator.userAgent.indexOf("webPRNTSupportMessageHandler")>=0;
  if(!isInWebPRNTApp){
    alert("レシートプリンター（Star webPRNT Browser）アプリ内でのみ利用できます");
    return;
  }
  try{
    const builder=new StarWebPrintBuilder();
    let request="";
    request+=builder.createInitializationElement();
    request+=builder.createPeripheralElement({channel:1,on:200,off:200});
    const trader=new StarWebPrintTrader({url:"https://localhost:8001/StarWebPRNT/SendMessage"});
    trader.onReceive=function(response){
      if(response.traderSuccess==="true"){
        if(window.__showAdminDrawerToast) window.__showAdminDrawerToast("🗄️ レジを開けました","success");
      }else{
        if(window.__showAdminDrawerToast) window.__showAdminDrawerToast("❌ レジドロアを開けられませんでした（プリンターの状態をご確認ください）","delete");
      }
    };
    trader.onError=function(response){
      if(window.__showAdminDrawerToast) window.__showAdminDrawerToast("❌ ドロア開放エラー："+(response.responseText||"接続できませんでした"),"delete");
    };
    trader.sendMessage({request:request});
  }catch(e){
    if(window.__showAdminDrawerToast) window.__showAdminDrawerToast("❌ ドロア開放処理でエラーが発生しました："+e.message,"delete");
  }
}
</script>

*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;background:#eef2f7;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:inherit;font-weight:700;cursor:pointer;border:none;transition:all .15s;}
.btn-primary{background:linear-gradient(180deg,#2563eb,#1d4ed8);color:white;border-radius:8px;padding:9px 16px;font-size:13px;box-shadow:0 2px 0 #1e3a8a,0 4px 8px rgba(37,99,235,.3);}
.btn-primary:hover{background:linear-gradient(180deg,#3b82f6,#2563eb);transform:translateY(-1px);box-shadow:0 3px 0 #1e3a8a,0 6px 12px rgba(37,99,235,.35);}
.btn-primary:active{transform:translateY(1px);box-shadow:0 1px 0 #1e3a8a;}
.btn-success{background:linear-gradient(180deg,#16a34a,#15803d);color:white;border-radius:8px;padding:9px 16px;font-size:13px;box-shadow:0 2px 0 #14532d,0 4px 8px rgba(22,163,74,.3);}
.btn-success:hover{transform:translateY(-1px);box-shadow:0 3px 0 #14532d,0 6px 12px rgba(22,163,74,.35);}
.btn-success:active{transform:translateY(1px);box-shadow:0 1px 0 #14532d;}
.btn-danger{background:linear-gradient(180deg,#ef4444,#dc2626);color:white;border-radius:8px;padding:9px 16px;font-size:13px;box-shadow:0 2px 0 #991b1b,0 4px 8px rgba(239,68,68,.3);}
.btn-danger:hover{transform:translateY(-1px);}
.btn-danger:active{transform:translateY(1px);box-shadow:0 1px 0 #991b1b;}
.btn-ghost{background:rgba(255,255,255,0.15);backdrop-filter:blur(4px);color:white;border-radius:8px;padding:8px 14px;font-size:13px;border:1px solid rgba(255,255,255,0.25);}
.btn-ghost:hover{background:rgba(255,255,255,0.25);}
.btn-outline{background:white;color:#374151;border:1.5px solid #d1d5db;border-radius:8px;padding:7px 14px;font-size:13px;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.btn-outline:hover{border-color:#6b7280;box-shadow:0 2px 6px rgba(0,0,0,.12);}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px;}
.btn-xs{padding:3px 8px;font-size:11px;border-radius:5px;}
.btn-icon{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);color:white;border-radius:8px;padding:7px 10px;font-size:13px;cursor:pointer;}

function addMonths(dateStr,months){
  const d=new Date(dateStr+"T00:00:00");
  d.setMonth(d.getMonth()+months);

// ===== 紹介特典の自動発行 =====
// 「紹介された患者」が初来院チェックインした瞬間に、紹介者へ特典を自動発行する。
// ・毎回：施術1回無料
// ・3人紹介ごと：回数券1回分ボーナス
// ・5人紹介ごと：フリーパス1ヶ月プレゼント
// 戻り値：{issued:boolean, referrerName, count, error}
async function processReferralBonus(booking,allBookings){
  const referrerName=(booking.referrer_name||"").trim();
  if(!referrerName) return {issued:false};

  try{
    // 二重付与防止：この予約に対してすでに紹介実績が記録されていないか確認
    const existing=await sb.select("referrals",`?referred_booking_id=eq.${booking.id}`);
    if(Array.isArray(existing)&&existing.length>0) return {issued:false,already:true};

    // 紹介者の連絡先を過去の予約データから検索（同姓同名の可能性があるため、最新の予約を採用）
    const referrerBookings=allBookings.filter(b=>b.patient_name===referrerName).sort((a,b)=>b.date.localeCompare(a.date));
    const referrerPhone=referrerBookings.length>0?referrerBookings[0].phone:null;
    if(!referrerPhone){
      return {issued:false,error:`紹介者「${referrerName}」の連絡先が見つからず、特典を自動発行できませんでした。手動でご対応ください。`};
    }

    const todayStr=fmtDate(new Date());

    // 紹介実績を記録
    await sb.insert("referrals",{
      referrer_name:referrerName,
      referrer_phone:referrerPhone,
      referred_patient_name:booking.patient_name,
      referred_booking_id:booking.id,
    });

    // これまでの紹介実績数をカウント
    const allReferrals=await sb.select("referrals",`?referrer_name=eq.${encodeURIComponent(referrerName)}`);
    const count=Array.isArray(allReferrals)?allReferrals.length:1;

    const issuedIsTraining=!!booking.is_training; // 紹介元の予約がトレーニングモードなら、発行する特典もトレーニング扱いにする
    const passesToIssue=[
      {phone:referrerPhone,pass_type:"紹介特典：施術1回無料",total_count:1,remaining_count:1,expiry_date:addMonths(todayStr,3),purchased_date:todayStr,active:true,is_training:issuedIsTraining},
    ];
    if(count%3===0){
      passesToIssue.push({phone:referrerPhone,pass_type:"紹介ボーナス：回数券1回分",total_count:1,remaining_count:1,expiry_date:addMonths(todayStr,3),purchased_date:todayStr,active:true,is_training:issuedIsTraining});
    }
    if(count%5===0){
      passesToIssue.push({phone:referrerPhone,pass_type:"紹介ボーナス：FP（フリーパス）1ヶ月",total_count:null,remaining_count:null,expiry_date:addMonths(todayStr,1),purchased_date:todayStr,active:true,is_training:issuedIsTraining});
    }
    for(const p of passesToIssue){
      await sb.insert("passes",p);
    }

    return {issued:true,referrerName,count,bonusCount:passesToIssue.length-1};
  }catch(e){
    console.error("紹介特典の発行に失敗しました",e);
    return {issued:false,error:"紹介特典の発行処理でエラーが発生しました："+(e.message||"不明なエラー")};
  }
}

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {

});

const sb = {
  async query(table,method="GET",body=null,filters=""){
    // ログイン中ならセッショントークンを、未ログインならanonキーを使う
    const {data:{session}} = await supabaseClient.auth.getSession();
    const token = session ? session.access_token : SUPABASE_ANON_KEY;
    const res=await fetch(`${SUPABASE_URL}/rest/v1/${table}${filters}`,{
      method,headers:{"apikey":SUPABASE_ANON_KEY,"Authorization":`Bearer ${token}`,"Content-Type":"application/json","Prefer":"return=representation"},
      body:body?JSON.stringify(body):null,
    });
    const text=await res.text();return text?JSON.parse(text):[];
  },
  select:(t,f="")=>sb.query(t,"GET",null,f),
  insert:(t,d)=>sb.query(t,"POST",d),
  update:(t,id,d)=>sb.query(t,"PATCH",d,`?id=eq.${id}`),
  delete:(t,id)=>sb.query(t,"DELETE",null,`?id=eq.${id}`),

  // ===== Auth関連 =====
  async login(email,password){
    const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
    if(error) throw error;
    return data;
  },
  async logout(){
    await supabaseClient.auth.signOut();
  },
  async getSession(){
    const {data:{session}}=await supabaseClient.auth.getSession();

  },
};

// 予約の追加・変更・キャンセルをスタッフのLINEグループへ自動共有するためのヘルパー。
// line_groupsテーブルに登録されているグループ（現状「スタッフグループ」）へ送信する。
// 失敗しても予約自体の保存処理には影響させない（best-effort・非同期で投げっぱなし）。
async function notifyStaffGroup(message){
  try{
    const groups=await sb.select("line_groups","?select=group_id&limit=1");
    const groupId=Array.isArray(groups)&&groups[0]?groups[0].group_id:null;
    if(!groupId) return;
    await fetch("/api/notify-line-group",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({groupId,message}),
    });
  }catch(e){
    console.error("スタッフLINEグループへの通知に失敗しました：",e);
  }
}

const today=new Date();
function fmtDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function getWeekDates(base){
  const day=base.getDay(),mon=new Date(base);
  mon.setDate(base.getDate()-(day===0?6:day-1));
  return Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d;});
}
function toMin(t){const[h,m]=t.split(":").map(Number);return h*60+m;}
function addMinutesToTime(t,mins){
  const total=toMin(t)+mins;
  const h=Math.floor(total/60),m=total%60;
  return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
}
function overlaps(a,b){
  const as=toMin(a.time),ae=as+(a.duration||DURATION[a.menu]||30),bs=toMin(b.time),be=bs+(b.duration||DURATION[b.menu]||30);
  return as<be&&bs<ae;
}

// 「予約日」と「予約が作成された日」が同じかどうか＝当日予約かどうかを判定する
function isSameDayBooking(b){
  if(!b.created_at) return false;
  return fmtDate(new Date(b.created_at))===b.date;
}

// 同じスタッフの予約を、時間が重ならないよう「レーン」に振り分ける（ベッド・アシスタント等で同時に複数人を担当できる場合用）。
// 戻り値：{ laneOf:{bookingId:レーン番号(0始まり)}, laneCount:実際に必要だったレーン数 }
function assignLanes(bookingsForStaff,minGapMinutes){
  minGapMinutes = minGapMinutes || 0;
  const sorted=[...bookingsForStaff].sort((a,b)=>a.time.localeCompare(b.time));
  const laneEndTimes=[];
  const laneOf={};
  sorted.forEach(b=>{
    const startMin=toMin(b.time);
    const realDuration=(b.duration||DURATION[b.menu]||30);
    const endMin=startMin+Math.max(realDuration,minGapMinutes);
    let placed=-1;
    for(let i=0;i<laneEndTimes.length;i++){
      if(laneEndTimes[i]<=startMin){placed=i;break;}
    }
    if(placed===-1){laneEndTimes.push(endMin);placed=laneEndTimes.length-1;}
    else laneEndTimes[placed]=endMin;
    laneOf[b.id]=placed;
  });
  return {laneOf,laneCount:laneEndTimes.length};
}

// 指定した患者の「次回予約」（今日以降の、キャンセルされていない、対象自身を除く予約のうち一番早いもの）を探す
function findNextBookingFor(patientName,excludeId,bookingsList,todayStr){
  const upcoming=bookingsList
    .filter(b=>b.patient_name===patientName&&b.id!==excludeId&&!b.cancelled&&b.date>=todayStr)
    .sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time));
  return upcoming.length>0?upcoming[0]:null;
}

      await sb.login(email.trim(),pw);
      // ログイン後、clinic_staffから対応するスタッフ情報を取得（RLSにより自分の分だけ見える）
      const users=await sb.select("clinic_staff",`?email=eq.${encodeURIComponent(email.trim())}`);

        const acc=STAFF_ACCOUNTS.find(s=>s.id===u.id)||STAFF_ACCOUNTS.find(s=>s.email===u.email);
        onLogin({...u,color:(acc&&acc.color)||u.color||"#64748b",initial:(acc&&acc.initial)||u.initial||(u.name?u.name.charAt(0):"?")});
      }else{
        setErr("スタッフ情報が見つかりませんでした");
      }

function BreakModal({onClose,bookings,breaks,setBreaks}){
  const [selDate,setSelDate]=React.useState(fmtDate(today));
  const [selStaff,setSelStaff]=React.useState(1);
  const [selStartTime,setSelStartTime]=React.useState("");
  const [selDuration,setSelDuration]=React.useState(30);
  const [reason,setReason]=React.useState("休憩");
  const [saving,setSaving]=React.useState(false);
  const [toast,setToast]=React.useState("");
  const todayBreaks=breaks.filter(b=>b.date===selDate);
  const DURATION_OPTIONS_BREAK=Array.from({length:12},(_,i)=>(i+1)*10); // 10分刻みで10〜120分
  async function addBreak(){
    if(!selStartTime){setToast("開始時刻を選択してください");setTimeout(()=>setToast(""),2500);return;}
    setSaving(true);
    try{
      const data=await sb.insert("staff_breaks",{staff_id:selStaff,date:selDate,time:selStartTime,duration:selDuration,reason});
      const newBreak=(Array.isArray(data)&&data.length>0)?data[0]:{id:Date.now()+Math.random(),staff_id:selStaff,date:selDate,time:selStartTime,duration:selDuration,reason};
      setBreaks(prev=>[...prev,newBreak]);setSelStartTime("");
      setToast("休憩を登録しました");setTimeout(()=>setToast(""),2500);
    }catch(e){setToast("エラー");setTimeout(()=>setToast(""),3000);}
    setSaving(false);
  }
  async function delBreak(id){
    try{await sb.delete("staff_breaks",id);}catch{}
    setBreaks(prev=>prev.filter(b=>b.id!==id));

  return(
    <div className="modal-overlay">

          <div style={{background:"#f8fafc",borderRadius:10,padding:14,marginBottom:18,border:"1px solid #e2e8f0"}}>
            <div style={{fontWeight:800,fontSize:13,color:"#1e3a5f",marginBottom:12}}>休憩を登録</div>
            <div className="form-group">

              </div>

              <div className="form-group">
                <label className="form-label">開始時刻</label>
                <select className="form-input" value={selStartTime} onChange={e=>setSelStartTime(e.target.value)}>
                  <option value="">選択</option>

function CancelModal({booking,bookings,todayStr,storeStaffList,isAdmin,onClose,onConfirm}){
  const [reason,setReason]=React.useState("");
  const [customReason,setCustomReason]=React.useState("");
  const [saving,setSaving]=React.useState(false);
  const staff=STAFF_ACCOUNTS.find(s=>s.id===booking.staff_id)||{name:"不明",color:"#888"};
  const nextBooking=React.useMemo(()=>findNextBookingFor(booking.patient_name,booking.id,bookings,todayStr),[booking,bookings,todayStr]);

  const [wantRebook,setWantRebook]=React.useState(false);
  const [rebookDate,setRebookDate]=React.useState("");
  const [rebookTime,setRebookTime]=React.useState("");
  const [rebookStaffId,setRebookStaffId]=React.useState(booking.staff_id);

  const rebookConflict=React.useMemo(()=>{
    if(!wantRebook||!rebookDate||!rebookTime) return false;
    return bookings.some(b=>!b.cancelled&&b.id!==booking.id&&b.staff_id===rebookStaffId&&b.date===rebookDate&&overlaps(b,{time:rebookTime,duration:booking.duration||DURATION[booking.menu]||30}));
  },[wantRebook,rebookDate,rebookTime,rebookStaffId,bookings,booking]);

  async function confirm(){
    const finalReason=reason==="その他"?(customReason.trim()||"その他"):reason;
    if(!finalReason){alert("キャンセル理由を選択してください");return;}
    if(wantRebook){
      if(!rebookDate||!rebookTime){alert("次回予約の日付・時間を選択してください");return;}
      if(rebookConflict){alert("その日時はすでに予約が入っています。別の日時を選んでください");return;}
    }
    setSaving(true);
    await onConfirm(finalReason, wantRebook?{date:rebookDate,time:rebookTime,staff_id:rebookStaffId}:null);
    setSaving(false);
  }

  return(
    <div className="modal-overlay">
      <div className="modal-box" style={{maxWidth:440,maxHeight:"90vh",overflowY:"auto"}}>
        <div className="modal-header" style={{background:"linear-gradient(135deg,#dc2626,#991b1b)"}}>
          <div>
            <div style={{fontWeight:800,fontSize:16,color:"white"}}>予約をキャンセル</div>
            <div style={{fontSize:12,color:"rgba(255,255,255,.75)",marginTop:2}}>この枠は空き枠として開放されます</div>
          </div>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>
        <div style={{padding:20}}>
          <div style={{background:"#f8fafc",borderRadius:10,padding:"12px 14px",marginBottom:12,border:"1px solid #e2e8f0"}}>
            <div style={{fontWeight:800,fontSize:15,color:"#1e293b"}}>{booking.patient_name} 様</div>
            <div style={{fontSize:13,color:"#64748b",marginTop:2}}>{booking.date}　{booking.time}　{staff.name}</div>
            <div style={{fontSize:12,color:"#94a3b8",marginTop:2}}>{booking.menu}</div>
          </div>
          <div style={{borderRadius:10,padding:"10px 14px",marginBottom:16,border:`1.5px solid ${nextBooking?"#bbf7d0":"#fed7aa"}`,background:nextBooking?"#f0fdf4":"#fff7ed"}}>
            {nextBooking?(
              <div style={{fontSize:12,color:"#065f46",fontWeight:700}}>✅ 次回予約あり：{nextBooking.date}　{nextBooking.time}</div>
            ):(
              <div style={{fontSize:12,color:"#9a3412",fontWeight:700}}>⚠ 次回予約なし（フォローが必要かもしれません）</div>
            )}
          </div>
          <div className="form-group">
            <label className="form-label">キャンセル理由 *</label>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              {CANCEL_REASONS.map(r=>(
                <button key={r} onClick={()=>setReason(r)} className="btn"
                  style={{padding:"7px 12px",borderRadius:8,border:`2px solid ${reason===r?"#dc2626":"#e2e8f0"}`,background:reason===r?"#dc2626":"white",color:reason===r?"white":"#374151",fontSize:12,fontWeight:reason===r?700:500}}>
                  {r}
                </button>
              ))}
            </div>
            {reason==="その他"&&(
              <input className="form-input" style={{marginTop:10}} placeholder="理由を入力してください" value={customReason} onChange={e=>setCustomReason(e.target.value)}/>
            )}
          </div>

          {/* 次回予約をその場で作成 */}
          <div style={{marginTop:16,marginBottom:6,padding:"12px 14px",background:wantRebook?"#eff6ff":"#f8fafc",borderRadius:10,border:`1.5px solid ${wantRebook?"#93c5fd":"#e2e8f0"}`}}>
            <div style={{display:"flex",alignItems:"center",gap:10,cursor:"pointer"}} onClick={()=>setWantRebook(v=>!v)}>
              <div style={{width:40,height:22,borderRadius:11,background:wantRebook?"#2563eb":"#d1d5db",position:"relative",flexShrink:0,transition:"background .15s"}}>
                <div style={{position:"absolute",top:2,left:wantRebook?20:2,width:18,height:18,borderRadius:"50%",background:"white",transition:"left .15s",boxShadow:"0 1px 3px rgba(0,0,0,.2)"}}/>
              </div>
              <div>
                <div style={{fontSize:13,fontWeight:800,color:"#1e3a5f"}}>📅 この場で次回予約も作成する</div>
                <div style={{fontSize:11,color:"#94a3b8"}}>キャンセルと同時に新しい予約を登録します</div>
              </div>
            </div>

            {wantRebook&&(
              <div style={{marginTop:14}}>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
                  <div>
                    <label className="form-label">日付</label>
                    <input type="date" className="form-input" value={rebookDate} onChange={e=>setRebookDate(e.target.value)}/>
                  </div>
                  <div>
                    <label className="form-label">時間</label>
                    <select className="form-input" value={rebookTime} onChange={e=>setRebookTime(e.target.value)}>
                      <option value="">選択</option>
                      {SLOTS.map(t=><option key={t} value={t}>{t}</option>)}
                    </select>
                  </div>
                </div>
                {isAdmin&&storeStaffList&&storeStaffList.length>0&&(
                  <div style={{marginBottom:10}}>
                    <label className="form-label">担当スタッフ</label>
                    <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                      {storeStaffList.map(s=>(
                        <button key={s.id} onClick={()=>setRebookStaffId(s.id)} className="btn"
                          style={{padding:"5px 12px",borderRadius:20,border:`2px solid ${rebookStaffId===s.id?s.color:"#e2e8f0"}`,background:rebookStaffId===s.id?s.color:"white",color:rebookStaffId===s.id?"white":"#374151",fontSize:12,fontWeight:700}}>
                          {s.name}
                        </button>
                      ))}
                    </div>
                  </div>
                )}
                {rebookConflict&&(
                  <div style={{background:"#fef2f2",border:"1.5px solid #fecaca",borderRadius:8,padding:"8px 12px",fontSize:12,color:"#dc2626",fontWeight:700}}>
                    ⚠ その日時はすでに予約が入っています
                  </div>
                )}
              </div>
            )}
          </div>

          <div style={{display:"flex",gap:10,marginTop:20}}>
            <button onClick={onClose} className="btn btn-outline" style={{flex:1,justifyContent:"center",padding:11}}>戻る</button>
            <button onClick={confirm} disabled={saving||!reason||(wantRebook&&rebookConflict)} className="btn btn-danger" style={{flex:2,justifyContent:"center",padding:11,opacity:(saving||!reason||(wantRebook&&rebookConflict))?0.6:1}}>
              {saving?"処理中...":wantRebook?"キャンセル＋次回予約を確定する":"キャンセルを確定する"}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ===== プレオープン期間の日別集計 =====
function PreOpenStatsPanel({bookings,payments,stores,user}){
  const [selStoreId,setSelStoreId]=React.useState(null); // null=全店舗
  const [rangeStart,setRangeStart]=React.useState("2026-10-01");
  const [rangeEnd,setRangeEnd]=React.useState("2026-10-04");
  const [passes,setPasses]=React.useState([]);
  // forecast＝来院前に予約データだけで見る集計／actual＝来院後の会計実績ベースの集計（従来の内容）
  const [mode,setMode]=React.useState("forecast");

  // ===== イベントが終わったら、その時点の集計結果を保存して後から見返せるようにする =====
  const [savedSnapshots,setSavedSnapshots]=React.useState([]);
  const [showSavedList,setShowSavedList]=React.useState(false);
  const [savingSnapshot,setSavingSnapshot]=React.useState(false);
  const [expandedSnapshotId,setExpandedSnapshotId]=React.useState(null);

  function fetchSavedSnapshots(){
    sb.select("event_stats_snapshots","?order=created_at.desc&limit=30")
      .then(rows=>setSavedSnapshots(Array.isArray(rows)?rows:[]))
      .catch(()=>{});
  }
  React.useEffect(()=>{ fetchSavedSnapshots(); },[]);

  const firstStoreId=(stores&&stores.length>0)?stores[0].id:1;

  // 店舗の「各種設定」に保存されたイベント期間があれば、それを初期値として反映する
  React.useEffect(()=>{
    const targetStoreId=stores&&stores.length>0?stores[0].id:null;
    if(!targetStoreId) return;
    sb.select("store_settings",`?store_id=eq.${targetStoreId}&order=updated_at.desc.nullslast,id.desc&limit=1`)
      .then(rows=>{
        if(Array.isArray(rows)&&rows.length>0){
          const s=rows[0];
          if(s.event_start_date) setRangeStart(s.event_start_date);
          if(s.event_end_date) setRangeEnd(s.event_end_date);
        }
      }).catch(()=>{});
  },[]);

  React.useEffect(()=>{
    sb.select("passes","?order=purchased_date.asc")
      .then(rows=>setPasses(Array.isArray(rows)?rows:[]))
      .catch(()=>setPasses([]));
  },[]);

  const scopedBookings=React.useMemo(()=>{
    if(selStoreId===null) return bookings;
    return bookings.filter(b=>(b.store_id||firstStoreId)===selStoreId);
  },[bookings,selStoreId,firstStoreId]);

  const scopedBookingIds=React.useMemo(()=>new Set(scopedBookings.map(b=>b.id)),[scopedBookings]);
  const scopedPayments=React.useMemo(()=>{
    if(selStoreId===null) return payments;
    return payments.filter(p=>scopedBookingIds.has(p.booking_id));
  },[payments,selStoreId,scopedBookingIds]);

  const dateList=React.useMemo(()=>{
    const list=[];
    if(!rangeStart||!rangeEnd) return list;
    let d=new Date(rangeStart+"T00:00:00");
    const end=new Date(rangeEnd+"T00:00:00");
    let guard=0;
    while(d<=end&&guard<60){
      list.push(fmtDate(d));
      d.setDate(d.getDate()+1);
      guard++;
    }
    return list;
  },[rangeStart,rangeEnd]);

  // 患者ごとの初回来院日（新患判定用。店舗内の全期間データから算出）
  const firstVisitByPatient=React.useMemo(()=>{
    const map={};
    [...scopedBookings].filter(b=>!b.cancelled).sort((a,b)=>a.date.localeCompare(b.date)).forEach(b=>{
      if(!map[b.patient_name]) map[b.patient_name]=b.date;
    });
    return map;
  },[scopedBookings]);

  // 患者ごとの来院日一覧（次回予約有無の判定用）
  const datesByPatient=React.useMemo(()=>{
    const map={};
    scopedBookings.filter(b=>!b.cancelled).forEach(b=>{
      if(!map[b.patient_name]) map[b.patient_name]=[];
      map[b.patient_name].push(b.date);
    });
    return map;
  },[scopedBookings]);

  function isTrialMenu(menu){
    return !!menu&&(menu.includes("体験")||menu.includes("500"));
  }

  // 会計（payments）が実際に記録されている予約IDの一覧（実来院数の判定に使う）
  const paidBookingIds=React.useMemo(()=>{
    const set=new Set();
    (payments||[]).forEach(p=>{ if(p.booking_id!=null) set.add(p.booking_id); });
    return set;
  },[payments]);

  const dayStats=dateList.map(dateStr=>{
    const dayBookings=scopedBookings.filter(b=>b.date===dateStr);
    const totalBookings=dayBookings.length;
    const cancelledCount=dayBookings.filter(b=>b.cancelled).length;
    const attended=dayBookings.filter(b=>!b.cancelled&&paidBookingIds.has(b.id));
    const actualVisits=attended.length;
    const newPatients=attended.filter(b=>firstVisitByPatient[b.patient_name]===dateStr).length;
    const trialCount=attended.filter(b=>isTrialMenu(b.menu)).length;
    const lineCount=dayBookings.filter(b=>b.line_user_id).length;

    let nextBookingCount=0;
    attended.forEach(b=>{
      const dates=datesByPatient[b.patient_name]||[];
      if(dates.some(dd=>dd>dateStr)) nextBookingCount++;
    });
    const nextBookingRate=actualVisits>0?Math.round(nextBookingCount/actualVisits*100):0;

    const dayPasses=passes.filter(p=>p.purchased_date===dateStr);
    const contractCount=new Set(dayPasses.map(p=>p.patient_name)).size;
    const contractRate=actualVisits>0?Math.round(contractCount/actualVisits*100):0;

    const dayPayments=scopedPayments.filter(p=>p.payment_date===dateStr);
    const sales=dayPayments.reduce((s,p)=>s+(p.total_amount||0),0);
    const salesPerVisit=actualVisits>0?Math.round(sales/actualVisits):0;

    const staffCount=new Set(dayBookings.filter(b=>!b.cancelled).map(b=>b.staff_id)).size;

    return{dateStr,totalBookings,actualVisits,newPatients,cancelledCount,trialCount,lineCount,
      nextBookingCount,nextBookingRate,contractCount,contractRate,sales,salesPerVisit,staffCount};
  });

  const totals=dayStats.reduce((acc,d)=>{
    acc.totalBookings+=d.totalBookings;acc.actualVisits+=d.actualVisits;acc.newPatients+=d.newPatients;
    acc.cancelledCount+=d.cancelledCount;acc.trialCount+=d.trialCount;acc.lineCount+=d.lineCount;
    acc.nextBookingCount+=d.nextBookingCount;acc.contractCount+=d.contractCount;acc.sales+=d.sales;
    return acc;
  },{totalBookings:0,actualVisits:0,newPatients:0,cancelledCount:0,trialCount:0,lineCount:0,nextBookingCount:0,contractCount:0,sales:0});
  totals.nextBookingRate=totals.actualVisits>0?Math.round(totals.nextBookingCount/totals.actualVisits*100):0;
  totals.contractRate=totals.actualVisits>0?Math.round(totals.contractCount/totals.actualVisits*100):0;
  totals.salesPerVisit=totals.actualVisits>0?Math.round(totals.sales/totals.actualVisits):0;

  // ===== 来院前に確認できる「予約ベース」の集計（会計・来院を待たず、予約データだけで集計する）=====
  const forecastDayStats=dateList.map(dateStr=>{
    const dayBookings=scopedBookings.filter(b=>b.date===dateStr);
    const active=dayBookings.filter(b=>!b.cancelled);
    const cancelledCount=dayBookings.length-active.length;
    const newPatientCount=active.filter(b=>firstVisitByPatient[b.patient_name]===dateStr).length;
    const trialCount=active.filter(b=>isTrialMenu(b.menu)).length;
    const lineCount=active.filter(b=>b.line_user_id).length;
    const referralCount=active.filter(b=>(b.referrer_name&&b.referrer_name.trim())||b.referral_code_used).length;
    const staffCount=new Set(active.map(b=>b.staff_id)).size;
    return {dateStr,total:dayBookings.length,active:active.length,cancelledCount,newPatientCount,trialCount,lineCount,referralCount,staffCount};
  });
  const forecastTotals=forecastDayStats.reduce((acc,d)=>{
    acc.total+=d.total;acc.active+=d.active;acc.cancelledCount+=d.cancelledCount;
    acc.newPatientCount+=d.newPatientCount;acc.trialCount+=d.trialCount;acc.lineCount+=d.lineCount;acc.referralCount+=d.referralCount;
    return acc;
  },{total:0,active:0,cancelledCount:0,newPatientCount:0,trialCount:0,lineCount:0,referralCount:0});

  // 期間内（キャンセル除く）の予約を対象に、来院経路・メニューの内訳を集計する
  const activeInRange=React.useMemo(()=>{
    const dateSet=new Set(dateList);
    return scopedBookings.filter(b=>!b.cancelled&&dateSet.has(b.date));
  },[scopedBookings,dateList]);
  function breakdown(getKey){
    const map={};
    activeInRange.forEach(b=>{
      const key=getKey(b)||"未回答";
      map[key]=(map[key]||0)+1;
    });
    const total=activeInRange.length;
    return Object.entries(map).map(([label,count])=>({label,count,pct:total>0?Math.round(count/total*100):0})).sort((a,b)=>b.count-a.count);
  }
  const howKnowBreakdown=breakdown(b=>b.how_know&&b.how_know.trim());
  const menuBreakdown=breakdown(b=>b.menu&&b.menu.trim());

  const DAYS_JP2=["日","月","火","水","木","金","土"];
  const fmtYen=n=>"¥"+Number(n||0).toLocaleString();

  // 今表示している集計（forecast/actualどちらか、今の期間・店舗の内容）をそのままDBに保存し、
  // イベントが終わった後もいつでも見返せるようにする（元の予約・会計データには影響しない）
  async function saveSnapshot(){
    const storeName=selStoreId===null?"全店舗合算":((stores||[]).find(s=>s.id===selStoreId)?.name||"");
    const defaultLabel=`${storeName}　${rangeStart}〜${rangeEnd}（${mode==="forecast"?"来院前・予約ベース":"来院後・実績ベース"}）`;
    const label=window.prompt("この集計を保存します。タイトルを入力してください（そのままでもOK）",defaultLabel);
    if(label===null) return; // キャンセル
    setSavingSnapshot(true);
    try{
      const data=mode==="forecast"
        ?{mode,forecastTotals,forecastDayStats,howKnowBreakdown,menuBreakdown,dateList}
        :{mode,totals,dayStats,dateList};
      await sb.insert("event_stats_snapshots",{
        store_id:selStoreId,
        store_name:storeName,
        range_start:rangeStart,
        range_end:rangeEnd,
        mode,
        label:label||defaultLabel,
        data,
        created_by:user&&user.id?user.id:null,
      });
      fetchSavedSnapshots();
      setShowSavedList(true);
      window.alert("集計を保存しました。「保存済みの集計」から後でも見返せます。");
    }catch(e){
      window.alert("保存に失敗しました："+(e.message||"不明なエラー"));
    }
    setSavingSnapshot(false);
  }

  async function deleteSnapshot(id){
    if(!window.confirm("この保存済み集計を削除します。よろしいですか？")) return;
    try{
      await sb.delete("event_stats_snapshots",id);
      setSavedSnapshots(prev=>prev.filter(s=>s.id!==id));
    }catch(e){
      window.alert("削除に失敗しました："+(e.message||"不明なエラー"));
    }
  }

  return(
    <div style={{maxWidth:1300,margin:"0 auto"}}>
      <div className="card" style={{marginBottom:16,padding:"16px 18px"}}>
        <div style={{fontWeight:800,fontSize:15,color:"#1e3a5f",marginBottom:12}}>📊 イベント期間集計</div>
        <div style={{display:"flex",gap:8,marginBottom:14}}>
          <button onClick={()=>setMode("forecast")} style={{flex:1,padding:"9px 10px",borderRadius:8,border:"2px solid "+(mode==="forecast"?"#1e3a5f":"#e2e8f0"),background:mode==="forecast"?"#1e3a5f":"white",color:mode==="forecast"?"white":"#374151",fontSize:12,fontWeight:800,cursor:"pointer"}}>
            📋 来院前（予約ベース）
          </button>
          <button onClick={()=>setMode("actual")} style={{flex:1,padding:"9px 10px",borderRadius:8,border:"2px solid "+(mode==="actual"?"#1e3a5f":"#e2e8f0"),background:mode==="actual"?"#1e3a5f":"white",color:mode==="actual"?"white":"#374151",fontSize:12,fontWeight:800,cursor:"pointer"}}>
            ✅ 来院後（実績ベース）
          </button>
        </div>
        <div style={{fontSize:11,color:"#94a3b8",marginBottom:12}}>
          {mode==="forecast"?"来院・会計を待たず、今入っている予約データだけで集計します（イベント前の準備・見込み確認用）":"実際に会計が記録された来院実績で集計します（従来の集計内容）"}
        </div>
        <div style={{display:"flex",gap:14,flexWrap:"wrap",alignItems:"flex-end"}}>
          <div>
            <label style={{fontSize:11,color:"#94a3b8",fontWeight:700,display:"block",marginBottom:4}}>集計期間（開始）</label>
            <input type="date" value={rangeStart} onChange={e=>setRangeStart(e.target.value)} style={{padding:"7px 10px",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:13}}/>
          </div>
          <div>
            <label style={{fontSize:11,color:"#94a3b8",fontWeight:700,display:"block",marginBottom:4}}>集計期間（終了）</label>
            <input type="date" value={rangeEnd} onChange={e=>setRangeEnd(e.target.value)} style={{padding:"7px 10px",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:13}}/>
          </div>
          <div>
            <label style={{fontSize:11,color:"#94a3b8",fontWeight:700,display:"block",marginBottom:4}}>店舗</label>
            <select value={selStoreId===null?"":selStoreId} onChange={e=>setSelStoreId(e.target.value===""?null:Number(e.target.value))} style={{padding:"7px 10px",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:13}}>
              <option value="">全店舗合算</option>
              {(stores||[]).map(s=>(<option key={s.id} value={s.id}>{s.name}</option>))}
            </select>
          </div>
          <div style={{marginLeft:"auto",display:"flex",gap:8}}>
            <button onClick={()=>setShowSavedList(v=>!v)} style={{padding:"9px 14px",borderRadius:8,border:"1.5px solid #e2e8f0",background:"white",color:"#374151",fontSize:12,fontWeight:700,cursor:"pointer"}}>
              🗂 保存済みの集計（{savedSnapshots.length}）
            </button>
            <button onClick={saveSnapshot} disabled={savingSnapshot} style={{padding:"9px 14px",borderRadius:8,border:"none",background:"#1e3a5f",color:"white",fontSize:12,fontWeight:800,cursor:savingSnapshot?"default":"pointer",opacity:savingSnapshot?.6:1}}>
              💾 {savingSnapshot?"保存中...":"この集計を保存"}
            </button>
          </div>
        </div>
        <div style={{fontSize:10,color:"#94a3b8",marginTop:8}}>イベントが終わったタイミングで保存しておくと、後日「保存済みの集計」からいつでも同じ内容を見返せます（保存後に予約・会計データが変わっても、保存時点の数字はそのまま残ります）。</div>
      </div>

      {showSavedList&&(
        <div className="card" style={{marginBottom:16,padding:"14px 18px"}}>
          <div style={{fontWeight:800,fontSize:13,color:"#1e3a5f",marginBottom:10}}>🗂 保存済みの集計</div>
          {savedSnapshots.length===0?(
            <div style={{fontSize:12,color:"#94a3b8",padding:"6px 0"}}>まだ保存された集計はありません。上の「この集計を保存」で、イベント終了後などに保存できます。</div>
          ):(
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              {savedSnapshots.map(snap=>{
                const isOpen=expandedSnapshotId===snap.id;
                const d=snap.data||{};
                const isForecast=d.mode==="forecast";
                const t=isForecast?(d.forecastTotals||{}):(d.totals||{});
                return(
                  <div key={snap.id} style={{border:"1px solid #e2e8f0",borderRadius:8,padding:"10px 12px"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                      <div>
                        <div style={{fontWeight:700,fontSize:13,color:"#1e293b"}}>{snap.label||"（無題）"}</div>
                        <div style={{fontSize:11,color:"#94a3b8",marginTop:2}}>{snap.range_start}〜{snap.range_end}　保存日：{fmtDate(new Date(snap.created_at))}　{isForecast?"📋来院前ベース":"✅来院後ベース"}</div>
                      </div>
                      <div style={{display:"flex",gap:6}}>
                        <button onClick={()=>setExpandedSnapshotId(isOpen?null:snap.id)} className="btn btn-outline btn-xs">{isOpen?"閉じる":"詳細を見る"}</button>
                        <button onClick={()=>deleteSnapshot(snap.id)} style={{padding:"4px 10px",borderRadius:6,border:"1px solid #fecaca",background:"#fef2f2",color:"#dc2626",fontSize:11,fontWeight:700,cursor:"pointer"}}>削除</button>
                      </div>
                    </div>
                    {isOpen&&(
                      <div style={{marginTop:10,paddingTop:10,borderTop:"1px dashed #e2e8f0",display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(110px,1fr))",gap:8}}>
                        {isForecast?[
                          {label:"総予約数",value:t.total},
                          {label:"有効予約数",value:t.active},
                          {label:"キャンセル数",value:t.cancelledCount},
                          {label:"新患予約",value:t.newPatientCount},
                          {label:"紹介予約",value:t.referralCount},
                          {label:"LINE連携",value:t.lineCount},
                        ]:[
                          {label:"総予約数",value:t.totalBookings},
                          {label:"実来院数",value:t.actualVisits},
                          {label:"新患数",value:t.newPatients},
                          {label:"キャンセル数",value:t.cancelledCount},
                          {label:"体験数",value:t.trialCount},
                          {label:"成約数",value:t.contractCount},
                          {label:"次回予約率",value:(t.nextBookingRate||0)+"%"},
                          {label:"売上",value:fmtYen(t.sales)},
                        ].map(c=>(
                          <div key={c.label} style={{textAlign:"center",background:"#f8fafc",borderRadius:6,padding:"8px 4px"}}>
                            <div style={{fontSize:10,color:"#94a3b8",fontWeight:700}}>{c.label}</div>
                            <div style={{fontSize:15,fontWeight:800,color:"#1e3a5f"}}>{c.value}</div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}

      {mode==="forecast"&&(
        <>
          <div style={{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:10,marginBottom:16}}>
            {[
              {label:"総予約数",value:forecastTotals.total,color:"#1e3a5f"},
              {label:"有効予約数",value:forecastTotals.active,color:"#059669"},
              {label:"キャンセル数",value:forecastTotals.cancelledCount,color:"#dc2626"},
              {label:"新患予約",value:forecastTotals.newPatientCount,color:"#0891b2"},
              {label:"紹介予約",value:forecastTotals.referralCount,color:"#7c3aed"},
              {label:"LINE連携",value:forecastTotals.lineCount,color:"#059669"},
            ].map(c=>(
              <div key={c.label} className="card" style={{padding:"14px 12px",textAlign:"center"}}>
                <div style={{fontSize:11,color:"#94a3b8",fontWeight:700,marginBottom:4}}>{c.label}</div>
                <div style={{fontSize:22,fontWeight:800,color:c.color}}>{c.value}</div>
              </div>
            ))}
          </div>

          <div className="card" style={{overflowX:"auto",marginBottom:16}}>
            <table style={{borderCollapse:"collapse",width:"100%",fontSize:13,minWidth:760}}>
              <thead>
                <tr style={{background:"#f8fafc",borderBottom:"2px solid #e2e8f0"}}>
                  {["日付","予約数（全体）","有効予約","キャンセル","新患予約","無料体験","紹介予約","LINE連携","稼働予定スタッフ"].map(h=>(
                    <th key={h} style={{padding:"10px 12px",textAlign:"left",fontWeight:800,color:"#64748b",whiteSpace:"nowrap"}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {forecastDayStats.length===0?(
                  <tr><td colSpan={9} style={{padding:24,textAlign:"center",color:"#94a3b8"}}>期間を選択してください</td></tr>
                ):forecastDayStats.map(d=>{
                  const dt=new Date(d.dateStr+"T00:00:00");
                  return(
                    <tr key={d.dateStr} style={{borderBottom:"1px solid #f1f5f9"}}>
                      <td style={{padding:"10px 12px",fontWeight:700,color:"#1e293b",whiteSpace:"nowrap"}}>{d.dateStr.slice(5)}（{DAYS_JP2[dt.getDay()]}）</td>
                      <td style={{padding:"10px 12px"}}>{d.total}</td>
                      <td style={{padding:"10px 12px",fontWeight:700,color:"#059669"}}>{d.active}</td>
                      <td style={{padding:"10px 12px",color:"#dc2626"}}>{d.cancelledCount}</td>
                      <td style={{padding:"10px 12px"}}>{d.newPatientCount}</td>
                      <td style={{padding:"10px 12px"}}>{d.trialCount}</td>
                      <td style={{padding:"10px 12px"}}>{d.referralCount}</td>
                      <td style={{padding:"10px 12px"}}>{d.lineCount}</td>
                      <td style={{padding:"10px 12px"}}>{d.staffCount}名</td>
                    </tr>
                  );
                })}
                {forecastDayStats.length>0&&(
                  <tr style={{background:"#f0fdf4",borderTop:"2px solid #86efac"}}>
                    <td style={{padding:"12px",fontWeight:800,color:"#065f46",whiteSpace:"nowrap"}}>{dateList.length}日間合計</td>
                    <td style={{padding:"12px",fontWeight:800}}>{forecastTotals.total}</td>
                    <td style={{padding:"12px",fontWeight:800,color:"#059669"}}>{forecastTotals.active}</td>
                    <td style={{padding:"12px",fontWeight:800,color:"#dc2626"}}>{forecastTotals.cancelledCount}</td>
                    <td style={{padding:"12px",fontWeight:800}}>{forecastTotals.newPatientCount}</td>
                    <td style={{padding:"12px",fontWeight:800}}>{forecastTotals.trialCount}</td>
                    <td style={{padding:"12px",fontWeight:800}}>{forecastTotals.referralCount}</td>
                    <td style={{padding:"12px",fontWeight:800}}>{forecastTotals.lineCount}</td>
                    <td style={{padding:"12px"}}>—</td>
                  </tr>
                )}
              </tbody>
            </table>
          </div>

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:16}}>
            <div className="card" style={{padding:"14px 16px"}}>
              <div style={{fontWeight:800,fontSize:13,color:"#1e3a5f",marginBottom:10}}>📣 来院経路の内訳（期間合計・キャンセル除く）</div>
              {howKnowBreakdown.length===0?(
                <div style={{fontSize:12,color:"#94a3b8",textAlign:"center",padding:"10px 0"}}>予約がありません</div>
              ):howKnowBreakdown.map(r=>(
                <div key={r.label} style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
                  <div style={{width:110,fontSize:12,color:"#374151",fontWeight:700,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{r.label}</div>
                  <div style={{flex:1,background:"#f1f5f9",borderRadius:6,height:16,position:"relative"}}>
                    <div style={{width:r.pct+"%",background:"#1e3a5f",height:"100%",borderRadius:6}}/>
                  </div>
                  <div style={{width:70,fontSize:12,fontWeight:800,color:"#1e3a5f",textAlign:"right",whiteSpace:"nowrap"}}>{r.count}件（{r.pct}%）</div>
                </div>
              ))}
            </div>
            <div className="card" style={{padding:"14px 16px"}}>
              <div style={{fontWeight:800,fontSize:13,color:"#1e3a5f",marginBottom:10}}>🩺 メニュー・施術区分の内訳（期間合計・キャンセル除く）</div>
              {menuBreakdown.length===0?(
                <div style={{fontSize:12,color:"#94a3b8",textAlign:"center",padding:"10px 0"}}>予約がありません</div>
              ):menuBreakdown.map(r=>(
                <div key={r.label} style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
                  <div style={{width:110,fontSize:12,color:"#374151",fontWeight:700,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{r.label}</div>
                  <div style={{flex:1,background:"#f1f5f9",borderRadius:6,height:16,position:"relative"}}>
                    <div style={{width:r.pct+"%",background:"#059669",height:"100%",borderRadius:6}}/>
                  </div>
                  <div style={{width:70,fontSize:12,fontWeight:800,color:"#059669",textAlign:"right",whiteSpace:"nowrap"}}>{r.count}件（{r.pct}%）</div>
                </div>
              ))}
            </div>
          </div>
          <div style={{fontSize:11,color:"#94a3b8",marginBottom:16,lineHeight:1.8}}>
            ・こちらは全て「予約データ」だけを集計したものです（会計・来院確認は不要）。実際の来院・売上実績を見たい場合は上の「来院後（実績ベース）」に切り替えてください<br/>
            ・新患予約：初回来院日がその日付になる予約の件数です<br/>
            ・紹介予約：紹介者名の入力、または紹介URL経由での予約の件数です
          </div>
        </>
      )}

      {mode==="actual"&&(
      <>
      <div className="card" style={{overflowX:"auto"}}>
        <table style={{borderCollapse:"collapse",width:"100%",fontSize:13,minWidth:1180}}>
          <thead>
            <tr style={{background:"#f8fafc",borderBottom:"2px solid #e2e8f0"}}>
              {["日付","予約数","実来院数","新患数","キャンセル数","無料体験","LINE登録","次回予約","次回予約率","成約人数","成約率","売上","1人あたり","稼働スタッフ"].map(h=>(
                <th key={h} style={{padding:"10px 12px",textAlign:"left",fontWeight:800,color:"#64748b",whiteSpace:"nowrap"}}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {dayStats.length===0?(
              <tr><td colSpan={14} style={{padding:24,textAlign:"center",color:"#94a3b8"}}>期間を選択してください</td></tr>
            ):dayStats.map(d=>{
              const dt=new Date(d.dateStr+"T00:00:00");
              return(
                <tr key={d.dateStr} style={{borderBottom:"1px solid #f1f5f9"}}>
                  <td style={{padding:"10px 12px",fontWeight:700,color:"#1e293b",whiteSpace:"nowrap"}}>{d.dateStr.slice(5)}（{DAYS_JP2[dt.getDay()]}）</td>
                  <td style={{padding:"10px 12px"}}>{d.totalBookings}</td>
                  <td style={{padding:"10px 12px",fontWeight:700,color:"#059669"}}>{d.actualVisits}</td>
                  <td style={{padding:"10px 12px"}}>{d.newPatients}</td>
                  <td style={{padding:"10px 12px",color:"#dc2626"}}>{d.cancelledCount}</td>
                  <td style={{padding:"10px 12px"}}>{d.trialCount}</td>
                  <td style={{padding:"10px 12px"}}>{d.lineCount}</td>

        ・実来院数：予約のうち「会計（お会計完了）」が記録されているものを集計しています<br/>

      </div>

// 増減を▲▼と色（緑＝プラス／赤＝マイナス）でひと目でわかるように表示する共通タグ
function DeltaTag({text,positive,size=12}){
  if(positive===null||positive===undefined){
    return <span style={{fontSize:size,fontWeight:700,color:"#94a3b8"}}>{text}</span>;
  }
  return(
    <span style={{display:"inline-flex",alignItems:"center",gap:3,fontSize:size,fontWeight:800,color:positive?"#059669":"#dc2626",background:positive?"#f0fdf4":"#fef2f2",padding:"2px 9px",borderRadius:20,border:`1px solid ${positive?"#bbf7d0":"#fecaca"}`}}>
      <span>{positive?"▲":"▼"}</span>{text}
    </span>
  );
}
function StoreSimCard({baselineKarte,baselineFreq,baselineUnit,fmt}){

  // 残ってしまい「0200」のような表示になってしまうため）
  const mk=(name)=>({name,karte:String(baselineKarte||10),freq:String(baselineFreq||2),unit:String(baselineUnit||3000)});
  const [patterns,setPatterns]=React.useState([mk("パターンA"),mk("パターンB"),mk("パターンC")]);
  function update(i,key,val){
    // 数字以外を除去しつつ、先頭の余分な0も取り除く（"0200"→"200"、全部消せば空欄のまま）
    const cleaned=val.replace(/[^\d]/g,"").replace(/^0+(?=\d)/,"");

  const baselineSales=Math.round((baselineKarte||0)*(baselineFreq||0)*(baselineUnit||0));
  return(
