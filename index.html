          <div style={{color:"white",fontWeight:800,fontSize:15}}>🚫 キャンセル一覧</div>
          <div style={{color:"rgba(255,255,255,.75)",fontSize:12,marginTop:2}}>全{cancelledList.length}件　（うち当日キャンセル：{sameDayCount}件／マイページ経由：{viaLineCount}件）</div>
        </div>
        {reasonCounts.length>0&&(
          <div style={{padding:"14px 16px",display:"flex",gap:8,flexWrap:"wrap"}}>
            {reasonCounts.map(([reason,count])=>(
              <span key={reason} className="badge badge-red">{reason}：{count}件</span>
            ))}
          </div>
        )}
      </div>

      <div className="card">
        <div style={{padding:"12px 16px",borderBottom:"1px solid #f1f5f9",fontWeight:800,fontSize:13,color:"#1e3a5f"}}>キャンセル履歴</div>
        <div style={{padding:"8px 16px"}}>
          {cancelledList.length===0?(
            <div style={{textAlign:"center",padding:30,color:"#94a3b8",fontSize:13}}>キャンセルされた予約はありません</div>
          ):cancelledList.map(b=>{
            const staff=STAFF_ACCOUNTS.find(s=>s.id===b.staff_id)||{name:"不明",color:"#888"};
            const nextBooking=findNextBookingFor(b.patient_name,b.id,bookings,todayStr);
            const isSameDay=b.cancelled_at&&fmtDate(new Date(b.cancelled_at))===b.date;
            return(
              <div key={b.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 0",borderBottom:"1px solid #f1f5f9",gap:10}}>
                <div>
                  <div style={{fontWeight:700,fontSize:14,color:"#1e293b"}}>{b.patient_name}{isSameDay&&<span className="badge badge-red" style={{marginLeft:6,fontSize:9}}>⚡当日キャンセル</span>}{b.cancelled_via_line&&<span style={{marginLeft:6,fontSize:9,fontWeight:800,color:"white",background:"#06C755",borderRadius:4,padding:"1px 6px"}}>マイページ経由</span>}</div>
                  <div style={{fontSize:11,color:"#94a3b8"}}>{b.date} {b.time}　{staff.name}　{b.menu}</div>
                  <div style={{fontSize:11,color:"#dc2626",fontWeight:700,marginTop:2}}>理由：{b.cancel_reason||"未記録"}</div>
                  <div style={{fontSize:11,fontWeight:700,marginTop:2,color:nextBooking?"#059669":"#d97706"}}>
                    {nextBooking?`次回予約あり：${nextBooking.date} ${nextBooking.time}`:"次回予約なし"}
                  </div>
                </div>
                <button onClick={()=>onRestore(b.id)} className="btn btn-outline btn-xs" style={{whiteSpace:"nowrap"}}>予約に戻す</button>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function ChurnAlertPanel({bookings,todayStr}){
  // 期間ごとの区分（日数の範囲）とデフォルトの文面
  const CHURN_BANDS=[
    {id:"2w",label:"2週間経過",min:14,max:20,color:"#0891b2",
      defaultMessage:"ご無沙汰しております、あんど整骨院です😊\n前回のご来院から2週間ほど経ちました。お身体の調子はいかがですか？お気軽にご来院ください。\nご予約はこちらから：https://ando-seikotsu-ibaraki.vercel.app/booking.html"},
    {id:"3w",label:"3週間経過",min:21,max:29,color:"#2563eb",
      defaultMessage:"あんど整骨院です😊\n前回のご来院から3週間ほど経ちました。せっかく良くなってきたお身体を維持するためにも、そろそろメンテナンスにいらしてください。\nご予約はこちらから：https://ando-seikotsu-ibaraki.vercel.app/booking.html"},
    {id:"1m",label:"1ヶ月以上",min:30,max:89,color:"#7c3aed",
      defaultMessage:"あんど整骨院です。\n1ヶ月以上ご来院がないようでしたので、ご連絡させていただきました。お身体の調子はその後いかがでしょうか？お気軽にご相談ください。\nご予約はこちらから：https://ando-seikotsu-ibaraki.vercel.app/booking.html"},
    {id:"3m",label:"3ヶ月以上",min:90,max:179,color:"#d97706",
      defaultMessage:"あんど整骨院です。\n3ヶ月以上お会いできておらず、お身体の調子が心配になりご連絡いたしました。よろしければまたお顔を見せてください🙏\nご予約はこちらから：https://ando-seikotsu-ibaraki.vercel.app/booking.html"},
    {id:"6m",label:"半年以上",min:180,max:999999,color:"#dc2626",
      defaultMessage:"あんど整骨院です。\n半年以上のご無沙汰、お元気にお過ごしでしょうか？お得な再来院キャンペーンもご用意していますので、お気軽にご連絡ください。\nご予約はこちらから：https://ando-seikotsu-ibaraki.vercel.app/booking.html"},
  ];

  const [activeBandId,setActiveBandId]=React.useState(CHURN_BANDS[0].id);
  const [exclusions,setExclusions]=React.useState([]); // line_user_idの配列（全バンド共通）
  const [loadingExclusions,setLoadingExclusions]=React.useState(true);
  const [messages,setMessages]=React.useState(()=>{
    const init={};CHURN_BANDS.forEach(b=>{init[b.id]=b.defaultMessage;});return init;
  });
  const [sending,setSending]=React.useState(false);
  const [toast,setToast]=React.useState("");
  const [sendResult,setSendResult]=React.useState(null); // {success, failed}

  function showToast(msg){setToast(msg);setTimeout(()=>setToast(""),3000);}

  // 除外リストを読み込み（Supabaseの churn_alert_exclusions テーブル。無ければ空扱い）
  React.useEffect(()=>{
    sb.select("churn_alert_exclusions","?select=line_user_id").then(data=>{
      setExclusions(Array.isArray(data)?data.map(r=>r.line_user_id):[]);
    }).catch(()=>{setExclusions([]);}).finally(()=>setLoadingExclusions(false));
  },[]);

  const daysAgo=(dateStr)=>{
    const d1=new Date(dateStr+"T00:00:00"),d2=new Date(todayStr+"T00:00:00");
    return Math.round((d2-d1)/86400000);
  };

  // 患者ごとに最終来院日・次回予約有無・経過日数を集計（バンドに関わらず共通の下ごしらえ）
  const allCandidates=React.useMemo(()=>{
    const byUid={};
    bookings.forEach(b=>{
      if(!b.line_user_id) return;
      if(!byUid[b.line_user_id]){
        byUid[b.line_user_id]={line_user_id:b.line_user_id,patient_name:b.patient_name,phone:b.phone,lastDate:null,hasFuture:false};
      }
      const rec=byUid[b.line_user_id];
      if(!b.cancelled){
        if(b.date<=todayStr){
          if(!rec.lastDate||b.date>rec.lastDate) rec.lastDate=b.date;
        }else{
          rec.hasFuture=true;
        }
      }
    });
    return Object.values(byUid).filter(r=>r.lastDate&&!r.hasFuture).map(r=>({...r,days:daysAgo(r.lastDate)}));
  },[bookings,todayStr]);

  // 期間バンドごとの対象者一覧
  const bandCandidates={};
  CHURN_BANDS.forEach(band=>{
    bandCandidates[band.id]=allCandidates.filter(c=>c.days>=band.min&&c.days<=band.max).sort((a,b)=>a.lastDate.localeCompare(b.lastDate));
  });

  const activeBand=CHURN_BANDS.find(b=>b.id===activeBandId);
  const candidates=bandCandidates[activeBandId]||[];
  const targetList=candidates.filter(c=>!exclusions.includes(c.line_user_id));
  const excludedList=candidates.filter(c=>exclusions.includes(c.line_user_id));
  const totalAllBands=CHURN_BANDS.reduce((s,b)=>s+bandCandidates[b.id].length,0);

  async function toggleExclude(lineUserId,exclude){
    try{
      if(exclude){
        await sb.insert("churn_alert_exclusions",{line_user_id:lineUserId,excluded_at:new Date().toISOString()});
        setExclusions(prev=>[...prev,lineUserId]);
      }else{
        await sb.query("churn_alert_exclusions","DELETE",null,`?line_user_id=eq.${encodeURIComponent(lineUserId)}`);
        setExclusions(prev=>prev.filter(id=>id!==lineUserId));
      }
    }catch(e){
      showToast("除外設定の保存にはchurn_alert_exclusionsテーブルが必要です");
    }
  }

  async function sendBulk(){
    if(targetList.length===0){showToast("送信対象がいません");return;}
    const message=messages[activeBandId]||"";
    if(!message.trim()){showToast("メッセージを入力してください");return;}
    if(!confirm(`「${activeBand.label}」の送信対象 ${targetList.length}名にLINEメッセージを一斉送信します。よろしいですか？`)) return;
    setSending(true);setSendResult(null);
    try{
      const res=await fetch("/api/send-line-push",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({userIds:targetList.map(t=>t.line_user_id),message}),
      });
      const data=await res.json().catch(()=>null);
      if(!res.ok) throw new Error((data&&data.error)||`送信に失敗しました（HTTP ${res.status}）`);
      setSendResult({success:data.success||targetList.length,failed:data.failed||0});
      showToast("送信しました");
    }catch(e){
      showToast("送信エラー："+e.message);
    }
    setSending(false);
  }

  return(
    <div style={{maxWidth:1200,margin:"0 auto"}}>
      {toast&&<div style={{background:"#fef2f2",border:"1px solid #fecaca",borderRadius:8,padding:"10px 14px",marginBottom:14,color:"#dc2626",fontWeight:700,fontSize:13}}>{toast}</div>}

      <div className="card" style={{marginBottom:14}}>
        <div style={{padding:"14px 16px",borderBottom:"1px solid #f1f5f9",background:"linear-gradient(135deg,#7c3aed,#6d28d9)"}}>
          <div style={{color:"white",fontWeight:800,fontSize:15}}>🔔 離反防止アラート</div>
          <div style={{color:"rgba(255,255,255,.75)",fontSize:12,marginTop:2}}>最終来院からの経過期間ごとに区分し、期間に応じた文面でLINE連携患者へ送信します（対象は全期間合計{totalAllBands}名）</div>
        </div>
        {/* 期間タブ */}
        <div style={{display:"flex",flexWrap:"wrap",gap:6,padding:"14px 16px"}}>
          {CHURN_BANDS.map(band=>{
            const count=bandCandidates[band.id].length;
            const isActive=activeBandId===band.id;
            return(
              <button key={band.id} onClick={()=>{setActiveBandId(band.id);setSendResult(null);}}
                style={{padding:"8px 14px",borderRadius:20,border:`2px solid ${isActive?band.color:"#e2e8f0"}`,background:isActive?band.color:"white",color:isActive?"white":"#374151",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",gap:6}}>
                {band.label}
                <span style={{background:isActive?"rgba(255,255,255,.3)":"#f1f5f9",color:isActive?"white":"#64748b",borderRadius:10,padding:"1px 7px",fontSize:11,fontWeight:800}}>{count}</span>
              </button>
            );
          })}
        </div>
      </div>

      {/* 選択中バンドの詳細 */}
      <div className="card" style={{marginBottom:14}}>
        <div style={{padding:"14px 16px",display:"flex",gap:16,flexWrap:"wrap",borderBottom:"1px solid #f1f5f9"}}>
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:26,fontWeight:800,color:activeBand.color}}>{candidates.length}</div>
            <div style={{fontSize:11,color:"#94a3b8",fontWeight:700}}>{activeBand.label}・対象患者</div>
          </div>
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:26,fontWeight:800,color:"#059669"}}>{targetList.length}</div>
            <div style={{fontSize:11,color:"#94a3b8",fontWeight:700}}>送信対象</div>
          </div>
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:26,fontWeight:800,color:"#9ca3af"}}>{excludedList.length}</div>
            <div style={{fontSize:11,color:"#94a3b8",fontWeight:700}}>送信不要に設定済み</div>
          </div>
        </div>

        {/* メッセージ編集＋一斉送信（バンドごとに文面を保持） */}
        <div style={{padding:16}}>
          <div style={{fontSize:12,fontWeight:700,color:"#374151",marginBottom:6}}>「{activeBand.label}」向けの送信メッセージ</div>
          <textarea value={messages[activeBandId]} onChange={e=>setMessages(prev=>({...prev,[activeBandId]:e.target.value}))} rows={5} className="form-input" style={{resize:"vertical",marginBottom:12}}/>
          <button onClick={sendBulk} disabled={sending||targetList.length===0} className="btn"
            style={{width:"100%",justifyContent:"center",padding:12,fontSize:14,borderRadius:9,background:`linear-gradient(135deg,${activeBand.color},${activeBand.color}cc)`,color:"white",fontWeight:800,opacity:(sending||targetList.length===0)?0.6:1}}>
            {sending?"送信中...":`📤 ${activeBand.label}の対象 ${targetList.length}名へ一斉送信する`}
          </button>
          {sendResult&&(
            <div style={{marginTop:10,fontSize:12,color:"#059669",fontWeight:700}}>
              ✅ 成功：{sendResult.success}件{sendResult.failed>0&&<span style={{color:"#dc2626",marginLeft:8}}>❌ 失敗：{sendResult.failed}件</span>}
            </div>
          )}
        </div>
      </div>

      {/* 送信対象リスト */}
      <div className="card" style={{marginBottom:14}}>
        <div style={{padding:"12px 16px",borderBottom:"1px solid #f1f5f9",fontWeight:800,fontSize:13,color:"#1e3a5f"}}>{activeBand.label}・送信対象一覧（{targetList.length}名）</div>
        <div style={{padding:"8px 16px"}}>
          {loadingExclusions?(
            <div style={{textAlign:"center",padding:20,color:"#94a3b8"}}>読み込み中...</div>
          ):targetList.length===0?(
            <div style={{textAlign:"center",padding:24,color:"#94a3b8",fontSize:13}}>該当する患者はいません</div>
          ):targetList.map(c=>(
            <div key={c.line_user_id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 0",borderBottom:"1px solid #f1f5f9",gap:10}}>
              <div>
                <div style={{fontWeight:700,fontSize:14,color:"#1e293b"}}>{c.patient_name}</div>
                <div style={{fontSize:11,color:"#94a3b8"}}>最終来院：{c.lastDate}（{c.days}日前）{c.phone?`　${c.phone}`:""}</div>
              </div>
              <button onClick={()=>toggleExclude(c.line_user_id,true)} className="btn btn-outline btn-xs" style={{whiteSpace:"nowrap"}}>送信不要にする</button>
            </div>
          ))}
        </div>
      </div>

      {/* 除外済み一覧 */}
      {excludedList.length>0&&(
        <div className="card">
          <div style={{padding:"12px 16px",borderBottom:"1px solid #f1f5f9",fontWeight:800,fontSize:13,color:"#94a3b8"}}>{activeBand.label}・送信不要に設定済み（{excludedList.length}名）</div>
          <div style={{padding:"8px 16px"}}>
            {excludedList.map(c=>(
              <div key={c.line_user_id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 0",borderBottom:"1px solid #f1f5f9",gap:10,opacity:0.7}}>
                <div>
                  <div style={{fontWeight:700,fontSize:14,color:"#1e293b"}}>{c.patient_name}</div>
                  <div style={{fontSize:11,color:"#94a3b8"}}>最終来院：{c.lastDate}（{c.days}日前）</div>
                </div>
                <button onClick={()=>toggleExclude(c.line_user_id,false)} className="btn btn-outline btn-xs" style={{whiteSpace:"nowrap"}}>対象に戻す</button>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

  const [showBreakModal,setShowBreakModal]=React.useState(false);

  const [bookingPopup,setBookingPopup]=React.useState(null); // {booking, x, y}
  const [iframeModal,setIframeModal]=React.useState(null); // {url, title} | null

  // intake.html / pos.html から「モーダルを閉じて」というメッセージを受け取る
  React.useEffect(()=>{
    function onMessage(e){
      if(e.data&&e.data.type==="closeIframeModal"){
        setIframeModal(null);
      }
    }
    window.addEventListener("message",onMessage);
    return ()=>window.removeEventListener("message",onMessage);
  },[]);
  const [timePickerPopup,setTimePickerPopup]=React.useState(null); // {date, staffId, x, y, centerTime}
  const [dragBooking,setDragBooking]=React.useState(null); // ドラッグ中の予約（開始〜終了までしか変化しない）
  const [dragPos,setDragPos]=React.useState({x:0,y:0,moved:false}); // 見た目の追従用（頻繁に変化する）
  const dragPosRef=React.useRef({x:0,y:0,startX:0,startY:0,moved:false});
  const [resizeBooking,setResizeBooking]=React.useState(null); // 右端ドラッグで時間調整中の予約
  const [resizeDeltaPx,setResizeDeltaPx]=React.useState(0); // 見た目の追従用（横方向の移動量）
  const resizeRef=React.useRef({startX:0,deltaPx:0});
  const [historyPatient,setHistoryPatient]=React.useState(null);
  const [payments,setPayments]=React.useState([]);
  const [businessHours,setBusinessHours]=React.useState([]);
  const [closures,setClosures]=React.useState([]);
  const [stores,setStores]=React.useState([]);
  const [selStoreId,setSelStoreId]=React.useState(null);
  const [weeklyShifts,setWeeklyShifts]=React.useState([]); // 全スタッフの週固定シフト
  const [staffStoreMap,setStaffStoreMap]=React.useState({}); // {staffId: [storeIds]}
  const [staffMenuMap,setStaffMenuMap]=React.useState({}); // {staffId: [対応可能メニュー名] | undefined(=全メニュー対応)}
  const [staffLaneMap,setStaffLaneMap]=React.useState({}); // {staffId: 同時受付レーン数（未設定は1）}
  const [customMenus,setCustomMenus]=React.useState([]); // 「メニュー・コース管理」で追加された有効なメニュー一覧

  const isAdmin=user.role==="admin";
  const todayStr=fmtDate(today);

  function getLaneCount(staffId){
    return staffLaneMap[staffId]||1;
  }

  async function changeLaneCount(staffId,delta){
    const next=Math.max(1,Math.min(6,getLaneCount(staffId)+delta));
    setStaffLaneMap(prev=>({...prev,[staffId]:next})); // 即座に画面へ反映
    try{
      const token=(await supabaseClient.auth.getSession()).data.session?.access_token||SUPABASE_ANON_KEY;
      await fetch(`${SUPABASE_URL}/rest/v1/clinic_staff?id=eq.${staffId}`,{
        method:"PATCH",
        headers:{apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${token}`,"Content-Type":"application/json"},
        body:JSON.stringify({lane_count:next}),
      });
    }catch(e){
      console.error("レーン数の保存に失敗しました",e);
    }
  }

  async function fetchAll(){
    try{
      const [b,br,py,st,ws,cs,mn]=await Promise.all([sb.select("bookings","?order=date.asc,time.asc"),sb.select("staff_breaks","?order=date.asc,time.asc"),sb.select("payments","?order=payment_date.desc"),sb.select("stores","?order=id.asc"),sb.select("staff_weekly_shifts","?order=staff_id.asc,day_of_week.asc"),sb.select("clinic_staff","?select=id,store_ids,allowed_menus,lane_count"),sb.select("menus","?active=eq.true&order=display_order.asc,id.asc")]);
      setBookings(Array.isArray(b)?b:[]);setBreaks(Array.isArray(br)?br:[]);setPayments(Array.isArray(py)?py:[]);
      const storeList=Array.isArray(st)?st:[];
      setStores(storeList);
      setSelStoreId(prev=>prev!==null?prev:(storeList.length>0?storeList[0].id:1));
      setWeeklyShifts(Array.isArray(ws)?ws:[]);
      const map={};
      const menuMap={};
      const laneMap={};
      if(Array.isArray(cs)) cs.forEach(row=>{
        if(row.store_ids) map[row.id]=row.store_ids;
        if(row.allowed_menus) menuMap[row.id]=row.allowed_menus;
        if(row.lane_count) laneMap[row.id]=row.lane_count;
      });
      setStaffStoreMap(map);
      setStaffMenuMap(menuMap);
      setStaffLaneMap(laneMap);
      // 「メニュー・コース管理」で追加されたメニューを、既存のハードコードされたメニュー一覧にマージする。
      // これにより、新しく登録したメニューも予約時間の計算（DURATION）や金額表示（MENU_PRICE）で
      // すぐに使えるようになる。
      const custom=Array.isArray(mn)?mn:[];
      setCustomMenus(custom);
      MENUS=[...BASE_MENUS,...custom.map(m=>m.name)];
      DURATION={...BASE_DURATION,...Object.fromEntries(custom.map(m=>[m.name,m.duration||30]))};
      MENU_PRICE={...BASE_MENU_PRICE,...Object.fromEntries(custom.map(m=>[m.name,m.price||0]))};
    }catch(e){console.error(e);}
    setLoading(false);
  }

  // 指定スタッフが指定メニュー（複数可）すべてに対応できるか。
  // staffMenuMapに登録が無いスタッフは「全メニュー対応」として扱う（後方互換のため）。
  function staffCanDoMenus(staffId,menuNames){
    const allowed=staffMenuMap[staffId];

  // 指定スタッフが指定日に出勤しているか（月次シフトの個別調整＞週固定シフトの順で判定）
  function isStaffWorkingOnDate(staffId,dateObj){
    const dateStr=fmtDate(dateObj);
    const monthKey=dateStr.slice(0,7);
    try{
      const raw=localStorage.getItem("shifts_"+monthKey);
      if(raw){
        const map=JSON.parse(raw);
        const val=map[staffId+"_"+dateStr];
        if(val) return val==="出勤";
      }
    }catch(e){}
    const dow=dateObj.getDay();
    const ws=weeklyShifts.find(w=>w.staff_id===staffId&&w.day_of_week===dow);
    if(ws) return ws.is_working!==false;
    return true; // シフトデータが無い場合はフェイルセーフで出勤扱い
  }

  async function save(){
    if(!form.patient_name.trim())return;
    const laneCapacity=getLaneCount(form.staff_id);
    const overlapCountLocal=bookings.filter(b=>b.id!==editId&&b.staff_id===form.staff_id&&b.date===form.date&&!b.cancelled&&overlaps(b,form)).length;
    if(overlapCountLocal>=laneCapacity){setConflict(true);return;}
    // 保存直前にもう一度サーバーへ問い合わせて、ほぼ同時に他のスタッフが同じ枠を
    // 確保してしまっていないか最終確認する（画面上のデータには多少タイムラグがあるため）
    try{
      const freshSameDay=await sb.select("bookings",`?staff_id=eq.${form.staff_id}&date=eq.${form.date}`);
      const overlapCountFresh=(Array.isArray(freshSameDay)?freshSameDay:[]).filter(b=>b.id!==editId&&!b.cancelled&&overlaps(b,form)).length;
      if(overlapCountFresh>=laneCapacity){
        setConflict(true);
        showToast("ちょうど別の予約が入ってしまいました。時間をご確認ください","delete");
        return;
      }
    }catch(e){
      // 確認自体が失敗した場合は、これまで通りクライアント側のチェックのみで進める
    }
    try{
      if(editId!==null){
        const result=await sb.update("bookings",editId,form);
        if(!Array.isArray(result)||result.length===0){
          throw new Error((result&&result.message)||"更新に失敗しました（対象の予約が見つかりませんでした）");
        }
        setBookings(prev=>prev.map(b=>b.id===editId?result[0]:b));
      }else{
        const result=await sb.insert("bookings",form);
        if(!Array.isArray(result)||result.length===0){
          throw new Error((result&&result.message)||"登録に失敗しました");
        }
        setBookings(prev=>[...prev,result[0]]);
      }
      // 回数券・フリーパスが選択されていればpassesテーブルへ反映（マイページの残数・期限表示用）
      await syncPassesFromMenus(form);
      showToast(editId!==null?"予約を更新しました":"予約を登録しました");setView("calendar");
    }catch(e){
      alert("保存に失敗しました："+(e.message||"不明なエラー"));
    }
  }

  async function cancelBooking(reason,rebookInfo){
    if(!cancelModalBooking) return;
    try{
      const token=(await supabaseClient.auth.getSession()).data.session?.access_token||SUPABASE_ANON_KEY;
      const res=await fetch(`${SUPABASE_URL}/rest/v1/bookings?id=eq.${cancelModalBooking.id}`,{
        method:"PATCH",
        headers:{apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${token}`,"Content-Type":"application/json",Prefer:"return=representation"},
        body:JSON.stringify({cancelled:true,cancel_reason:reason,cancelled_at:new Date().toISOString()})
      });
      const bodyText=await res.text();
      if(!res.ok){
        throw new Error(`保存に失敗しました（HTTP ${res.status}）\n${bodyText}`);
      }
      let updated=null;
      try{updated=JSON.parse(bodyText);}catch(e){}
      if(!Array.isArray(updated)||updated.length===0){
        throw new Error("対象の予約が見つからず、キャンセルが保存されませんでした。");
      }
      setBookings(prev=>prev.map(b=>b.id===cancelModalBooking.id?updated[0]:b));

      // 「この場で次回予約も作成する」が選ばれていれば、続けて新しい予約を登録する
      let rebookOk=false;
      if(rebookInfo&&rebookInfo.date&&rebookInfo.time){
        try{
          const original=cancelModalBooking;
          const newBookingData={
            patient_name:original.patient_name,
            phone:original.phone||"",
            staff_id:rebookInfo.staff_id||original.staff_id,
            date:rebookInfo.date,
            time:rebookInfo.time,
            menu:original.menu,
            store_id:original.store_id,
            line_notify:!!original.line_user_id,
            line_user_id:original.line_user_id||null,
            reminded:false,
            karte_no:original.karte_no||null,
          };
          const rebookResult=await sb.insert("bookings",newBookingData);
          if(Array.isArray(rebookResult)&&rebookResult.length>0){
            setBookings(prev=>[...prev,rebookResult[0]]);
            rebookOk=true;
          }
        }catch(e){
          console.error(e);
        }
      }

      showToast(rebookInfo?(rebookOk?"キャンセルし、次回予約を登録しました":"キャンセルしましたが、次回予約の登録に失敗しました"):"予約をキャンセルしました",rebookOk?"success":"delete");
      setCancelModalBooking(null);
      setBookingPopup(null);
      if(view==="form") setView("calendar");
    }catch(e){
      alert("キャンセル処理に失敗しました：\n"+(e.message||"不明なエラー")+"\n\nSupabaseのbookingsテーブルにcancel_reason・cancelled_at列が追加されているかご確認ください。");
    }
  }

  // ===== カレンダー上でのドラッグ移動 =====
  const DRAG_TOTAL_SLOTS=66; // 09:00〜20:00を10分刻みにした数（土日祝9-18・平日10-20の両方をカバー。カレンダー表示の時間軸と一致）
  function computeTimeFromRowX(relX,rowWidth){
    const cellW=rowWidth/DRAG_TOTAL_SLOTS;
    const totalMin=Math.max(0,Math.round(relX/cellW))*10;
    const h=9+Math.floor(totalMin/60),m=totalMin%60;
    if(h<9||h>17) return null;
    return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
  }

  async function attemptMoveBooking(booking,newDate,newTime,newStaffId){
    const dateObj=new Date(newDate+"T00:00:00");
    if(!isStaffWorkingOnDate(newStaffId,dateObj)){
      showToast("移動先のスタッフはこの日休みのため移動できません","delete");
      return;
    }
    const laneCapacity=getLaneCount(newStaffId);
    const overlapCountLocal=bookings.filter(b=>b.id!==booking.id&&b.staff_id===newStaffId&&b.date===newDate&&!b.cancelled&&overlaps(b,{time:newTime,duration:booking.duration||DURATION[booking.menu]||30})).length;
    if(overlapCountLocal>=laneCapacity){
      showToast("その時間はすでに予約枠が埋まっています","delete");
      return;
    }
    try{
      // 保存直前にもう一度サーバーへ問い合わせて最終確認（かぶり移動を防ぐ）
      const freshSameDay=await sb.select("bookings",`?staff_id=eq.${newStaffId}&date=eq.${newDate}`);
      const overlapCountFresh=(Array.isArray(freshSameDay)?freshSameDay:[]).filter(b=>b.id!==booking.id&&!b.cancelled&&overlaps(b,{time:newTime,duration:booking.duration||DURATION[booking.menu]||30})).length;
      if(overlapCountFresh>=laneCapacity){
        showToast("ちょうど別の予約が入ってしまいました。時間をご確認ください","delete");
        return;
      }
      const result=await sb.update("bookings",booking.id,{date:newDate,time:newTime,staff_id:newStaffId});
      if(!Array.isArray(result)||result.length===0){
        throw new Error((result&&result.message)||"移動に失敗しました");
      }
      setBookings(prev=>prev.map(b=>b.id===booking.id?result[0]:b));
      showToast("予約を移動しました");
    }catch(e){
      alert("移動に失敗しました："+(e.message||"不明なエラー"));
    }
  }

  async function attemptResizeBooking(booking,newDuration){
    const clamped=Math.max(10,Math.min(240,newDuration)); // 10分〜4時間の範囲に収める
    if(clamped===(booking.duration||DURATION[booking.menu]||30)) return; // 変化なし
    const laneCapacity=getLaneCount(booking.staff_id);
    const overlapCountLocal=bookings.filter(b=>b.id!==booking.id&&b.staff_id===booking.staff_id&&b.date===booking.date&&!b.cancelled&&overlaps(b,{time:booking.time,duration:clamped})).length;
    if(overlapCountLocal>=laneCapacity){
      showToast("その時間はすでに予約枠が埋まっています","delete");
      return;
    }
    try{
      const freshSameDay=await sb.select("bookings",`?staff_id=eq.${booking.staff_id}&date=eq.${booking.date}`);
      const overlapCountFresh=(Array.isArray(freshSameDay)?freshSameDay:[]).filter(b=>b.id!==booking.id&&!b.cancelled&&overlaps(b,{time:booking.time,duration:clamped})).length;
      if(overlapCountFresh>=laneCapacity){
        showToast("ちょうど別の予約が入ってしまいました。時間をご確認ください","delete");
        return;
      }
      const result=await sb.update("bookings",booking.id,{duration:clamped});
      if(!Array.isArray(result)||result.length===0){
        throw new Error((result&&result.message)||"時間の変更に失敗しました");
      }
      setBookings(prev=>prev.map(b=>b.id===booking.id?result[0]:b));
      showToast(`対応時間を${clamped}分に変更しました`);
    }catch(e){
      alert("時間の変更に失敗しました："+(e.message||"不明なエラー"));
    }
  }

  function suppressNextClick(){
    function killClick(ev){
      ev.stopPropagation();
      ev.preventDefault();
      window.removeEventListener("click",killClick,true);
    }
    window.addEventListener("click",killClick,true);
    setTimeout(()=>window.removeEventListener("click",killClick,true),500);
  }

  // dragBookingが変化した時（＝ドラッグ開始/終了の時）だけリスナーを付け外しする
  // （指の移動中にリスナーを毎回付け替えないことで、離した瞬間のイベント取りこぼしを防ぐ）
  React.useEffect(()=>{
    if(!dragBooking) return;
    function onMove(e){
      const p=dragPosRef.current;
      const moved=p.moved||Math.abs(e.clientX-p.startX)>10||Math.abs(e.clientY-p.startY)>10;
      dragPosRef.current={...p,x:e.clientX,y:e.clientY,moved};
      setDragPos({x:e.clientX,y:e.clientY,moved});
    }
    function onUp(e){
      const p=dragPosRef.current;
      const bkg=dragBooking;
      if(p.moved){
        e.preventDefault();
        e.stopPropagation();
        suppressNextClick();
        const el=document.elementFromPoint(e.clientX,e.clientY);
        const rowEl=el&&el.closest?el.closest("[data-cal-row]"):null;
        if(rowEl){
          const targetDate=rowEl.getAttribute("data-date");
          const targetStaffId=parseInt(rowEl.getAttribute("data-staffid"),10);
          const rect=rowEl.getBoundingClientRect();
          const relX=e.clientX-rect.left;
          const newTime=computeTimeFromRowX(relX,rect.width);
          if(targetDate&&newTime&&!isNaN(targetStaffId)){
            attemptMoveBooking(bkg,targetDate,newTime,targetStaffId);
          }
        }
      }else{
        // 動いていなければ「タップ」＝予約詳細ポップアップを開く
        setTimePickerPopup(null);
        setBookingPopup({booking:bkg,x:e.clientX,y:e.clientY});
      }
      setDragBooking(null);
    }
    function onCancel(){ setDragBooking(null); }
    window.addEventListener("pointermove",onMove);
    window.addEventListener("pointerup",onUp);
    window.addEventListener("pointercancel",onCancel);
    return()=>{
      window.removeEventListener("pointermove",onMove);
      window.removeEventListener("pointerup",onUp);
      window.removeEventListener("pointercancel",onCancel);
    };
  },[dragBooking]);

  // 予約枠の右端をドラッグして対応時間を伸縮する
  React.useEffect(()=>{
    if(!resizeBooking) return;

      const deltaPx=e.clientX-resizeRef.current.startX;

      setResizeDeltaPx(deltaPx);
    }
    function onUp(e){
      e.preventDefault();

      suppressNextClick();
      const b=resizeBooking;

      // カレンダー本体のCELL_W計算と同じ式（10分刻み・54枠分）をここでも再現する
      const headerW=100;
      const screenW=Math.max(window.innerWidth-130-48,600);
      const cellW=Math.max(Math.floor((screenW-headerW)/54),12);
      const deltaMin=Math.round(resizeRef.current.deltaPx/cellW)*10;
      attemptResizeBooking(b,currentDuration+deltaMin);
      setResizeBooking(null);
      setResizeDeltaPx(0);
    }
    function onCancel(){ setResizeBooking(null); setResizeDeltaPx(0); }
    window.addEventListener("pointermove",onMove);
    window.addEventListener("pointerup",onUp);
    window.addEventListener("pointercancel",onCancel);
    return()=>{
      window.removeEventListener("pointermove",onMove);
      window.removeEventListener("pointerup",onUp);
      window.removeEventListener("pointercancel",onCancel);
    };
  },[resizeBooking]);

                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    予約を編集
                  </button>
                )}
                {(isAdmin||b.staff_id===user.id)&&(
                  <button onClick={()=>{setCancelModalBooking(b);setBookingPopup(null);}} style={{width:"100%",padding:"9px 12px",background:"#fef2f2",color:"#dc2626",border:"1px solid #fecaca",borderRadius:8,cursor:"pointer",fontWeight:700,fontSize:13,textAlign:"left",display:"flex",alignItems:"center",gap:8}}>
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
                    キャンセルにする
                  </button>
                )}
              </div>
            </div>
          </>
        );
      })()}

      {/* PatientHistoryModal removed - now shown inline in PatientsPanel */}
      {showBreakModal&&<BreakModal onClose={()=>setShowBreakModal(false)} bookings={bookings} breaks={breaks} setBreaks={setBreaks}/>}
      {cancelModalBooking&&<CancelModal booking={cancelModalBooking} bookings={bookings} todayStr={todayStr} storeStaffList={storeStaff} isAdmin={isAdmin} onClose={()=>setCancelModalBooking(null)} onConfirm={cancelBooking}/>}

      {delConfirm&&(
        <div className="confirm-box">
          <div style={{background:"white",borderRadius:14,padding:24,maxWidth:300,width:"100%",boxShadow:"0 16px 48px rgba(0,0,0,.2)"}}>
            <div style={{width:52,height:52,background:"#fef2f2",borderRadius:14,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 12px",fontSize:24}}>🗑</div>
            <div style={{fontWeight:800,fontSize:16,textAlign:"center",marginBottom:6,color:"#1e293b"}}>削除しますか？</div>
            <div style={{color:"#64748b",fontSize:13,textAlign:"center",marginBottom:20,lineHeight:1.6}}>{delConfirm.patient_name}さん<br/>{delConfirm.date} {delConfirm.time}</div>
            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>setDelConfirm(null)} className="btn btn-outline" style={{flex:1,justifyContent:"center",padding:11}}>キャンセル</button>
              <button onClick={()=>del(delConfirm.id)} className="btn btn-danger" style={{flex:1,justifyContent:"center",padding:11}}>削除する</button>
            </div>
          </div>
        </div>
      )}

      {iframeModal&&(
        <div style={{position:"fixed",inset:0,background:"rgba(15,23,42,.6)",zIndex:500,display:"flex",flexDirection:"column"}}>
          <div style={{background:"#1e3a5f",color:"white",padding:"10px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
            <div style={{fontWeight:800,fontSize:14}}>{iframeModal.title}</div>
            <button onClick={()=>setIframeModal(null)} style={{background:"rgba(255,255,255,.15)",border:"none",color:"white",borderRadius:8,padding:"6px 14px",cursor:"pointer",fontWeight:700,fontSize:13}}>✕ 閉じる</button>
          </div>
          <div style={{flex:1,background:"white"}}>
            <iframe src={iframeModal.url} title={iframeModal.title} allow="camera" style={{width:"100%",height:"100%",border:"none"}}/>
          </div>
        </div>
      )}

      {toast&&(<div className="toast" style={{background:toast.type==="delete"?"#1e293b":"#059669",color:"white"}}>{toast.type==="delete"?"削除しました":"✓ "}{toast.msg}</div>)}
    </div>
  );
}

function App(){
  const [user,setUser]=React.useState(null);
  const [checking,setChecking]=React.useState(true);

  React.useEffect(()=>{
    async function restoreSession(){
      try{
        const session=await sb.getSession();
        const saved=sessionStorage.getItem("ando_user");
        if(session&&saved){
          setUser(JSON.parse(saved));
        }
      }catch{}
      setChecking(false);
    }
    restoreSession();
  },[]);

  function handleLogin(u){
    try{sessionStorage.setItem("ando_user",JSON.stringify(u));}catch{}
    setUser(u);
  }
  function handleLogout(){
    try{sessionStorage.removeItem("ando_user");}catch{}
    sb.logout();
    setUser(null);
  }

  if(checking)return(<div className="loading"><div className="loading-spinner"></div><div style={{fontWeight:700,color:"#1e3a5f",fontSize:14}}>確認中...</div></div>);
  if(!user)return <LoginScreen onLogin={handleLogin}/>;
  return <Dashboard user={user} onLogout={handleLogout}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
