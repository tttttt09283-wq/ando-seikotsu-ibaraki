function addMonths(dateStr,months){
  const d=new Date(dateStr+"T00:00:00");
  d.setMonth(d.getMonth()+months);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

// ===== 紹介特典の自動発行 =====
// 「紹介された患者」が初来院チェックインした瞬間に、紹介者へ特典を自動発行する。
// ・毎回：施術1回無料
// ・3人紹介ごと：回数券1回分ボーナス
// ・5人紹介ごと：フリーパス1ヶ月プレゼント
// 戻り値：{issued:boolean, referrerName, count, error}
async function processReferralBonus(booking,allBookings){
  const referrerName=(booking.referrer_name||"").trim();
  if(!referrerName) return {issued:false};

  try{
    // 二重付与防止：この予約に対してすでに紹介実績が記録されていないか確認
    const existing=await sb.select("referrals",`?referred_booking_id=eq.${booking.id}`);
    if(Array.isArray(existing)&&existing.length>0) return {issued:false,already:true};

    // 紹介者の連絡先を過去の予約データから検索（同姓同名の可能性があるため、最新の予約を採用）
    const referrerBookings=allBookings.filter(b=>b.patient_name===referrerName).sort((a,b)=>b.date.localeCompare(a.date));
    const referrerPhone=referrerBookings.length>0?referrerBookings[0].phone:null;
    if(!referrerPhone){
      return {issued:false,error:`紹介者「${referrerName}」の連絡先が見つからず、特典を自動発行できませんでした。手動でご対応ください。`};
    }

    const todayStr=fmtDate(new Date());

    // 紹介実績を記録
    await sb.insert("referrals",{
      referrer_name:referrerName,
      referrer_phone:referrerPhone,
      referred_patient_name:booking.patient_name,
      referred_booking_id:booking.id,
    });

    // これまでの紹介実績数をカウント
    const allReferrals=await sb.select("referrals",`?referrer_name=eq.${encodeURIComponent(referrerName)}`);
    const count=Array.isArray(allReferrals)?allReferrals.length:1;

    const passesToIssue=[
      {phone:referrerPhone,pass_type:"紹介特典：施術1回無料",total_count:1,remaining_count:1,expiry_date:addMonths(todayStr,3),purchased_at:todayStr,active:true},
    ];
    if(count%3===0){
      passesToIssue.push({phone:referrerPhone,pass_type:"紹介ボーナス：回数券1回分",total_count:1,remaining_count:1,expiry_date:addMonths(todayStr,3),purchased_at:todayStr,active:true});
    }
    if(count%5===0){
      passesToIssue.push({phone:referrerPhone,pass_type:"紹介ボーナス：FP（フリーパス）1ヶ月",total_count:null,remaining_count:null,expiry_date:addMonths(todayStr,1),purchased_at:todayStr,active:true});
    }
    for(const p of passesToIssue){
      await sb.insert("passes",p);
    }

    return {issued:true,referrerName,count,bonusCount:passesToIssue.length-1};
  }catch(e){
    console.error("紹介特典の発行に失敗しました",e);
    return {issued:false,error:"紹介特典の発行処理でエラーが発生しました："+(e.message||"不明なエラー")};
  }
}

const SLOTS = (()=>{const s=[];for(let h=9;h<20;h++){for(let m=0;m<60;m+=10){s.push(`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`);}}return s;})();

// Supabase公式クライアント（Authセッション管理付き）
// storage を sessionStorage にすることで「タブを閉じるまでログイン維持」を実現
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { storage: window.sessionStorage, persistSession: true, autoRefreshToken: true }
});

const sb = {
  async query(table,method="GET",body=null,filters=""){
    // ログイン中ならセッショントークンを、未ログインならanonキーを使う
    const {data:{session}} = await supabaseClient.auth.getSession();
    const token = session ? session.access_token : SUPABASE_ANON_KEY;
    const res=await fetch(`${SUPABASE_URL}/rest/v1/${table}${filters}`,{
      method,headers:{"apikey":SUPABASE_ANON_KEY,"Authorization":`Bearer ${token}`,"Content-Type":"application/json","Prefer":"return=representation"},
      body:body?JSON.stringify(body):null,
    });
    const text=await res.text();return text?JSON.parse(text):[];
  },
  select:(t,f="")=>sb.query(t,"GET",null,f),
  insert:(t,d)=>sb.query(t,"POST",d),
  update:(t,id,d)=>sb.query(t,"PATCH",d,`?id=eq.${id}`),
  delete:(t,id)=>sb.query(t,"DELETE",null,`?id=eq.${id}`),

  // ===== Auth関連 =====
  async login(email,password){
    const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
    if(error) throw error;
    return data;
  },
  async logout(){
    await supabaseClient.auth.signOut();
  },
  async getSession(){
    const {data:{session}}=await supabaseClient.auth.getSession();
    return session;
  },
};

const today=new Date();
function fmtDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function getWeekDates(base){
  const day=base.getDay(),mon=new Date(base);
  mon.setDate(base.getDate()-(day===0?6:day-1));
  return Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d;});
}
function toMin(t){const[h,m]=t.split(":").map(Number);return h*60+m;}
function overlaps(a,b){
  const as=toMin(a.time),ae=as+(a.duration||DURATION[a.menu]||30),bs=toMin(b.time),be=bs+(b.duration||DURATION[b.menu]||30);
  return as<be&&bs<ae;
}

// 「予約日」と「予約が作成された日」が同じかどうか＝当日予約かどうかを判定する
function isSameDayBooking(b){
  if(!b.created_at) return false;
  return fmtDate(new Date(b.created_at))===b.date;
}

// 同じスタッフの予約を、時間が重ならないよう「レーン」に振り分ける（ベッド・アシスタント等で同時に複数人を担当できる場合用）。
// 戻り値：{ laneOf:{bookingId:レーン番号(0始まり)}, laneCount:実際に必要だったレーン数 }
function assignLanes(bookingsForStaff){
  const sorted=[...bookingsForStaff].sort((a,b)=>a.time.localeCompare(b.time));
  const laneEndTimes=[];
  const laneOf={};
  sorted.forEach(b=>{
    const startMin=toMin(b.time);
    const endMin=startMin+(b.duration||DURATION[b.menu]||30);
    let placed=-1;
    for(let i=0;i<laneEndTimes.length;i++){
      if(laneEndTimes[i]<=startMin){placed=i;break;}
    }
    if(placed===-1){laneEndTimes.push(endMin);placed=laneEndTimes.length-1;}
    else laneEndTimes[placed]=endMin;
    laneOf[b.id]=placed;
  });
  return {laneOf,laneCount:laneEndTimes.length};
}

// 指定した患者の「次回予約」（今日以降の、キャンセルされていない、対象自身を除く予約のうち一番早いもの）を探す
function findNextBookingFor(patientName,excludeId,bookingsList,todayStr){
  const upcoming=bookingsList
    .filter(b=>b.patient_name===patientName&&b.id!==excludeId&&!b.cancelled&&b.date>=todayStr)
    .sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time));
  return upcoming.length>0?upcoming[0]:null;
}

          <div style={{background:"#f8fafc",borderRadius:10,padding:14,marginBottom:18,border:"1px solid #e2e8f0"}}>
            <div style={{fontWeight:800,fontSize:13,color:"#1e3a5f",marginBottom:12}}>休憩を登録</div>
            <div className="form-group">
              <label className="form-label">日付</label>
              <input type="date" className="form-input" value={selDate} onChange={e=>setSelDate(e.target.value)}/>

              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                {STAFF_ACCOUNTS.map(s=>(<button key={s.id} onClick={()=>setSelStaff(s.id)} className="btn" style={{background:selStaff===s.id?s.color:"white",color:selStaff===s.id?"white":"#374151",border:`2px solid ${s.color}`,borderRadius:20,padding:"5px 12px",fontSize:12,boxShadow:selStaff===s.id?`0 2px 8px ${s.color}66`:"none"}}>{s.name}</button>))}

            <div className="form-group">
              <label className="form-label">時間帯（複数選択可）</label>
              <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:5}}>
                {SLOTS.map(t=>{const isSel=selTimes.includes(t);return <button key={t} onClick={()=>setSelTimes(prev=>prev.includes(t)?prev.filter(x=>x!==t):[...prev,t])} className="btn" style={{padding:"7px 4px",borderRadius:7,border:`2px solid ${isSel?"#1e3a5f":"#e2e8f0"}`,background:isSel?"#1e3a5f":"white",color:isSel?"white":"#374151",fontSize:12,fontWeight:isSel?700:400,boxShadow:isSel?"0 2px 6px rgba(30,58,95,.3)":"none"}}>{t}</button>;})}
              </div>
              {selTimes.length>0&&<div style={{marginTop:8,fontSize:12,color:"#2563eb",fontWeight:600}}>選択：{selTimes.join("　")}</div>}
            </div>
            <div className="form-group" style={{marginBottom:14}}>
              <label className="form-label">理由</label>
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                {["休憩","昼休み","研修","外出","その他"].map(r=>(<button key={r} onClick={()=>setReason(r)} className="btn" style={{padding:"5px 10px",borderRadius:7,border:`2px solid ${reason===r?"#1e3a5f":"#e2e8f0"}`,background:reason===r?"#1e3a5f":"white",color:reason===r?"white":"#374151",fontSize:12,fontWeight:reason===r?700:400}}>{r}</button>))}
              </div>

          </div>
          <div style={{fontWeight:800,fontSize:13,color:"#1e3a5f",marginBottom:10}}>{selDate} の休憩一覧</div>
          {todayBreaks.length===0?(<div style={{color:"#9ca3af",fontSize:13,padding:"12px 0",textAlign:"center"}}>登録なし</div>):todayBreaks.map(b=>{
            const s=STAFF_ACCOUNTS.find(x=>x.id===b.staff_id)||{color:"#888",name:"不明",initial:"？"};
            return(
              <div key={b.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",background:"#f8fafc",borderRadius:8,marginBottom:6,borderLeft:`3px solid ${s.color}`,border:`1px solid #e2e8f0`,borderLeftWidth:3}}>
                <div style={{width:28,height:28,borderRadius:"50%",background:s.color,display:"flex",alignItems:"center",justifyContent:"center",color:"white",fontWeight:800,fontSize:12,boxShadow:`0 2px 6px ${s.color}66`}}>{s.initial}</div>
                <div style={{flex:1}}>
                  <div style={{fontWeight:700,fontSize:13,color:"#1e3a5f"}}>{s.name}</div>
                  <div style={{fontSize:12,color:"#6b7280"}}>{b.time}　{b.reason}</div>
                </div>
                <button onClick={()=>delBreak(b.id)} className="btn btn-danger btn-xs">削除</button>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ===== キャンセルモーダル =====
function CancelModal({booking,bookings,todayStr,storeStaffList,isAdmin,onClose,onConfirm}){
  const [reason,setReason]=React.useState("");
  const [customReason,setCustomReason]=React.useState("");
  const [saving,setSaving]=React.useState(false);
  const staff=STAFF_ACCOUNTS.find(s=>s.id===booking.staff_id)||{name:"不明",color:"#888"};
  const nextBooking=React.useMemo(()=>findNextBookingFor(booking.patient_name,booking.id,bookings,todayStr),[booking,bookings,todayStr]);

  const [wantRebook,setWantRebook]=React.useState(false);
  const [rebookDate,setRebookDate]=React.useState("");
  const [rebookTime,setRebookTime]=React.useState("");
  const [rebookStaffId,setRebookStaffId]=React.useState(booking.staff_id);

  const rebookConflict=React.useMemo(()=>{
    if(!wantRebook||!rebookDate||!rebookTime) return false;
    return bookings.some(b=>!b.cancelled&&b.id!==booking.id&&b.staff_id===rebookStaffId&&b.date===rebookDate&&overlaps(b,{time:rebookTime,duration:booking.duration||DURATION[booking.menu]||30}));
  },[wantRebook,rebookDate,rebookTime,rebookStaffId,bookings,booking]);

  async function confirm(){
    const finalReason=reason==="その他"?(customReason.trim()||"その他"):reason;
    if(!finalReason){alert("キャンセル理由を選択してください");return;}
    if(wantRebook){
      if(!rebookDate||!rebookTime){alert("次回予約の日付・時間を選択してください");return;}
      if(rebookConflict){alert("その日時はすでに予約が入っています。別の日時を選んでください");return;}
    }
    setSaving(true);
    await onConfirm(finalReason, wantRebook?{date:rebookDate,time:rebookTime,staff_id:rebookStaffId}:null);
    setSaving(false);
  }

  return(
    <div className="modal-overlay">
      <div className="modal-box" style={{maxWidth:440,maxHeight:"90vh",overflowY:"auto"}}>
        <div className="modal-header" style={{background:"linear-gradient(135deg,#dc2626,#991b1b)"}}>
          <div>
            <div style={{fontWeight:800,fontSize:16,color:"white"}}>予約をキャンセル</div>
            <div style={{fontSize:12,color:"rgba(255,255,255,.75)",marginTop:2}}>この枠は空き枠として開放されます</div>
          </div>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>
        <div style={{padding:20}}>
          <div style={{background:"#f8fafc",borderRadius:10,padding:"12px 14px",marginBottom:12,border:"1px solid #e2e8f0"}}>
            <div style={{fontWeight:800,fontSize:15,color:"#1e293b"}}>{booking.patient_name} 様</div>
            <div style={{fontSize:13,color:"#64748b",marginTop:2}}>{booking.date}　{booking.time}　{staff.name}</div>
            <div style={{fontSize:12,color:"#94a3b8",marginTop:2}}>{booking.menu}</div>
          </div>
          <div style={{borderRadius:10,padding:"10px 14px",marginBottom:16,border:`1.5px solid ${nextBooking?"#bbf7d0":"#fed7aa"}`,background:nextBooking?"#f0fdf4":"#fff7ed"}}>
            {nextBooking?(
              <div style={{fontSize:12,color:"#065f46",fontWeight:700}}>✅ 次回予約あり：{nextBooking.date}　{nextBooking.time}</div>
            ):(
              <div style={{fontSize:12,color:"#9a3412",fontWeight:700}}>⚠ 次回予約なし（フォローが必要かもしれません）</div>
            )}
          </div>
          <div className="form-group">
            <label className="form-label">キャンセル理由 *</label>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              {CANCEL_REASONS.map(r=>(
                <button key={r} onClick={()=>setReason(r)} className="btn"
                  style={{padding:"7px 12px",borderRadius:8,border:`2px solid ${reason===r?"#dc2626":"#e2e8f0"}`,background:reason===r?"#dc2626":"white",color:reason===r?"white":"#374151",fontSize:12,fontWeight:reason===r?700:500}}>
                  {r}
                </button>
              ))}
            </div>
            {reason==="その他"&&(
              <input className="form-input" style={{marginTop:10}} placeholder="理由を入力してください" value={customReason} onChange={e=>setCustomReason(e.target.value)}/>
            )}
          </div>

          {/* 次回予約をその場で作成 */}
          <div style={{marginTop:16,marginBottom:6,padding:"12px 14px",background:wantRebook?"#eff6ff":"#f8fafc",borderRadius:10,border:`1.5px solid ${wantRebook?"#93c5fd":"#e2e8f0"}`}}>
            <div style={{display:"flex",alignItems:"center",gap:10,cursor:"pointer"}} onClick={()=>setWantRebook(v=>!v)}>
              <div style={{width:40,height:22,borderRadius:11,background:wantRebook?"#2563eb":"#d1d5db",position:"relative",flexShrink:0,transition:"background .15s"}}>
                <div style={{position:"absolute",top:2,left:wantRebook?20:2,width:18,height:18,borderRadius:"50%",background:"white",transition:"left .15s",boxShadow:"0 1px 3px rgba(0,0,0,.2)"}}/>
              </div>
              <div>
                <div style={{fontSize:13,fontWeight:800,color:"#1e3a5f"}}>📅 この場で次回予約も作成する</div>
                <div style={{fontSize:11,color:"#94a3b8"}}>キャンセルと同時に新しい予約を登録します</div>
              </div>
            </div>

            {wantRebook&&(
              <div style={{marginTop:14}}>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
                  <div>
                    <label className="form-label">日付</label>
                    <input type="date" className="form-input" value={rebookDate} onChange={e=>setRebookDate(e.target.value)}/>
                  </div>
                  <div>
                    <label className="form-label">時間</label>
                    <select className="form-input" value={rebookTime} onChange={e=>setRebookTime(e.target.value)}>
                      <option value="">選択</option>
                      {SLOTS.map(t=><option key={t} value={t}>{t}</option>)}
                    </select>
                  </div>
                </div>
                {isAdmin&&storeStaffList&&storeStaffList.length>0&&(
                  <div style={{marginBottom:10}}>
                    <label className="form-label">担当スタッフ</label>
                    <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                      {storeStaffList.map(s=>(
                        <button key={s.id} onClick={()=>setRebookStaffId(s.id)} className="btn"
                          style={{padding:"5px 12px",borderRadius:20,border:`2px solid ${rebookStaffId===s.id?s.color:"#e2e8f0"}`,background:rebookStaffId===s.id?s.color:"white",color:rebookStaffId===s.id?"white":"#374151",fontSize:12,fontWeight:700}}>
                          {s.name}
                        </button>
                      ))}
                    </div>
                  </div>
                )}
                {rebookConflict&&(
                  <div style={{background:"#fef2f2",border:"1.5px solid #fecaca",borderRadius:8,padding:"8px 12px",fontSize:12,color:"#dc2626",fontWeight:700}}>
                    ⚠ その日時はすでに予約が入っています
                  </div>
                )}
              </div>
            )}
          </div>

          <div style={{display:"flex",gap:10,marginTop:20}}>
            <button onClick={onClose} className="btn btn-outline" style={{flex:1,justifyContent:"center",padding:11}}>戻る</button>
            <button onClick={confirm} disabled={saving||!reason||(wantRebook&&rebookConflict)} className="btn btn-danger" style={{flex:2,justifyContent:"center",padding:11,opacity:(saving||!reason||(wantRebook&&rebookConflict))?0.6:1}}>
              {saving?"処理中...":wantRebook?"キャンセル＋次回予約を確定する":"キャンセルを確定する"}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ===== プレオープン期間の日別集計 =====
function PreOpenStatsPanel({bookings,payments,stores}){
  const [selStoreId,setSelStoreId]=React.useState(null); // null=全店舗
  const [rangeStart,setRangeStart]=React.useState("2026-10-01");
  const [rangeEnd,setRangeEnd]=React.useState("2026-10-04");
  const [passes,setPasses]=React.useState([]);

  const firstStoreId=(stores&&stores.length>0)?stores[0].id:1;

  // 店舗の「各種設定」に保存されたイベント期間があれば、それを初期値として反映する
  React.useEffect(()=>{
    const targetStoreId=stores&&stores.length>0?stores[0].id:null;
    if(!targetStoreId) return;
    sb.select("store_settings",`?store_id=eq.${targetStoreId}&order=updated_at.desc.nullslast,id.desc&limit=1`)
      .then(rows=>{
        if(Array.isArray(rows)&&rows.length>0){
          const s=rows[0];
          if(s.event_start_date) setRangeStart(s.event_start_date);
          if(s.event_end_date) setRangeEnd(s.event_end_date);
        }
      }).catch(()=>{});
  },[]);

  React.useEffect(()=>{
    sb.select("passes","?order=purchased_date.asc")
      .then(rows=>setPasses(Array.isArray(rows)?rows:[]))
      .catch(()=>setPasses([]));
  },[]);

  const scopedBookings=React.useMemo(()=>{
    if(selStoreId===null) return bookings;
    return bookings.filter(b=>(b.store_id||firstStoreId)===selStoreId);
  },[bookings,selStoreId,firstStoreId]);

  const scopedBookingIds=React.useMemo(()=>new Set(scopedBookings.map(b=>b.id)),[scopedBookings]);
  const scopedPayments=React.useMemo(()=>{
    if(selStoreId===null) return payments;
    return payments.filter(p=>scopedBookingIds.has(p.booking_id));
  },[payments,selStoreId,scopedBookingIds]);

  const dateList=React.useMemo(()=>{
    const list=[];
    if(!rangeStart||!rangeEnd) return list;
    let d=new Date(rangeStart+"T00:00:00");
    const end=new Date(rangeEnd+"T00:00:00");
    let guard=0;
    while(d<=end&&guard<60){
      list.push(fmtDate(d));
      d.setDate(d.getDate()+1);
      guard++;
    }
    return list;
  },[rangeStart,rangeEnd]);

  // 患者ごとの初回来院日（新患判定用。店舗内の全期間データから算出）
  const firstVisitByPatient=React.useMemo(()=>{
    const map={};
    [...scopedBookings].filter(b=>!b.cancelled).sort((a,b)=>a.date.localeCompare(b.date)).forEach(b=>{
      if(!map[b.patient_name]) map[b.patient_name]=b.date;
    });
    return map;
  },[scopedBookings]);

  // 患者ごとの来院日一覧（次回予約有無の判定用）
  const datesByPatient=React.useMemo(()=>{
    const map={};
    scopedBookings.filter(b=>!b.cancelled).forEach(b=>{
      if(!map[b.patient_name]) map[b.patient_name]=[];
      map[b.patient_name].push(b.date);
    });
    return map;
  },[scopedBookings]);

  function isTrialMenu(menu){
    return !!menu&&(menu.includes("体験")||menu.includes("500"));
  }

  const dayStats=dateList.map(dateStr=>{
    const dayBookings=scopedBookings.filter(b=>b.date===dateStr);
    const totalBookings=dayBookings.length;
    const cancelledCount=dayBookings.filter(b=>b.cancelled).length;
    const attended=dayBookings.filter(b=>!b.cancelled&&b.checked_in_at);
    const actualVisits=attended.length;
    const newPatients=attended.filter(b=>firstVisitByPatient[b.patient_name]===dateStr).length;
    const trialCount=attended.filter(b=>isTrialMenu(b.menu)).length;
    const lineCount=dayBookings.filter(b=>b.line_user_id).length;

    let nextBookingCount=0;
    attended.forEach(b=>{
      const dates=datesByPatient[b.patient_name]||[];
      if(dates.some(dd=>dd>dateStr)) nextBookingCount++;
    });
    const nextBookingRate=actualVisits>0?Math.round(nextBookingCount/actualVisits*100):0;

    const dayPasses=passes.filter(p=>p.purchased_date===dateStr);
    const contractCount=new Set(dayPasses.map(p=>p.patient_name)).size;
    const contractRate=actualVisits>0?Math.round(contractCount/actualVisits*100):0;

    const dayPayments=scopedPayments.filter(p=>p.payment_date===dateStr);
    const sales=dayPayments.reduce((s,p)=>s+(p.total_amount||0),0);
    const salesPerVisit=actualVisits>0?Math.round(sales/actualVisits):0;

    const staffCount=new Set(dayBookings.filter(b=>!b.cancelled).map(b=>b.staff_id)).size;

    return{dateStr,totalBookings,actualVisits,newPatients,cancelledCount,trialCount,lineCount,
      nextBookingCount,nextBookingRate,contractCount,contractRate,sales,salesPerVisit,staffCount};
  });

  const totals=dayStats.reduce((acc,d)=>{
    acc.totalBookings+=d.totalBookings;acc.actualVisits+=d.actualVisits;acc.newPatients+=d.newPatients;
    acc.cancelledCount+=d.cancelledCount;acc.trialCount+=d.trialCount;acc.lineCount+=d.lineCount;
    acc.nextBookingCount+=d.nextBookingCount;acc.contractCount+=d.contractCount;acc.sales+=d.sales;
    return acc;
  },{totalBookings:0,actualVisits:0,newPatients:0,cancelledCount:0,trialCount:0,lineCount:0,nextBookingCount:0,contractCount:0,sales:0});
  totals.nextBookingRate=totals.actualVisits>0?Math.round(totals.nextBookingCount/totals.actualVisits*100):0;
  totals.contractRate=totals.actualVisits>0?Math.round(totals.contractCount/totals.actualVisits*100):0;
  totals.salesPerVisit=totals.actualVisits>0?Math.round(totals.sales/totals.actualVisits):0;

  const DAYS_JP2=["日","月","火","水","木","金","土"];
  const fmtYen=n=>"¥"+Number(n||0).toLocaleString();

  return(
    <div style={{maxWidth:1300,margin:"0 auto"}}>
      <div className="card" style={{marginBottom:16,padding:"16px 18px"}}>
        <div style={{fontWeight:800,fontSize:15,color:"#1e3a5f",marginBottom:12}}>📊 プレオープン集計</div>
        <div style={{display:"flex",gap:14,flexWrap:"wrap",alignItems:"flex-end"}}>
          <div>
            <label style={{fontSize:11,color:"#94a3b8",fontWeight:700,display:"block",marginBottom:4}}>集計期間（開始）</label>
            <input type="date" value={rangeStart} onChange={e=>setRangeStart(e.target.value)} style={{padding:"7px 10px",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:13}}/>
          </div>
          <div>
            <label style={{fontSize:11,color:"#94a3b8",fontWeight:700,display:"block",marginBottom:4}}>集計期間（終了）</label>
            <input type="date" value={rangeEnd} onChange={e=>setRangeEnd(e.target.value)} style={{padding:"7px 10px",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:13}}/>
          </div>
          <div>
            <label style={{fontSize:11,color:"#94a3b8",fontWeight:700,display:"block",marginBottom:4}}>店舗</label>
            <select value={selStoreId===null?"":selStoreId} onChange={e=>setSelStoreId(e.target.value===""?null:Number(e.target.value))} style={{padding:"7px 10px",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:13}}>
              <option value="">全店舗合算</option>
              {(stores||[]).map(s=>(<option key={s.id} value={s.id}>{s.name}</option>))}
            </select>
          </div>
        </div>
      </div>

      <div className="card" style={{overflowX:"auto"}}>
        <table style={{borderCollapse:"collapse",width:"100%",fontSize:13,minWidth:1180}}>
          <thead>
            <tr style={{background:"#f8fafc",borderBottom:"2px solid #e2e8f0"}}>
              {["日付","予約数","実来院数","新患数","キャンセル数","500円体験","LINE登録","次回予約","次回予約率","成約人数","成約率","売上","1人あたり","稼働スタッフ"].map(h=>(
                <th key={h} style={{padding:"10px 12px",textAlign:"left",fontWeight:800,color:"#64748b",whiteSpace:"nowrap"}}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {dayStats.length===0?(
              <tr><td colSpan={14} style={{padding:24,textAlign:"center",color:"#94a3b8"}}>期間を選択してください</td></tr>
            ):dayStats.map(d=>{
              const dt=new Date(d.dateStr+"T00:00:00");
              return(
                <tr key={d.dateStr} style={{borderBottom:"1px solid #f1f5f9"}}>
                  <td style={{padding:"10px 12px",fontWeight:700,color:"#1e293b",whiteSpace:"nowrap"}}>{d.dateStr.slice(5)}（{DAYS_JP2[dt.getDay()]}）</td>
                  <td style={{padding:"10px 12px"}}>{d.totalBookings}</td>
                  <td style={{padding:"10px 12px",fontWeight:700,color:"#059669"}}>{d.actualVisits}</td>
                  <td style={{padding:"10px 12px"}}>{d.newPatients}</td>
                  <td style={{padding:"10px 12px",color:"#dc2626"}}>{d.cancelledCount}</td>
                  <td style={{padding:"10px 12px"}}>{d.trialCount}</td>
                  <td style={{padding:"10px 12px"}}>{d.lineCount}</td>
                  <td style={{padding:"10px 12px"}}>{d.nextBookingCount}</td>
                  <td style={{padding:"10px 12px"}}>{d.nextBookingRate}%</td>
                  <td style={{padding:"10px 12px"}}>{d.contractCount}</td>
                  <td style={{padding:"10px 12px"}}>{d.contractRate}%</td>
                  <td style={{padding:"10px 12px",fontWeight:700,color:"#d97706"}}>{fmtYen(d.sales)}</td>
                  <td style={{padding:"10px 12px"}}>{fmtYen(d.salesPerVisit)}</td>
                  <td style={{padding:"10px 12px",whiteSpace:"nowrap"}}>{d.staffCount}名　<span style={{fontSize:11,color:"#94a3b8"}}>（{d.staffCount>0?(d.actualVisits/d.staffCount).toFixed(1):"—"}件/人）</span></td>
                </tr>
              );
            })}
            {dayStats.length>0&&(
              <tr style={{background:"#f0fdf4",borderTop:"2px solid #86efac"}}>
                <td style={{padding:"12px",fontWeight:800,color:"#065f46",whiteSpace:"nowrap"}}>{dateList.length}日間合計</td>
                <td style={{padding:"12px",fontWeight:800}}>{totals.totalBookings}</td>
                <td style={{padding:"12px",fontWeight:800,color:"#059669"}}>{totals.actualVisits}</td>
                <td style={{padding:"12px",fontWeight:800}}>{totals.newPatients}</td>
                <td style={{padding:"12px",fontWeight:800,color:"#dc2626"}}>{totals.cancelledCount}</td>
                <td style={{padding:"12px",fontWeight:800}}>{totals.trialCount}</td>
                <td style={{padding:"12px",fontWeight:800}}>{totals.lineCount}</td>
                <td style={{padding:"12px",fontWeight:800}}>{totals.nextBookingCount}</td>
                <td style={{padding:"12px",fontWeight:800}}>{totals.nextBookingRate}%</td>
                <td style={{padding:"12px",fontWeight:800}}>{totals.contractCount}</td>
                <td style={{padding:"12px",fontWeight:800}}>{totals.contractRate}%</td>
                <td style={{padding:"12px",fontWeight:800,color:"#d97706"}}>{fmtYen(totals.sales)}</td>
                <td style={{padding:"12px",fontWeight:800}}>{fmtYen(totals.salesPerVisit)}</td>
                <td style={{padding:"12px"}}>—</td>
              </tr>
            )}
          </tbody>
        </table>
      </div>
      <div style={{fontSize:11,color:"#94a3b8",marginTop:10,lineHeight:1.8}}>
        ・実来院数：予約のうち「来院受付（QRチェックイン）」が完了したものを集計しています<br/>
        ・500円体験：実来院者のうち、メニュー名に「体験」または「500」を含む予約の人数です<br/>
        ・成約人数：その日に回数券・フリーパスの購入があった患者数です（passesテーブル。店舗の絞り込みは反映されません）<br/>
        ・次回予約：来院した患者のうち、その日より後の日付で予約（キャンセル除く）を持っている人数です<br/>
        ・稼働スタッフ：その日に予約対応があったスタッフの人数（ユニーク人数）と、実来院数を割った「1人あたり対応件数」です
      </div>
    </div>
  );
}

function StatsPanel({bookings,payments,todayStr,stores}){
  const today=new Date(todayStr+"T00:00:00");
  const fmt=n=>"¥"+Number(n||0).toLocaleString();
  const DAYS_JP=["日","月","火","水","木","金","土"];

  // ===== 店舗フィルタ（全店舗 / 各店舗） =====
  const [selStatsStoreId,setSelStatsStoreId]=React.useState(null); // null = 全店舗
  const [selStatsStaffId,setSelStatsStaffId]=React.useState(null); // null = 全スタッフ
  const [filterTab,setFilterTab]=React.useState("store"); // "store" | "staff"
  const [reportTab,setReportTab]=React.useState("monthly"); // "monthly" | "annual"
  const [listModal,setListModal]=React.useState(null); // {title, items:[{name,sub}]} | null
  const [funnelModal,setFunnelModal]=React.useState(null); // {title, funnel, color} | null
  const firstStoreId=(stores&&stores.length>0)?stores[0].id:1;
  const scopedBookings=React.useMemo(()=>{
    let list=bookings;
    if(selStatsStoreId!==null) list=list.filter(b=>(b.store_id||firstStoreId)===selStatsStoreId);
    if(selStatsStaffId!==null) list=list.filter(b=>b.staff_id===selStatsStaffId);
    return list;
  },[bookings,selStatsStoreId,selStatsStaffId,firstStoreId]);
  const scopedBookingIds=React.useMemo(()=>new Set(scopedBookings.map(b=>b.id)),[scopedBookings]);
  const scopedPayments=React.useMemo(()=>{
    if(selStatsStoreId===null&&selStatsStaffId===null) return payments;
    return payments.filter(p=>scopedBookingIds.has(p.booking_id));
  },[payments,selStatsStoreId,selStatsStaffId,scopedBookingIds]);

  // 院（店舗全体）の売上・予約 ＝ スタッフ絞り込みを一切含めない集計（個人目標との比較用に別立てで用意）
  const storeOnlyBookings=React.useMemo(()=>{
    if(selStatsStoreId===null) return bookings;
    return bookings.filter(b=>(b.store_id||firstStoreId)===selStatsStoreId);
  },[bookings,selStatsStoreId,firstStoreId]);
  const storeOnlyBookingIds=React.useMemo(()=>new Set(storeOnlyBookings.map(b=>b.id)),[storeOnlyBookings]);
  const storeOnlyPayments=React.useMemo(()=>{
    if(selStatsStoreId===null) return payments;
    return payments.filter(p=>storeOnlyBookingIds.has(p.booking_id));
  },[payments,selStatsStoreId,storeOnlyBookingIds]);

  // 期間設定
  function getRange(type){
    const now=new Date(todayStr+"T00:00:00");
    const pad=n=>String(n).padStart(2,"0");
    const toStr=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    if(type==="today") return{start:todayStr,end:todayStr};
    if(type==="month"){const s=new Date(now.getFullYear(),now.getMonth(),1);const e=new Date(now.getFullYear(),now.getMonth()+1,0);return{start:toStr(s),end:toStr(e)};}
    if(type==="last_month"){const s=new Date(now.getFullYear(),now.getMonth()-1,1);const e=new Date(now.getFullYear(),now.getMonth(),0);return{start:toStr(s),end:toStr(e)};}
    if(type==="3months"){const s=new Date(now.getFullYear(),now.getMonth()-2,1);return{start:toStr(s),end:todayStr};}
    if(type==="6months"){const s=new Date(now.getFullYear(),now.getMonth()-5,1);return{start:toStr(s),end:todayStr};}
    if(type==="1year"){const s=new Date(now.getFullYear()-1,now.getMonth()+1,1);return{start:toStr(s),end:todayStr};}
    return{start:todayStr,end:todayStr};
  }

  const [rangeType,setRangeType]=React.useState("month");
  const [customStart,setCustomStart]=React.useState(todayStr.slice(0,7)+"-01");
  const [customEnd,setCustomEnd]=React.useState(todayStr);

  const range=rangeType==="custom"?{start:customStart,end:customEnd}:getRange(rangeType);
  const inRange=(d)=>d>=range.start&&d<=range.end;

  // ===== 期間の進捗（選んでいる期間のうち、今日までどれだけ経過したか） =====
  const rangeStartDate=new Date(range.start+"T00:00:00");
  const rangeEndDate=new Date(range.end+"T00:00:00");
  const totalRangeDays=Math.max(1,Math.round((rangeEndDate-rangeStartDate)/86400000)+1);
  const todayForRange=new Date(todayStr+"T00:00:00");
  let elapsedRangeDays;
  if(todayForRange<rangeStartDate) elapsedRangeDays=0;
  else if(todayForRange>rangeEndDate) elapsedRangeDays=totalRangeDays;
  else elapsedRangeDays=Math.round((todayForRange-rangeStartDate)/86400000)+1;
  const rangeProgressPct=Math.round(elapsedRangeDays/totalRangeDays*100);

  // ===== 月間売上目標（院＝店舗全体、個人＝選択中スタッフ、それぞれ別々にブラウザへ保存） =====
  const storeTargetKey=`ando_sales_target_store_${selStatsStoreId||"all"}_${range.start.slice(0,7)}`;
  const [storeSalesTarget,setStoreSalesTarget]=React.useState("");
  React.useEffect(()=>{
    try{ setStoreSalesTarget(localStorage.getItem(storeTargetKey)||""); }catch(e){ setStoreSalesTarget(""); }
  },[storeTargetKey]);
  function updateStoreSalesTarget(val){
    setStoreSalesTarget(val);
    try{ localStorage.setItem(storeTargetKey,val); }catch(e){}
  }

  const staffTargetKey=selStatsStaffId!=null?`ando_sales_target_staff_${selStatsStoreId||"all"}_${selStatsStaffId}_${range.start.slice(0,7)}`:null;
  const [staffSalesTarget,setStaffSalesTarget]=React.useState("");
  React.useEffect(()=>{
    if(!staffTargetKey){ setStaffSalesTarget(""); return; }
    try{ setStaffSalesTarget(localStorage.getItem(staffTargetKey)||""); }catch(e){ setStaffSalesTarget(""); }
  },[staffTargetKey]);
  function updateStaffSalesTarget(val){
    setStaffSalesTarget(val);
    if(!staffTargetKey) return;
    try{ localStorage.setItem(staffTargetKey,val); }catch(e){}
  }

  // 期間内の予約・会計
  const bks=scopedBookings.filter(b=>b.date&&inRange(b.date));
  const pays=scopedPayments.filter(p=>p.payment_date&&inRange(p.payment_date));
  const storeOnlyPays=storeOnlyPayments.filter(p=>p.payment_date&&inRange(p.payment_date));
  const storeTotalSales=storeOnlyPays.reduce((s,p)=>s+(p.total_amount||0),0);

  // === 指標計算 ===
  const totalBk=bks.length;
  const paidBk=pays.length;
  const cancelledBk=bks.filter(b=>b.cancelled).length;
  const confirmedBk=totalBk-cancelledBk;
  // 当日キャンセル（予約日そのものにキャンセルされたもの）
  const sameDayCancelList=bks.filter(b=>b.cancelled&&b.cancelled_at&&fmtDate(new Date(b.cancelled_at))===b.date);
  const sameDayCancelCount=sameDayCancelList.length;

  // 売上
  const totalSales=pays.reduce((s,p)=>s+(p.total_amount||0),0);
  const insSales=pays.reduce((s,p)=>s+(p.insurance_amount||0),0);
  const jifeeSales=pays.reduce((s,p)=>s+(p.jifee_amount||0),0);

  // スタッフ別売上（会計に紐づく予約の担当スタッフで集計）
  const bookingByIdForStats=React.useMemo(()=>{
    const map={};
    scopedBookings.forEach(b=>{map[b.id]=b;});
    return map;
  },[scopedBookings]);
  const salesByStaffMap={};
  pays.forEach(p=>{
    const booking=bookingByIdForStats[p.booking_id];
    const sid=(booking&&booking.staff_id)||0;
    if(!salesByStaffMap[sid]) salesByStaffMap[sid]={total:0,insurance:0,jifee:0,count:0};
    salesByStaffMap[sid].total+=(p.total_amount||0);
    salesByStaffMap[sid].insurance+=(p.insurance_amount||0);
    salesByStaffMap[sid].jifee+=(p.jifee_amount||0);
    salesByStaffMap[sid].count++;
  });
  const salesByStaffList=Object.entries(salesByStaffMap).map(([sid,v])=>{
    const staffInfo=STAFF_ACCOUNTS.find(s=>s.id===Number(sid))||{name:"担当未定",color:"#888",initial:"？"};
    return{staffId:Number(sid),staffInfo,...v};
  }).sort((a,b)=>b.total-a.total);
  const maxStaffSales=Math.max(...salesByStaffList.map(s=>s.total),1);

  // 性別・年代の集計（患者ごとに一番新しい入力値を採用。期間に関わらず店舗/スタッフ絞り込みは反映）
  const patientDemo={};
  [...scopedBookings].sort((a,b)=>a.date.localeCompare(b.date)).forEach(b=>{
    if(!patientDemo[b.patient_name]) patientDemo[b.patient_name]={gender:null,age:null};
    if(b.gender) patientDemo[b.patient_name].gender=b.gender;
    if(b.age!=null && b.age!=="") patientDemo[b.patient_name].age=Number(b.age);
  });
  const demoEntries=Object.values(patientDemo);
  const genderCounts={"女性":0,"男性":0,"回答しない":0,"未回答":0};
  demoEntries.forEach(d=>{
    if(d.gender&&genderCounts[d.gender]!==undefined) genderCounts[d.gender]++;
    else genderCounts["未回答"]++;
  });
  const genderTotal=demoEntries.length;
  const AGE_BANDS=[
    {label:"10代未満",min:0,max:9},
    {label:"10代",min:10,max:19},
    {label:"20代",min:20,max:29},
    {label:"30代",min:30,max:39},
    {label:"40代",min:40,max:49},
    {label:"50代",min:50,max:59},
    {label:"60代",min:60,max:69},
    {label:"70代以上",min:70,max:999},
  ];
  const ageCounts=AGE_BANDS.map(band=>({
    ...band,
    count:demoEntries.filter(d=>d.age!=null&&d.age>=band.min&&d.age<=band.max).length
  }));
  const ageUnknownCount=demoEntries.filter(d=>d.age==null).length;
  const maxAgeCount=Math.max(...ageCounts.map(a=>a.count),1);

  // ユニーク患者
  const uniquePatients=[...new Set(bks.map(b=>b.patient_name))];
  const totalUnique=uniquePatients.length;
  const allPatientDates={};
  scopedBookings.forEach(b=>{if(!allPatientDates[b.patient_name])allPatientDates[b.patient_name]=[];allPatientDates[b.patient_name].push(b.date);});
  let newCount=0,revisitCount=0;
  const newPatientsList=[];
  uniquePatients.forEach(name=>{
    const all=(allPatientDates[name]||[]).sort();
    const first=all[0];
    if(first&&first>=range.start&&first<=range.end){
      newCount++;
      // 累計来院数（キャンセル除く・店舗内の全期間）と、初回担当スタッフを調べる
      const patientVisits=scopedBookings.filter(b=>b.patient_name===name&&!b.cancelled).sort((a,b2)=>a.date.localeCompare(b2.date)||(a.time||"").localeCompare(b2.time||""));
      const totalVisits=patientVisits.length;
      const firstStaffId=patientVisits.length>0?patientVisits[0].staff_id:null;
      newPatientsList.push({name,sub:`初回来院：${first}　累計${totalVisits}回`,totalVisits,staffId:firstStaffId,reached8:totalVisits>=8});
    }
    else revisitCount++;
  });
  const newRate=totalUnique>0?Math.round(newCount/totalUnique*100):0;

  // 新規患者の8回継続数・率（全体・スタッフ別）
  const eightVisitCount=newPatientsList.filter(p=>p.reached8).length;
  const eightVisitRate=newPatientsList.length>0?Math.round(eightVisitCount/newPatientsList.length*100):0;
  // 1〜8回目それぞれで「その回数まで到達した人数」を数える（継続ファネル）
  function buildVisitFunnel(patients){
    const steps=[];
    for(let n=1;n<=8;n++){
      steps.push({step:n,count:patients.filter(p=>p.totalVisits>=n).length});
    }
    return steps;
  }
  const overallFunnel=buildVisitFunnel(newPatientsList);
  const eightByStaff={};
  newPatientsList.forEach(p=>{
    const sid=p.staffId||0;
    if(!eightByStaff[sid]) eightByStaff[sid]={total:0,reached8:0,patients:[]};
    eightByStaff[sid].total++;
    eightByStaff[sid].patients.push(p);
    if(p.reached8) eightByStaff[sid].reached8++;
  });
  const eightByStaffList=Object.entries(eightByStaff).map(([sid,v])=>{
    const staffInfo=STAFF_ACCOUNTS.find(s=>s.id===Number(sid))||{name:"担当未定",color:"#888",initial:"？"};
    return{staffId:Number(sid),staffInfo,total:v.total,reached8:v.reached8,rate:v.total>0?Math.round(v.reached8/v.total*100):0,funnel:buildVisitFunnel(v.patients)};
  }).sort((a,b)=>b.total-a.total);

  // 継続ファネルの棒グラフを描画するヘルパー
  function renderVisitFunnel(funnel,color){
    const max=Math.max(...funnel.map(f=>f.count),1);
    return(
      <div style={{display:"flex",alignItems:"flex-end",gap:6,height:100,padding:"0 2px"}}>
        {funnel.map(f=>{
          const pct=Math.round(f.count/max*100);
          return(
            <div key={f.step} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
              <div style={{fontSize:11,fontWeight:800,color:"#374151"}}>{f.count}</div>
              <div style={{width:"100%",height:`${Math.max(pct,4)}%`,background:color,borderRadius:"4px 4px 0 0",minHeight:4}}/>
              <div style={{fontSize:9,color:"#94a3b8",whiteSpace:"nowrap"}}>{f.step}回目</div>
            </div>
          );
        })}
      </div>
    );
  }

  // 単価・LTV
  const allUnitPrice=paidBk>0?Math.round(totalSales/paidBk):0;
  const ltv=totalUnique>0?Math.round(totalSales/totalUnique):0;

  // 離反（30日以上未来院）
  const cutoff=new Date(today);cutoff.setDate(cutoff.getDate()-30);
  const cutoffStr=cutoff.toISOString().split("T")[0];
  const allUnique=[...new Set(scopedBookings.map(b=>b.patient_name))];
  const churnedNames=allUnique.filter(name=>{
    const last=(allPatientDates[name]||[]).sort().slice(-1)[0];
    return last&&last<cutoffStr&&!bks.some(b=>b.patient_name===name);
  });
  const churnedPatientsList=churnedNames.map(name=>{
    const last=(allPatientDates[name]||[]).sort().slice(-1)[0];
    const daysSince=Math.round((today-new Date(last+"T00:00:00"))/86400000);
    return{name,sub:`最終来院：${last}（${daysSince}日前）`};
  });
  const churnCount=churnedNames.length;
  const churnRate=allUnique.length>0?((churnCount/allUnique.length)*100).toFixed(1):"0";

  // 曜日別
  const dayCount=[0,0,0,0,0,0,0];
  bks.forEach(b=>{if(b.date){const d=new Date(b.date+"T00:00:00");dayCount[d.getDay()]++;}});
  const maxDay=Math.max(...dayCount,1);

  // 時間帯別（時間を取得）
  const hourCount={};
  bks.forEach(b=>{if(b.time){const h=parseInt(b.time.split(":")[0]);hourCount[h]=(hourCount[h]||0)+1;}});
  const hourEntries=Object.entries(hourCount).sort((a,b)=>Number(a[0])-Number(b[0]));
  const maxHour=Math.max(...Object.values(hourCount),1);

  // コース別（menu）
  const menuCount={};
  bks.forEach(b=>{if(b.menu)menuCount[b.menu]=(menuCount[b.menu]||0)+1;});
  const menuEntries=Object.entries(menuCount).sort((a,b)=>b[1]-a[1]);
  const maxMenu=Math.max(...Object.values(menuCount),1);

  // 月別推移（全期間の月別予約数）
  const monthlyMap={};
  scopedBookings.forEach(b=>{if(b.date){const m=b.date.slice(0,7);monthlyMap[m]=(monthlyMap[m]||0)+1;}});
  const monthlyEntries=Object.entries(monthlyMap).sort((a,b)=>a[0].localeCompare(b[0])).slice(-12);
  const maxMonthly=Math.max(...monthlyEntries.map(e=>e[1]),1);

  // インサイト
  const peakDay=dayCount.indexOf(Math.max(...dayCount));
  const peakHour=hourEntries.length>0?hourEntries.reduce((a,b)=>b[1]>a[1]?b:a,hourEntries[0]):null;

  const rangeButtons=[
    {id:"month",label:"今月"},
    {id:"last_month",label:"先月"},
    {id:"3months",label:"3ヶ月"},
    {id:"6months",label:"半年"},
    {id:"1year",label:"1年"},
    {id:"custom",label:"カスタム"},
  ];

  const cardStyle={background:"white",borderRadius:12,padding:"16px",marginBottom:12,boxShadow:"0 1px 4px rgba(0,0,0,.06)",border:"1px solid #f1f5f9"};

  // バーチャート（水平）
  function HBar({label,count,max,color="#059669",highlight}){
    const pct=max>0?Math.round(count/max*100):0;
    return(
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
        <div style={{width:24,fontSize:12,color:highlight?"#ef4444":"#374151",fontWeight:highlight?800:600,textAlign:"right",flexShrink:0}}>{label}</div>
        <div style={{flex:1,height:18,background:"#f1f5f9",borderRadius:4,overflow:"hidden"}}>
          <div style={{height:"100%",width:`${pct}%`,background:highlight?"#ef4444":color,borderRadius:4,transition:"width .3s"}}/>
        </div>
        <div style={{width:28,fontSize:12,fontWeight:700,color:"#374151",textAlign:"right",flexShrink:0}}>{count}</div>
        {highlight&&<span style={{fontSize:10,fontWeight:800,color:"#ef4444",background:"#fee2e2",padding:"1px 5px",borderRadius:4}}>最多</span>}
      </div>
    );
  }

  return(
    <div style={{maxWidth:1600,margin:"0 auto"}}>

      {/* フィルター（期間・店舗・担当スタッフ） */}
      <div style={{...cardStyle,marginBottom:16,padding:"14px 16px"}}>
        {/* 期間選択 */}
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <input type="date" value={customStart} onChange={e=>{setCustomStart(e.target.value);setRangeType("custom");}}
              style={{padding:"6px 10px",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:13,fontWeight:600}}/>
            <span style={{color:"#94a3b8",fontSize:13}}>〜</span>
            <input type="date" value={customEnd} onChange={e=>{setCustomEnd(e.target.value);setRangeType("custom");}}
              style={{padding:"6px 10px",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:13,fontWeight:600}}/>
          </div>
          <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
            {rangeButtons.filter(b=>b.id!=="custom").map(b=>(
              <button key={b.id} onClick={()=>setRangeType(b.id)} style={{padding:"6px 14px",borderRadius:8,fontSize:12,fontWeight:700,border:"1.5px solid",borderColor:rangeType===b.id?"#059669":"#e2e8f0",background:rangeType===b.id?"#059669":"white",color:rangeType===b.id?"white":"#374151",cursor:"pointer",fontFamily:"inherit"}}>{b.label}</button>
            ))}
          </div>
        </div>
        <div style={{fontSize:11,color:"#94a3b8",marginTop:8,marginBottom:14}}>期間：{range.start} 〜 {range.end}</div>

        {/* 店舗／スタッフ タブ切り替え */}
        <div style={{display:"flex",gap:4,borderBottom:"1.5px solid #f1f5f9",marginBottom:12}}>
          {[
            {id:"store",label:"🏢 店舗"},
            {id:"staff",label:"👥 担当スタッフ"},

              {t.label}
            </button>
          ))}
        </div>

        {filterTab==="store"&&stores&&stores.length>0&&(
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            <button onClick={()=>setSelStatsStoreId(null)} style={{padding:"7px 16px",borderRadius:20,border:"1.5px solid",borderColor:selStatsStoreId===null?"#1e3a5f":"#e2e8f0",background:selStatsStoreId===null?"#1e3a5f":"white",color:selStatsStoreId===null?"white":"#374151",fontSize:13,fontWeight:800,cursor:"pointer",fontFamily:"inherit"}}>
              🏢 全店舗合算
            </button>
            {stores.map(s=>(
              <button key={s.id} onClick={()=>setSelStatsStoreId(s.id)} style={{padding:"7px 16px",borderRadius:20,border:"1.5px solid",borderColor:selStatsStoreId===s.id?"#1e3a5f":"#e2e8f0",background:selStatsStoreId===s.id?"#1e3a5f":"white",color:selStatsStoreId===s.id?"white":"#374151",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
                {s.name}
              </button>
            ))}
          </div>
        )}

        const monthList=[];
        {
          const base=new Date(todayStr+"T00:00:00");
          for(let i=11;i>=0;i--){
            const d=new Date(base.getFullYear(),base.getMonth()-i,1);
            monthList.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`);
          }
        }
        // 月別売上
        const monthlyRevenue={};
        scopedPayments.forEach(p=>{if(p.payment_date){const m=p.payment_date.slice(0,7);monthlyRevenue[m]=(monthlyRevenue[m]||0)+(p.total_amount||0);}});
        const monthlyPaidCount={};
        scopedPayments.forEach(p=>{if(p.payment_date){const m=p.payment_date.slice(0,7);monthlyPaidCount[m]=(monthlyPaidCount[m]||0)+1;}});
        // 月別新患（初回来院月）
        const firstVisitMonthByPatient={};
        [...scopedBookings].filter(b=>!b.cancelled).sort((a,b)=>a.date.localeCompare(b.date)).forEach(b=>{
          if(!firstVisitMonthByPatient[b.patient_name]) firstVisitMonthByPatient[b.patient_name]=b.date.slice(0,7);
        });
        const monthlyNewPatients={};
        Object.values(firstVisitMonthByPatient).forEach(m=>{monthlyNewPatients[m]=(monthlyNewPatients[m]||0)+1;});
        // 月別の来院患者セット（簡易離反率の算出用）
        const monthlyActivePatients={};
        scopedBookings.filter(b=>!b.cancelled&&b.date).forEach(b=>{
          const m=b.date.slice(0,7);
          if(!monthlyActivePatients[m]) monthlyActivePatients[m]=new Set();
          monthlyActivePatients[m].add(b.patient_name);
        });

        const monthlyData=monthList.map((m,idx)=>{
          const revenue=monthlyRevenue[m]||0;
          const paidCount=monthlyPaidCount[m]||0;
          const unit=paidCount>0?Math.round(revenue/paidCount):0;
          const newP=monthlyNewPatients[m]||0;
          const prevM=idx>0?monthList[idx-1]:null;
          const prevSet=prevM?(monthlyActivePatients[prevM]||new Set()):new Set();
          const curSet=monthlyActivePatients[m]||new Set();
          let churnedThisMonth=0;
          prevSet.forEach(name=>{if(!curSet.has(name)) churnedThisMonth++;});
          const monthChurnRate=prevSet.size>0?Math.round(churnedThisMonth/prevSet.size*100):null;
          return{month:m,revenue,newP,unit,churnRate:monthChurnRate};
        });
        const maxRevenue=Math.max(...monthlyData.map(d=>d.revenue),1);
        const chartW2=700,chartH2=140,padL2=10,padR2=10,padT2=10,padB2=10;
        const plotW2=chartW2-padL2-padR2,plotH2=chartH2-padT2-padB2;
        const n2=monthlyData.length;
        const xFor2=i=>padL2+(n2<=1?0:(plotW2/(n2-1))*i);
        const yFor2=v=>padT2+plotH2-(v/maxRevenue*plotH2);
        const linePoints=monthlyData.map((d,i)=>`${xFor2(i)},${yFor2(d.revenue)}`).join(" ");

        return(
          <div style={{background:"white",borderRadius:14,padding:"20px 22px",boxShadow:"0 1px 8px rgba(0,0,0,.06)",border:"1px solid #f1f5f9",marginBottom:14}}>

              <polyline points={linePoints} fill="none" stroke="#2563eb" strokeWidth="2.5"/>

              ))}

function FormPanel({form,setForm,editId,conflict,setConflict,isAdmin,bookings,save,onClose,onDelete,onCancel,businessHours,closures,storeStaffList,isStaffWorkingOnDate,staffCanDoMenus,getLaneCount,customMenus}){
  const [searchQ,setSearchQ]=React.useState("");
  const [searchResults,setSearchResults]=React.useState([]);
  const [searching,setSearching]=React.useState(false);
  const [showSearch,setShowSearch]=React.useState(editId===null&&!form.patient_name);

  // 「メニュー・コース管理」で追加されたメニューを、カテゴリごとにまとめて1つの追加タブとして表示する
  const DISPLAY_CATEGORIES=React.useMemo(()=>{
    if(!customMenus||customMenus.length===0) return MENU_CATEGORIES;
    const byCat={};
    customMenus.forEach(m=>{
      const cat=m.category||"自費治療";
      if(!byCat[cat]) byCat[cat]=[];
      byCat[cat].push({name:m.name,duration:m.duration||30,price:m.price||0});
    });
    const customCat={
      id:"custom", label:"追加メニュー", color:"#7c3aed",
      subs:Object.entries(byCat).map(([label,items])=>({id:"custom_"+label,label,items})),
    };
    return [...MENU_CATEGORIES,customCat];
  },[customMenus]);

  const [selCategory,setSelCategory]=React.useState(MENU_CATEGORIES[0].id);
  const [selSub,setSelSub]=React.useState(MENU_CATEGORIES[0].subs[0].id);

  const selectedMenus=form.menus||[];
  const totalPrice=selectedMenus.reduce((s,m)=>s+(MENU_PRICE[m]||0),0);
  const visitCount=React.useMemo(()=>{
    if(!form.patient_name) return 0;
    const prev=bookings.filter(b=>b.patient_name===form.patient_name&&b.id!==editId);
    return prev.length+1;
  },[form.patient_name,bookings,editId]);

  // ===== 営業時間・臨時休業日ヘルパー =====
  const bh=businessHours||[];
  const tc=closures||[];
  function getDayHours(dayOfWeek){
    return bh.find(h=>h.day_of_week===dayOfWeek)||null;
  }
  const dateClosedByTemp=form.date?tc.some(c=>c.date===form.date):false;
  const dayHoursForDate=form.date?getDayHours(new Date(form.date+"T00:00:00").getDay()):null;
  const dateClosedByWeekday=bh.length>0&&dayHoursForDate&&dayHoursForDate.is_open===false;
  const isSelectedDateClosed=dateClosedByTemp||dateClosedByWeekday;
  function isTimeAllowed(t){
    if(!form.date) return true;
    if(bh.length===0) return true;
    const dh=getDayHours(new Date(form.date+"T00:00:00").getDay());
    if(!dh||dh.is_open===false) return false;
    const tm=toMin(t);
    const openM=toMin(dh.open_time||"09:00");
    const closeM=toMin(dh.close_time||"19:00");
    if(tm<openM||tm>=closeM) return false;
    const brs=dh.break_times||[];
    for(const br of brs){
      const bs=toMin(br.start),be=toMin(br.end);
      if(tm>=bs&&tm<be) return false;
    }
    return true;
  }

  function toggleMenu(name,dur){
    const next=selectedMenus.includes(name)?selectedMenus.filter(m=>m!==name):[...selectedMenus,name];
    const maxDur=next.length>0?Math.max(...next.map(m=>DURATION[m]||30)):dur;
    setForm(f=>({...f,menus:next,menu:next[0]||"",duration:maxDur}));
  }

  async function searchPatients(q){
    if(!q.trim()){setSearchResults([]);return;}
    setSearching(true);
    try{
      const [byName,byKarte]=await Promise.all([
        sb.select("bookings","?patient_name=ilike.*"+encodeURIComponent(q)+"*&order=date.desc&limit=20"),
        sb.select("bookings","?karte_no=eq."+encodeURIComponent(q)+"&order=date.desc&limit=10")
      ]);
      const all=[...(Array.isArray(byName)?byName:[]),...(Array.isArray(byKarte)?byKarte:[])];
      const seen={};const unique=[];
      all.forEach(b=>{const key=b.patient_name;if(!seen[key]){seen[key]=true;unique.push(b);}});
      setSearchResults(unique.slice(0,10));
    }catch(e){console.error(e);}
    setSearching(false);
  }

  function selectPatient(b){
    setForm(f=>({...f,patient_name:b.patient_name,phone:b.phone||"",karte_no:b.karte_no||"",line_user_id:b.line_user_id||null,line_notify:!!b.line_user_id}));
    setSearchQ("");setSearchResults([]);setShowSearch(false);
  }

  return(
    <div className="card" style={{maxWidth:520,padding:22}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20}}>
        <div style={{fontSize:17,fontWeight:800,color:"#1e3a5f"}}>{editId!==null?"予約を編集":"新規予約"}</div>
        <button onClick={onClose} style={{background:"none",border:"none",fontSize:22,cursor:"pointer",color:"#94a3b8",lineHeight:1}}>x</button>
      </div>
      {conflict&&<div style={{background:"#fef2f2",border:"1.5px solid #fecaca",borderRadius:8,padding:"10px 14px",marginBottom:14,color:"#dc2626",fontSize:13,fontWeight:700}}>ダブルブッキングになります</div>}
      {showSearch?(
        <div style={{background:"#f0f9ff",borderRadius:10,padding:14,marginBottom:16,border:"1px solid #bae6fd"}}>
          <div style={{fontWeight:800,fontSize:13,color:"#0369a1",marginBottom:10}}>既存患者を検索</div>
          <div style={{position:"relative",marginBottom:8}}>
            <input className="form-input" placeholder="患者名またはカルテ番号で検索..." value={searchQ} onChange={e=>{setSearchQ(e.target.value);searchPatients(e.target.value);}} style={{paddingRight:40}} autoFocus/>
            {searching&&<div style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",fontSize:12,color:"#94a3b8"}}>検索中...</div>}
          </div>
          {searchResults.length>0&&(
            <div style={{background:"white",borderRadius:8,border:"1px solid #e2e8f0",overflow:"hidden",maxHeight:220,overflowY:"auto"}}>
              {searchResults.map((b,i)=>(
                <button key={i} onClick={()=>selectPatient(b)} style={{width:"100%",padding:"10px 14px",background:"none",border:"none",borderBottom:"1px solid #f1f5f9",cursor:"pointer",textAlign:"left",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div>
                    <div style={{fontWeight:700,fontSize:14,color:"#1e293b"}}>{b.patient_name}</div>
                    <div style={{fontSize:12,color:"#64748b"}}>{b.phone||""}</div>
                  </div>
                  <div style={{fontSize:11,color:"#94a3b8",textAlign:"right"}}>
                    <div>{b.date}</div>
                    {b.line_user_id&&<div style={{color:"#059669",fontWeight:700}}>LINE</div>}
                  </div>
                </button>
              ))}
            </div>
          )}
          {searchQ&&!searching&&searchResults.length===0&&<div style={{fontSize:13,color:"#94a3b8",textAlign:"center",padding:"8px 0"}}>該当患者なし</div>}
          <button onClick={()=>setShowSearch(false)} className="btn btn-outline btn-sm" style={{marginTop:8,width:"100%",justifyContent:"center"}}>新規患者として入力</button>
        </div>
      ):(
        <div style={{marginBottom:14}}>
          {form.patient_name&&(
            <div style={{background:"#f0fdf4",borderRadius:10,padding:"10px 14px",marginBottom:10,border:"1px solid #bbf7d0",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{fontWeight:800,fontSize:15,color:"#1e293b"}}>{form.patient_name}</div>
                <div style={{fontSize:12,color:"#64748b"}}>{form.phone}</div>
                {visitCount>0&&<div style={{fontSize:11,color:"#059669",fontWeight:700}}>来院{visitCount}回目</div>}
              </div>
              {editId===null&&<button onClick={()=>setShowSearch(true)} className="btn btn-outline btn-xs">変更</button>}
            </div>
          )}
        </div>
      )}
      {!showSearch&&(
        <div style={{display:"grid",gridTemplateColumns:"1fr auto",gap:10,marginBottom:14}}>
          <div><label className="form-label">患者名 *</label><input className="form-input" value={form.patient_name||""} placeholder="山本 花子" onChange={e=>{setForm(f=>({...f,patient_name:e.target.value}));setConflict(false);}}/></div>
          <div style={{minWidth:110}}><label className="form-label">カルテ番号</label><input className="form-input" value={form.karte_no||""} placeholder="K-001" onChange={e=>setForm(f=>({...f,karte_no:e.target.value}))}/></div>
        </div>
      )}
      <div className="form-group"><label className="form-label">電話番号</label><input type="tel" className="form-input" value={form.phone||""} placeholder="090-0000-0000" onChange={e=>setForm(f=>({...f,phone:e.target.value}))}/></div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
        <div><label className="form-label">日付</label><input type="date" className="form-input" value={form.date||""} onChange={e=>{setForm(f=>({...f,date:e.target.value,time:""}));setConflict(false);}}/></div>
        <div>
          <label className="form-label">時間</label>
          <select className="form-input" value={form.time||""} onChange={e=>{setForm(f=>({...f,time:e.target.value}));setConflict(false);}} disabled={isSelectedDateClosed}>
            <option value="">選択</option>
            {SLOTS.map(t=>{
              const allowed=isTimeAllowed(t);
              return <option key={t} value={t} disabled={!allowed} style={{color:allowed?"inherit":"#d1d5db"}}>{t}{allowed?"":" ×休業"}</option>;
            })}
          </select>
        </div>
      </div>
      {isSelectedDateClosed&&(
        <div style={{background:"#fef2f2",border:"1.5px solid #fecaca",borderRadius:8,padding:"10px 14px",marginBottom:14,color:"#dc2626",fontSize:13,fontWeight:700}}>
          ⚠ この日は{dateClosedByTemp?"臨時休業日":"定休日"}に設定されています。予約を入れる場合は営業時間・休憩時間設定をご確認ください。
        </div>
      )}
      {isAdmin&&(
        <div className="form-group">
          <label className="form-label">担当スタッフ</label>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {(storeStaffList||STAFF_ACCOUNTS).map(s=>{
              const working=!form.date||!isStaffWorkingOnDate?true:isStaffWorkingOnDate(s.id,new Date(form.date+"T00:00:00"));
              const canDoMenu=!staffCanDoMenus||staffCanDoMenus(s.id,selectedMenus);
              // 既にこの日時で予約枠（レーン数）が埋まっているスタッフは選べないようにする
              let isBooked=false;
              if(form.date&&form.time){
                const laneCapacity=getLaneCount?getLaneCount(s.id):1;
                const overlapCount=bookings.filter(b=>b.id!==editId&&b.staff_id===s.id&&b.date===form.date&&!b.cancelled&&overlaps(b,form)).length;
                isBooked=overlapCount>=laneCapacity;
              }
              const selectable=working&&canDoMenu&&!isBooked;
              return(
                <button key={s.id} disabled={!selectable} onClick={()=>{if(!selectable)return;setForm(f=>({...f,staff_id:s.id}));setConflict(false);}} className="btn"
                  style={{background:!selectable?"#f3f4f6":form.staff_id===s.id?s.color:"white",color:!selectable?"#d1d5db":form.staff_id===s.id?"white":"#374151",border:"2px solid "+(!selectable?"#e2e8f0":s.color),borderRadius:20,padding:"5px 12px",fontSize:12,fontWeight:700,boxShadow:form.staff_id===s.id&&selectable?"0 2px 8px "+s.color+"55":"none",cursor:!selectable?"not-allowed":"pointer"}}>
                  {s.name}{!working?"（休み）":!canDoMenu?"（非対応）":isBooked?"（予約済み）":""}
                </button>
              );
            })}
          </div>
          {form.staff_id&&isStaffWorkingOnDate&&form.date&&!isStaffWorkingOnDate(form.staff_id,new Date(form.date+"T00:00:00"))&&(
            <div style={{marginTop:8,fontSize:12,color:"#dc2626",fontWeight:700}}>⚠ 選択中の担当者はこの日休みに設定されています</div>
          )}
          {form.staff_id&&staffCanDoMenus&&!staffCanDoMenus(form.staff_id,selectedMenus)&&(
            <div style={{marginTop:8,fontSize:12,color:"#dc2626",fontWeight:700}}>⚠ 選択中の担当者は、選ばれているメニューに対応していません</div>
          )}
          {form.staff_id&&form.date&&form.time&&bookings.filter(b=>b.id!==editId&&b.staff_id===form.staff_id&&b.date===form.date&&!b.cancelled&&overlaps(b,form)).length>=(getLaneCount?getLaneCount(form.staff_id):1)&&(
            <div style={{marginTop:8,fontSize:12,color:"#dc2626",fontWeight:700}}>⚠ 選択中の担当者はこの時間帯、既に予約枠が埋まっています</div>
          )}
        </div>
      )}
      <div className="form-group">
        <label className="form-label">メニュー（複数選択可）</label>
        <div style={{display:"flex",gap:4,marginBottom:8,flexWrap:"wrap"}}>
          {DISPLAY_CATEGORIES.map(cat=>(
            <button key={cat.id} onClick={()=>{setSelCategory(cat.id);setSelSub(cat.subs[0].id);}} style={{padding:"5px 12px",borderRadius:8,border:"1.5px solid",borderColor:selCategory===cat.id?cat.color:"#e2e8f0",background:selCategory===cat.id?cat.color:"white",color:selCategory===cat.id?"white":cat.color,fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
              {cat.label}
            </button>
          ))}
        </div>
        {(()=>{
          const cat=DISPLAY_CATEGORIES.find(c=>c.id===selCategory)||DISPLAY_CATEGORIES[0];
          const sub=cat.subs.find(s=>s.id===selSub)||cat.subs[0];
          return(
            <div>
              {cat.subs.length>1&&(
                <div style={{display:"flex",gap:4,marginBottom:8,flexWrap:"wrap"}}>
                  {cat.subs.map(s=>(
                    <button key={s.id} onClick={()=>setSelSub(s.id)} style={{padding:"4px 10px",borderRadius:6,border:"1px solid",borderColor:selSub===s.id?"#374151":"#e2e8f0",background:selSub===s.id?"#374151":"white",color:selSub===s.id?"white":"#374151",fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>
                      {s.label}
                    </button>
                  ))}
                </div>
              )}
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:5,maxHeight:220,overflowY:"auto",padding:2}}>
                {sub.items.map(item=>{
                  const isSel=selectedMenus.includes(item.name);
                  return(
                    <button key={item.name} onClick={()=>toggleMenu(item.name,item.duration)} style={{padding:"8px 10px",borderRadius:8,border:"1.5px solid "+(isSel?cat.color:"#e2e8f0"),background:isSel?cat.color+"18":"white",textAlign:"left",cursor:"pointer",fontFamily:"inherit"}}>
                      <div style={{fontSize:12,fontWeight:700,color:isSel?cat.color:"#374151"}}>{item.name}</div>
                      <div style={{fontSize:10,color:"#94a3b8"}}>{item.price>0?""+item.price.toLocaleString()+"円":item.price===0?"保険":""}</div>
                    </button>
                  );
                })}
              </div>
            </div>
          );
        })()}
        {selectedMenus.length>0&&(
          <div style={{marginTop:12,padding:"10px 14px",background:"#f8fafc",borderRadius:8,border:"1px solid #e2e8f0"}}>
            <div style={{display:"flex",flexWrap:"wrap",gap:5,marginBottom:6}}>
              {selectedMenus.map(m=>(
                <span key={m} className="badge badge-blue" style={{padding:"3px 8px"}}>
                  {m}
                  <button onClick={()=>toggleMenu(m,30)} style={{marginLeft:4,background:"none",border:"none",cursor:"pointer",color:"inherit",padding:0,lineHeight:1}}>x</button>
                </span>
              ))}
            </div>
            {totalPrice>0&&<div style={{textAlign:"right",fontWeight:800,fontSize:15,color:"#d97706"}}>{"合計 "+totalPrice.toLocaleString()+"円"}</div>}
            {selectedMenus.some(m=>PASS_MENU_CONFIG[m])&&(
              <div style={{marginTop:8,padding:"8px 10px",background:"#fef9ec",border:"1px solid #fde68a",borderRadius:8,fontSize:11,color:"#92400e",fontWeight:700}}>
                🎫 回数券・フリーパスが含まれています。確定するとマイページの残数・期限に反映されます。
              </div>
            )}
          </div>
        )}
      </div>
      <div className="form-group"><label className="form-label">メモ</label><textarea className="form-input" rows={2} value={form.memo||""} placeholder="気になる点など" onChange={e=>setForm(f=>({...f,memo:e.target.value}))}/></div>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:20,padding:"10px 12px",background:"#f0fdf4",borderRadius:8,border:"1px solid #bbf7d0"}}>
        <input type="checkbox" id="ln" checked={!!form.line_notify} onChange={e=>setForm(f=>({...f,line_notify:e.target.checked}))} style={{width:16,height:16,accentColor:"#059669"}}/>
        <label htmlFor="ln" style={{fontSize:13,color:"#059669",fontWeight:700,cursor:"pointer"}}>LINEリマインドを前日に送る</label>
      </div>
      {editId!==null&&form.booked_via_line&&(
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:20,padding:"10px 12px",background:"#f0fdf4",borderRadius:8,border:"1px solid #86efac"}}>
          <input type="checkbox" id="lineMark" checked={!form.booked_via_line} onChange={e=>setForm(f=>({...f,booked_via_line:!e.target.checked}))} style={{width:16,height:16,accentColor:"#06C755"}}/>
          <label htmlFor="lineMark" style={{fontSize:13,color:"#065f46",fontWeight:700,cursor:"pointer"}}>この予約は「LINE予約」の目印がついています。チェックすると通常予約に戻ります</label>
        </div>
      )}
      <div style={{display:"flex",gap:10}}>
        {editId!==null&&<button onClick={onDelete} className="btn btn-danger" style={{flex:1,justifyContent:"center",padding:11,fontSize:14}}>削除</button>}
        {editId!==null&&onCancel&&<button onClick={onCancel} className="btn" style={{flex:1,justifyContent:"center",padding:11,fontSize:14,background:"white",color:"#dc2626",border:"1.5px solid #fecaca"}}>キャンセルにする</button>}
        <button onClick={save} className="btn btn-primary" style={{flex:2,justifyContent:"center",padding:11,fontSize:14}}>{editId!==null?"更新する":"予約を確定する"}</button>
      </div>
    </div>
  );
}

function SettingsPanel(){
  const [stores,setStores]=React.useState([]);
  const [selStoreId,setSelStoreId]=React.useState(1);
  const [loading,setLoading]=React.useState(true);
  const [saving,setSaving]=React.useState(false);
  const [toast,setToast]=React.useState("");
  const [settings,setSettings]=React.useState({
    slot_unit:10,
    hours_before:2,
    days_ahead:60,
    max_per_slot:5,
    allow_same_day:true,
    allow_staff_select:true,
    auto_break:false,
    staff_break:true,
    thanks_url:"",
    header_bg:"#1e3a5f",
    header_text:"#ffffff",
    main_color:"#1e3a5f",
    logo_text:"",
    booking_min_date:"",
    event_start_date:"",
    event_end_date:"",
    event_menu_name:"",
    event_menu_price:"",
  });

  function showToast(msg){setToast(msg);setTimeout(()=>setToast(""),2500);}
  function setF(key,val){setSettings(p=>({...p,[key]:val}));}

  React.useEffect(()=>{
    sb.select("stores","?order=id.asc").then(data=>{
      if(Array.isArray(data)&&data.length>0){setStores(data);setSelStoreId(data[0].id);}
    }).catch(()=>{});
  },[]);

  React.useEffect(()=>{loadSettings();},[selStoreId]);

  async function loadSettings(){
    setLoading(true);
    try{
      const data=await sb.select("store_settings",`?store_id=eq.${selStoreId}&order=updated_at.desc.nullslast,id.desc&limit=1`);
      if(Array.isArray(data)&&data.length>0){
        const s=data[0];
        setSettings({
          slot_unit:s.slot_unit||10,
          hours_before:s.hours_before||2,
          days_ahead:s.days_ahead||60,
          max_per_slot:s.max_per_slot||5,
          allow_same_day:s.allow_same_day!==false,
          allow_staff_select:s.allow_staff_select!==false,
          auto_break:s.auto_break===true,
          staff_break:s.staff_break!==false,
          thanks_url:s.thanks_url||"",
          header_bg:s.header_bg||"#1e3a5f",
          header_text:s.header_text||"#ffffff",
          main_color:s.main_color||"#1e3a5f",
          logo_text:s.logo_text||"",
          booking_min_date:s.booking_min_date||"",
          event_start_date:s.event_start_date||"",
          event_end_date:s.event_end_date||"",
          event_menu_name:s.event_menu_name||"",
          event_menu_price:s.event_menu_price||"",
        });
      }
    }catch(e){console.error(e);}
    setLoading(false);
  }

  async function saveSettings(){
    setSaving(true);
    try{
      const token=(await supabaseClient.auth.getSession()).data.session?.access_token||SUPABASE_ANON_KEY;
      await fetch(`${SUPABASE_URL}/rest/v1/store_settings`,{
        method:"POST",
        headers:{apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${token}`,"Content-Type":"application/json",Prefer:"resolution=merge-duplicates"},
        body:JSON.stringify({store_id:selStoreId,...settings,updated_at:new Date().toISOString()})
      });
      showToast("設定を保存しました");
    }catch(e){alert("保存に失敗しました："+e.message);}
    setSaving(false);
  }

  const cardStyle={background:"white",borderRadius:12,marginBottom:14,boxShadow:"0 1px 4px rgba(0,0,0,.06)",border:"1px solid #f1f5f9",overflow:"hidden"};
  const cardHeader={padding:"14px 16px",borderBottom:"1px solid #f1f5f9",fontWeight:800,fontSize:14,color:"#1e3a5f"};
  const cardBody={padding:"16px"};
  const labelStyle={display:"block",fontSize:12,fontWeight:700,color:"#374151",marginBottom:6};
  const inputStyle={width:"100%",padding:"9px 12px",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:14,fontFamily:"inherit"};

  function Toggle({val,onChange,label,sub}){
    return(
      <div style={{display:"flex",alignItems:"flex-start",gap:10,marginBottom:12}}>
        <div onClick={onChange} style={{width:44,height:24,borderRadius:12,background:val?"#059669":"#d1d5db",cursor:"pointer",position:"relative",flexShrink:0,marginTop:2}}>
          <div style={{position:"absolute",top:2,left:val?20:2,width:20,height:20,borderRadius:"50%",background:"white",transition:"left .2s",boxShadow:"0 1px 4px rgba(0,0,0,.2)"}}/>
        </div>
        <div>
          <div style={{fontSize:13,fontWeight:700,color:"#374151"}}>{label}</div>
          {sub&&<div style={{fontSize:11,color:"#94a3b8",marginTop:2}}>{sub}</div>}
        </div>
      </div>
    );
  }

  return(
    <div style={{maxWidth:1300,margin:"0 auto"}}>
      {toast&&<div style={{background:"#f0fdf4",border:"1px solid #86efac",borderRadius:8,padding:"10px 14px",marginBottom:12,color:"#15803d",fontWeight:700,fontSize:13}}>{toast}</div>}

      {/* 店舗選択 */}
      {stores.length>0&&(
        <div style={{...cardStyle,marginBottom:14}}>
          <div style={cardBody}>
            <div style={{fontSize:12,fontWeight:700,color:"#64748b",marginBottom:8}}>店舗選択</div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              {stores.map(s=>(
                <button key={s.id} onClick={()=>setSelStoreId(s.id)}
                  style={{padding:"7px 16px",borderRadius:8,border:"1.5px solid",borderColor:selStoreId===s.id?"#059669":"#e2e8f0",background:selStoreId===s.id?"#059669":"white",color:selStoreId===s.id?"white":"#374151",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
                  {s.name}
                </button>
              ))}
            </div>
          </div>
        </div>
      )}

      {loading?<div style={{textAlign:"center",padding:40,color:"#94a3b8"}}>読み込み中...</div>:(
        <>
          <div style={{display:"grid",gridTemplateColumns:"1fr",gap:16,alignItems:"start"}}>
            <div>
              {/* 予約制限設定 */}
              <div style={cardStyle}>
                <div style={cardHeader}>予約制限設定</div>
                <div style={cardBody}>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:14}}>
                    <div>
                      <label style={labelStyle}>予約枠の単位</label>
                      <select value={settings.slot_unit} onChange={e=>setF("slot_unit",parseInt(e.target.value))} style={inputStyle}>
                        {[10,15,20,30,60].map(v=><option key={v} value={v}>{v}分単位</option>)}
                      </select>
                    </div>
                    <div>
                      <label style={labelStyle}>何時間前まで予約可能か</label>
                      <input type="number" value={settings.hours_before} onChange={e=>setF("hours_before",parseInt(e.target.value)||0)} style={inputStyle}/>
                    </div>
                    <div>
                      <label style={labelStyle}>何日先まで予約可能か</label>
                      <input type="number" value={settings.days_ahead} onChange={e=>setF("days_ahead",parseInt(e.target.value)||0)} style={inputStyle}/>
                    </div>
                    <div>
                      <label style={labelStyle}>同一時間帯の最大予約数</label>
                      <input type="number" value={settings.max_per_slot} onChange={e=>setF("max_per_slot",parseInt(e.target.value)||1)} style={inputStyle}/>
                    </div>
                  </div>
                  <Toggle val={settings.allow_same_day} onChange={()=>setF("allow_same_day",!settings.allow_same_day)} label="当日予約を許可する"/>
                  <Toggle val={settings.allow_staff_select} onChange={()=>setF("allow_staff_select",!settings.allow_staff_select)} label="スタッフ指名を許可する" sub="OFFにするとスタッフ選択画面を表示しない"/>
                </div>
              </div>

              {/* 受付開始日・イベント設定 */}
              <div style={cardStyle}>
                <div style={cardHeader}>受付開始日・オープンイベント設定</div>
                <div style={cardBody}>
                  <div style={{marginBottom:14}}>
                    <label style={labelStyle}>予約受付を開始する日（空欄＝制限なし・今日から受付）</label>
                    <input type="date" value={settings.booking_min_date} onChange={e=>setF("booking_min_date",e.target.value)} style={inputStyle}/>
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:14}}>
                    <div>
                      <label style={labelStyle}>イベント開催期間（開始）</label>
                      <input type="date" value={settings.event_start_date} onChange={e=>setF("event_start_date",e.target.value)} style={inputStyle}/>
                    </div>
                    <div>
                      <label style={labelStyle}>イベント開催期間（終了）</label>
                      <input type="date" value={settings.event_end_date} onChange={e=>setF("event_end_date",e.target.value)} style={inputStyle}/>
                    </div>
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"2fr 1fr",gap:14}}>
                    <div>
                      <label style={labelStyle}>イベント用メニュー名</label>
                      <input value={settings.event_menu_name} onChange={e=>setF("event_menu_name",e.target.value)} placeholder="無料施術体験会（約60分・カウンセリング込み）" style={inputStyle}/>
                    </div>
                    <div>
                      <label style={labelStyle}>価格（円）</label>
                      <input type="number" value={settings.event_menu_price} onChange={e=>setF("event_menu_price",e.target.value)} placeholder="0" style={inputStyle}/>
                    </div>
                  </div>
                  <div style={{fontSize:11,color:"#94a3b8",marginTop:8}}>ここで設定した内容は、患者様向け予約ページにそのまま反映されます。</div>
                </div>
              </div>

              {/* 休憩時間設定 */}
