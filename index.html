// ===== 保険請求用：当日のカルテ番号一覧 =====
// 指定した日に来院（予約）した保険対応の患者様のカルテ番号を、番号順に一覧で確認・コピーできる。
// カルテ番号は患者様ごとに1つで、その患者様のどの予約に登録されていても拾う（編集画面で全予約に反映される仕様のため）。
function KarteListPanel({bookings,payments,stores,todayStr}){
  const fmt=n=>"¥"+Number(n||0).toLocaleString();
  const firstStoreId=(stores&&stores[0]&&stores[0].id)||1;
  const [storeId,setStoreId]=React.useState(firstStoreId);
  const [date,setDate]=React.useState(todayStr);
  const [onlyInsured,setOnlyInsured]=React.useState(true);
  const [copied,setCopied]=React.useState(false);

  const patientKey=b=>(b.phone||"")+"|"+(b.patient_name||"");
  const result=React.useMemo(()=>{
    // 患者様ごとのカルテ番号（どれかの予約に入っていれば採用）
    const karteByPatient={};
    bookings.forEach(b=>{
      const k=(b.karte_no||"").trim();
      if(k) karteByPatient[patientKey(b)]=k;
    });
    const payByBooking={};
    payments.forEach(p=>{ if(p.booking_id!=null) payByBooking[p.booking_id]=p; });
    const list=bookings
      .filter(b=>b.date===date&&!b.cancelled&&(b.store_id||firstStoreId)===storeId)
      .map(b=>{
        const pay=payByBooking[b.id];
        const insAmount=pay?(pay.insurance_amount||0):0;
        // 会計前でも、保険メニュー（◯割）で予約している方は保険対応とみなす
        const insured=insAmount>0||/[1-3１-３]割/.test(b.menu||"");
        return{b,karte:karteByPatient[patientKey(b)]||"",insAmount,paid:!!pay,insured};
      })
      .filter(r=>!onlyInsured||r.insured);
    // 同じ患者様が同日に複数枠ある場合は1行にまとめる
    const seen=new Set();
    const uniq=list.filter(r=>{const k=patientKey(r.b);if(seen.has(k))return false;seen.add(k);return true;});
    uniq.sort((a,c)=>{
      if(!a.karte&&c.karte) return 1;
      if(a.karte&&!c.karte) return -1;
      return a.karte.localeCompare(c.karte,"ja",{numeric:true})||(a.b.time||"").localeCompare(c.b.time||"");
    });
    return uniq;
  },[bookings,payments,date,storeId,onlyInsured,firstStoreId]);

  const missing=result.filter(r=>!r.karte).length;

  function copyNumbers(){
    const text=result.filter(r=>r.karte).map(r=>r.karte).join("\n");
    try{ navigator.clipboard.writeText(text).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000);}); }
    catch(e){ alert("コピーできませんでした"); }
  }

  const th={padding:"8px 10px",fontSize:11,fontWeight:800,color:"#475569",background:"#f1f5f9",textAlign:"left",whiteSpace:"nowrap",borderBottom:"1px solid #e2e8f0"};
  const td={padding:"8px 10px",fontSize:13,color:"#1e293b",borderBottom:"1px solid #f1f5f9"};
  const staffName=id=>{const s=(typeof STAFF_ACCOUNTS!=="undefined"?STAFF_ACCOUNTS:[]).find(x=>x.id===id);return s?s.name:"";};

  return(
    <div className="card" style={{padding:16}}>
      <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",marginBottom:12}}>
        <span style={{fontWeight:800,fontSize:16,color:"#1e3a5f"}}>🗂 カルテ番号一覧（保険請求用）</span>
        <input type="date" value={date} onChange={e=>setDate(e.target.value)} style={{padding:"6px 10px",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:13}}/>
        <button onClick={()=>setDate(todayStr)} style={{padding:"6px 12px",borderRadius:8,border:"1.5px solid #e2e8f0",background:"white",fontSize:12,fontWeight:700,cursor:"pointer"}}>今日</button>
        <select value={storeId} onChange={e=>setStoreId(Number(e.target.value))} style={{padding:"6px 10px",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:13}}>
          {(stores||[]).map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
        </select>
        <label style={{display:"flex",alignItems:"center",gap:5,fontSize:12,fontWeight:700,color:"#374151",cursor:"pointer"}}>
          <input type="checkbox" checked={onlyInsured} onChange={e=>setOnlyInsured(e.target.checked)}/>保険対応のみ
        </label>
        <button onClick={copyNumbers} style={{marginLeft:"auto",padding:"6px 14px",borderRadius:8,border:"none",background:copied?"#059669":"#1e3a5f",color:"white",fontSize:12,fontWeight:700,cursor:"pointer"}}>
          {copied?"✓ コピーしました":"カルテ番号をコピー（改行区切り）"}
        </button>
      </div>
      <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:10,fontSize:12,fontWeight:700}}>
        <span style={{background:"#eff6ff",color:"#1d4ed8",padding:"3px 12px",borderRadius:20}}>{result.length}名</span>
        {missing>0&&<span style={{background:"#fef2f2",color:"#dc2626",padding:"3px 12px",borderRadius:20}}>⚠ カルテ番号が未登録：{missing}名</span>}
      </div>
      {result.length===0?(
        <div style={{textAlign:"center",color:"#94a3b8",padding:"28px 0",fontSize:13}}>この日の{onlyInsured?"保険対応の":""}来院はありません</div>
      ):(
        <div style={{overflowX:"auto",border:"1px solid #e2e8f0",borderRadius:10}}>
          <table style={{borderCollapse:"collapse",width:"100%"}}>
            <thead><tr>
              <th style={th}>カルテNo.</th><th style={th}>患者名</th><th style={th}>時間</th><th style={th}>メニュー</th><th style={th}>担当</th><th style={{...th,textAlign:"right"}}>保険窓口</th><th style={th}>会計</th>
            </tr></thead>
            <tbody>
              {result.map(r=>(
                <tr key={r.b.id}>
                  <td style={{...td,fontWeight:800,fontSize:15,color:r.karte?"#0f172a":"#dc2626"}}>{r.karte||"未登録"}</td>
                  <td style={td}>{r.b.patient_name}</td>
                  <td style={td}>{r.b.time}</td>
                  <td style={{...td,fontSize:12,color:"#64748b"}}>{r.b.menu}</td>
                  <td style={td}>{staffName(r.b.staff_id)}</td>
                  <td style={{...td,textAlign:"right"}}>{r.paid?fmt(r.insAmount):"-"}</td>
                  <td style={td}>{r.paid?<span style={{color:"#059669",fontWeight:700}}>済</span>:<span style={{color:"#94a3b8"}}>未</span>}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
      <div style={{fontSize:11,color:"#94a3b8",marginTop:10,lineHeight:1.6}}>
        カルテ番号は「患者管理」の患者情報編集で登録できます（その患者様の全予約に反映されます）。
      </div>
    </div>
  );
}

// ===== 日計表（スプレッドシートの日計表と同じ項目を、会計データから自動集計して日別に表示） =====
// 巻き爪・自賠は、POS会計の「巻き爪・自賠」ボタンで追加した自費項目（payments.jifee_items）から集計する。
// ===== レジ金（レジ締め）：釣銭準備金＋現金売上±入出金＝あるべきレジ金 と、実際に数えた現金の差額を出す =====
function RegisterCashPanel({bookings,payments,stores,todayStr,currentUser,refunds}){
  const fmt=n=>"¥"+Number(n||0).toLocaleString();
  const firstStoreId=(stores&&stores[0]&&stores[0].id)||1;
  const [storeId,setStoreId]=React.useState(firstStoreId);
  const [date,setDate]=React.useState(todayStr);
  const DENOMS=[10000,5000,2000,1000,500,100,50,10,5,1];
  const [counts,setCounts]=React.useState({});
  const [floatStart,setFloatStart]=React.useState("");
  const [floatNext,setFloatNext]=React.useState("");
  const [adj,setAdj]=React.useState([]); // {type:"in"|"out",amount,reason}
  const [memo,setMemo]=React.useState("");
  const [saved,setSaved]=React.useState(null); // 保存済みの記録
  const [prevFloat,setPrevFloat]=React.useState(null); // 前回締めの「翌日の釣銭準備金」
  const [loading,setLoading]=React.useState(true);
  const [saving,setSaving]=React.useState(false);
  const [msg,setMsg]=React.useState("");

  // その日の現金売上（現金＝合計−現金以外。お釣り分は含めない）
  const cashInfo=React.useMemo(()=>{
    const ids=new Set(bookings.filter(b=>(b.store_id||firstStoreId)===storeId).map(b=>b.id));
    const pays=payments.filter(p=>p.payment_date===date&&ids.has(p.booking_id));
    let cash=0,other=0; const by={};
    pays.forEach(p=>{
      const tot=parseInt(p.total_amount)||0; let nonCash=0;
      String(p.payment_method||"").split("・").forEach(part=>{
        const i=part.indexOf(":"); if(i<0) return;
        const nm=part.slice(0,i).trim(); const amt=parseInt(part.slice(i+1).replace(/[^\d]/g,""))||0;
        if(nm&&nm!=="現金"){ nonCash+=amt; by[nm]=(by[nm]||0)+amt; }
      });
      other+=nonCash; cash+=Math.max(0,tot-nonCash);
    });
    // 返金：現金で返したぶんはレジ金から引く（現金以外はその支払い方法の売上から引く）
    let refundCash=0;
    (refunds||[]).filter(r=>r.refund_date===date&&!r.voided&&(r.store_id||firstStoreId)===storeId).forEach(r=>{
      const a=r.amount||0;
      if(r.refund_method==="現金"){ cash-=a; refundCash+=a; }
      else{ other-=a; by[r.refund_method||"その他"]=(by[r.refund_method||"その他"]||0)-a; }
    });
    return {cash,other,by,count:pays.length,refundCash};
  },[bookings,payments,refunds,storeId,date,firstStoreId]);

  // 日付・店舗が変わったら、保存済みの記録と、前回締めの繰越額を読み込む
  React.useEffect(()=>{
    let alive=true;
    setLoading(true); setMsg("");
    sb.select("register_closings",`?store_id=eq.${storeId}&date=lte.${date}&order=date.desc&limit=2`).then(rows=>{
      if(!alive) return;
      const list=Array.isArray(rows)?rows:[];
      const cur=list.find(r=>r.date===date)||null;
      const prev=list.find(r=>r.date<date)||null;
      setSaved(cur); setPrevFloat(prev?prev.float_next:null);
      if(cur){
        setFloatStart(String(cur.float_start)); setFloatNext(String(cur.float_next));
        setAdj(Array.isArray(cur.adjustments)?cur.adjustments:[]);
        setCounts(cur.denominations||{}); setMemo(cur.memo||"");
      }else{
        setFloatStart(prev?String(prev.float_next):""); setFloatNext(prev?String(prev.float_next):"");
        setAdj([]); setCounts({}); setMemo("");
      }
      setLoading(false);
    }).catch(()=>{ if(alive) setLoading(false); });
    return ()=>{alive=false;};
  },[storeId,date]);

  const n=v=>parseInt(v,10)||0;
  const inTotal=adj.filter(a=>a.type==="in").reduce((s,a)=>s+n(a.amount),0);
  const outTotal=adj.filter(a=>a.type==="out").reduce((s,a)=>s+n(a.amount),0);
  const expected=n(floatStart)+cashInfo.cash+inTotal-outTotal;
  const actual=DENOMS.reduce((s,d)=>s+d*n(counts[d]),0);
  const counted=DENOMS.some(d=>n(counts[d])>0);
  const diff=actual-expected;
  const deposit=actual-n(floatNext);

  function shiftDate(delta){ const d=new Date(date+"T00:00:00"); d.setDate(d.getDate()+delta); setDate(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`); }
  function setAdjAt(i,patch){ setAdj(p=>p.map((a,k)=>k===i?{...a,...patch}:a)); }

  async function save(){
    if(!counted&&!window.confirm("現金の枚数がまだ入力されていません。このまま保存しますか？")) return;
    if(counted&&diff!==0&&!window.confirm(`差額が ${diff>0?"+":""}${diff.toLocaleString()}円 あります。このまま保存しますか？`)) return;
    setSaving(true); setMsg("");
    const payload={
      store_id:storeId,date,float_start:n(floatStart),cash_sales:cashInfo.cash,
      adjustments:adj.filter(a=>n(a.amount)>0),denominations:counts,
      expected,actual,diff,float_next:n(floatNext),deposit,memo:memo||null,
      staff_id:(currentUser&&currentUser.id)||null,updated_at:new Date().toISOString(),
    };
    try{
      let res;
      if(saved) res=await sb.update("register_closings",saved.id,payload);
      else res=await sb.insert("register_closings",payload);
      const row=Array.isArray(res)?res[0]:null;
      if(!row) throw new Error((res&&res.message)||"保存に失敗しました");
      setSaved(row); setMsg("✅ 保存しました");
    }catch(e){ setMsg("保存に失敗しました："+(e.message||"")); }
    setSaving(false);
  }

  const card={background:"white",borderRadius:12,padding:"14px 16px",boxShadow:"0 1px 4px rgba(0,0,0,.06)",marginBottom:12};
  const h={fontSize:13,fontWeight:800,color:"#1e3a5f",marginBottom:10};
  const inp={padding:"7px 10px",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:14,fontFamily:"inherit",textAlign:"right",width:130};
  const row={display:"flex",justifyContent:"space-between",alignItems:"center",padding:"5px 0",fontSize:14};

  return(
    <div style={{maxWidth:760,margin:"0 auto"}}>
      <div style={card}>
        <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
          <div style={{fontWeight:800,fontSize:16,color:"#1e3a5f"}}>💴 レジ金（レジ締め）</div>
          {stores&&stores.length>1&&(
            <select value={storeId} onChange={e=>setStoreId(Number(e.target.value))} style={{padding:"6px 10px",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:13}}>
              {stores.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
            </select>
          )}
          <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:6}}>
            <button onClick={()=>shiftDate(-1)} style={{padding:"5px 12px",borderRadius:8,border:"1.5px solid #e2e8f0",background:"white",cursor:"pointer"}}>◀</button>
            <input type="date" value={date} onChange={e=>e.target.value&&setDate(e.target.value)} style={{padding:"6px 10px",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:13}}/>
            <button onClick={()=>shiftDate(1)} style={{padding:"5px 12px",borderRadius:8,border:"1.5px solid #e2e8f0",background:"white",cursor:"pointer"}}>▶</button>
          </div>
        </div>
        {saved&&<div style={{marginTop:8,fontSize:12,color:"#059669",fontWeight:700}}>✓ この日は保存済みです（{(saved.updated_at||"").slice(0,16).replace("T"," ")}）。内容を変えて保存し直せます。</div>}
      </div>

      {loading?<div style={{...card,textAlign:"center",color:"#94a3b8"}}>読み込み中...</div>:(<>
      <div style={card}>
        <div style={h}>① あるべきレジ金の計算</div>
        <div style={row}>
          <span>開始時の釣銭準備金{prevFloat!=null&&<span style={{fontSize:11,color:"#94a3b8",marginLeft:6}}>（前回締め：{fmt(prevFloat)}）</span>}</span>
          <input type="number" inputMode="numeric" value={floatStart} onChange={e=>setFloatStart(e.target.value)} placeholder="0" style={inp}/>
        </div>
        <div style={row}>
          <span>＋ 現金売上（会計から自動）<span style={{fontSize:11,color:"#94a3b8",marginLeft:6}}>{cashInfo.count}件</span></span>
          <b>{fmt(cashInfo.cash)}</b>
        </div>
        {cashInfo.refundCash>0&&<div style={{...row,fontSize:12,color:"#dc2626",paddingTop:0}}><span>↩️ うち現金での返金 −{fmt(cashInfo.refundCash)}（現金売上から差し引き済み）</span></div>}
        {cashInfo.other!==0&&<div style={{...row,fontSize:12,color:"#64748b",paddingTop:0}}><span>（参考）現金以外 {fmt(cashInfo.other)}：{Object.keys(cashInfo.by).map(k=>`${k} ${fmt(cashInfo.by[k])}`).join("／")}</span><span>レジ金には含めません</span></div>}
        <div style={{borderTop:"1px dashed #e2e8f0",marginTop:6,paddingTop:6}}>
          <div style={{fontSize:12,color:"#64748b",fontWeight:700,marginBottom:6}}>入金・出金（釣銭の追加、立替精算、両替など）</div>
          {adj.map((a,i)=>(
            <div key={i} style={{display:"flex",gap:6,alignItems:"center",marginBottom:6,flexWrap:"wrap"}}>
              <select value={a.type} onChange={e=>setAdjAt(i,{type:e.target.value})} style={{padding:"6px 8px",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:13}}>
                <option value="in">＋ 入金</option><option value="out">− 出金</option>
              </select>
              <input type="number" inputMode="numeric" value={a.amount} onChange={e=>setAdjAt(i,{amount:e.target.value})} placeholder="金額" style={{...inp,width:110}}/>
              <input value={a.reason||""} onChange={e=>setAdjAt(i,{reason:e.target.value})} placeholder="理由（例：消耗品購入）" style={{flex:1,minWidth:120,padding:"7px 10px",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:13,fontFamily:"inherit"}}/>
              <button onClick={()=>setAdj(p=>p.filter((_,k)=>k!==i))} style={{border:"none",background:"#fee2e2",color:"#dc2626",borderRadius:8,padding:"6px 10px",cursor:"pointer",fontWeight:700}}>✕</button>
            </div>
          ))}
          <button onClick={()=>setAdj(p=>[...p,{type:"out",amount:"",reason:""}])} style={{border:"1.5px dashed #94a3b8",background:"white",color:"#475569",borderRadius:8,padding:"6px 12px",cursor:"pointer",fontSize:12,fontWeight:700}}>＋ 入出金を追加</button>
        </div>
        {(inTotal>0||outTotal>0)&&<div style={{...row,fontSize:13,color:"#475569"}}><span>入金 {fmt(inTotal)} ／ 出金 {fmt(outTotal)}</span><span>{inTotal-outTotal>=0?"+":"−"}{fmt(Math.abs(inTotal-outTotal))}</span></div>}
        <div style={{...row,borderTop:"2px solid #1e3a5f",marginTop:8,paddingTop:10,fontSize:16,fontWeight:800,color:"#1e3a5f"}}>
          <span>あるべきレジ金</span><span>{fmt(expected)}</span>
        </div>
      </div>

      <div style={card}>
        <div style={h}>② 実際の現金を数える</div>
        {DENOMS.map(d=>(
          <div key={d} style={{display:"flex",alignItems:"center",gap:8,padding:"4px 0"}}>
            <span style={{width:84,fontWeight:700,fontSize:14}}>{d>=1000?`${d.toLocaleString()}円札`:`${d}円玉`}</span>
            <span style={{color:"#94a3b8"}}>×</span>
            <input type="number" inputMode="numeric" min="0" value={counts[d]===undefined?"":counts[d]} onChange={e=>setCounts(p=>({...p,[d]:e.target.value}))} placeholder="0" style={{...inp,width:90}}/>
            <span style={{color:"#94a3b8",fontSize:13}}>枚</span>
            <span style={{marginLeft:"auto",fontWeight:700,fontSize:14}}>{fmt(d*n(counts[d]))}</span>
          </div>
        ))}
        <div style={{...row,borderTop:"2px solid #1e3a5f",marginTop:8,paddingTop:10,fontSize:16,fontWeight:800,color:"#1e3a5f"}}>
          <span>実際の現金</span><span>{fmt(actual)}</span>
        </div>
      </div>

      <div style={{...card,border:"2px solid "+(!counted?"#e2e8f0":diff===0?"#059669":"#dc2626"),background:!counted?"white":diff===0?"#f0fdf4":"#fef2f2"}}>
        <div style={h}>③ 過不足</div>
        {!counted?<div style={{color:"#94a3b8",fontSize:13}}>現金の枚数を入力すると、ここに過不足が出ます。</div>:(
          <div style={{fontSize:22,fontWeight:800,color:diff===0?"#059669":"#dc2626"}}>
            {diff===0?"✅ ピッタリ合っています":(diff>0?`＋${diff.toLocaleString()}円 多い`:`−${Math.abs(diff).toLocaleString()}円 足りない`)}
          </div>
        )}
        {counted&&diff!==0&&<div style={{fontSize:12,color:"#64748b",marginTop:6}}>あるべきレジ金 {fmt(expected)} − 実際の現金 {fmt(actual)}。会計の金額修正・入出金の記入漏れがないか確認してください。</div>}
      </div>

      <div style={card}>
        <div style={h}>④ 締めたあとの現金</div>
        <div style={row}>
          <span>明日に残す釣銭準備金</span>
          <input type="number" inputMode="numeric" value={floatNext} onChange={e=>setFloatNext(e.target.value)} placeholder="0" style={inp}/>
        </div>
        <div style={{...row,fontWeight:800}}><span>持ち帰り・入金する現金（実際の現金 − 準備金）</span><span>{fmt(deposit)}</span></div>
        <textarea value={memo} onChange={e=>setMemo(e.target.value)} rows={2} placeholder="メモ（過不足の原因など）" style={{width:"100%",marginTop:8,padding:"8px 10px",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:13,fontFamily:"inherit",resize:"none"}}/>
      </div>

      <button onClick={save} disabled={saving} style={{width:"100%",padding:14,borderRadius:12,border:"none",background:"#1e3a5f",color:"white",fontSize:15,fontWeight:800,cursor:"pointer",fontFamily:"inherit",opacity:saving?0.6:1}}>
        {saving?"保存中...":(saved?"レジ締めを更新して保存":"レジ締めを保存")}
      </button>
      {msg&&<div style={{textAlign:"center",marginTop:10,fontSize:13,fontWeight:700,color:msg.startsWith("✅")?"#059669":"#dc2626"}}>{msg}</div>}
      </>)}
    </div>
  );
}

const REFUND_REASONS=["施術内容へのご不満","会計ミス（二重請求・金額誤り）","来院されなかった・キャンセル","体調不良等で施術中止","回数券・FPの返金","保険請求の訂正","その他"];
const REFUND_METHODS=["現金","カード","PayPay","その他"];

function RefundPanel({bookings,payments,refunds,allRefunds,stores,todayStr,user,isAdmin,onChanged,trainingMode}){
  const fmt=n=>"¥"+Number(n||0).toLocaleString();
  const firstStoreId=(stores&&stores[0]&&stores[0].id)||1;
  const [tab,setTab]=React.useState("register");
  const [q,setQ]=React.useState("");
  const [qDate,setQDate]=React.useState("");
  const [sel,setSel]=React.useState(null);
  const [amount,setAmount]=React.useState("");
  const [method,setMethod]=React.useState("現金");
  const [target,setTarget]=React.useState("自費");
  const [rdate,setRdate]=React.useState(todayStr);
  const [cat,setCat]=React.useState("");
  const [detail,setDetail]=React.useState("");
  const [approver,setApprover]=React.useState("");
  const [saving,setSaving]=React.useState(false);
  const [msg,setMsg]=React.useState("");
  // 履歴
  const [ym,setYm]=React.useState(todayStr.slice(0,7));
  const [hStore,setHStore]=React.useState(0);
  const [hReason,setHReason]=React.useState("");
  const [hQ,setHQ]=React.useState("");
  const [showVoided,setShowVoided]=React.useState(false);

  const bookingById=React.useMemo(()=>{const m={};bookings.forEach(b=>{m[b.id]=b;});return m;},[bookings]);
  const storeOf=p=>{const b=bookingById[p.booking_id];return (b&&b.store_id)||firstStoreId;};
  const storeName=id=>{const s=(stores||[]).find(x=>x.id===id);return s?s.name:"";};
  const staffName=id=>{const s=STAFF_ACCOUNTS.find(x=>x.id===id);return s?s.name:"—";};
  const refundedBy=React.useMemo(()=>{const m={};(refunds||[]).forEach(r=>{if(r.payment_id)m[r.payment_id]=(m[r.payment_id]||0)+(r.amount||0);});return m;},[refunds]);

  const candidates=React.useMemo(()=>{
    const kw=q.trim();
    return payments.filter(p=>{
      if(qDate&&p.payment_date!==qDate) return false;
      if(kw&&!String(p.patient_name||"").includes(kw)) return false;
      return (p.total_amount||0)>0;
    }).sort((a,b)=>String(b.payment_date).localeCompare(String(a.payment_date))||b.id-a.id).slice(0,40);
  },[payments,q,qDate]);

  function pick(p){
    const remain=(p.total_amount||0)-(refundedBy[p.id]||0);
    setSel(p);setAmount(String(Math.max(remain,0)));setMsg("");
    // 元の支払い方法の先頭をデフォルトに（例「カード:¥3,000」→カード）
    const first=String(p.payment_method||"").split("・")[0].split(":")[0].trim();
    setMethod(REFUND_METHODS.includes(first)?first:"現金");
    setTarget((p.jifee_amount||0)>0||(p.insurance_amount||0)===0?"自費":"保険窓口負担");
    setCat("");setDetail("");setApprover("");setRdate(todayStr);
  }

  async function submit(){
    if(!sel) return;
    const amt=parseInt(amount,10)||0;
    const remain=(sel.total_amount||0)-(refundedBy[sel.id]||0);
    if(amt<=0){setMsg("返金額を入力してください");return;}
    if(amt>remain){setMsg(`返金できる残り金額（${fmt(remain)}）を超えています`);return;}
    if(!cat){setMsg("返金の理由（分類）を選んでください");return;}
    if(detail.trim().length<5){setMsg("理由の詳細を5文字以上で具体的に書いてください（何が起きたか／誰が判断したか）");return;}
    if(!window.confirm(`${sel.patient_name}様\n${sel.payment_date}の会計 ${fmt(sel.total_amount)} のうち\n${fmt(amt)} を返金（売上マイナス）します。\n\n理由：${cat}\n${detail.trim()}\n\nよろしいですか？`)) return;
    setSaving(true);setMsg("");
    try{
      const b=bookingById[sel.booking_id];
      const row={
        payment_id:sel.id,booking_id:sel.booking_id||null,store_id:storeOf(sel),patient_name:sel.patient_name||null,
        refund_date:rdate,amount:amt,refund_method:method,target,reason_category:cat,reason_detail:detail.trim(),
        original_total:sel.total_amount||0,original_staff_id:(b&&b.staff_id)||sel.staff_id||null,
        processed_by:(user&&user.id)||null,processed_by_name:(user&&user.name)||null,approved_by:approver.trim()||null,
        is_training:!!trainingMode,
      };
      const res=await sb.insert("refunds",row);
      if(!Array.isArray(res)||!res[0]) throw new Error((res&&res.message)||"保存に失敗しました");
      setMsg("✅ 返金を記録しました（売上にマイナスで反映されます）");
      setSel(null);setDetail("");setCat("");
      if(onChanged) await onChanged();
    }catch(e){setMsg("保存に失敗しました："+(e.message||""));}
    setSaving(false);
  }

  async function voidRefund(r){
    const why=window.prompt(`この返金記録（${r.patient_name}様 ${fmt(r.amount)}）を取り消します。\n取り消す理由を入力してください（記録は残り、売上は元に戻ります）`);
    if(why===null) return;
    if(why.trim().length<3){window.alert("取り消し理由を入力してください");return;}
    try{
      await sb.update("refunds",r.id,{voided:true,void_reason:why.trim(),voided_by_name:(user&&user.name)||null,voided_at:new Date().toISOString()});
      if(onChanged) await onChanged();
    }catch(e){window.alert("取り消しに失敗しました："+(e.message||""));}
  }

  // ===== 履歴・分析 =====
  const hRows=React.useMemo(()=>{
    return (allRefunds||[]).filter(r=>!!r.is_training===!!trainingMode).filter(r=>{
      if(!String(r.refund_date||"").startsWith(ym)) return false;
      if(hStore&&r.store_id!==hStore) return false;
      if(hReason&&r.reason_category!==hReason) return false;
      if(hQ.trim()&&!String(r.patient_name||"").includes(hQ.trim())) return false;
      if(!showVoided&&r.voided) return false;
      return true;
    }).sort((a,b)=>String(b.refund_date).localeCompare(String(a.refund_date))||b.id-a.id);
  },[allRefunds,ym,hStore,hReason,hQ,showVoided,trainingMode]);
  const live=hRows.filter(r=>!r.voided);
  const refundTotal=live.reduce((s,r)=>s+(r.amount||0),0);
  const monthSales=React.useMemo(()=>{
    const ids=new Set(bookings.filter(b=>!hStore||(b.store_id||firstStoreId)===hStore).map(b=>b.id));
    return payments.filter(p=>String(p.payment_date||"").startsWith(ym)&&(!hStore||(p.booking_id?ids.has(p.booking_id):storeOf(p)===hStore))).reduce((s,p)=>s+(p.total_amount||0),0);
  },[payments,bookings,ym,hStore]);
  const byReason={},byStaff={},byProc={};
  live.forEach(r=>{
    byReason[r.reason_category]=(byReason[r.reason_category]||0)+(r.amount||0);
    const sn=r.original_staff_id?staffName(r.original_staff_id):"不明";
    (byStaff[sn]=byStaff[sn]||{n:0,a:0}).n++;byStaff[sn].a+=r.amount||0;
    const pn=r.processed_by_name||"不明";
    (byProc[pn]=byProc[pn]||{n:0,a:0}).n++;byProc[pn].a+=r.amount||0;
  });
  function shiftMonth(d){const [y,m]=ym.split("-").map(Number);const t=new Date(y,m-1+d,1);setYm(`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}`);}
  function csv(){
    const head=["返金日","患者名","店舗","元の会計日","元の会計額","返金額","返金方法","区分","理由分類","理由詳細","施術担当","処理者","確認者","取消","取消理由","記録日時"];
    const esc=v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`;
    const pById={};payments.forEach(p=>{pById[p.id]=p;});
    const lines=[head.map(esc).join(",")].concat(hRows.map(r=>{const p=pById[r.payment_id];return [r.refund_date,r.patient_name,storeName(r.store_id),p?p.payment_date:"",r.original_total,r.amount,r.refund_method,r.target,r.reason_category,r.reason_detail,r.original_staff_id?staffName(r.original_staff_id):"",r.processed_by_name,r.approved_by,r.voided?"取消":"",r.void_reason,(r.created_at||"").slice(0,16).replace("T"," ")].map(esc).join(",");}));
    const blob=new Blob(["﻿"+lines.join("\n")],{type:"text/csv"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`返金履歴_${ym}.csv`;a.click();
  }

  const card={background:"white",borderRadius:12,padding:"14px 16px",boxShadow:"0 1px 4px rgba(0,0,0,.06)",marginBottom:12};
  const h={fontSize:13,fontWeight:800,color:"#1e3a5f",marginBottom:10};
  const inp={padding:"7px 10px",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:13,fontFamily:"inherit"};
  const tabBtn=(id,label)=>(<button onClick={()=>setTab(id)} style={{padding:"8px 18px",borderRadius:10,border:"1.5px solid "+(tab===id?"#1e3a5f":"#e2e8f0"),background:tab===id?"#1e3a5f":"white",color:tab===id?"white":"#374151",fontWeight:800,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>{label}</button>);
  const remainOf=p=>(p.total_amount||0)-(refundedBy[p.id]||0);

  return(
    <div style={{maxWidth:900,margin:"0 auto"}}>
      <div style={{...card,display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
        <div style={{fontWeight:800,fontSize:16,color:"#1e3a5f",marginRight:8}}>↩️ 返金管理</div>
        {tabBtn("register","返金を登録")}{tabBtn("history","返金履歴・分析")}
      </div>

      {tab==="register"&&(<>
        <div style={card}>
          <div style={h}>① 返金する会計を探す</div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:10}}>
            <input value={q} onChange={e=>setQ(e.target.value)} placeholder="患者名で検索" style={{...inp,flex:1,minWidth:140}}/>
            <input type="date" value={qDate} onChange={e=>setQDate(e.target.value)} style={inp}/>
            {qDate&&<button onClick={()=>setQDate("")} style={{...inp,cursor:"pointer",background:"#f8fafc"}}>日付解除</button>}
          </div>
          <div style={{maxHeight:300,overflowY:"auto",border:"1px solid #e2e8f0",borderRadius:8}}>
            {candidates.length===0&&<div style={{padding:14,color:"#94a3b8",textAlign:"center",fontSize:13}}>該当する会計がありません</div>}
            {candidates.map(p=>{const b=bookingById[p.booking_id];const rem=remainOf(p);return(
              <div key={p.id} onClick={()=>pick(p)} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 12px",borderBottom:"1px solid #f1f5f9",cursor:"pointer",background:sel&&sel.id===p.id?"#eff6ff":"white",fontSize:13}}>
                <span style={{width:84,color:"#64748b"}}>{p.payment_date}</span>
                <b style={{flex:1}}>{p.patient_name}<span style={{fontWeight:500,color:"#94a3b8",marginLeft:6,fontSize:11}}>{b?b.menu:""}</span></b>
                <span>{fmt(p.total_amount)}</span>
                {(refundedBy[p.id]||0)>0&&<span style={{fontSize:11,color:"#dc2626",fontWeight:700}}>返金済 {fmt(refundedBy[p.id])}</span>}
                {rem<=0&&<span style={{fontSize:11,color:"#94a3b8"}}>全額返金済</span>}
              </div>);})}
          </div>
        </div>

        {sel&&(
        <div style={{...card,border:"2px solid #fecaca"}}>
          <div style={h}>② 返金内容と理由を記録</div>
          <div style={{fontSize:13,marginBottom:10,padding:"8px 10px",background:"#f8fafc",borderRadius:8}}>
            <b>{sel.patient_name}</b> 様／{sel.payment_date}／会計 {fmt(sel.total_amount)}（{sel.payment_method||"—"}）／施術担当：{staffName((bookingById[sel.booking_id]||{}).staff_id||sel.staff_id)}
            <div style={{color:"#64748b",fontSize:12,marginTop:2}}>返金できる残り：{fmt(remainOf(sel))}</div>
          </div>
          <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:10}}>
            <label style={{fontSize:12,fontWeight:700}}>返金額<br/><input type="number" inputMode="numeric" value={amount} onChange={e=>setAmount(e.target.value)} style={{...inp,width:130,textAlign:"right"}}/></label>
            <label style={{fontSize:12,fontWeight:700}}>返金方法<br/><select value={method} onChange={e=>setMethod(e.target.value)} style={inp}>{REFUND_METHODS.map(m=><option key={m}>{m}</option>)}</select></label>
            <label style={{fontSize:12,fontWeight:700}}>返金する部分<br/><select value={target} onChange={e=>setTarget(e.target.value)} style={inp}><option>自費</option><option>保険窓口負担</option></select></label>
            <label style={{fontSize:12,fontWeight:700}}>返金日<br/><input type="date" value={rdate} onChange={e=>setRdate(e.target.value)} style={inp}/></label>
          </div>
          <div style={{fontSize:12,fontWeight:700,marginBottom:4}}>理由（分類）<span style={{color:"#dc2626"}}> 必須</span></div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>
            {REFUND_REASONS.map(r=>(<button key={r} onClick={()=>setCat(r)} style={{padding:"6px 12px",borderRadius:20,border:"1.5px solid "+(cat===r?"#dc2626":"#e2e8f0"),background:cat===r?"#fee2e2":"white",color:cat===r?"#dc2626":"#374151",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{r}</button>))}
          </div>
          <div style={{fontSize:12,fontWeight:700,marginBottom:4}}>理由の詳細<span style={{color:"#dc2626"}}> 必須</span>（何が起きたか／対応内容／誰が判断したか）</div>
          <textarea value={detail} onChange={e=>setDetail(e.target.value)} rows={3} placeholder="例：施術後に痛みが強く出たとのことで、院長が確認のうえ本日分を全額返金。" style={{...inp,width:"100%",resize:"vertical",marginBottom:10}}/>
          <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"flex-end"}}>
            <label style={{fontSize:12,fontWeight:700,flex:1,minWidth:160}}>確認・承認した人（任意）<br/><input value={approver} onChange={e=>setApprover(e.target.value)} placeholder="例：岩永" style={{...inp,width:"100%"}}/></label>
            <div style={{fontSize:12,color:"#64748b"}}>処理者：<b>{(user&&user.name)||"—"}</b>（自動記録）</div>
          </div>
          <button onClick={submit} disabled={saving} style={{width:"100%",marginTop:12,padding:13,borderRadius:12,border:"none",background:"#dc2626",color:"white",fontSize:15,fontWeight:800,cursor:"pointer",fontFamily:"inherit",opacity:saving?0.6:1}}>{saving?"保存中...":"返金を記録する（売上をマイナス）"}</button>
        </div>)}
        {msg&&<div style={{textAlign:"center",marginBottom:12,fontSize:13,fontWeight:700,color:msg.startsWith("✅")?"#059669":"#dc2626"}}>{msg}</div>}
      </>)}

      {tab==="history"&&(<>
        <div style={{...card,display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
          <button onClick={()=>shiftMonth(-1)} style={{padding:"5px 12px",borderRadius:8,border:"1.5px solid #e2e8f0",background:"white",cursor:"pointer"}}>◀</button>
          <b style={{fontSize:14}}>{ym.replace("-","年")}月</b>
          <button onClick={()=>shiftMonth(1)} style={{padding:"5px 12px",borderRadius:8,border:"1.5px solid #e2e8f0",background:"white",cursor:"pointer"}}>▶</button>
          {stores&&stores.length>1&&<select value={hStore} onChange={e=>setHStore(Number(e.target.value))} style={inp}><option value={0}>全店舗</option>{stores.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</select>}
          <select value={hReason} onChange={e=>setHReason(e.target.value)} style={inp}><option value="">理由：すべて</option>{REFUND_REASONS.map(r=><option key={r}>{r}</option>)}</select>
          <input value={hQ} onChange={e=>setHQ(e.target.value)} placeholder="患者名" style={{...inp,width:110}}/>
          <label style={{fontSize:12,display:"flex",alignItems:"center",gap:4}}><input type="checkbox" checked={showVoided} onChange={e=>setShowVoided(e.target.checked)}/>取消分も表示</label>
          <button onClick={csv} disabled={hRows.length===0} style={{marginLeft:"auto",padding:"6px 14px",borderRadius:8,border:"1.5px solid #1e3a5f",background:"white",color:"#1e3a5f",fontWeight:800,fontSize:12,cursor:"pointer"}}>CSV出力</button>
        </div>

        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:10,marginBottom:12}}>
          {[["総売上（返金前）",fmt(monthSales),"#1e3a5f"],["返金合計",refundTotal>0?"−"+fmt(refundTotal):fmt(0),"#dc2626"],["純売上（返金後）",fmt(monthSales-refundTotal),"#059669"],["返金件数",live.length+"件","#475569"],["返金率",monthSales>0?(refundTotal/monthSales*100).toFixed(1)+"%":"-","#d97706"]].map(([l,v,c])=>(
            <div key={l} style={{background:"white",borderRadius:12,padding:"12px 14px",boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}><div style={{fontSize:11,color:"#64748b",fontWeight:700}}>{l}</div><div style={{fontSize:20,fontWeight:800,color:c}}>{v}</div></div>
          ))}
        </div>

        {live.length>0&&(
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(260px,1fr))",gap:10,marginBottom:12}}>
          <div style={card}>
            <div style={h}>理由別</div>
            {Object.keys(byReason).sort((a,b)=>byReason[b]-byReason[a]).map(k=>(
              <div key={k} style={{marginBottom:6,fontSize:12}}>
                <div style={{display:"flex",justifyContent:"space-between"}}><span>{k}</span><b>{fmt(byReason[k])}</b></div>
                <div style={{height:6,background:"#f1f5f9",borderRadius:3}}><div style={{height:6,borderRadius:3,background:"#ef4444",width:(byReason[k]/refundTotal*100)+"%"}}/></div>
              </div>))}
          </div>
          <div style={card}>
            <div style={h}>施術担当別（誰の会計が返金になったか）</div>
            {Object.keys(byStaff).sort((a,b)=>byStaff[b].a-byStaff[a].a).map(k=>(<div key={k} style={{display:"flex",justifyContent:"space-between",fontSize:13,padding:"3px 0"}}><span>{k}</span><span>{byStaff[k].n}件　<b>{fmt(byStaff[k].a)}</b></span></div>))}
          </div>
          <div style={card}>
            <div style={h}>処理者別（誰が返金操作したか）</div>
            {Object.keys(byProc).sort((a,b)=>byProc[b].a-byProc[a].a).map(k=>(<div key={k} style={{display:"flex",justifyContent:"space-between",fontSize:13,padding:"3px 0"}}><span>{k}</span><span>{byProc[k].n}件　<b>{fmt(byProc[k].a)}</b></span></div>))}
          </div>
        </div>)}

        <div style={card}>
          <div style={h}>返金の履歴（{hRows.length}件）</div>
          {hRows.length===0&&<div style={{color:"#94a3b8",textAlign:"center",padding:14,fontSize:13}}>この月の返金はありません</div>}
          {hRows.map(r=>(
            <div key={r.id} style={{borderTop:"1px solid #f1f5f9",padding:"10px 0",opacity:r.voided?0.5:1}}>
              <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap",fontSize:13}}>
                <span style={{color:"#64748b"}}>{r.refund_date}</span>
                <b style={{textDecoration:r.voided?"line-through":"none"}}>{r.patient_name}</b>
                <span style={{color:"#dc2626",fontWeight:800}}>−{fmt(r.amount)}</span>
                <span style={{fontSize:11,color:"#64748b"}}>（元の会計 {fmt(r.original_total)}／{r.refund_method}／{r.target}）</span>
                {stores&&stores.length>1&&<span style={{fontSize:11,color:"#94a3b8"}}>{storeName(r.store_id)}</span>}
                {r.voided&&<span style={{fontSize:11,fontWeight:800,color:"#475569",background:"#e2e8f0",borderRadius:8,padding:"1px 8px"}}>取消済</span>}
                {isAdmin&&!r.voided&&<button onClick={()=>voidRefund(r)} style={{marginLeft:"auto",border:"1px solid #e2e8f0",background:"white",borderRadius:6,fontSize:11,padding:"3px 8px",cursor:"pointer",color:"#64748b"}}>取り消す</button>}
              </div>
              <div style={{fontSize:12,marginTop:3}}><span style={{background:"#fee2e2",color:"#dc2626",fontWeight:700,borderRadius:8,padding:"1px 8px",marginRight:6}}>{r.reason_category}</span>{r.reason_detail}</div>
              <div style={{fontSize:11,color:"#94a3b8",marginTop:2}}>施術担当：{r.original_staff_id?staffName(r.original_staff_id):"不明"}／処理：{r.processed_by_name||"不明"}{r.approved_by?`／確認：${r.approved_by}`:""}／記録 {(r.created_at||"").slice(0,16).replace("T"," ")}{r.voided?`／取消理由：${r.void_reason||""}（${r.voided_by_name||""}）`:""}</div>
            </div>))}
        </div>
      </>)}
    </div>
  );
}

const LAUNCH_CATS=["広告・集客費","販促物（チラシ・看板等）","人件費","内装・設備","備品・消耗品","その他"];
const LAUNCH_AD_CATS=["広告・集客費","販促物（チラシ・看板等）"];
const LAUNCH_CHANNELS=["チラシ①","チラシ②","Threads","Instagram","Google検索","看板","通りがかり","紹介","その他"];

function LaunchROIPanel({bookings,payments,stores,todayStr,user,trainingMode}){
  const fmt=n=>"¥"+Math.round(Number(n)||0).toLocaleString();
  const pct=(a,b)=>b>0?(a/b*100).toFixed(1)+"%":"-";
  const firstStoreId=(stores&&stores[0]&&stores[0].id)||1;
  const [storeId,setStoreId]=React.useState(firstStoreId);
  const [start,setStart]=React.useState("2026-10-01");
  const [end,setEnd]=React.useState(todayStr);
  const [costs,setCosts]=React.useState([]);
  const [loading,setLoading]=React.useState(true);
  const [showGuide,setShowGuide]=React.useState(false);
  // 入力フォーム
  const [fDate,setFDate]=React.useState(todayStr);
  const [fCat,setFCat]=React.useState(LAUNCH_CATS[0]);
  const [fChannel,setFChannel]=React.useState("");
  const [fItem,setFItem]=React.useState("");
  const [fAmount,setFAmount]=React.useState("");
  const [fMemo,setFMemo]=React.useState("");
  const [saving,setSaving]=React.useState(false);
  const [msg,setMsg]=React.useState("");

  function loadCosts(){
    sb.select("launch_costs","?order=cost_date.desc,id.desc").then(r=>{setCosts(Array.isArray(r)?r:[]);setLoading(false);}).catch(()=>setLoading(false));
  }
  React.useEffect(()=>{loadCosts();},[]);

  async function addCost(){
    const amt=parseInt(fAmount,10);
    if(!fItem.trim()){setMsg("内容を入力してください");return;}
    if(!(amt>=0)){setMsg("金額を入力してください");return;}
    setSaving(true);setMsg("");
    try{
      const res=await sb.insert("launch_costs",{store_id:storeId,cost_date:fDate,category:fCat,channel:LAUNCH_AD_CATS.includes(fCat)&&fChannel?fChannel:null,item:fItem.trim(),amount:amt,memo:fMemo.trim()||null,created_by_name:(user&&user.name)||null,is_training:!!trainingMode});
      if(!Array.isArray(res)||!res[0]) throw new Error((res&&res.message)||"保存に失敗しました");
      setFItem("");setFAmount("");setFMemo("");setMsg("✅ 追加しました");loadCosts();
    }catch(e){setMsg("保存に失敗しました："+(e.message||""));}
    setSaving(false);
  }
  async function delCost(c){
    if(!window.confirm(`${c.item}（${fmt(c.amount)}）を削除しますか？`)) return;
    try{await sb.delete("launch_costs",c.id);setCosts(p=>p.filter(x=>x.id!==c.id));}catch(e){window.alert("削除に失敗しました");}
  }

  const calc=React.useMemo(()=>{
    const bookingById={};
    bookings.forEach(b=>{bookingById[b.id]=b;});
    const inStore=b=>(b.store_id||firstStoreId)===storeId;
    const key=b=>(b.phone||"")+"|"+(b.patient_name||"");
    // 店舗の会計（返金はマイナスの会計として含まれる）
    const pays=payments.filter(p=>{const b=bookingById[p.booking_id];return b&&inStore(b);});
    const real=pays.filter(p=>!p.is_refund);
    // 患者ごとの来院（会計済みの予約）
    const visitsBy={}; // key -> {dates:[...]}
    const seen=new Set();
    real.forEach(p=>{
      const b=bookingById[p.booking_id]; if(seen.has(b.id)) return; seen.add(b.id);
      (visitsBy[key(b)]=visitsBy[key(b)]||[]).push(p.payment_date||b.date);
    });
    Object.values(visitsBy).forEach(a=>a.sort());
    // 来院経路：その患者の予約のうち、最初に入力があったもの
    const channelBy={};
    bookings.filter(b=>inStore(b)&&b.how_know).sort((a,b)=>String(a.date).localeCompare(String(b.date))).forEach(b=>{
      const k=key(b); if(channelBy[k]) return;
      let c=String(b.how_know).trim(); if(c.startsWith("その他")) c="その他";
      channelBy[k]=c;
    });
    const inR=d=>d&&d>=start&&d<=end;
    const periodPays=pays.filter(p=>inR(p.payment_date));
    const sales=periodPays.reduce((s,p)=>s+(p.total_amount||0),0);
    const refunds=periodPays.filter(p=>p.is_refund).reduce((s,p)=>s+(p.total_amount||0),0);
    const periodReal=real.filter(p=>inR(p.payment_date));
    const visitCount=new Set(periodReal.map(p=>p.booking_id)).size;
    // 新患＝初めて会計した日が期間内の患者
    const newKeys=Object.keys(visitsBy).filter(k=>inR(visitsBy[k][0]));
    const returned=newKeys.filter(k=>visitsBy[k].length>=2);
    // 回数券・FP
    let passSales=0; const passBuyers=new Set();
    periodReal.forEach(p=>{(Array.isArray(p.jifee_items)?p.jifee_items:[]).forEach(it=>{
      if(/回数券|回券|フリーパス|FP/.test(String(it.label||""))){passSales+=parseInt(it.amount)||0;const b=bookingById[p.booking_id];if(b)passBuyers.add(key(b));}
    });});
    // 患者別の期間売上
    const salesByKey={};
    periodPays.forEach(p=>{const b=bookingById[p.booking_id];if(!b) return;const k=key(b);salesByKey[k]=(salesByKey[k]||0)+(p.total_amount||0);});
    // 費用（期間終了日までに発生した全額＝開業前の投資も含む）
    const storeCosts=costs.filter(c=>(c.store_id||firstStoreId)===storeId&&!!c.is_training===!!trainingMode&&c.cost_date<=end);
    const costTotal=storeCosts.reduce((s,c)=>s+(c.amount||0),0);
    const byCat={};storeCosts.forEach(c=>{byCat[c.category]=(byCat[c.category]||0)+(c.amount||0);});
    const adCost=LAUNCH_AD_CATS.reduce((s,c)=>s+(byCat[c]||0),0);
    // チャネル別
    const ch={};
    const ensure=n=>(ch[n]=ch[n]||{newN:0,sales:0,cost:0});
    newKeys.forEach(k=>{const n=channelBy[k]||"不明（未入力）";const e=ensure(n);e.newN++;e.sales+=salesByKey[k]||0;});
    storeCosts.forEach(c=>{if(c.channel) ensure(c.channel).cost+=c.amount||0;});
    // 営業日あたり売上（直近＝期間内で会計のあった日数で割る）
    const days=new Set(periodPays.filter(p=>!p.is_refund).map(p=>p.payment_date)).size;
    return {sales,refunds,visitCount,newCount:newKeys.length,returnedCount:returned.length,passSales,passBuyerCount:passBuyers.size,
      costTotal,byCat,adCost,ch,days,storeCosts,
      avgVisits:newKeys.length?newKeys.reduce((s,k)=>s+visitsBy[k].length,0)/newKeys.length:0};
  },[bookings,payments,costs,storeId,start,end,trainingMode,firstStoreId]);

  const profit=calc.sales-calc.costTotal;
  const recov=pct(calc.sales,calc.costTotal);
  const perDay=calc.days>0?calc.sales/calc.days:0;
  const remain=Math.max(0,calc.costTotal-calc.sales);
  const daysToRecover=perDay>0&&remain>0?Math.ceil(remain/perDay):0;
  const cac=calc.newCount>0?calc.adCost/calc.newCount:0;
  const cacAll=calc.newCount>0?calc.costTotal/calc.newCount:0;
  const unit=calc.visitCount>0?calc.sales/calc.visitCount:0;

  const card={background:"white",borderRadius:12,padding:"14px 16px",boxShadow:"0 1px 4px rgba(0,0,0,.06)",marginBottom:12};
  const h={fontSize:13,fontWeight:800,color:"#1e3a5f",marginBottom:10};
  const inp={padding:"7px 10px",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:13,fontFamily:"inherit"};
  const Kpi=({l,v,sub,c})=>(<div style={{background:"white",borderRadius:12,padding:"12px 14px",boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}><div style={{fontSize:11,color:"#64748b",fontWeight:700}}>{l}</div><div style={{fontSize:20,fontWeight:800,color:c||"#1e3a5f",marginTop:2}}>{v}</div>{sub&&<div style={{fontSize:11,color:"#94a3b8",marginTop:2}}>{sub}</div>}</div>);
  const grid={display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(170px,1fr))",gap:10,marginBottom:12};
  const preset=(l,s,e)=>(<button key={l} onClick={()=>{setStart(s);setEnd(e);}} style={{...inp,cursor:"pointer",background:start===s&&end===e?"#1e3a5f":"white",color:start===s&&end===e?"white":"#374151",fontWeight:700}}>{l}</button>);
  const chNames=Object.keys(calc.ch).sort((a,b)=>calc.ch[b].newN-calc.ch[a].newN);

  return(
    <div style={{maxWidth:980,margin:"0 auto"}}>
      <div style={{...card,display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
        <div style={{fontWeight:800,fontSize:16,color:"#1e3a5f"}}>📈 開業の費用対効果</div>
        {stores&&stores.length>1&&<select value={storeId} onChange={e=>setStoreId(Number(e.target.value))} style={inp}>{stores.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</select>}
        {preset("プレオープン","2026-10-01","2026-10-04")}
        {preset("開業〜今日","2026-10-05",todayStr)}
        {preset("10/1〜今日","2026-10-01",todayStr)}
        <span style={{display:"flex",gap:4,alignItems:"center",fontSize:12}}><input type="date" value={start} onChange={e=>e.target.value&&setStart(e.target.value)} style={inp}/>〜<input type="date" value={end} onChange={e=>e.target.value&&setEnd(e.target.value)} style={inp}/></span>
        <button onClick={()=>setShowGuide(v=>!v)} style={{...inp,marginLeft:"auto",cursor:"pointer",background:"#eff6ff",color:"#1d4ed8",fontWeight:700}}>{showGuide?"▲ 数字の見方を閉じる":"❓ どの数字を見ればいい？"}</button>
      </div>

      {showGuide&&(
      <div style={{...card,background:"#f8fafc",fontSize:13,lineHeight:1.8,color:"#334155"}}>
        <div style={h}>立ち上げ期に見るべき数字（上から順に見ると流れが分かります）</div>
        <div><b>① 回収率・損益</b>…かけた費用に対して、売上でどれだけ取り戻せたか。100%を超えると費用は回収済み。ただし売上＝利益ではない（家賃・人件費・原価は別）ので、あくまで「投資を回収できているか」の目安です。</div>
        <div><b>② 新患獲得単価</b>…広告・販促費 ÷ 新患数。「1人の新規患者を連れてくるのにいくらかかったか」。この数字が、1人の患者様が生む売上（客単価×通院回数）より低ければ、広告は採算が合っています。</div>
        <div><b>③ チャネル別（チラシ・Threads等）</b>…どの集客手段が効いているか。費用が小さく新患が多い手段に予算を寄せ、効かない手段はやめる判断に使います。※費用の入力時に集客チャネルを選ぶと出ます。</div>
        <div><b>④ 2回目来院率・平均通院回数</b>…一度来た方が通ってくれているか。立ち上げは「来てもらう」より「通ってもらう」ほうが収益に効きます。ここが低いと広告を増やしても赤字が膨らみます。</div>
        <div><b>⑤ 客単価・回数券/FP購入率</b>…1回あたりの売上と、継続前提の購入（回数券・フリーパス）がどれだけ出ているか。購入額は先に入る売上で、通院の定着にもつながります。</div>
        <div><b>⑥ 回収までの目安日数</b>…今の売上ペースがこのまま続いた場合、あと何営業日で費用を回収できるか。</div>
        <div style={{color:"#64748b",marginTop:6}}>費用は「期間の終了日までに登録した全額」を投資額として扱います（開業前の内装費や広告費も入れられます）。人件費は月ごとなど、まとめて1行で入力して構いません。</div>
      </div>)}

      <div style={grid}>
        <Kpi l="総投資額（費用合計）" v={fmt(calc.costTotal)} sub={`広告・販促 ${fmt(calc.adCost)}`}/>
        <Kpi l="期間の売上（返金後）" v={fmt(calc.sales)} sub={calc.refunds<0?`返金 ${fmt(calc.refunds)} を含む`:`会計${calc.visitCount}件`} c="#059669"/>
        <Kpi l="回収率（売上÷費用）" v={recov} sub={profit>=0?`費用を ${fmt(profit)} 上回る`:`あと ${fmt(remain)} で回収`} c={profit>=0?"#059669":"#d97706"}/>
        <Kpi l="売上−費用" v={(profit<0?"−":"")+fmt(Math.abs(profit))} sub="利益ではなく投資回収の目安" c={profit>=0?"#059669":"#dc2626"}/>
        <Kpi l="回収までの目安" v={remain<=0?"回収済み":(daysToRecover>0?`あと約${daysToRecover}営業日`:"-")} sub={perDay>0?`1営業日あたり売上 ${fmt(perDay)}`:"売上データなし"}/>
      </div>

      <div style={grid}>
        <Kpi l="新患数（期間内に初来院）" v={calc.newCount+"人"} sub={`来院（会計）${calc.visitCount}件`}/>
        <Kpi l="新患獲得単価（広告・販促費÷新患）" v={calc.newCount>0&&calc.adCost>0?fmt(cac):"-"} sub={calc.newCount>0?`総費用ベース ${fmt(cacAll)}／人`:""}/>
        <Kpi l="2回目来院率（新患のうち）" v={pct(calc.returnedCount,calc.newCount)} sub={`${calc.returnedCount}/${calc.newCount}人が再来院`}/>
        <Kpi l="新患の平均通院回数" v={calc.avgVisits.toFixed(1)+"回"}/>
        <Kpi l="客単価（売上÷来院）" v={fmt(unit)}/>
        <Kpi l="回数券・FP" v={fmt(calc.passSales)} sub={`購入 ${calc.passBuyerCount}人（来院の${pct(calc.passBuyerCount,calc.visitCount)}）`}/>
      </div>

      <div style={card}>
        <div style={h}>集客チャネル別（来院経路 × 費用）</div>
        {chNames.length===0?<div style={{fontSize:13,color:"#94a3b8"}}>この期間の新患データがありません</div>:(
        <div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
          <thead><tr style={{background:"#f1f5f9",color:"#475569"}}>{["チャネル","新患数","費用","新患獲得単価","新患の売上","費用対効果(売上÷費用)"].map(t=><th key={t} style={{padding:"6px 8px",textAlign:t==="チャネル"?"left":"right",whiteSpace:"nowrap"}}>{t}</th>)}</tr></thead>
          <tbody>{chNames.map(n=>{const e=calc.ch[n];return(<tr key={n} style={{borderTop:"1px solid #f1f5f9"}}>
            <td style={{padding:"6px 8px",fontWeight:700}}>{n}</td>
            <td style={{padding:"6px 8px",textAlign:"right"}}>{e.newN}人</td>
            <td style={{padding:"6px 8px",textAlign:"right"}}>{e.cost>0?fmt(e.cost):"-"}</td>
            <td style={{padding:"6px 8px",textAlign:"right"}}>{e.cost>0&&e.newN>0?fmt(e.cost/e.newN):"-"}</td>
            <td style={{padding:"6px 8px",textAlign:"right"}}>{fmt(e.sales)}</td>
            <td style={{padding:"6px 8px",textAlign:"right",fontWeight:800,color:e.cost>0&&e.sales>=e.cost?"#059669":"#475569"}}>{e.cost>0?(e.sales/e.cost*100).toFixed(0)+"%":"-"}</td>
          </tr>);})}</tbody>
        </table></div>)}
        <div style={{fontSize:11,color:"#94a3b8",marginTop:6}}>来院経路は予約時・問診票の「何を見て来院したか」の回答です。費用は、入力時にチャネルを選んだ分だけがここに入ります。</div>
      </div>

      <div style={card}>
        <div style={h}>費用の内訳</div>
        {Object.keys(calc.byCat).length===0&&<div style={{fontSize:13,color:"#94a3b8"}}>まだ費用が登録されていません。下のフォームから追加してください。</div>}
        {Object.keys(calc.byCat).sort((a,b)=>calc.byCat[b]-calc.byCat[a]).map(k=>(
          <div key={k} style={{marginBottom:6,fontSize:13}}>
            <div style={{display:"flex",justifyContent:"space-between"}}><span>{k}</span><b>{fmt(calc.byCat[k])}<span style={{fontWeight:500,color:"#94a3b8",marginLeft:6}}>{pct(calc.byCat[k],calc.costTotal)}</span></b></div>
            <div style={{height:6,background:"#f1f5f9",borderRadius:3}}><div style={{height:6,borderRadius:3,background:"#3b82f6",width:(calc.byCat[k]/calc.costTotal*100)+"%"}}/></div>
          </div>))}
      </div>

      <div style={card}>
        <div style={h}>費用を追加</div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:8}}>
          <label style={{fontSize:12,fontWeight:700}}>日付<br/><input type="date" value={fDate} onChange={e=>setFDate(e.target.value)} style={inp}/></label>
          <label style={{fontSize:12,fontWeight:700}}>種類<br/><select value={fCat} onChange={e=>setFCat(e.target.value)} style={inp}>{LAUNCH_CATS.map(c=><option key={c}>{c}</option>)}</select></label>
          {LAUNCH_AD_CATS.includes(fCat)&&<label style={{fontSize:12,fontWeight:700}}>集客チャネル<br/><select value={fChannel} onChange={e=>setFChannel(e.target.value)} style={inp}><option value="">（選ばない）</option>{LAUNCH_CHANNELS.map(c=><option key={c}>{c}</option>)}</select></label>}
          <label style={{fontSize:12,fontWeight:700,flex:1,minWidth:150}}>内容<br/><input value={fItem} onChange={e=>setFItem(e.target.value)} placeholder="例：チラシ①印刷・配布" style={{...inp,width:"100%"}}/></label>
          <label style={{fontSize:12,fontWeight:700}}>金額（円）<br/><input type="number" inputMode="numeric" value={fAmount} onChange={e=>setFAmount(e.target.value)} style={{...inp,width:120,textAlign:"right"}}/></label>
        </div>
        <input value={fMemo} onChange={e=>setFMemo(e.target.value)} placeholder="メモ（任意）" style={{...inp,width:"100%",marginBottom:8}}/>
        <button onClick={addCost} disabled={saving} style={{width:"100%",padding:11,borderRadius:10,border:"none",background:"#1e3a5f",color:"white",fontWeight:800,fontSize:14,cursor:"pointer",opacity:saving?0.6:1}}>{saving?"保存中...":"＋ 費用を追加"}</button>
        {msg&&<div style={{textAlign:"center",marginTop:8,fontSize:13,fontWeight:700,color:msg.startsWith("✅")?"#059669":"#dc2626"}}>{msg}</div>}
      </div>

      <div style={card}>
        <div style={h}>登録済みの費用（{calc.storeCosts.length}件）</div>
        {loading&&<div style={{color:"#94a3b8",fontSize:13}}>読み込み中...</div>}
        {calc.storeCosts.map(c=>(
          <div key={c.id} style={{display:"flex",alignItems:"center",gap:8,borderTop:"1px solid #f1f5f9",padding:"7px 0",fontSize:13,flexWrap:"wrap"}}>
            <span style={{color:"#64748b",width:84}}>{c.cost_date}</span>
            <span style={{fontSize:11,background:"#eff6ff",color:"#1d4ed8",borderRadius:8,padding:"1px 8px"}}>{c.category}</span>
            {c.channel&&<span style={{fontSize:11,background:"#fef3c7",color:"#92400e",borderRadius:8,padding:"1px 8px"}}>{c.channel}</span>}
            <span style={{flex:1,minWidth:120}}>{c.item}{c.memo&&<span style={{color:"#94a3b8",fontSize:11,marginLeft:6}}>{c.memo}</span>}</span>
            <b>{fmt(c.amount)}</b>
            <button onClick={()=>delCost(c)} style={{border:"1px solid #e2e8f0",background:"white",borderRadius:6,fontSize:11,padding:"2px 8px",cursor:"pointer",color:"#64748b"}}>削除</button>
          </div>))}
      </div>
    </div>
  );
}
