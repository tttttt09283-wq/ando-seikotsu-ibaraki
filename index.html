}
function Dashboard({user,onLogout}){
  const [allBookings,setAllBookings]=React.useState([]);
  const [breaks,setBreaks]=React.useState([]);
  const [loading,setLoading]=React.useState(true);
  // トレーニングモード：ONの間に作られた予約・会計は「練習用」として分析・KPIに一切カウントされない
  const [trainingMode,setTrainingMode]=React.useState(()=>{
    try{ return localStorage.getItem("ando_training_mode")==="1"; }catch(e){ return false; }
  });
  function toggleTrainingMode(){
    setTrainingMode(prev=>{
      const next=!prev;
      try{ localStorage.setItem("ando_training_mode", next?"1":"0"); }catch(e){}
      return next;
    });
  }
  // カレンダーに「現在時刻」の縦線を表示するための時計。30秒ごとに更新してバーを動かす。
  const [nowTick,setNowTick]=React.useState(()=>new Date());
  React.useEffect(()=>{
    const timer=setInterval(()=>setNowTick(new Date()),30000);
    return ()=>clearInterval(timer);
  },[]);
  // 今の表示モードに応じて、実データと練習データを出し分ける
  // （以降のコード全体で使う"bookings"は、常にこのフィルタ後の値。生データはallBookings/allPaymentsとして残す）
  // ※KPI・売上・患者一覧などの「集計系」画面は、本番・練習の数字が絶対に混ざらないよう、必ずこの"bookings"（同モードのみ）を使うこと。
  const bookings=React.useMemo(()=>allBookings.filter(b=>!!b.is_training===trainingMode),[allBookings,trainingMode]);
  // カレンダー表示・ダブルブッキング判定・来院履歴の回数表示など「実際の予約状況を見ながら練習する」ための画面だけは、
  // トレーニングモード中も本番予約（is_training:false）を一緒に表示する（背景として見えるだけで、編集・キャンセル・会計等の書き込みは別途ガードして本番データを一切変更させない）。
  // トレーニングモードOFF時はbookingsと同じ（本番のみ）になる。
  const calendarBookings=React.useMemo(()=>trainingMode?allBookings:bookings,[trainingMode,allBookings,bookings]);
  const [view,setViewRaw]=React.useState(()=>{
    try{
      const saved=localStorage.getItem("ando_admin_last_view");
      // 「新規予約フォーム」は編集中データが保存されていないため、そのまま復元すると壊れた画面になる。
      // その場合はカレンダーへ戻す。
      return (saved&&saved!=="form")?saved:"calendar";
    }catch(e){ return "calendar"; }
  });
  const [collapsedGroups,setCollapsedGroups]=React.useState(()=>{
    // サイドバーがごちゃつかないよう、今開いている画面のグループだけ最初から展開しておく
    try{
      const saved=localStorage.getItem("ando_admin_collapsed_groups");
      if(saved) return JSON.parse(saved);
    }catch(e){}
    return {};
  });
  function toggleGroup(groupId){
    setCollapsedGroups(prev=>{
      const next={...prev,[groupId]:!prev[groupId]};
      try{localStorage.setItem("ando_admin_collapsed_groups",JSON.stringify(next));}catch(e){}
      return next;
    });
  }
  // 画面を切り替えるたびに、ブラウザの更新（リロード）後も同じ画面に戻れるよう記憶しておく
  function setView(v){
    setViewRaw(v);
    try{ localStorage.setItem("ando_admin_last_view",v); }catch(e){}
  }
  const [selStaff,setSelStaff]=React.useState(null);
  const [weekViewMode,setWeekViewMode]=React.useState("calendar"); // "calendar" | "list"
  const [baseDate,setBaseDate]=React.useState(today);
  const [form,setForm]=React.useState(null);
  const [editId,setEditId]=React.useState(null);
  const [conflict,setConflict]=React.useState(false);
  const [toast,setToast]=React.useState(null);
  const [delConfirm,setDelConfirm]=React.useState(null);
  const [cancelModalBooking,setCancelModalBooking]=React.useState(null);
  const [showMenu,setShowMenu]=React.useState(false);
  const [showBreakModal,setShowBreakModal]=React.useState(false);
  const [viewIntake,setViewIntake]=React.useState(null);
  const [bookingPopup,setBookingPopup]=React.useState(null); // {booking, x, y}
  const [iframeModal,setIframeModal]=React.useState(null); // {url, title} | null

  // intake.html / pos.html から「モーダルを閉じて」というメッセージを受け取る
  // （pos.htmlの「次回予約」で日付を指定してカレンダーの空き状況を確認したい場合は、
  //   モーダルを閉じたうえでその日付のカレンダー表示へ切り替える）
  React.useEffect(()=>{
    function onMessage(e){
      if(e.data&&e.data.type==="closeIframeModal"){
        setIframeModal(null);
      }
      if(e.data&&e.data.type==="goToCalendarDate"&&e.data.date){
        setIframeModal(null);
        setBaseDate(new Date(e.data.date+"T00:00:00"));
        setView("calendar");
      }
    }
    window.addEventListener("message",onMessage);
    return ()=>window.removeEventListener("message",onMessage);
  },[]);

  // 単独タブでpos.htmlの「カレンダーで確認」から開かれた場合（index.html?gotodate=YYYY-MM-DD）、
  // 起動時に一度だけその日付のカレンダーへ切り替える
  React.useEffect(()=>{
    try{
      const params=new URLSearchParams(location.search);
      const gotodate=params.get("gotodate");
      if(gotodate){
        setBaseDate(new Date(gotodate+"T00:00:00"));
        setView("calendar");
        params.delete("gotodate");
        const newSearch=params.toString();
        history.replaceState(null,"",location.pathname+(newSearch?`?${newSearch}`:""));
      }
    }catch(e){}
  },[]);
  const [timePickerPopup,setTimePickerPopup]=React.useState(null); // {date, staffId, x, y, centerTime}
  const [dragBooking,setDragBooking]=React.useState(null); // ドラッグ中の予約（開始〜終了までしか変化しない）
  const [dragPos,setDragPos]=React.useState({x:0,y:0,moved:false}); // 見た目の追従用（頻繁に変化する）
  const dragPosRef=React.useRef({x:0,y:0,startX:0,startY:0,moved:false});
  const [resizeBooking,setResizeBooking]=React.useState(null); // 右端ドラッグで時間調整中の予約
  const [resizeBreak,setResizeBreak]=React.useState(null); // 右端ドラッグで長さ調整中の休憩
  const [resizeBreakDeltaPx,setResizeBreakDeltaPx]=React.useState(0);
  const [resizeDeltaPx,setResizeDeltaPx]=React.useState(0); // 見た目の追従用（横方向の移動量）
  const resizeRef=React.useRef({startX:0,deltaPx:0});
  const [historyPatient,setHistoryPatient]=React.useState(null);
  const [allPayments,setAllPayments]=React.useState([]);
  const [allRefunds,setAllRefunds]=React.useState([]);
  const payments=React.useMemo(()=>allPayments.filter(p=>!!p.is_training===trainingMode),[allPayments,trainingMode]);
  // 返金（取消されていないもの）。売上集計では「返金日にマイナスの会計」として扱う
  const refunds=React.useMemo(()=>allRefunds.filter(r=>!r.voided&&!!r.is_training===trainingMode),[allRefunds,trainingMode]);
  const paymentsNet=React.useMemo(()=>{
    if(refunds.length===0) return payments;
    const rows=refunds.map(r=>({
      id:"refund_"+r.id,is_refund:true,booking_id:r.booking_id,patient_name:r.patient_name,payment_date:r.refund_date,
      total_amount:-(r.amount||0),insurance_amount:r.target==="自費"?0:-(r.amount||0),jifee_amount:r.target==="自費"?-(r.amount||0):0,
      staff_id:r.original_staff_id,payment_method:null,refund_method:r.refund_method,is_training:r.is_training,
    }));
    return [...payments,...rows];
  },[payments,refunds]);
  async function reloadRefunds(){
    try{const r=await sb.select("refunds","?order=refund_date.desc,id.desc");setAllRefunds(Array.isArray(r)?r:[]);}catch(e){}
  }
  const [businessHours,setBusinessHours]=React.useState([]);
  const [closures,setClosures]=React.useState([]);
  const [stores,setStores]=React.useState([]);
  const [selStoreId,setSelStoreId]=React.useState(null);
  const [weeklyShifts,setWeeklyShifts]=React.useState([]); // 全スタッフの週固定シフト
  const [dateOverrides,setDateOverrides]=React.useState([]); // 特定日だけの出勤・休み変更（staff_date_overrides）
  const [staffStoreMap,setStaffStoreMap]=React.useState({}); // {staffId: [storeIds]}
  const [staffMenuMap,setStaffMenuMap]=React.useState({}); // {staffId: [対応可能メニュー名] | undefined(=全メニュー対応)}
  const [staffLaneMap,setStaffLaneMap]=React.useState({}); // {staffId: 同時受付レーン数（未設定は1）}
  const [customMenus,setCustomMenus]=React.useState([]); // 「メニュー・コース管理」で追加された有効なメニュー一覧
  const [staffVersion,setStaffVersion]=React.useState(0); // STAFF_ACCOUNTS（動的マージ）が更新されたら再描画するためのトリガー
  const [eventDateRange,setEventDateRange]=React.useState({start:"",end:""}); // イベント開催期間（応援スタッフの表示判定に使用）

  const isAdmin=user.role==="admin";
  const todayStr=fmtDate(today);

  function getLaneCount(staffId){
    return staffLaneMap[staffId]||1;
  }

  // ===== カレンダーの表示状態（見ている日付・店舗・スタッフ）をPCとスマホなど別端末間で連動させる =====
  // 同じログインユーザーが別の端末で見ている表示を、Supabaseのadmin_view_stateテーブルに保存しておき、
  // 30秒ごとの自動更新（fetchAll）のタイミングで他端末での変更を取り込む。予約データ本体には一切影響しない。
  const viewStateSyncRef=React.useRef({loaded:false,applyingRemote:false,lastWritten:null});
  // selStoreId===nullは「全店舗」表示を表す正当な値なので、初期デフォルト店舗の割り当ては一度だけ行う
  const storeIdInitRef=React.useRef(false);
  // fetchAllはマウント時に一度だけ登録したsetIntervalから繰り返し呼ばれるため、
  // その時点のbaseDate等を直接読むと古い値のままになってしまう。常に最新の値を読めるようrefで持っておく。
  const currentViewRef=React.useRef({baseDate,selStoreId,selStaff});
  React.useEffect(()=>{ currentViewRef.current={baseDate,selStoreId,selStaff}; },[baseDate,selStoreId,selStaff]);

  async function writeViewState(values){
    if(!user||!user.id) return;
    const payload={user_id:user.id,base_date:values.base_date,sel_store_id:values.sel_store_id,sel_staff:values.sel_staff,updated_at:new Date().toISOString()};
    viewStateSyncRef.current.lastWritten=payload;
    try{
      const token=(await supabaseClient.auth.getSession()).data.session?.access_token||SUPABASE_ANON_KEY;
      await fetch(`${SUPABASE_URL}/rest/v1/admin_view_state?on_conflict=user_id`,{
        method:"POST",
        headers:{apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${token}`,"Content-Type":"application/json",Prefer:"resolution=merge-duplicates"},
        body:JSON.stringify(payload),
      });
    }catch(e){ console.error("表示状態の保存に失敗しました",e); }
  }

  async function syncViewStateFromServer(){
    if(!user||!user.id) return;
    try{
      const rows=await sb.select("admin_view_state",`?user_id=eq.${user.id}&limit=1`);
      const row=Array.isArray(rows)&&rows.length>0?rows[0]:null;
      if(row){
        const last=viewStateSyncRef.current.lastWritten;
        // 自分がこれまでに書き込んだ内容と同じ（＝他端末からの変更ではない）場合は何もしない
        if(!last||last.updated_at!==row.updated_at){
          viewStateSyncRef.current.applyingRemote=true;
          storeIdInitRef.current=true; // 他端末の値を適用したので、以後デフォルト店舗の上書きは行わない
          if(row.base_date) setBaseDate(new Date(row.base_date+"T00:00:00"));
          setSelStoreId(row.sel_store_id===undefined?null:row.sel_store_id);
          setSelStaff(row.sel_staff===undefined?null:row.sel_staff);
          viewStateSyncRef.current.lastWritten={base_date:row.base_date,sel_store_id:row.sel_store_id,sel_staff:row.sel_staff,updated_at:row.updated_at};
          setTimeout(()=>{viewStateSyncRef.current.applyingRemote=false;},0);
        }
      }else if(!viewStateSyncRef.current.loaded){
        // まだ誰の表示状態も保存されていない＝初回。今見ている内容をそのまま保存しておく
        const v=currentViewRef.current;
        writeViewState({base_date:fmtDate(v.baseDate),sel_store_id:v.selStoreId,sel_staff:v.selStaff});
      }
    }catch(e){ console.error("表示状態の取得に失敗しました",e); }
    viewStateSyncRef.current.loaded=true;
  }

  async function changeLaneCount(staffId,delta){
    const next=Math.max(1,Math.min(6,getLaneCount(staffId)+delta));
    setStaffLaneMap(prev=>({...prev,[staffId]:next})); // 即座に画面へ反映
    try{
      const token=(await supabaseClient.auth.getSession()).data.session?.access_token||SUPABASE_ANON_KEY;
      await fetch(`${SUPABASE_URL}/rest/v1/clinic_staff?id=eq.${staffId}`,{
        method:"PATCH",
        headers:{apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${token}`,"Content-Type":"application/json"},
        body:JSON.stringify({lane_count:next}),
      });
    }catch(e){
      console.error("レーン数の保存に失敗しました",e);
    }
  }

  async function fetchAll(){
    reloadRefunds();
    // PC・スマホなど別端末で見ている表示（日付・店舗・スタッフ）との連動チェックも、
    // このfetchAllの30秒ごとの自動更新に相乗りさせる（他の通信を止めないようawaitはしない）
    syncViewStateFromServer();
    try{
      const [b,br,py,st,ws,cs,mn,dov]=await Promise.all([sb.select("bookings","?order=date.asc,time.asc"),sb.select("staff_breaks","?order=date.asc,time.asc"),sb.select("payments","?order=payment_date.desc"),sb.select("stores","?order=id.asc"),sb.select("staff_weekly_shifts","?order=staff_id.asc,day_of_week.asc"),sb.select("clinic_staff","?select=id,store_ids,allowed_menus,lane_count,name,email,password,role,color,initial,event_only"),sb.select("menus","?active=eq.true&order=display_order.asc,id.asc"),sb.select("staff_date_overrides","?order=date.asc")]);
      setAllBookings(Array.isArray(b)?b:[]);setBreaks(Array.isArray(br)?br:[]);setAllPayments(Array.isArray(py)?py:[]);
      const storeList=Array.isArray(st)?st:[];
      setStores(storeList);
      // selStoreId===nullは「全店舗」を意味する正当な値なので、初回（まだ一度もセットされていない時）だけ
      // デフォルト店舗を入れる。ここを毎回のポーリングで行うと、ユーザーが意図的に選んだ「全店舗」表示が
      // 30秒ごとに勝手に特定店舗へ戻ってしまい、他端末の表示との連動が壊れて見える原因になっていた。
      if(!storeIdInitRef.current){
        storeIdInitRef.current=true;
        setSelStoreId(prev=>prev!==null?prev:(storeList.length>0?storeList[0].id:1));
      }
      setWeeklyShifts(Array.isArray(ws)?ws:[]);
      setDateOverrides(Array.isArray(dov)?dov:[]);
      // イベント開催期間を取得（応援スタッフの表示判定用。店舗が複数ある場合は先頭店舗の設定を使う）
      if(storeList.length>0){
        sb.select("store_settings",`?store_id=eq.${storeList[0].id}&order=updated_at.desc.nullslast,id.desc&limit=1`)
          .then(rows=>{
            if(Array.isArray(rows)&&rows.length>0){
              setEventDateRange({start:rows[0].event_start_date||"",end:rows[0].event_end_date||""});
            }
          }).catch(()=>{});
      }
      const map={};
      const menuMap={};
      const laneMap={};
      if(Array.isArray(cs)) cs.forEach(row=>{
        if(row.store_ids) map[row.id]=row.store_ids;
        if(row.allowed_menus) menuMap[row.id]=row.allowed_menus;
        if(row.lane_count) laneMap[row.id]=row.lane_count;
      });
      setStaffStoreMap(map);
      setStaffMenuMap(menuMap);
      setStaffLaneMap(laneMap);
      // 「スタッフ・シフト管理」→「スタッフを追加」で登録されたスタッフを、
      // ハードコードされた基本スタッフ一覧に自動でマージする（コード修正なしでカレンダー等に反映される）
      updateStaffAccounts(Array.isArray(cs)?cs:[]);
      setStaffVersion(v=>v+1);
      // 「メニュー・コース管理」で追加されたメニューを、既存のハードコードされたメニュー一覧にマージする。
      // これにより、新しく登録したメニューも予約時間の計算（DURATION）や金額表示（MENU_PRICE）で
      // すぐに使えるようになる。
      const custom=Array.isArray(mn)?mn:[];
      setCustomMenus(custom);
      MENUS=[...BASE_MENUS,...custom.map(m=>m.name)];
      DURATION={...BASE_DURATION,...Object.fromEntries(custom.map(m=>[m.name,m.duration||30]))};
      MENU_PRICE={...BASE_MENU_PRICE,...Object.fromEntries(custom.map(m=>[m.name,m.price||0]))};
    }catch(e){console.error(e);}
    setLoading(false);
  }

  // 指定スタッフが指定メニュー（複数可）すべてに対応できるか。
  // staffMenuMapに登録が無いスタッフは「全メニュー対応」として扱う（後方互換のため）。
  function staffCanDoMenus(staffId,menuNames){
    const allowed=staffMenuMap[staffId];
    if(!allowed||allowed.length===0) return true; // 未設定＝全メニュー対応
    if(!menuNames||menuNames.length===0) return true;
    return menuNames.every(m=>allowed.includes(m));
  }

  // イベント開催期間内の日付かどうか（応援スタッフ・臨時枠の表示判定に使用）
  function isEventDateAdmin(dateStr){
    if(!eventDateRange.start||!eventDateRange.end) return false;
    return dateStr>=eventDateRange.start && dateStr<=eventDateRange.end;
  }

  // 指定スタッフが指定日に出勤しているか（①特定日の変更（DB保存・全員が同じ内容を見られる）＞②週固定シフトの順で判定）
  function isStaffWorkingOnDate(staffId,dateObj){
    const dateStr=fmtDate(dateObj);
    const dov=dateOverrides.find(o=>o.staff_id===staffId&&o.date===dateStr);
    if(dov) return dov.is_working!==false;
    // 旧・ブラウザ限定の月次シフト設定も後方互換のため一応見る（新規の変更は上のstaff_date_overridesに保存されます）
    const monthKey=dateStr.slice(0,7);
    try{
      const raw=localStorage.getItem("shifts_"+monthKey);
      if(raw){
        const map=JSON.parse(raw);
        const val=map[staffId+"_"+dateStr];
        if(val) return val==="出勤";
      }
    }catch(e){}
    const dow=dateObj.getDay();
    const ws=weeklyShifts.find(w=>w.staff_id===staffId&&w.day_of_week===dow);
    if(ws) return ws.is_working!==false;
    return true; // シフトデータが無い場合はフェイルセーフで出勤扱い
  }

  // その日の出勤時間帯（開始・終了）を返す。特定日の時間変更は現状保存していないため、
  // 週固定シフト（staff_weekly_shifts）の時間をそのまま使う。設定が無ければnull（終日扱い＝グレー表示なし）
  function getShiftTimeRange(staffId,dateObj){
    // 祝日（営業時間を上書きした日）は、曜日シフトの時間ではなく祝日の診療時間（9:00〜18:00）で予約を受け付ける
    const dStr=fmtDate(dateObj);
    if(dStr>="2026-10-01"){
      const hc=closures.find(x=>x.date===dStr&&x.is_closed===false&&x.open_time&&/祝日|振替休日|国民の休日/.test(x.memo||""));
      if(hc) return{start:String(hc.open_time).slice(0,5),end:String(hc.close_time||"18:00").slice(0,5)};
    }
    const dow=dateObj.getDay();
    const ws=weeklyShifts.find(w=>w.staff_id===staffId&&w.day_of_week===dow);
    if(ws&&ws.start_time&&ws.end_time) return{start:ws.start_time,end:ws.end_time};
    return null;
  }

  // 選択中の店舗の営業時間・臨時休業日を取得
  React.useEffect(()=>{
    if(selStoreId===null) return;
    Promise.all([
      sb.select("business_hours",`?store_id=eq.${selStoreId}&order=day_of_week.asc`),
      sb.select("temp_closures",`?store_id=eq.${selStoreId}`)
    ]).then(([bh,tc])=>{
      setBusinessHours(Array.isArray(bh)?bh:[]);
      setClosures(Array.isArray(tc)?tc:[]);
    }).catch(()=>{});
  },[selStoreId]);

  React.useEffect(()=>{fetchAll();const t=setInterval(fetchAll,30000);return()=>clearInterval(t);},[]);

  // タブを離れて別端末を操作し、また戻ってきた時に最大30秒待たされないよう、
  // 画面がアクティブになった瞬間にも表示状態の同期だけ即座に行う（予約データ等の全体再取得は待たない）
  React.useEffect(()=>{
    function onFocusOrVisible(){
      if(document.visibilityState&&document.visibilityState!=="visible") return;
      syncViewStateFromServer();
    }
    window.addEventListener("focus",onFocusOrVisible);
    document.addEventListener("visibilitychange",onFocusOrVisible);
    return()=>{
      window.removeEventListener("focus",onFocusOrVisible);
      document.removeEventListener("visibilitychange",onFocusOrVisible);
    };
  },[]);

  // この端末で日付・店舗・スタッフの表示を切り替えたら、すぐにサーバーへ保存する
  // （他端末からの変更を取り込んだ直後の場合は、書き戻して無限ループにならないようスキップする）
  React.useEffect(()=>{
    if(!viewStateSyncRef.current.loaded||viewStateSyncRef.current.applyingRemote) return;
    const baseDateStr=fmtDate(baseDate);
    const last=viewStateSyncRef.current.lastWritten;
    if(last&&last.base_date===baseDateStr&&last.sel_store_id===selStoreId&&last.sel_staff===selStaff) return;
    writeViewState({base_date:baseDateStr,sel_store_id:selStoreId,sel_staff:selStaff});
  },[baseDate,selStoreId,selStaff]);

  function showToast(msg,type="success"){setToast({msg,type});setTimeout(()=>setToast(null),3000);}

  // ===== トレーニングモード用：テストデータをワンクリックで作成/削除 =====
  const [showTrainingDataModal,setShowTrainingDataModal]=React.useState(false);
  const [trainingDataBusy,setTrainingDataBusy]=React.useState(false);
  const TRAINING_FAKE_PATIENTS=[
    {name:"テスト　一郎",phone:"09000000001"},
    {name:"テスト　花子",phone:"09000000002"},
    {name:"テスト　次郎",phone:"09000000003"},
    {name:"テスト　由美",phone:"09000000004"},
    {name:"テスト　健太",phone:"09000000005"},
    {name:"テスト　美咲",phone:"09000000006"},
    {name:"テスト　大輔",phone:"09000000007"},
    {name:"テスト　愛子",phone:"09000000008"},
  ];
  const TRAINING_MENUS=["初めての方（初診）","2回目以降の方","久しぶりの方（要確認）","再診（20分）"];
  const TRAINING_TIME_SLOTS=["10:00","10:30","11:00","11:30","14:00","14:30","15:00","15:30","16:00","16:30","17:00","17:30"];
  function pickRandom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  // トレーニングモード中に、練習用の予約・会計・回数券サンプルをまとめて自動作成する
  async function generateTrainingData(count){
    if(!trainingMode){ alert("先に画面右上の「トレーニングモード」をONにしてから作成してください。"); return; }
    count=Math.max(1,Math.min(30,count||8));
    const staffPool=storeStaff.filter(s=>!s.event_only);
    if(staffPool.length===0){ alert("スタッフが見つかりませんでした。店舗の選択をご確認ください。"); return; }
    setTrainingDataBusy(true);
    try{
      const createdBookings=[];
      for(let i=0;i<count;i++){
        const patient=pickRandom(TRAINING_FAKE_PATIENTS);
        const staff=pickRandom(staffPool);
        const dayOffset=Math.floor(Math.random()*10)-3; // 過去3日〜未来6日にばらけさせ、当日会計の練習もできるようにする
        const d=new Date(today); d.setDate(d.getDate()+dayOffset);
        const dateStr=fmtDate(d);
        const payload={
          patient_name:patient.name+"（テスト"+(i+1)+"）",
          phone:patient.phone,
          staff_id:staff.id,
          date:dateStr,
          time:pickRandom(TRAINING_TIME_SLOTS),
          menu:pickRandom(TRAINING_MENUS),
          store_id:selStoreId||firstStoreId,
          line_notify:false,
          reminded:false,
          is_training:true,
        };
        try{
          const result=await sb.insert("bookings",payload);
          if(Array.isArray(result)&&result.length>0) createdBookings.push(result[0]);
        }catch(e){ console.error("テスト予約の作成に失敗しました",e); }
      }
      if(createdBookings.length>0) setAllBookings(prev=>[...prev,...createdBookings]);

      // 過去日・当日分の一部には会計データも作成し、会計・POS操作の練習もできるようにする
      const pastOrToday=createdBookings.filter(b=>b.date<=todayStr);
      for(const b of pastOrToday){
        const amount=pickRandom([1000,1500,2000,3000]);
        try{
          await sb.insert("payments",{
            booking_id:b.id,patient_name:b.patient_name,payment_date:b.date,
            insurance_amount:amount,jifee_amount:0,total_amount:amount,
            payment_method:"現金:"+amount,staff_id:b.staff_id,is_training:true,
          });
        }catch(e){ console.error("テスト会計の作成に失敗しました",e); }
      }

      // 回数券・FP関連の練習ができるよう、1名分だけサンプルの回数券を作成し、
      // さらに「会計へ進むと回数券の残数が減る」動きまで確認できるよう、
      // まだ会計していない予約（できれば未来日）に、この回数券をあらかじめ紐づけておく
      let passDemoInfo=null;
      if(createdBookings.length>0){
        const unpaidBookings=createdBookings.filter(b=>b.date>todayStr);
        const sample=unpaidBookings[0]||createdBookings.find(b=>!pastOrToday.includes(b))||createdBookings[0];
        try{
          const passResult=await sb.insert("passes",{
            patient_name:sample.patient_name,phone:sample.phone,pass_type:"テスト回数券5回券",
            total_count:5,remaining_count:5,amount:15000,purchased_date:sample.date,
            expiry_date:addMonths(sample.date,12),staff_id:sample.staff_id,active:true,is_training:true,
          });
          const newPass=Array.isArray(passResult)&&passResult.length>0?passResult[0]:null;
          // すでに会計済み（pastOrTodayで自動会計データを作った）予約には紐づけない
          // （会計へ進んでも消費のタイミングが来ないため、練習用に紐づける意味がない）
          if(newPass&&!pastOrToday.includes(sample)){
            const updateResult=await sb.update("bookings",sample.id,{consumed_pass_id:newPass.id,consumed_pass_type:"回数券"});
            if(Array.isArray(updateResult)&&updateResult.length>0){
              setAllBookings(prev=>prev.map(b=>b.id===sample.id?updateResult[0]:b));
              passDemoInfo={name:sample.patient_name,date:sample.date,time:sample.time};
            }
          }
        }catch(e){ console.error("テスト回数券の作成に失敗しました",e); }
      }

      showToast(
        passDemoInfo
          ?`テストデータを${createdBookings.length}件作成しました🎓　${passDemoInfo.name}様（${passDemoInfo.date} ${passDemoInfo.time}）の予約には回数券（残り5回）が紐づいています。会計へ進むと本番同様に残数が減る様子を確認できます`
          :`テストデータを${createdBookings.length}件作成しました🎓`
      );
      setShowTrainingDataModal(false);
    }catch(e){
      alert("テストデータの作成中にエラーが発生しました："+(e.message||"不明なエラー"));
    }
    setTrainingDataBusy(false);
  }

  // トレーニングモードで作成した予約・会計・回数券のテストデータを一括削除する（本番データには影響しない）
  async function clearTrainingData(){
    if(!window.confirm("トレーニングモードで作成したテストの予約・会計・回数券データを全て削除します。\n（本番データには一切影響しません）\n\nよろしいですか？")) return;
    setTrainingDataBusy(true);
    try{
      const trainingBookings=allBookings.filter(b=>b.is_training);
      for(const b of trainingBookings){ await sb.delete("bookings",b.id).catch(()=>{}); }
      setAllBookings(prev=>prev.filter(b=>!b.is_training));

  // スタッフがカレンダーから新規予約を手入力で作成した場合、その場ではline_user_idが分からず
  // 空のまま保存されてしまい、既にLINE連携済みの患者でもマイページに予約が反映されない不具合があった。
  // 同じ電話番号で過去にLINE連携済み（line_user_id有り）の予約があれば、それを引き継ぐ。
  async function findLinkedLineUserId(phoneRaw){
    if(!phoneRaw) return null;
    const raw=String(phoneRaw).trim();
    if(!raw) return null;
    const digits=raw.replace(/[^0-9]/g,"");
    try{
      const results=await Promise.all([
        sb.select("bookings",`?phone=eq.${encodeURIComponent(raw)}&line_user_id=not.is.null&order=date.desc&limit=1`),
        digits&&digits!==raw?sb.select("bookings",`?phone=eq.${encodeURIComponent(digits)}&line_user_id=not.is.null&order=date.desc&limit=1`):Promise.resolve([])
      ]);
      for(const r of results){
        if(Array.isArray(r)&&r.length>0&&r[0].line_user_id) return r[0].line_user_id;
      }
    }catch(e){}
    return null;
  }
  async function save(){
    if(!form.patient_name.trim())return;
    // 同姓同名だが電話番号が違う既存予約がある場合は、別人の可能性があるので保存前に一度確認する
    // （名前の入力ミス・コピペミスで別人のデータに混ざるのを防ぐための安全策）
    if(form.phone&&form.phone.trim()){
      const sameName=bookings.filter(b=>b.id!==editId&&!b.cancelled&&b.patient_name===form.patient_name.trim()&&b.phone&&b.phone.replace(/-/g,"")!==form.phone.replace(/-/g,""));
      if(sameName.length>0){
        const otherPhones=[...new Set(sameName.map(b=>b.phone))].join("、");
        const ok=window.confirm(
          `「${form.patient_name.trim()}」という名前の予約が既にありますが、電話番号が異なります（既存：${otherPhones} / 今回：${form.phone}）。\n\n`+
          `同姓同名の別の方の可能性があります。このまま保存してよろしいですか？\n`+
          `（名前の入力間違いの場合は「キャンセル」を押して確認してください）`
        );
        if(!ok) return;
      }
    }
    const laneCapacity=getLaneCount(form.staff_id);
    // トレーニングモード中の練習予約でも、本番予約と時間が被らないよう本番分も含めて判定する
    const overlapCountLocal=calendarBookings.filter(b=>b.id!==editId&&b.staff_id===form.staff_id&&b.date===form.date&&!b.cancelled&&overlaps(b,form)).length;
    if(overlapCountLocal>=laneCapacity){setConflict(true);return;}
    // 保存直前にもう一度サーバーへ問い合わせて、ほぼ同時に他のスタッフが同じ枠を
    // 確保してしまっていないか最終確認する（画面上のデータには多少タイムラグがあるため）
    try{
      const freshSameDay=await sb.select("bookings",`?staff_id=eq.${form.staff_id}&date=eq.${form.date}`);
      const overlapCountFresh=(Array.isArray(freshSameDay)?freshSameDay:[]).filter(b=>b.id!==editId&&!b.cancelled&&overlaps(b,form)).length;
      if(overlapCountFresh>=laneCapacity){
        setConflict(true);
        showToast("ちょうど別の予約が入ってしまいました。時間をご確認ください","delete");
        return;
      }
    }catch(e){
      // 確認自体が失敗した場合は、これまで通りクライアント側のチェックのみで進める
    }
    try{
      if(editId!==null){
        const result=await sb.update("bookings",editId,form);
        if(!Array.isArray(result)||result.length===0){
          throw new Error((result&&result.message)||"更新に失敗しました（対象の予約が見つかりませんでした）");
        }
        setAllBookings(prev=>prev.map(b=>b.id===editId?result[0]:b));
        // トレーニングモード中の練習予約はスタッフLINEグループへ通知しない（本番の予約情報と混ざらないように）
        if(!trainingMode){
          const staffNm=(STAFF_ACCOUNTS.find(s=>s.id===result[0].staff_id)||{}).name||"担当未定";
          notifyStaffGroup(`✏️ 予約変更\n${result[0].patient_name||""} 様\n${result[0].date} ${result[0].time}\n担当：${staffNm}`);
        }
      }else{
        let lineUserId=form.line_user_id||null;
        if(!lineUserId&&form.phone){
          lineUserId=await findLinkedLineUserId(form.phone);
        }
        const insertPayload=Object.assign({},form,{is_training:trainingMode});
        if(lineUserId){

        }
      }
      // 回数券・フリーパスが選択されていればpassesテーブルへ反映（マイページの残数・期限表示用）
      await syncPassesFromMenus(form);
      showToast(editId!==null?"予約を更新しました":"予約を登録しました");setView("calendar");
    }catch(e){
      alert("保存に失敗しました："+(e.message||"不明なエラー"));
    }
  }

  async function cancelBooking(reason,rebookInfo){
    if(!cancelModalBooking) return;
    try{
      const token=(await supabaseClient.auth.getSession()).data.session?.access_token||SUPABASE_ANON_KEY;
      const res=await fetch(`${SUPABASE_URL}/rest/v1/bookings?id=eq.${cancelModalBooking.id}`,{
        method:"PATCH",
        headers:{apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${token}`,"Content-Type":"application/json",Prefer:"return=representation"},
        body:JSON.stringify({cancelled:true,cancel_reason:reason,cancelled_at:new Date().toISOString()})
      });
      const bodyText=await res.text();
      if(!res.ok){
        throw new Error(`保存に失敗しました（HTTP ${res.status}）\n${bodyText}`);
      }
      let updated=null;
      try{updated=JSON.parse(bodyText);}catch(e){}
      if(!Array.isArray(updated)||updated.length===0){
        throw new Error("対象の予約が見つからず、キャンセルが保存されませんでした。");
      }
      setAllBookings(prev=>prev.map(b=>b.id===cancelModalBooking.id?updated[0]:b));
      if(!cancelModalBooking.is_training){
        const staffNm=(STAFF_ACCOUNTS.find(s=>s.id===cancelModalBooking.staff_id)||{}).name||"担当未定";
        notifyStaffGroup(`❌ キャンセル\n${cancelModalBooking.patient_name||""} 様\n${cancelModalBooking.date} ${cancelModalBooking.time}\n担当：${staffNm}\n理由：${reason||"未記入"}`);
      }

      // 「この場で次回予約も作成する」が選ばれていれば、続けて新しい予約を登録する
      let rebookOk=false;
      if(rebookInfo&&rebookInfo.date&&rebookInfo.time){
        try{
          const original=cancelModalBooking;
          const newBookingData={
            patient_name:original.patient_name,
            phone:original.phone||"",
            staff_id:rebookInfo.staff_id||original.staff_id,
            date:rebookInfo.date,
            time:rebookInfo.time,
            menu:original.menu,
            store_id:original.store_id,
            line_notify:!!original.line_user_id,
            line_user_id:original.line_user_id||null,
            reminded:false,
            karte_no:original.karte_no||null,
            is_training:trainingMode, // トレーニングモード中に作った次回予約が本番データに混ざらないようにする
          };
          const rebookResult=await sb.insert("bookings",newBookingData);
          if(Array.isArray(rebookResult)&&rebookResult.length>0){
            setAllBookings(prev=>[...prev,rebookResult[0]]);
            rebookOk=true;
            if(!trainingMode){
              const staffNm=(STAFF_ACCOUNTS.find(s=>s.id===rebookResult[0].staff_id)||{}).name||"担当未定";
              notifyStaffGroup(`🆕 新規予約（振替）\n${rebookResult[0].patient_name||""} 様\n${rebookResult[0].date} ${rebookResult[0].time}\n担当：${staffNm}`);
            }
          }
        }catch(e){
          console.error(e);
        }
      }

      showToast(rebookInfo?(rebookOk?"キャンセルし、次回予約を登録しました":"キャンセルしましたが、次回予約の登録に失敗しました"):"予約をキャンセルしました",rebookOk?"success":"delete");
      setCancelModalBooking(null);
      setBookingPopup(null);
      if(view==="form") setView("calendar");
    }catch(e){
      alert("キャンセル処理に失敗しました：\n"+(e.message||"不明なエラー")+"\n\nSupabaseのbookingsテーブルにcancel_reason・cancelled_at列が追加されているかご確認ください。");
    }
  }

  // ===== カレンダー上でのドラッグ移動 =====
  const DRAG_TOTAL_SLOTS=66; // 09:00〜20:00を10分刻みにした数（土日祝9-18・平日10-20の両方をカバー。カレンダー表示の時間軸と一致）
  function computeTimeFromRowX(relX,rowWidth){
    const cellW=rowWidth/DRAG_TOTAL_SLOTS;
    // 行の端まで（09:00〜20:00の最終枠19:50まで）クランプする。
    // 以前はここが誤って17時までしか許可しておらず、18時以降に予約を動かそうとすると
    // 判定上「範囲外」としてnullを返し、見た目は動いた後に元の位置へ戻る（＝全く動かせない）
    // バグになっていた。
    const maxMin=DRAG_TOTAL_SLOTS*10-10; // 19:50
    const totalMin=Math.min(maxMin,Math.max(0,Math.round(relX/cellW)*10));
    const h=9+Math.floor(totalMin/60),m=totalMin%60;
    return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
  }
    async function rescheduleBooking(booking,newDate,newTime){
    const dow=new Date(newDate+"T00:00:00").getDay();
    function isWorkingOnNewDate(staffId){
      const ws=weeklyShifts.find(w=>w.staff_id===staffId&&w.day_of_week===dow);
      if(ws) return ws.is_working!==false;
      return true;
    }
    const list=(storeStaff&&storeStaff.length>0)?storeStaff:STAFF_ACCOUNTS;
    const candidates=list.filter(s=>isWorkingOnNewDate(s.id));
    if(candidates.length===0){
      showToast("その日も出勤スタッフがいません。別の日付をお試しください","delete");
      return;
    }
    function hasRoom(staffId){
      const capacity=getLaneCount(staffId);
      const overlapCount=bookings.filter(b=>b.id!==booking.id&&b.staff_id===staffId&&b.date===newDate&&!b.cancelled&&overlaps(b,{time:newTime,duration:booking.duration||DURATION[booking.menu]||30})).length;
      return overlapCount<capacity;
    }
    const chosen=candidates.find(s=>hasRoom(s.id));
    if(!chosen){
      showToast("その時間は予約枠が埋まっています。別の時間をお試しください","delete");
      return;
    }
    try{
      const result=await sb.update("bookings",booking.id,{date:newDate,time:newTime,staff_id:chosen.id});
      if(Array.isArray(result)&&result.length>0){
        setAllBookings(prev=>prev.map(b=>b.id===booking.id?result[0]:b));
        showToast("予約を"+newDate+" "+newTime+"（"+chosen.name+"）に移動しました");
      }
    }catch(e){
      showToast("移動に失敗しました","delete");
    }
  }
  async function reassignStaffForBooking(booking,newStaffId){

    const overlapCount=bookings.filter(b=>b.id!==booking.id&&b.staff_id===newStaffId&&b.date===booking.date&&!b.cancelled&&overlaps(b,booking)).length;
    if(overlapCount>=laneCapacity){

  async function attemptMoveBooking(booking,newDate,newTime,newStaffId){
    // トレーニングモード中にカレンダー上で見えている本番予約は、ドラッグ移動でも本番データを変更させない
    if(trainingMode&&!booking.is_training){ showToast("本番の予約はトレーニングモードでは移動できません（閲覧のみ）","delete"); return; }
    const dateObj=new Date(newDate+"T00:00:00");
    if(!isStaffWorkingOnDate(newStaffId,dateObj)){
      showToast("移動先のスタッフはこの日休みのため移動できません","delete");
      return;
    }
    const laneCapacity=getLaneCount(newStaffId);
    const overlapCountLocal=calendarBookings.filter(b=>b.id!==booking.id&&b.staff_id===newStaffId&&b.date===newDate&&!b.cancelled&&overlaps(b,{time:newTime,duration:booking.duration||DURATION[booking.menu]||30})).length;
    if(overlapCountLocal>=laneCapacity){
      showToast("その時間はすでに予約枠が埋まっています","delete");
      return;
    }
    try{
      // 保存直前にもう一度サーバーへ問い合わせて最終確認（かぶり移動を防ぐ）
      const freshSameDay=await sb.select("bookings",`?staff_id=eq.${newStaffId}&date=eq.${newDate}`);
      const overlapCountFresh=(Array.isArray(freshSameDay)?freshSameDay:[]).filter(b=>b.id!==booking.id&&!b.cancelled&&overlaps(b,{time:newTime,duration:booking.duration||DURATION[booking.menu]||30})).length;
      if(overlapCountFresh>=laneCapacity){
        showToast("ちょうど別の予約が入ってしまいました。時間をご確認ください","delete");
        return;
      }
      const result=await sb.update("bookings",booking.id,{date:newDate,time:newTime,staff_id:newStaffId});
      if(!Array.isArray(result)||result.length===0){
        throw new Error((result&&result.message)||"移動に失敗しました");
      }
      setAllBookings(prev=>prev.map(b=>b.id===booking.id?result[0]:b));
      showToast("予約を移動しました");
    }catch(e){
      alert("移動に失敗しました："+(e.message||"不明なエラー"));
    }
  }

  async function attemptResizeBreak(br,newDuration){
    const clamped=Math.max(10,Math.min(120,newDuration)); // 10分〜120分の範囲に収める
    if(clamped===(br.duration||10)) return;
    try{
      const result=await sb.update("staff_breaks",br.id,{duration:clamped});
      if(!Array.isArray(result)||result.length===0){
        throw new Error((result&&result.message)||"長さの変更に失敗しました");
      }
      setBreaks(prev=>prev.map(b=>b.id===br.id?result[0]:b));
      showToast(`休憩の長さを${clamped}分に変更しました`);

  async function attemptResizeBooking(booking,newDuration){
    // トレーニングモード中にカレンダー上で見えている本番予約は、リサイズでも本番データを変更させない
    if(trainingMode&&!booking.is_training){ showToast("本番の予約はトレーニングモードでは変更できません（閲覧のみ）","delete"); return; }
    const clamped=Math.max(10,Math.min(240,newDuration)); // 10分〜4時間の範囲に収める
    if(clamped===(booking.duration||DURATION[booking.menu]||30)) return; // 変化なし
    const laneCapacity=getLaneCount(booking.staff_id);
    const overlapCountLocal=calendarBookings.filter(b=>b.id!==booking.id&&b.staff_id===booking.staff_id&&b.date===booking.date&&!b.cancelled&&overlaps(b,{time:booking.time,duration:clamped})).length;
    if(overlapCountLocal>=laneCapacity){
      showToast("その時間はすでに予約枠が埋まっています","delete");
      return;
    }
    try{
      const freshSameDay=await sb.select("bookings",`?staff_id=eq.${booking.staff_id}&date=eq.${booking.date}`);
      const overlapCountFresh=(Array.isArray(freshSameDay)?freshSameDay:[]).filter(b=>b.id!==booking.id&&!b.cancelled&&overlaps(b,{time:booking.time,duration:clamped})).length;
      if(overlapCountFresh>=laneCapacity){
        showToast("ちょうど別の予約が入ってしまいました。時間をご確認ください","delete");
        return;
      }
      const result=await sb.update("bookings",booking.id,{duration:clamped});
      if(!Array.isArray(result)||result.length===0){
        throw new Error((result&&result.message)||"時間の変更に失敗しました");
      }
      setAllBookings(prev=>prev.map(b=>b.id===booking.id?result[0]:b));
      showToast(`対応時間を${clamped}分に変更しました`);
    }catch(e){
      alert("時間の変更に失敗しました："+(e.message||"不明なエラー"));
    }
  }

    // ここが判定条件からズレると、サイドバーの件数バッジと実際の一覧件数が食い違ってしまう。
    function isWorkingLocal(staffId,dateStr){
      const dov=dateOverrides.find(o=>o.staff_id===staffId&&o.date===dateStr);
      if(dov) return dov.is_working!==false;
      const monthKey=dateStr.slice(0,7);

        if(raw){
          const map=JSON.parse(raw);
          const val=map[staffId+"_"+dateStr];
          if(val) return val==="出勤";
        }
      }catch(e){}
      const dow=new Date(dateStr+"T00:00:00").getDay();
      const ws=weeklyShifts.find(w=>w.staff_id===staffId&&w.day_of_week===dow);
      if(ws) return ws.is_working!==false;
      return true;
    }

        {/* ===== メインコンテンツ ===== */}
        <div style={{flex:1,padding:16,minWidth:0,overflowY:"auto"}}>

          {/* 店舗タブ（2店舗以上ある場合のみ表示） */}
          {stores.length>1&&(view==="calendar"||view==="list")&&(
            <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>
              {stores.map(s=>(
                <button key={s.id} onClick={()=>{setSelStoreId(s.id);setSelStaff(null);}}
                  style={{padding:"7px 16px",borderRadius:8,border:"1.5px solid",borderColor:selStoreId===s.id?"#1e3a5f":"#e2e8f0",background:selStoreId===s.id?"#1e3a5f":"white",color:selStoreId===s.id?"white":"#374151",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
                  {s.name}

          )}

          {/* スタッフフィルター（カレンダー・一覧のみ） */}
          {(view==="calendar"||view==="list")&&(
            <div className="staff-filter">
              {isAdmin&&(<button onClick={()=>setSelStaff(null)} className="staff-chip" style={{background:!selStaff?"#1e3a5f":"white",color:!selStaff?"white":"#374151",borderColor:!selStaff?"#1e3a5f":"#e2e8f0",boxShadow:!selStaff?"0 2px 8px rgba(30,58,95,.35)":"0 1px 3px rgba(0,0,0,.08)"}}>全員</button>)}
              {storeStaff.map(s=>(<button key={s.id} onClick={()=>setSelStaff(s.id)} className="staff-chip" style={{background:selStaff===s.id?s.color:"white",color:selStaff===s.id?"white":"#374151",borderColor:selStaff===s.id?s.color:"#e2e8f0",boxShadow:selStaff===s.id?`0 2px 8px ${s.color}55`:"0 1px 3px rgba(0,0,0,.08)"}}>{s.name}</button>))}
            </div>
          )}

          {/* カレンダービュー */}
          {view==="calendar"&&(()=>{
            const DAYS_JP=["日","月","火","水","木","金","土"];
            // スタッフ絞り込み時は今日〜7日先固定、全員表示時は通常ナビ
            function getWeekStart(d){const s=new Date(d);s.setHours(0,0,0,0);return s;}
            const weekStart=selStaff?getWeekStart(today):getWeekStart(baseDate);
            const weekDates=Array.from({length:7},(_,i)=>{const d=new Date(weekStart);d.setDate(weekStart.getDate()+i);return d;});
            const ds=fmtDate(baseDate);

            function prevWeek(){const d=new Date(baseDate);d.setDate(d.getDate()-7);setBaseDate(d);}
            function nextWeek(){const d=new Date(baseDate);d.setDate(d.getDate()+7);setBaseDate(d);}

            const MINS=Array.from({length:66},(_,i)=>{const totalMin=i*10,h=9+Math.floor(totalMin/60),m=totalMin%60;if(h>=20)return null;return{h,m,label:`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`};}).filter(Boolean);
            const TOTAL_MINS=MINS.length;
            const HEADER_W=100;
            const screenW=Math.max(window.innerWidth-130-48,600);
            const CELL_W=Math.max(Math.floor((screenW-HEADER_W)/TOTAL_MINS),12);

            // 祝日（2026/10〜）：temp_closuresの営業時間上書き＋メモに祝日系の語がある日を祝日として表示
            function holidayOf(dStr){
              if(dStr<"2026-10-01") return null;
              const c=closures.find(x=>x.date===dStr&&x.is_closed===false&&x.open_time&&/祝日|振替休日|国民の休日/.test(x.memo||""));
              if(!c) return null;
              const nm=(c.memo||"").replace(/9-18営業/,"").replace(/^祝日（(.+)）$/,"$1").trim()||"祝日";
              return{name:nm,open:String(c.open_time).slice(0,5),close:String(c.close_time||"18:00").slice(0,5)};
            }
            const staffList=storeStaff;
            const filteredStaff=selStaff?staffList.filter(s=>s.id===selStaff):staffList;

            function timeToX(timeStr){const[h,m]=timeStr.split(":").map(Number);return((h-9)*60+m)/10*CELL_W;}
            function durationToW(b){return(b.duration||DURATION[b.menu]||30)/10*CELL_W;}

            // 現在時刻バー：9:00〜20:00の表示範囲内の時だけ、今日の列にXを計算する
            const nowMinOfDay=nowTick.getHours()*60+nowTick.getMinutes();
            const nowInRange=nowMinOfDay>=9*60&&nowMinOfDay<=20*60;
            const nowX=nowInRange?((nowTick.getHours()-9)*60+nowTick.getMinutes())/10*CELL_W:null;

            // 30分スロット集計
            const timeSlots30=[];
            for(let h=9;h<=20;h++){for(let m=0;m<60;m+=30){
              if(h===20&&m>0) break;
              const label=`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
              const booked=bookings.filter(b=>{if(b.date!==ds)return false;const bs=toMin(b.time),be=bs+(b.duration||DURATION[b.menu]||30),ss=toMin(label),se=ss+30;return bs<se&&ss<be;}).length;
              const resting=breaks.filter(b=>b.date===ds&&b.time===label).length;
              const available=Math.max(0,filteredStaff.length-resting);
              timeSlots30.push({label,booked,available,x:(h-9)*60/10*CELL_W+m/10*CELL_W,w:30/10*CELL_W});
            }}

            // 選択中の日の売上：現金／現金以外の内訳
            // payment_methodは「現金:¥5,000・カード:¥3,000」形式。現金はお預かり額で記録されている場合があるため、
            // 現金＝合計−現金以外 で算出（お釣り分は売上に含めない）。
            const dayStoreIds=new Set(storeBookings.map(b=>b.id));
            const dayPays=paymentsNet.filter(p=>p.payment_date===ds&&dayStoreIds.has(p.booking_id)&&(!selStaff||p.staff_id===selStaff));
            let dayCash=0,dayOther=0;
            const dayOtherBy={};
            dayPays.forEach(p=>{
              const tot=parseInt(p.total_amount)||0;
              if(p.is_refund){
                if(p.refund_method==="現金"){dayCash+=tot;}
                else{const nm=p.refund_method||"その他";dayOther+=tot;dayOtherBy[nm]=(dayOtherBy[nm]||0)+tot;}
                return;
              }
              let nonCash=0;
              String(p.payment_method||"").split("・").forEach(part=>{
                const i=part.indexOf(":");
                if(i<0) return;
                const nm=part.slice(0,i).trim();
                const amt=parseInt(part.slice(i+1).replace(/[^\d]/g,""))||0;
                if(nm&&nm!=="現金"){nonCash+=amt;dayOtherBy[nm]=(dayOtherBy[nm]||0)+amt;}
              });
              dayOther+=nonCash;
              dayCash+=Math.max(0,tot-nonCash);
            });
            const dayOtherDetail=Object.keys(dayOtherBy).map(k=>`${k} ¥${dayOtherBy[k].toLocaleString()}`).join("／");

            return(
              <div className="card">
                {/* 選択日の売上（現金／現金以外） */}
                {(!selStaff||weekViewMode==="calendar")&&(
                  <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",padding:"8px 12px",background:"#fffbeb",borderBottom:"1px solid #fde68a"}}>
                    <span style={{fontSize:12,fontWeight:800,color:"#92400e"}}>💰 {baseDate.getMonth()+1}/{baseDate.getDate()}({DAYS_JP[baseDate.getDay()]})の売上</span>
                    <span style={{fontSize:15,fontWeight:800,color:"#d97706"}}>¥{(dayCash+dayOther).toLocaleString()}</span>
                    <span style={{fontSize:12,fontWeight:700,color:"#059669",background:"#ecfdf5",padding:"3px 10px",borderRadius:20}}>💴 現金 ¥{dayCash.toLocaleString()}</span>
                    <span style={{fontSize:12,fontWeight:700,color:"#2563eb",background:"#eff6ff",padding:"3px 10px",borderRadius:20}}>💳 現金以外 ¥{dayOther.toLocaleString()}{dayOtherDetail?`（${dayOtherDetail}）`:""}</span>
                  </div>
                )}
                {/* 個人絞り込み時：週間リスト切り替えボタン */}
                {selStaff&&(
                  <div style={{padding:"8px 12px",background:"#f8fafc",borderBottom:"1px solid #e2e8f0",display:"flex",gap:8}}>
                    <button onClick={()=>setWeekViewMode("calendar")}
                      style={{padding:"5px 14px",borderRadius:8,border:"1.5px solid",borderColor:weekViewMode==="calendar"?"#1e3a5f":"#e2e8f0",background:weekViewMode==="calendar"?"#1e3a5f":"white",color:weekViewMode==="calendar"?"white":"#374151",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
                      時間軸カレンダー
                    </button>
                    <button onClick={()=>setWeekViewMode("list")}
                      style={{padding:"5px 14px",borderRadius:8,border:"1.5px solid",borderColor:weekViewMode==="list"?"#1e3a5f":"#e2e8f0",background:weekViewMode==="list"?"#1e3a5f":"white",color:weekViewMode==="list"?"white":"#374151",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
                      週間リスト
                    </button>
                  </div>
                )}
                {/* 週間リストビュー（個人絞り込み時のみ） */}
                {selStaff&&weekViewMode==="list"&&<PersonalWeekView
                  staff={STAFF_ACCOUNTS.find(s=>s.id===selStaff)}
                  filtered={filtered}
                  payments={payments}
                  visitCounts={visitCounts}
                  setBookingPopup={setBookingPopup}
                  setView={setView}
                  setForm={setForm}
                  setEditId={setEditId}
                  todayStr={todayStr}
                  isAdmin={isAdmin}
                  user={user}
                  selStoreId={selStoreId}
                />}
                {/* 時間軸カレンダー（全員・個人共通） */}
                {(!selStaff||weekViewMode==="calendar")&&<div style={{display:"flex",alignItems:"center",background:"linear-gradient(135deg,#0f2744,#1e4d8c)",padding:"8px 10px",gap:4,overflowX:"auto"}}>
                  <button onClick={prevWeek} style={{background:"rgba(255,255,255,.15)",border:"none",color:"white",borderRadius:8,width:32,height:32,cursor:"pointer",fontWeight:800,fontSize:14,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>◀</button>
                  {weekDates.map(d=>{
                    const dStr=fmtDate(d);
                    const isSelected=dStr===ds;
                    const isToday=dStr===todayStr;
                    const isSun=d.getDay()===0,isSat=d.getDay()===6;
                    const cnt=storeBookings.filter(b=>b.date===dStr&&!b.cancelled).length;
                    const hol=holidayOf(dStr);
                    return(
                      <button key={dStr} onClick={()=>setBaseDate(new Date(dStr+"T00:00:00"))}
                        style={{flex:1,minWidth:72,padding:"6px 4px",borderRadius:10,border:"none",cursor:"pointer",fontWeight:800,fontSize:12,textAlign:"center",transition:"all .15s",
                          background:isToday?"#d97706":isSelected?"rgba(255,255,255,.3)":"rgba(255,255,255,.1)",
                          color:"white",boxShadow:isToday?"0 2px 8px rgba(217,119,6,.5)":"none"}}>
                        <div style={{color:(isSun||hol)?"#fca5a5":isSat?"#c4b5fd":"white"}}>{d.getMonth()+1}/{d.getDate()}({DAYS_JP[d.getDay()]})</div>
                        {hol&&<div style={{fontSize:9,fontWeight:800,color:"#fecaca",marginTop:1}}>🎌祝 {hol.open.replace(/^0/,"")}-{hol.close.replace(/^0/,"")}</div>}
                        {cnt>0&&<div style={{fontSize:10,opacity:.8,marginTop:1}}>{cnt}件</div>}
                        {isToday&&<div style={{fontSize:9,fontWeight:700,marginTop:1}}>今日</div>}
                      </button>
                    );
                  })}
                  <button onClick={nextWeek} style={{background:"rgba(255,255,255,.15)",border:"none",color:"white",borderRadius:8,width:32,height:32,cursor:"pointer",fontWeight:800,fontSize:14,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>▶</button>
                </div>}

                {/* 日付ピッカー */}
                {(!selStaff||weekViewMode==="calendar")&&<div style={{padding:"6px 12px",borderBottom:"1px solid #e2e8f0",display:"flex",alignItems:"center",gap:8,background:"#f8fafc"}}>
                  <span style={{fontSize:13,fontWeight:800,color:holidayOf(ds)?"#dc2626":"#1e3a5f"}}>{baseDate.getFullYear()}年{baseDate.getMonth()+1}月{baseDate.getDate()}日（{DAYS_JP[baseDate.getDay()]}）</span>
                  {holidayOf(ds)&&<span style={{fontSize:11,fontWeight:800,color:"#dc2626",background:"#fee2e2",padding:"2px 10px",borderRadius:20}}>🎌 {holidayOf(ds).name}｜診療 {holidayOf(ds).open}〜{holidayOf(ds).close}</span>}
                  {ds!==todayStr&&<button className="btn btn-outline btn-xs" onClick={()=>setBaseDate(new Date())}>今日</button>}
                  <input type="date" value={ds} onChange={e=>{if(e.target.value)setBaseDate(new Date(e.target.value+"T00:00:00"));}}
                    style={{marginLeft:"auto",padding:"3px 8px",border:"1.5px solid #e2e8f0",borderRadius:7,fontSize:12,color:"#374151",cursor:"pointer"}}/>
                </div>}

                {(!selStaff||weekViewMode==="calendar")&&<div style={{overflowX:"auto"}}>
                  <div style={{minWidth:HEADER_W+TOTAL_MINS*CELL_W+20}}>

                    {/* 時間ヘッダー（固定） */}
                    <div style={{display:"flex",borderBottom:"2px solid #e2e8f0",background:"#f8fafc",position:"sticky",top:0,zIndex:10}}>
                      <div style={{width:HEADER_W,flexShrink:0,padding:"5px 8px",fontWeight:700,fontSize:11,color:"#64748b",borderRight:"1px solid #e2e8f0"}}>スタッフ</div>
                      <div style={{position:"relative",height:24,flex:1}}>
                        {MINS.filter((_,i)=>i%3===0).map(({h,m,label})=>(
                          <div key={label} style={{position:"absolute",left:(h-9)*60/10*CELL_W+m/10*CELL_W,top:0,height:"100%",borderLeft:"1px solid #e2e8f0",paddingLeft:2,display:"flex",alignItems:"center"}}>
                            <span style={{fontSize:9,fontWeight:600,color:"#94a3b8",whiteSpace:"nowrap"}}>{label}</span>
                          </div>
                        ))}
                      </div>
                    </div>

                    {/* 7日分ループ */}
                    {weekDates.map(wd=>{
                      const wdStr=fmtDate(wd);
                      const isToday=wdStr===todayStr;
                      const isSun=wd.getDay()===0,isSat=wd.getDay()===6;
                      const dayBookings=storeBookings.filter(b=>b.date===wdStr&&!b.cancelled);
                      const wdHol=holidayOf(wdStr);
                      const dayColor=(isSun||wdHol)?"#ef4444":isSat?"#7c3aed":"#1e293b";
                      // その日実際に出勤しているスタッフのみ表示（誤予約防止）
                      const dayStaffList=filteredStaff.filter(s=>isStaffWorkingOnDate(s.id,wd)&&(!s.eventOnly||isEventDateAdmin(wdStr)));

                      // 対応可能・予約数（その日の）
                      const daySlots30=[];
                      for(let h=9;h<=20;h++){
                        for(let m=0;m<60;m+=30){
                          if(h===20&&m>0) break;
                          const label=`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
                          const booked=dayBookings.filter(b=>b.time===label).length;
                          const resting=breaks.filter(b=>b.date===wdStr&&b.time===label).length;
                          const available=Math.max(0,dayStaffList.length-resting);
                          daySlots30.push({label,booked,available,x:(h-9)*60/10*CELL_W+m/10*CELL_W,w:30/10*CELL_W});
                        }
                      }

                      return(
                        <div key={wdStr}>
                          {/* 日付ヘッダー行 */}
                          <div style={{display:"flex",background:isToday?"#1e3a5f":(isSun||wdHol)?"#fff1f2":isSat?"#faf5ff":"#f1f5f9",borderBottom:"1px solid #e2e8f0",borderTop:"2px solid #e2e8f0"}}>
                            <div style={{width:HEADER_W,flexShrink:0,padding:"5px 8px",borderRight:"1px solid #e2e8f0",display:"flex",alignItems:"center",gap:6}}>
                              <span style={{fontWeight:800,fontSize:12,color:isToday?"white":dayColor}}>
                                {wd.getMonth()+1}/{wd.getDate()}({DAYS_JP[wd.getDay()]})
                              </span>
                              {isToday&&<span style={{fontSize:9,fontWeight:800,color:"rgba(255,255,255,.8)"}}>今日</span>}
                              {wdHol&&<span title={wdHol.name+" 診療 "+wdHol.open+"〜"+wdHol.close} style={{fontSize:9,fontWeight:800,color:"#dc2626",background:"#fee2e2",borderRadius:8,padding:"1px 5px",whiteSpace:"nowrap"}}>祝 {wdHol.open.replace(/^0/,"")}-{wdHol.close.replace(/^0/,"")}</span>}
                            </div>
                            {/* 対応可能・予約数 */}
                            <div style={{position:"relative",flex:1,height:22}}>
                              {daySlots30.map(slot=>(
                                <div key={slot.label} style={{position:"absolute",left:slot.x,top:0,width:slot.w-1,height:"100%",display:"flex",borderRight:"1px solid rgba(0,0,0,.05)"}}>
                                  <div style={{flex:1,background:"rgba(37,99,235,.15)",display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{fontSize:8,fontWeight:800,color:"#2563eb"}}>{slot.available}</span></div>
                                  <div style={{flex:1,background:"rgba(5,150,105,.15)",display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{fontSize:8,fontWeight:800,color:"#059669"}}>{slot.booked}</span></div>
                                </div>
                              ))}
                            </div>
                          </div>

                          {/* スタッフ行（出勤しているスタッフのみ） */}
                          {dayStaffList.length===0&&(
                            <div style={{padding:"10px 8px",textAlign:"center",color:"#94a3b8",fontSize:12,borderBottom:"1px solid #f1f5f9"}}>この日は出勤スタッフがいません</div>
                          )}
                          {dayStaffList.map(staff=>{
                            const staffBookings=dayBookings.filter(b=>b.staff_id===staff.id);
                            const staffBreaks=breaks.filter(b=>b.date===wdStr&&b.staff_id===staff.id);
                            const configuredLanes=getLaneCount(staff.id);
                            // レーン分け（段を分けるかどうか）は実際の予約時間の重なりだけで判定する。
                            // 以前は「名前が読めるように」という表示上の余白（minGapMinutes）もここに混ぜていたため、
                            // 実際には時間が重なっていない予約まで別の段に分かれてバラバラに見えてしまっていた。
                            const {laneOf,laneCount:neededLanes}=assignLanes(staffBookings,0);
                            const totalLanes=Math.max(configuredLanes,neededLanes,1);
                            const rowH=Math.max(48,totalLanes*40);
                            const laneH=rowH/totalLanes;
                            const shiftRange=getShiftTimeRange(staff.id,wd);
                            const rowFullW=TOTAL_MINS*CELL_W;
                            const shiftStartX=shiftRange?Math.max(0,Math.min(rowFullW,timeToX(shiftRange.start))):0;
                            const shiftEndX=shiftRange?Math.max(0,Math.min(rowFullW,timeToX(shiftRange.end))):rowFullW;
                            return(
                              <div key={staff.id} style={{display:"flex",borderBottom:"1px solid #f1f5f9",minHeight:rowH}}>
                                <div style={{width:HEADER_W,flexShrink:0,padding:"4px 8px",borderRight:"1px solid #e2e8f0",background:"#fafbfc",display:"flex",alignItems:"center",gap:5}}>
                                  <div style={{width:22,height:22,borderRadius:6,background:`linear-gradient(135deg,${staff.color},${staff.color}99)`,display:"flex",alignItems:"center",justifyContent:"center",color:"white",fontWeight:800,fontSize:10,flexShrink:0}}>{staff.initial}</div>
                                  <div style={{flex:1,minWidth:0}}>
                                    <div style={{fontWeight:700,fontSize:10,color:"#1e293b",lineHeight:1.2}}>{staff.name}</div>
                                    <div style={{fontSize:9,color:staff.color,fontWeight:700}}>{staffBookings.length}件</div>
                                  </div>
                                  {isAdmin&&(
                                    <div style={{display:"flex",flexDirection:"column",gap:1,flexShrink:0}}>

                <div style={{fontSize:11,color:"rgba(255,255,255,.8)",marginTop:2}}>{b.date}　{b.time}　{s.name}</div>
                {cnt>1&&<div style={{fontSize:10,color:"rgba(255,255,255,.7)",marginTop:1}}>{cnt}回目</div>}
                {cnt===1&&<div style={{fontSize:10,fontWeight:800,color:"#7c2d12",background:"#fed7aa",display:"inline-block",borderRadius:4,padding:"1px 6px",marginTop:4}}>🆕 初診</div>}
                {b.checked_in_at&&<div style={{fontSize:10,fontWeight:800,color:"#111",background:"#facc15",display:"inline-block",borderRadius:4,padding:"1px 6px",marginTop:4}}>📷 来院済み</div>}
                {isSameDayBooking(b)&&<div style={{fontSize:10,fontWeight:800,color:"#a16207",background:"#fef9c3",display:"inline-block",borderRadius:4,padding:"1px 6px",marginTop:4,marginLeft:4}}>⚡ 当日予約</div>}
                {b.booked_via_line&&<div style={{fontSize:10,fontWeight:800,color:"white",background:"#06C755",display:"inline-block",borderRadius:4,padding:"1px 6px",marginTop:4,marginLeft:4}}>LINE予約</div>}
                {b.referrer_name&&<div style={{fontSize:10,fontWeight:800,color:"#6d28d9",background:"#ede9fe",display:"inline-block",borderRadius:4,padding:"1px 6px",marginTop:4,marginLeft:4}}>🎁 紹介：{b.referrer_name}</div>}
                {b.memo&&<div style={{fontSize:11,color:"white",background:"rgba(255,255,255,.18)",borderRadius:6,padding:"5px 8px",marginTop:6,lineHeight:1.5}}>📝 {b.memo}</div>}
                {isReadOnlyReal&&<div style={{fontSize:10,fontWeight:800,color:"#1e293b",background:"#fff",display:"inline-block",borderRadius:4,padding:"1px 6px",marginTop:4}}>🔒 本番の予約（閲覧のみ）</div>}
              </div>
              {!isReadOnlyReal&&(
                           <QuickMemoEditor key={b.id} booking={b} onSave={async(val)=>{
                try{
                  const result=await sb.update("bookings",b.id,{memo:val||null});
                  if(Array.isArray(result)&&result.length>0){
                    setAllBookings(prev=>prev.map(x=>x.id===b.id?result[0]:x));
                    setBookingPopup(prev=>prev?{...prev,booking:{...prev.booking,memo:val}}:prev);
                    showToast("メモを保存しました");
                  }
                }catch(e){
                  showToast("メモの保存に失敗しました","delete");
                }
              }}/>
              )}
              {/* アクション */}
              <div style={{padding:8,display:"flex",flexDirection:"column",gap:4}}>
                {isReadOnlyReal&&(
                  <div style={{fontSize:11,color:"#64748b",padding:"4px 4px 8px",lineHeight:1.5}}>トレーニングモード中は本番の予約を編集・会計できません。来院履歴のみ確認できます。</div>
                )}
                {!isReadOnlyReal&&cnt===1&&(
                  <button onClick={()=>{
                    setIframeModal({url:`intake.html?id=${b.id}`,title:"問診票"});
                    setBookingPopup(null);
                  }} style={{width:"100%",padding:"9px 12px",background:"linear-gradient(135deg,#f97316,#ea580c)",color:"white",border:"none",borderRadius:8,cursor:"pointer",fontWeight:800,fontSize:13,textAlign:"left",display:"flex",alignItems:"center",gap:8}}>
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/></svg>
                    問診票を確認
                  </button>
                )}
                {!isReadOnlyReal&&(
                <button onClick={()=>{
                  setIframeModal({url:`pos.html?id=${b.id}`,title:"会計"});
                  setBookingPopup(null);
                }} style={{width:"100%",padding:"9px 12px",background:"linear-gradient(135deg,#059669,#047857)",color:"white",border:"none",borderRadius:8,cursor:"pointer",fontWeight:800,fontSize:13,textAlign:"left",display:"flex",alignItems:"center",gap:8}}>
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
                  会計へ進む
                </button>
                )}
                {!isReadOnlyReal&&(
                <button onClick={()=>{
                  window.open(`treatment.html?id=${b.id}`,"_blank");
                  setBookingPopup(null);
                }} style={{width:"100%",padding:"9px 12px",background:"linear-gradient(135deg,#2563eb,#1d4ed8)",color:"white",border:"none",borderRadius:8,cursor:"pointer",fontWeight:800,fontSize:13,textAlign:"left",display:"flex",alignItems:"center",gap:8}}>
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                  施術記録
                </button>
                )}
                {!isReadOnlyReal&&(
                <button onClick={()=>{
                  window.open(`posture-analysis.html?id=${b.id}`,"_blank");
                  setBookingPopup(null);
                }} style={{width:"100%",padding:"9px 12px",background:"linear-gradient(135deg,#0f766e,#0d9488)",color:"white",border:"none",borderRadius:8,cursor:"pointer",fontWeight:800,fontSize:13,textAlign:"left",display:"flex",alignItems:"center",gap:8}}>
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><circle cx="12" cy="5" r="2"/><path d="M12 7v5l-3 8M12 12l3 8M8 10l4-2 4 2"/></svg>
                  姿勢評価
                </button>
                )}
                <button onClick={()=>{setHistoryPatient(b.patient_name);setView("patients");setBookingPopup(null);}} style={{width:"100%",padding:"9px 12px",background:"#f8fafc",color:"#374151",border:"1px solid #e2e8f0",borderRadius:8,cursor:"pointer",fontWeight:700,fontSize:13,textAlign:"left",display:"flex",alignItems:"center",gap:8}}>
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/></svg>
                  来院履歴
                </button>
                {!isReadOnlyReal&&(isAdmin||b.staff_id===user.id)&&(
                  <button onClick={()=>{openEdit(b);setBookingPopup(null);}} style={{width:"100%",padding:"9px 12px",background:"#f8fafc",color:"#374151",border:"1px solid #e2e8f0",borderRadius:8,cursor:"pointer",fontWeight:700,fontSize:13,textAlign:"left",display:"flex",alignItems:"center",gap:8}}>
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    予約を編集
                  </button>
                )}
                {!isReadOnlyReal&&(isAdmin||b.staff_id===user.id)&&(
                  <button onClick={()=>{setCancelModalBooking(b);setBookingPopup(null);}} style={{width:"100%",padding:"9px 12px",background:"#fef2f2",color:"#dc2626",border:"1px solid #fecaca",borderRadius:8,cursor:"pointer",fontWeight:700,fontSize:13,textAlign:"left",display:"flex",alignItems:"center",gap:8}}>
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
                    キャンセルにする
                  </button>
                )}
              </div>
            </div>
          </>
        );
      })()}

      {/* PatientHistoryModal removed - now shown inline in PatientsPanel */}
      {showBreakModal&&<BreakModal onClose={()=>setShowBreakModal(false)} bookings={bookings} breaks={breaks} setBreaks={setBreaks}/>}
      {cancelModalBooking&&<CancelModal booking={cancelModalBooking} bookings={bookings} todayStr={todayStr} storeStaffList={storeStaff} isAdmin={isAdmin} onClose={()=>setCancelModalBooking(null)} onConfirm={cancelBooking}/>}

      {delConfirm&&(
        <div className="confirm-box">
          <div style={{background:"white",borderRadius:14,padding:24,maxWidth:300,width:"100%",boxShadow:"0 16px 48px rgba(0,0,0,.2)"}}>
            <div style={{width:52,height:52,background:"#fef2f2",borderRadius:14,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 12px",fontSize:24}}>🗑</div>
            <div style={{fontWeight:800,fontSize:16,textAlign:"center",marginBottom:6,color:"#1e293b"}}>削除しますか？</div>
            <div style={{color:"#64748b",fontSize:13,textAlign:"center",marginBottom:20,lineHeight:1.6}}>{delConfirm.patient_name}さん<br/>{delConfirm.date} {delConfirm.time}</div>
            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>setDelConfirm(null)} className="btn btn-outline" style={{flex:1,justifyContent:"center",padding:11}}>キャンセル</button>
              <button onClick={()=>del(delConfirm.id)} className="btn btn-danger" style={{flex:1,justifyContent:"center",padding:11}}>削除する</button>
            </div>
          </div>
        </div>
      )}

      {iframeModal&&(
        <div style={{position:"fixed",inset:0,background:"rgba(15,23,42,.6)",zIndex:500,display:"flex",flexDirection:"column"}}>
          <div style={{background:"#1e3a5f",color:"white",padding:"10px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
            <div style={{fontWeight:800,fontSize:14}}>{iframeModal.title}</div>
            <button onClick={()=>setIframeModal(null)} style={{background:"rgba(255,255,255,.15)",border:"none",color:"white",borderRadius:8,padding:"6px 14px",cursor:"pointer",fontWeight:700,fontSize:13}}>✕ 閉じる</button>
          </div>
          <div style={{flex:1,background:"white"}}>
            <iframe src={iframeModal.url} title={iframeModal.title} allow="camera" style={{width:"100%",height:"100%",border:"none"}}/>
          </div>
        </div>
      )}

      {toast&&(<div className="toast" style={{background:toast.type==="delete"?"#1e293b":"#059669",color:"white"}}>{toast.type==="delete"?"削除しました":"✓ "}{toast.msg}</div>)}

      {/* 予約フォーム入力中に「カレンダーで確認」した場合、入力内容を保ったまま予約フォームへ戻れるようにする */}
      {form&&view!=="form"&&(
        <button onClick={()=>setView("form")} style={{position:"fixed",right:18,bottom:18,zIndex:500,background:"#1e3a5f",color:"white",border:"none",borderRadius:24,padding:"12px 18px",fontSize:13,fontWeight:800,boxShadow:"0 4px 16px rgba(0,0,0,.3)",cursor:"pointer",display:"flex",alignItems:"center",gap:8}}>
          📝 入力中の予約フォームに戻る
        </button>
      )}
    </div>
  );
}

function App(){
  const [user,setUser]=React.useState(null);
  const [checking,setChecking]=React.useState(true);

  React.useEffect(()=>{
    async function restoreSession(){
      try{
        const session=await sb.getSession();
        const saved=sessionStorage.getItem("ando_user");
        if(session&&saved){
          setUser(JSON.parse(saved));
        }
      }catch{}
      setChecking(false);
    }
    restoreSession();
  },[]);

  function handleLogin(u){
    try{sessionStorage.setItem("ando_user",JSON.stringify(u));}catch{}
    setUser(u);
  }
  function handleLogout(){
    try{sessionStorage.removeItem("ando_user");}catch{}
    sb.logout();
    setUser(null);
  }

  if(checking)return(<div className="loading"><div className="loading-spinner"></div><div style={{fontWeight:700,color:"#1e3a5f",fontSize:14}}>確認中...</div></div>);
  if(!user)return <LoginScreen onLogin={handleLogin}/>;
  return <Dashboard user={user} onLogout={handleLogout}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
