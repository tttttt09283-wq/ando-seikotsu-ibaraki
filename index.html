  quiz:[Q("中殿筋の主な働きはどれ？",["股関節の外転と骨盤の安定","股関節の屈曲","膝関節の伸展","足関節の底屈"],0,"中殿筋は外転と立脚時の骨盤安定。"),Q("大腿四頭筋を支配する神経は？",["脛骨神経","坐骨神経","大腿神経","閉鎖神経"],2,"大腿神経（L2〜L4）。"),Q("股関節屈曲の主動作筋は？",["大殿筋","腸腰筋","ハムストリングス","梨状筋"],1,"腸腰筋が主動作筋。")]},
 {id:"anat4",title:"神経系（脊髄神経と末梢神経）",min:20,
  points:["脊髄神経は31対（頸8・胸12・腰5・仙5・尾1）。","腕神経叢はC5〜T1。主な枝は筋皮神経・正中神経・尺骨神経・橈骨神経・腋窩神経。腰仙骨神経叢からは大腿神経・坐骨神経（脛骨神経と総腓骨神経に分かれる）が出る。","正中神経は手根管で絞扼されやすく（母指球の筋力低下・しびれ）、尺骨神経は肘部管で絞扼されやすい（小指・環指のしびれ）。橈骨神経麻痺では下垂手になる。","デルマトーム（皮膚分節）とミオトーム（筋節）で、障害されている神経根の高さを推測できる。"],
  clinical:"しびれの訴えでは、末梢神経の絞扼（手根管・肘部管）か、神経根の障害（頸椎・腰椎）かを、しびれの範囲と誘発動作で区別する。症状が進行性・筋力低下・膀胱直腸障害を伴う場合は医療機関への紹介を優先する。",
  quiz:[Q("脊髄神経の数は？",["12対","24対","31対","43対"],2,"頸8・胸12・腰5・仙5・尾1＝31対。"),Q("手根管症候群で障害される神経は？",["橈骨神経","尺骨神経","正中神経","筋皮神経"],2,"手根管を通るのは正中神経。"),Q("橈骨神経麻痺で典型的に見られるのは？",["猿手","鷲手","下垂手","ばね指"],2,"橈骨神経麻痺は下垂手（手関節が背屈できない）。")]},
 {id:"anat5",title:"循環器・呼吸器の基礎",min:15,
  points:["血液は体循環（左心室→全身→右心房）と肺循環（右心室→肺→左心房）を巡る。動脈は心臓から出る血管、静脈は心臓へ戻る血管。","手関節の橈骨動脈で脈を触れる（脈診・バイタル確認）。総頸動脈は頸部で触れる。","呼吸の主役は横隔膜（横隔神経・C3〜C5）と外肋間筋。吸気時に横隔膜が収縮して下がる。","リンパ系は組織液を回収して静脈に戻し、免疫にも関わる。"],
  clinical:"胸郭の動き（呼吸）は肩甲骨・胸椎の可動性と関連する。呼吸が浅く上部胸式になっていると、頸部・肩の筋（斜角筋・僧帽筋上部）が過緊張になりやすい。",
  quiz:[Q("左心室から出て全身へ向かう循環はどれ？",["肺循環","体循環","門脈循環","胎児循環"],1,"左心室→大動脈→全身が体循環。"),Q("横隔膜を支配する神経は？",["迷走神経","肋間神経","横隔神経","副神経"],2,"横隔神経（C3〜C5）。"),Q("脈を触れる代表的な部位はどれ？",["橈骨動脈","大腿骨","上腕三頭筋","アキレス腱"],0,"手関節の橈骨動脈。")]}
]},
{id:"phys",name:"生理学",icon:"🫀",color:"#dc2626",desc:"痛み・筋収縮・自律神経・循環・炎症のしくみを、施術の効果と結びつけて理解する",units:[
 {id:"phys1",title:"痛みの生理（侵害受容と疼痛抑制）",min:20,
  points:["痛みの信号は侵害受容器→末梢神経→脊髄後角→視床→大脳皮質へ伝わる。","Aδ線維（有髄・速い）は鋭い痛み、C線維（無髄・遅い）は鈍く長引く痛みを伝える。","ゲートコントロール説：触圧覚を伝えるAβ線維の刺激が、脊髄後角で痛みの伝達を抑える。さする・押さえると痛みが和らぐ理由の一つ。","下行性疼痛抑制系（セロトニン・ノルアドレナリン）やエンドルフィンも痛みを抑える。痛みは感情・睡眠・ストレスの影響も受ける。","内臓や深部の障害が離れた体表に痛みを感じさせるのが関連痛。"],
  clinical:"施術で痛みが和らぐ背景には、ゲートコントロールや下行性抑制、筋緊張の緩和などが関わる。慢性痛では組織の損傷だけでなく、感作（痛みに敏感な状態）や心理社会的要因も評価に入れる。",
  quiz:[Q("速く鋭い痛み（一次痛）を伝える線維は？",["Aδ線維","C線維","Aβ線維","Aα線維"],0,"Aδ線維は有髄で伝導が速い。"),Q("ゲートコントロール説で痛みの伝達を抑えるとされる刺激は？",["強い熱刺激","Aβ線維を介する触圧刺激","寒冷刺激のみ","無刺激"],1,"さする・押さえるなどのAβ線維刺激。"),Q("内臓疾患が体表の離れた部位の痛みとして現れることを何という？",["関連痛","幻肢痛","神経障害性疼痛","心因性疼痛"],0,"関連痛。")]},
 {id:"phys2",title:"筋収縮と筋・腱の感覚器",min:20,
  points:["運動神経の信号が神経筋接合部でアセチルコリンを放出し、筋小胞体からCa²⁺が出てアクチンとミオシンが滑り込む（滑走説）。収縮にはATPが必要。","遅筋（タイプⅠ）は持久力に優れ姿勢保持に働く。速筋（タイプⅡ）は瞬発力に優れる。","筋紡錘は筋の長さ（伸張）を感知し、伸張反射を起こす。ゴルジ腱器官は張力を感知し、過度な張力で筋を弛緩させる（自己抑制）。","筋の硬さ（筋緊張）は、神経の興奮、血流、筋膜・結合組織の状態などが関わる。"],
  clinical:"ストレッチでは、ゆっくり持続的に伸ばすと伸張反射が起きにくい。また収縮後の弛緩（等尺性収縮後のリラクゼーション）はゴルジ腱器官や相反抑制の利用として説明される。",
  quiz:[Q("筋収縮のときに神経筋接合部で放出される物質は？",["ドパミン","アセチルコリン","セロトニン","GABA"],1,"アセチルコリン。"),Q("筋の長さの変化を感知する受容器は？",["ゴルジ腱器官","筋紡錘","パチニ小体","マイスナー小体"],1,"筋紡錘が長さ、ゴルジ腱器官が張力。"),Q("姿勢保持に向いた持久型の筋線維は？",["タイプⅠ（遅筋）","タイプⅡb（速筋）","心筋線維","平滑筋線維"],0,"遅筋（タイプⅠ）。")]},
 {id:"phys3",title:"自律神経系",min:15,
  points:["自律神経は交感神経と副交感神経からなり、意識とは別に内臓・血管・汗腺などを調節する。","交感神経が優位になると、心拍数↑・血圧↑・瞳孔散大・消化抑制。副交感神経が優位になると、心拍数↓・消化促進・瞳孔縮小。","交感神経の節後線維の伝達物質はノルアドレナリン、副交感神経はアセチルコリン（節前線維はどちらもアセチルコリン）。","睡眠・ストレス・姿勢・呼吸のしかたが自律神経のバランスに影響する。"],
  clinical:"施術後の眠気・だるさ・体のぽかぽか感は、副交感神経が優位になる反応として説明できる。起立時のふらつきがある方には、施術後にゆっくり起き上がってもらうよう案内する。",
  quiz:[Q("交感神経が優位なときの変化として正しいのは？",["心拍数が増える","消化が促進される","瞳孔が縮小する","唾液が増える"],0,"交感神経優位で心拍数↑。"),Q("副交感神経の節後線維が放出する伝達物質は？",["ノルアドレナリン","アセチルコリン","アドレナリン","ドパミン"],1,"アセチルコリン。"),Q("リラックス・休息時に優位になるのは？",["交感神経","副交感神経","運動神経","感覚神経"],1,"副交感神経。")]},
 {id:"phys4",title:"循環・呼吸とバイタルサイン",min:15,
  points:["心拍出量＝1回拍出量×心拍数。血圧は心拍出量と末梢血管抵抗で決まる。","成人の安静時脈拍は60〜100回/分が目安。診察室血圧は140/90 mmHg以上で高血圧とされる。","呼吸数は成人でおよそ12〜20回/分。吸気は横隔膜と外肋間筋の収縮による。","バイタルサイン（体温・脈拍・血圧・呼吸・意識）は施術前に体調を把握する基本情報になる。"],
  clinical:"高血圧・糖尿病・抗凝固薬の服用がある方、発熱や強い倦怠感のある方は、施術内容（強さ・鍼の刺激量・施灸）を調整するか、医療機関の受診を勧める判断が必要になる。",
  quiz:[Q("心拍出量を表す式は？",["1回拍出量×心拍数","血圧×呼吸数","脈拍÷体温","心拍数÷血圧"],0,"心拍出量＝1回拍出量×心拍数。"),Q("診察室での高血圧の基準（収縮期/拡張期）は？",["120/80以上","130/85以上","140/90以上","160/100以上"],2,"診察室血圧140/90 mmHg以上。"),Q("バイタルサインに含まれないのは？",["体温","脈拍","血圧","身長"],3,"身長はバイタルサインではない。")]},
 {id:"phys5",title:"炎症と組織修復",min:15,
  points:["炎症の五徴候：発赤・熱感・腫脹・疼痛・機能障害。","組織修復は、炎症期（数日）→増殖期（数日〜数週）→成熟（リモデリング）期（数週〜数か月）の流れで進む。","急性期は安静・保護・過度な負荷を避ける。回復に合わせて、適切な負荷を段階的に加えることが組織の再生を助ける。","慢性的な痛みでは、炎症がなくても感作や筋緊張が続くことがある。"],
  clinical:"急性の外傷（捻挫・打撲）で、強い腫脹・熱感・変形・荷重不能がある場合は、骨折・靭帯断裂を疑って医療機関への受診を優先する。",
  quiz:[Q("炎症の五徴候に含まれないのは？",["発赤","熱感","しびれ","腫脹"],2,"発赤・熱感・腫脹・疼痛・機能障害。"),Q("組織修復の正しい順序は？",["炎症期→増殖期→成熟期","増殖期→炎症期→成熟期","成熟期→炎症期→増殖期","炎症期→成熟期→増殖期"],0,"炎症期→増殖期→成熟（リモデリング）期。"),Q("外傷後に強い腫脹・変形・荷重不能があるとき、まず優先することは？",["強めのマッサージ","医療機関の受診を勧める","ストレッチ","温める"],1,"骨折などを疑い受診を優先。")]}
]},
{id:"kine",name:"運動学",icon:"🏃",color:"#059669",desc:"関節運動・姿勢・歩行を、評価と動作指導に使える形で理解する",units:[
 {id:"kine1",title:"運動の面・軸と関節運動",min:15,
  points:["体の運動は3つの面で表す：矢状面（屈曲・伸展）、前額面（外転・内転・側屈）、水平面（回旋）。","運動の軸は、矢状面の運動＝左右軸、前額面の運動＝前後軸、水平面の運動＝垂直軸。","関節可動域（日本整形外科学会基準）の例：肩の屈曲・外転は180°、股関節の屈曲125°・伸展15°、膝の屈曲130°。","筋は主動作筋・拮抗筋・協力筋・固定筋が協調して働く。"],
  clinical:"可動域は「自動」と「他動」を比べる。他動は動くのに自動で動かない場合は筋力・神経の問題、他動でも動かない場合は関節・軟部組織・痛みの問題を疑う。",
  quiz:[Q("屈曲・伸展が起こる面は？",["矢状面","前額面","水平面","斜面"],0,"屈曲・伸展は矢状面。"),Q("前額面の運動の軸は？",["左右軸","前後軸","垂直軸","斜軸"],1,"前額面の運動は前後軸まわり。"),Q("他動では動くが自動では動かないとき、まず疑うのは？",["関節包の癒着","筋力低下や神経の問題","骨性の制限","皮膚の拘縮"],1,"自動運動のみ制限なら筋力・神経・痛みの影響。")]},
 {id:"kine2",title:"姿勢とアライメント",min:20,
  points:["理想的な立位（側面）の重心線は、耳垂→肩峰→大転子→膝関節（やや前方）→外果の前方を通る。","骨盤前傾は腰椎前弯を強め、後傾は腰椎前弯を減らす。猫背（円背）では胸椎後弯が増加し、頭部が前方に出る（前方頭位）。","上位交差症候群：大胸筋・上部僧帽筋・肩甲挙筋が短縮し、深頸屈筋・菱形筋・下部僧帽筋が弱化する。","下位交差症候群：腸腰筋・脊柱起立筋が短縮し、腹筋・殿筋が弱化する。"],
  clinical:"姿勢は「悪い・良い」ではなく、痛みや動作との関係で評価する。同じ姿勢でも症状が出る人・出ない人がいる。姿勢の指導は1〜2個の具体的な変化に絞ると続きやすい。",
  quiz:[Q("理想的な立位で側面の重心線が通る部位として正しいのは？",["耳垂・肩峰・大転子・外果の前方","つま先・膝・肩・頭頂","臍・膝・踵のみ","耳垂・肘・膝・つま先"],0,"耳垂→肩峰→大転子→膝やや前→外果の前方。"),Q("下位交差症候群で弱化しやすい筋は？",["腸腰筋","腹筋・殿筋","脊柱起立筋","大腿筋膜張筋"],1,"腸腰筋・脊柱起立筋は短縮、腹筋・殿筋は弱化。"),Q("上位交差症候群で短縮しやすい筋は？",["深頸屈筋","下部僧帽筋","大胸筋・上部僧帽筋","菱形筋"],2,"大胸筋・上部僧帽筋・肩甲挙筋が短縮。")]},
 {id:"kine3",title:"歩行の運動学",min:20,
  points:["歩行周期は立脚期（約60%）と遊脚期（約40%）。立脚期は踵接地→荷重応答→立脚中期→立脚終期→前遊脚期。","立脚中期には中殿筋が働いて骨盤を水平に保つ。中殿筋が弱いと、遊脚側の骨盤が下がる（トレンデレンブルグ徴候）。","歩行では、足部のアーチ・足関節・膝・股関節・骨盤・体幹が連動し、衝撃吸収と推進を行う。","歩幅・歩隔・左右差・足の接地の仕方（内側・外側荷重）を観察する。"],
  clinical:"片側の膝・股・腰の痛みでは、立脚期の左右差（骨盤の傾き、体幹の側屈）を観察すると、負担のかかり方のヒントになる。",
  quiz:[Q("歩行周期で立脚期が占める割合のおおよそは？",["約40%","約60%","約80%","約20%"],1,"立脚期は約60%、遊脚期は約40%。"),Q("トレンデレンブルグ徴候で弱化しているのは？",["大殿筋","中殿筋","腸腰筋","大腿四頭筋"],1,"中殿筋の弱化で遊脚側の骨盤が下がる。"),Q("歩行の「踵接地」は何期の始まり？",["遊脚期","立脚期","前遊脚期","立脚終期"],1,"踵接地で立脚期が始まる。")]},
 {id:"kine4",title:"肩関節と肩甲上腕リズム",min:20,
  points:["腕を挙上するとき、肩甲上腕関節と肩甲胸郭関節が協調して動く（肩甲上腕リズム）。全体の挙上180°のうち、おおよそ肩甲上腕関節120°：肩甲胸郭関節60°（2：1）。","肩甲骨の上方回旋には、僧帽筋（上部・下部）と前鋸筋が働く。","腕の挙上60〜120°あたりで痛みが出て、それを過ぎると軽減する現象をペインフルアーク（有痛弧）といい、肩峰下インピンジメントを疑う所見の一つ。","肩の動きは、胸椎の伸展・胸郭の動きにも影響される。"],
  clinical:"挙上時に肩をすくめる（上部僧帽筋の過活動）、肩甲骨が浮く（翼状肩甲）などは肩甲骨の安定性の低下を示す。肩の治療では、肩甲骨と胸椎のアプローチもセットで考える。",
  quiz:[Q("肩甲上腕リズムの目安は？",["1：1","2：1（肩甲上腕：肩甲胸郭）","1：2","3：1"],1,"おおよそ2：1。"),Q("肩甲骨の上方回旋に主に働く筋は？",["前鋸筋・僧帽筋","大胸筋・小胸筋","広背筋・大円筋","肩甲挙筋・菱形筋"],0,"前鋸筋と僧帽筋（上部・下部）。"),Q("ペインフルアーク（有痛弧）が出やすい挙上角度は？",["0〜30°","60〜120°","150〜180°","どの角度でも同じ"],1,"60〜120°付近で痛み、肩峰下インピンジメントを疑う所見。")]},
 {id:"kine5",title:"腰椎・骨盤・股関節の連動",min:20,
  points:["体幹の前屈は、腰椎の屈曲と骨盤の前傾（股関節の屈曲）が連動する（腰椎骨盤リズム）。","股関節の可動域が小さいと、腰椎でその分を補い、腰への負担が増える。","腰椎は屈曲・伸展、胸椎は回旋が得意、股関節は全方向に動く。「腰は動きすぎ、胸椎・股関節は動かなすぎ」が腰痛の背景にあることが多い。","腹腔内圧と腹横筋・多裂筋・骨盤底筋・横隔膜が体幹の安定性（コア）を作る。"],
  clinical:"前屈で痛い、後屈で痛い、回旋で痛い、といった動作の違いから、どの動作が負担かを評価し、動作指導（股関節から曲げる、胸椎を動かす）につなげる。",
  quiz:[Q("体幹前屈で腰椎と連動して動くのは？",["骨盤の前傾（股関節屈曲）","肩甲骨の挙上","足関節の背屈のみ","頸椎の回旋"],0,"腰椎骨盤リズム。"),Q("股関節の可動域が小さいと起こりやすいのは？",["腰椎への負担が増える","膝の可動域が増える","肩が下がる","姿勢が改善する"],0,"股関節で動けない分を腰椎が補う。"),Q("一般に回旋が得意な脊柱の部位は？",["腰椎","胸椎","仙椎","尾椎"],1,"胸椎は回旋が得意、腰椎は屈曲・伸展。")]}
]},
{id:"toyo",name:"東洋医学",icon:"☯️",color:"#7c3aed",desc:"陰陽五行・気血津液・臓腑・四診の考え方を、日々の問診と施術に活かす",units:[
 {id:"toyo1",title:"陰陽論と五行説",min:15,
  points:["陰陽：対立・互根・消長・転化の関係。例：天（陽）と地（陰）、昼（陽）と夜（陰）、熱（陽）と寒（陰）。","五行は木・火・土・金・水。相生（木→火→土→金→水→木）は育てる関係、相克（木→土→水→火→金→木）は抑える関係。","五臓は五行に配当される：肝＝木、心＝火、脾＝土、肺＝金、腎＝水。","五行は季節・色・味・感情などにも対応する（例：肝＝春・青・酸・怒、心＝夏・赤・苦・喜）。"],
  clinical:"五行の関係は、体の不調の連鎖を考える「ものさし」。例えばストレスで肝が高ぶると（木）、脾（土）を抑えて消化が落ちる（木克土）という見方をする。",
  quiz:[Q("相生の関係として正しいのは？",["木→火","木→土","火→金","金→木"],0,"相生：木→火→土→金→水→木。"),Q("五行で「脾」が配当されるのは？",["木","火","土","金"],2,"脾＝土。"),Q("五行の相克として正しいのは？",["水→木","火→金","土→火","木→水"],1,"相克：木→土→水→火→金→木。火は金を克す。")]},
 {id:"toyo2",title:"気・血・津液",min:15,
  points:["気は生命活動のエネルギー。作用は推動・温煦・防御・固摂・気化。","血は全身を栄養し潤す。津液は血以外の体液（汗・唾液・涙など）の総称。","気の失調：気虚（疲れやすい・息切れ）、気滞（張る・イライラ・ため息）、気逆（ほてる・のぼせ・吐き気）。","血の失調：血虚（めまい・乾燥・顔色が悪い）、瘀血（固定した刺すような痛み・暗い舌）。"],
  clinical:"「肩こり」でも、気滞（ストレス・張る感じ）なのか、瘀血（固定痛・長引く）なのか、血虚（疲労・冷え・乾燥）なのかで、選ぶ経穴や施術の強さが変わる。",
  quiz:[Q("気虚の症状として当てはまるのは？",["疲れやすい・息切れ","固定した刺す痛み","張る・ため息","のぼせ・ほてり"],0,"気虚＝エネルギー不足。"),Q("固定した刺すような痛みが特徴の病態は？",["気虚","瘀血","津液不足","気逆"],1,"瘀血は固定性の刺痛。"),Q("気の作用として含まれないのは？",["推動","温煦","防御","分泌"],3,"気の作用は推動・温煦・防御・固摂・気化。")]},
 {id:"toyo3",title:"臓腑（五臓六腑）",min:20,
  points:["五臓（肝・心・脾・肺・腎）は「貯蔵」、六腑（胆・小腸・胃・大腸・膀胱・三焦）は「受け渡し」の働き。","肝：蔵血・疏泄（気の流れをスムーズにする）、目に開竅。心：血脈を主り神（精神）を蔵す、舌に開竅。脾：運化（消化吸収）・統血、口に開竅。肺：呼吸を主り、皮毛・鼻に開竅。腎：蔵精・納気・水の代謝、耳に開竅。","臓と腑は表裏の関係：肝—胆、心—小腸、脾—胃、肺—大腸、腎—膀胱。","東洋医学の臓腑は解剖学の臓器と同じではなく、機能のまとまりとして捉える。"],
  clinical:"耳鳴りや腰のだるさは腎、目の疲れ・筋のこわばりは肝、食欲不振・むくみは脾、など、症状と臓腑を結びつけると、問診の質問の幅が広がる。",
  quiz:[Q("「疏泄」を主るのはどの臓？",["肝","心","肺","腎"],0,"肝は疏泄（気の流れの調整）。"),Q("脾と表裏の関係にある腑は？",["胆","胃","大腸","膀胱"],1,"脾—胃。"),Q("耳に開竅するのは？",["肝","脾","肺","腎"],3,"腎は耳に開竅。")]},
 {id:"toyo4",title:"四診と弁証",min:20,
  points:["四診：望診（見る：顔色・舌・姿勢）、聞診（聞く・嗅ぐ：声・呼吸・におい）、問診（聞く：症状・生活）、切診（触れる：脈診・腹診・切経）。","八綱弁証：陰陽・表裏・寒熱・虚実で、病態の大まかな方向を捉える。","舌診：舌質（色・形）と舌苔（厚さ・色）を見る。例：淡白舌＝虚・寒、紅舌＝熱、紫舌＝瘀血、厚い苔＝湿・食積など。","脈診：浮・沈・遅・数・弦・滑など。ただ脈の名前を覚えるのでなく、患者さんの訴えと照らして使う。"],
  clinical:"問診では、痛みの性質（ズキズキ・重い・張る・刺す）、増悪因子（冷え・動作・天候）、時間帯、睡眠・食欲・便通・月経を聞くと、証を立てる材料になる。",
  quiz:[Q("四診に含まれないのは？",["望診","聞診","問診","画像診"],3,"四診＝望・聞・問・切。"),Q("八綱弁証の組み合わせは？",["陰陽・表裏・寒熱・虚実","五行・六腑・気血・津液","風寒・暑湿・燥火・熱","木火土金水"],0,"八綱＝陰陽・表裏・寒熱・虚実。"),Q("切診に含まれるのは？",["舌診","脈診","聞診","声の確認"],1,"切診＝脈診・腹診・切経など。舌診は望診。")]},
 {id:"toyo5",title:"鍼灸の基本と安全管理",min:20,
  points:["補法は虚を補う（弱く・短く・浅く）、瀉法は実を取り除く（強く・やや長く）。患者さんの体力・反応・部位で刺激量を調整する。","感染予防：ディスポーザブル鍼の使用、手指衛生、刺鍼部位の消毒、使用後の鍼は医療廃棄。","安全管理：抜鍼時の本数確認、気胸（胸背部の深刺に注意）、折鍼、脳貧血（鍼酔い）、出血・皮下出血、灸の火傷に配慮する。","妊娠中・出血傾向・抗凝固薬服用・感染部位・皮膚疾患などは、禁忌または慎重に対応すべき場合がある。事前問診で必ず確認する。"],
  clinical:"初回は特に、既往歴・服薬・妊娠の可能性・体調を確認し、同意を得てから施術する。迷ったら刺激量を下げ、必要なら医療機関へ紹介する。",
  quiz:[Q("鍼の使用前後で必ず行うのは？",["使い回し","ディスポ鍼の使用と本数確認","消毒をしない","廃棄しない"],1,"ディスポ鍼の使用と抜鍼時の本数確認。"),Q("背部・胸部への深い刺鍼で特に注意すべき有害事象は？",["気胸","便秘","むくみ","耳鳴り"],0,"胸背部は気胸のリスク。"),Q("抗凝固薬を服用している患者さんへの対応は？",["通常通りに強く刺激する","事前に確認し、慎重に（刺激量を下げる・必要なら紹介）","説明せず施術","灸のみを多用"],1,"出血傾向があるため事前確認と慎重な対応。")]}
]},
{id:"meri",name:"経絡経穴",icon:"📍",color:"#d97706",desc:"十四経脈の流れと、臨床でよく使う経穴の位置・働きを覚える",units:[
 {id:"meri1",title:"十四経脈の概要と流注",min:20,
  points:["十二経脈＋任脈・督脈＝十四経。十二経脈は手の三陰・手の三陽・足の三陽・足の三陰に分かれる。","流注の順番：肺→大腸→胃→脾→心→小腸→膀胱→腎→心包→三焦→胆→肝（そして肺に戻る）。","手の三陰は胸から手へ、手の三陽は手から頭へ、足の三陽は頭から足へ、足の三陰は足から腹・胸へ流れる。","陽経は主に体の外側・背側、陰経は内側・腹側を走る。任脈は体の前面正中、督脈は背面正中を走る。"],
  clinical:"痛みの部位を走る経絡を考えると、遠隔の経穴（例：腰痛に委中、頭痛に合谷）を選ぶ根拠になる。まずは「どこを通る経絡か」を言えることが臨床の第一歩。",
  quiz:[Q("十二経脈の流注で、肺経の次に流れるのは？",["胃経","大腸経","脾経","心経"],1,"肺→大腸→胃→脾→心→小腸…"),Q("督脈が走行する場所は？",["体の前面正中","体の背面正中","体の外側","手の内側"],1,"督脈は背面正中、任脈は前面正中。"),Q("足の三陽経が流れる方向は？",["足から頭","頭から足","手から頭","胸から手"],1,"足の三陽は頭から足へ。")]},
 {id:"meri2",title:"経穴の取り方（同身寸と骨度法）",min:20,
  points:["同身寸（指寸法）：患者さん自身の指を物差しにする。母指の幅＝1寸、示指〜小指の4本を揃えた幅（横指4本）＝3寸。","骨度法：体の骨の長さを基準に等分して寸を決める。例：前腕（肘横紋〜手関節横紋）12寸、下腿（膝窩横紋〜外果尖）16寸、臍〜恥骨結合上縁5寸、両乳頭間8寸。","後背部では、後正中線から肩甲骨内縁までが3寸。","経穴は骨の際・筋の間・くぼみ・動脈拍動部に多い。触れて圧痛・硬結・陥凹・冷え・熱などの反応（反応点）を確認して決める。"],
  clinical:"体格差があるため、必ず患者さん本人の寸法で取る。位置は「教科書の数字」と「触れて見つかる反応」を合わせて決める。",
  quiz:[Q("骨度法で、下腿（膝窩横紋〜外果尖）は何寸？",["10寸","12寸","16寸","19寸"],2,"下腿16寸、前腕12寸。"),Q("横指4本（示指〜小指）の幅は何寸とする？",["1寸","2寸","3寸","5寸"],2,"4横指＝3寸。"),Q("同身寸で基準にするのは？",["施術者の指","患者さん本人の指・体","統一した定規","年齢の平均値"],1,"患者さん本人の体の寸法で取る。")]},
 {id:"meri3",title:"要穴（特定穴）の分類",min:25,
  points:["要穴の例：五兪穴（井・滎・兪・経・合）、原穴、絡穴、郄穴、募穴、背部兪穴、八会穴、交会穴。","原穴（臓腑の原気が集まる）の例：肺＝太淵、大腸＝合谷、胃＝衝陽、脾＝太白、心＝神門、小腸＝腕骨、膀胱＝京骨、腎＝太谿、心包＝大陵、三焦＝陽池、胆＝丘墟、肝＝太衝。","募穴（腹・胸にある臓腑の気が集まる穴）の例：胃＝中脘、大腸＝天枢、小腸＝関元、膀胱＝中極、胆＝日月、肝＝期門、心包＝膻中。","背部兪穴（背中にある臓腑の気が注ぐ穴）の例：肺兪＝第3胸椎、心兪＝第5胸椎、膈兪＝第7胸椎、肝兪＝第9胸椎、脾兪＝第11胸椎、胃兪＝第12胸椎、腎兪＝第2腰椎、大腸兪＝第4腰椎（棘突起の下外方1.5寸）。"],
  clinical:"臓腑の不調は、背部兪穴（背中）と募穴（腹・胸）の反応を診て、両方を組み合わせる（兪募配穴）。原穴は、その経絡の本質的な不調に使う。",
  quiz:[Q("大腸の原穴は？",["曲池","合谷","足三里","内関"],1,"大腸の原穴は合谷。"),Q("胃の募穴は？",["天枢","関元","中脘","期門"],2,"胃の募穴は中脘（天枢は大腸の募穴）。"),Q("腎兪はどの高さ？",["第5胸椎","第9胸椎","第2腰椎","第5腰椎"],2,"第2腰椎棘突起の下、外方1.5寸。")]},
 {id:"meri4",title:"頸・肩・腰の主要経穴",min:25,
  points:["風池（GB20）：後頭骨の下、胸鎖乳突筋と僧帽筋の間のくぼみ。頭痛・頸のこり・眼精疲労。","天柱（BL10）：後髪際で僧帽筋外縁。頸のこり・頭痛。大椎（GV14）：第7頸椎棘突起の下。","肩井（GB21）：大椎と肩峰外縁の中点。肩こり。妊娠中は慎重に（刺激が強くなりすぎない）。","腎兪（BL23）・大腸兪（BL25）：腰痛の基本穴。志室（BL52）は腎兪の外3寸。委中（BL40）：膝窩横紋の中央、腰痛・坐骨神経痛。環跳（GB30）：殿部、坐骨神経痛。"],
  clinical:"腰痛では、局所（腎兪・大腸兪・志室）と遠隔（委中・承山）の組み合わせが基本。肩こりでは、肩井だけでなく天柱・風池・肩甲間部（膈兪など）の反応も確認する。",
  quiz:[Q("膝窩横紋の中央にあり、腰痛によく使う経穴は？",["委中","足三里","三陰交","太衝"],0,"委中（BL40）。"),Q("肩井は何と何の中点？",["風池と天柱","大椎と肩峰外縁","大椎と腎兪","肩髃と曲池"],1,"大椎と肩峰外縁の中点。"),Q("志室は腎兪の外方何寸？",["1.5寸","3寸","4.5寸","6寸"],1,"腎兪の外3寸。")]},
 {id:"meri5",title:"四肢の主要経穴",min:25,
  points:["合谷（LI4）：手背、第1・第2中手骨の間。頭痛・歯痛・顔面の症状。曲池（LI11）：肘を曲げたときの肘横紋の橈側端。","内関（PC6）：手関節掌側横紋の上2寸、長掌筋腱と橈側手根屈筋腱の間。吐き気・胸のつかえ・動悸。","足三里（ST36）：外膝眼（犢鼻）の下3寸、脛骨前縁から外方1横指。胃腸・全身の調整。三陰交（SP6）：内果尖の上3寸、脛骨内縁の後ろ。婦人科症状・冷え。","太衝（LR3）：足背、第1・第2中足骨底の間。陽陵泉（GB34）：腓骨頭の前下方のくぼみ、筋会。湧泉（KI1）：足底のくぼみ。"],
  clinical:"合谷・三陰交は妊娠中は禁忌または慎重とされる穴として扱う。問診で妊娠の可能性を必ず確認する。",
  quiz:[Q("内関の位置は？",["手関節掌側横紋の上2寸","手関節背側の上3寸","肘窩の中央","足関節の前方"],0,"手関節掌側横紋の上2寸。"),Q("足三里の位置として正しいのは？",["犢鼻の下3寸・脛骨前縁から1横指外","内果の上3寸","腓骨頭の後方","膝窩の中央"],0,"犢鼻の下3寸、脛骨前縁から外方1横指。"),Q("妊娠中に特に慎重に扱う穴はどれ？",["合谷・三陰交","曲池のみ","足三里のみ","太衝のみ"],0,"合谷・三陰交は妊娠中は慎重・禁忌とされる。")]}
]},
{id:"fascia",name:"筋膜",icon:"🕸️",color:"#0891b2",desc:"筋膜の構造と、筋膜ライン・トリガーポイント・リリースの考え方を学ぶ",units:[
 {id:"fas1",title:"筋膜とは（構造と役割）",min:15,
  points:["筋膜は、コラーゲン線維・エラスチン・基質（ヒアルロン酸など）からなる連続した結合組織のネットワーク。","浅筋膜（皮下組織）と深筋膜（筋を包む膜）がある。筋は内側から筋内膜・筋周膜・筋外膜に包まれる。","筋膜には自由神経終末やルフィニ小体・パチニ小体などの感覚受容器があり、固有感覚や痛みに関与する。","胸腰筋膜は広背筋・大殿筋・脊柱起立筋などをつなぎ、腰部の安定に関わる。"],
  clinical:"筋だけでなく、それを包む膜・皮下組織・皮膚の滑りも評価する。皮膚をつまんだり動かしたときの滑りの左右差は、簡単な評価になる。",
  quiz:[Q("筋を包む筋膜の層のうち、最も外側にあるのは？",["筋内膜","筋周膜","筋外膜","筋鞘"],2,"筋外膜（内側から筋内膜・筋周膜・筋外膜）。"),Q("筋膜の基質に含まれる代表的な成分は？",["ヒアルロン酸","ヘモグロビン","インスリン","ミオグロビン"],0,"ヒアルロン酸などの基質。"),Q("胸腰筋膜が連結する筋の組み合わせとして正しいのは？",["広背筋と大殿筋","上腕二頭筋と大胸筋","咬筋と側頭筋","腓腹筋と前脛骨筋のみ"],0,"広背筋・大殿筋・脊柱起立筋などをつなぐ。")]},
 {id:"fas2",title:"筋膜ライン（アナトミー・トレイン）",min:25,
  points:["トーマス・マイヤーズの「アナトミー・トレイン」は、筋・筋膜が連なる線（ライン）として体を捉える考え方。","表層後線（SBL）：足底筋膜→下腿三頭筋→ハムストリングス→仙結節靭帯→脊柱起立筋→後頭部→頭皮。表層前線（SFL）：足背→前脛骨筋→大腿四頭筋→腹直筋→胸鎖乳突筋。","外側線（LL）：体の側面（腓骨筋・腸脛靭帯・外腹斜筋など）。らせん線（SPL）：体をらせん状に巻く（回旋・バランス）。","他に、前方・後方機能線、深前線（DFL：体幹深部の安定、腸腰筋など）、腕のライン。"],
  clinical:"「ふくらはぎや足底を緩めると前屈が変わる」といった遠隔部位の変化を、後線（SBL）の連続として説明できる。ただしラインは仮説として臨床に使い、触診・評価の結果と合わせて判断する。",
  quiz:[Q("表層後線（SBL）の始まりは？",["足底筋膜","腹直筋","胸鎖乳突筋","腸脛靭帯"],0,"足底筋膜から始まり頭皮へ。"),Q("体の側面を走るラインは？",["表層前線","外側線","表層後線","深前線"],1,"外側線（LL）。"),Q("体幹深部の安定に関わるラインは？",["深前線（DFL）","表層後線","らせん線","腕のライン"],0,"深前線（DFL）。")]},
 {id:"fas3",title:"癒着・滑走とトリガーポイント",min:20,
  points:["筋膜の層同士が滑り合うことで動きがスムーズになる。ヒアルロン酸の粘性が高くなる（高密度化）と滑走が悪くなり、動きの制限や痛みにつながるとされる。","トリガーポイント（TrP）：筋の中の索状硬結（taut band）上にある過敏な圧痛点。押すと関連痛が出る、局所単収縮反応が出ることがある。","筋・筋膜性疼痛の背景：過負荷・同一姿勢・外傷・ストレス・睡眠不足。","鍼・圧迫・ストレッチ・動作改善でTrPを緩和し、原因（姿勢・使い方）を同時に改善する。"],
  clinical:"圧痛点を見つけたら「そこだけ」でなく、関連痛のパターン（例：僧帽筋上部→側頭・こめかみ）と、原因となる筋の過負荷を考える。",
  quiz:[Q("トリガーポイントの特徴として正しいのは？",["索状硬結上の圧痛点で、関連痛を出すことがある","常に骨の上にある","痛みを出さない","皮膚のみの病変"],0,"索状硬結上の圧痛点＋関連痛。"),Q("筋膜の「滑走」が悪くなると起こりやすいのは？",["可動域の制限や痛み","可動域の拡大","血圧の低下","筋力の増加"],0,"動きの制限・痛みにつながる。"),Q("TrPの施術後に併せて行うとよいのは？",["原因となる姿勢・使い方の改善","放置","同じ強さで長時間の圧迫","安静のみ"],0,"原因（姿勢・使い方）の改善を併せて行う。")]},
 {id:"fas4",title:"筋膜リリースの考え方と安全",min:20,
  points:["持続圧：組織の抵抗（バリア）を感じる位置で、ゆっくり圧をかけて待つ。数十秒〜数分、組織がゆるむのを待つ。","痛みの強さ：患者さんが「痛いが気持ちいい」程度までにし、顔をしかめたり息を止める強さは避ける。防御的な筋収縮は逆効果。","方向は、皮膚→筋膜の層→筋の順に、ライン上の関連部位も含めて考える。施術前後で可動域・痛み（NRS）を確認して効果を判断する。","禁忌・慎重：急性炎症・骨折・感染・悪性腫瘍・深部静脈血栓症・重い骨粗鬆症・抗凝固薬服用・皮膚疾患のある部位。"],
  clinical:"施術の効果が出にくいときは、強さを上げる前に、姿勢・呼吸・動作（使い方）の影響を見直す。必ず施術前後に評価し、変化を患者さんと共有する。",
  quiz:[Q("筋膜リリースの圧のかけ方として適切なのは？",["ゆっくり持続的に、組織のバリアを感じて待つ","できるだけ強く素早く","痛みを我慢してもらう","毎回同じ強さのみ"],0,"ゆっくり持続的に。"),Q("慎重または禁忌となるのは？",["深部静脈血栓症の疑い","軽い筋のこり","慢性の肩こり","姿勢の乱れ"],0,"DVTの疑いは禁忌・医療機関へ。"),Q("施術の効果を判断するために行うことは？",["施術前後の可動域と痛みの比較","何も評価しない","患者さんの感想を聞かない","強さを変えず時間のみ"],0,"前後評価（可動域・NRS）。")]},
 {id:"fas5",title:"姿勢・動作から筋膜ラインを評価する",min:20,
  points:["前屈で後ろ（ハムストリングス〜ふくらはぎ〜足底）が突っ張る → 表層後線（SBL）の制限を疑う。","後屈で前面（股関節前〜腹部〜胸）が突っ張る → 表層前線（SFL）・深前線の制限を疑う。","側屈・体幹の側面の突っ張り → 外側線（LL）、回旋の左右差 → らせん線（SPL）を疑う。","評価→（遠隔部位も含む）施術→再評価、の流れで「どこを触ると変わるか」を確認し、患者さん自身でできるセルフケアに落とし込む。"],
  clinical:"ラインの評価は、症状のある局所だけを見ないための視点。施術後の再評価で動きが変わらない場合は、ラインの仮説を見直し、他の要因（関節・神経・痛みの感作）を検討する。",
  quiz:[Q("前屈でふくらはぎや太もも裏が突っ張るとき、まず疑うラインは？",["表層後線（SBL）","表層前線（SFL）","外側線","腕のライン"],0,"前屈の制限は後線（SBL）を疑う。"),Q("後屈で体の前面が突っ張るとき、疑うラインは？",["表層前線（SFL）","表層後線","らせん線のみ","腕のラインのみ"],0,"後屈の制限は前線を疑う。"),Q("評価→施術→再評価を行う主な目的は？",["変化を確認し、仮説と施術が合っているか検証する","時間を延ばす","説明を省く","料金を決める"],0,"変化の確認で仮説を検証する。")]}
]}
,{id:"exam",name:"部位別の検査と評価",icon:"🔍",color:"#be185d",desc:"部位ごとの検査の種類・やり方・陽性の意味と、評価の考え方（症例パターン付き）",units:[
 {id:"exam1",title:"評価の流れと考え方（臨床推論・レッドフラッグ）",min:20,
  points:["評価の流れ：①問診（主訴・いつから・きっかけ・どの動作で・痛みの性質・経過・既往・服薬）→②視診（姿勢・腫れ・変形・歩き方）→③触診（圧痛・熱感・腫脹・筋緊張）→④可動域（自動→他動→抵抗）→⑤徒手検査（整形外科的・神経学的）→⑥動作評価→⑦仮説を立てて施術→⑧再評価。","健側から先に、痛くない動きから先に検査する。痛みを出す動作は最後にする。","1つの検査だけで決めつけない。問診・圧痛・可動域・誘発テストなど複数の所見がそろうかを見る。陽性は「その組織が症状に関わっている可能性が高い」という意味で、診断の確定ではない。","検査の目的は4つ：①受診・紹介が必要かのふるい分け（レッドフラッグ）②痛みの原因組織の絞り込み③動作・機能の問題の把握④施術効果の確認（前後比較）。","レッドフラッグ（受診を優先）：発熱・原因不明の体重減少、夜間や安静時に強くなる痛み、悪性腫瘍の既往、進行する筋力低下やしびれ、膀胱・直腸の障害や会陰部のしびれ、強い外傷後の変形や荷重不能、胸痛・息苦しさ・冷や汗、片側ふくらはぎの腫れ・熱感・痛み。","イエローフラッグ（長引く要因）：不安・恐怖で動かさない、仕事や家庭のストレス、睡眠不足、「治らない」という思い込み。説明と動かす安心感づくりが必要。"],
  clinical:"所見は必ず左右差・前後差で記録する（例：SLR 右45°痛・左70°）。再評価で変化が出ない場合は、仮説を見直す。レッドフラッグがあるときは、無理に施術を続けず受診を勧め、その判断を記録に残す。",
  quiz:[Q("評価の順番として適切なのは？",["問診→視診→触診→可動域→徒手検査→施術→再評価","いきなり強い徒手検査から","施術→問診→再評価","徒手検査のみ"],0,"問診から始め、最後に再評価で確認する。"),Q("レッドフラッグに当たるのは？",["夜間や安静時にも強まる痛みと体重減少","動かすと軽い痛み","朝にこわばる程度","肩のこり"],0,"夜間・安静時痛や原因不明の体重減少は受診を優先。"),Q("1つの整形外科的テストが陽性だったとき、適切な解釈は？",["診断が確定した","他の所見と合わせて、関与の可能性を判断する","無視する","施術を強くする"],1,"複数の所見がそろうかを見る。"),Q("検査の順序で適切なのは？",["痛い側・痛い動作から先に","健側・痛くない動作から先に","順不同","動かさずに触診のみ"],1,"健側から先に、痛みを出す動作は最後に。")]},
 {id:"exam2",title:"頸部・胸郭出口の検査",min:25,
  tests:[
   {name:"スパーリングテスト",how:"座位で頸部を患側へ側屈・軽く伸展させ、頭頂部から下向きに圧迫する。",pos:"患側の上肢へ放散痛・しびれが出る → 頸椎の神経根症状を疑う。"},
   {name:"ジャクソン圧迫テスト",how:"頸部を後屈して患側へ傾け（または回旋し）、頭頂部から圧迫する。",pos:"上肢への放散痛 → 神経根（椎間孔の狭小）。"},
   {name:"頸椎牽引（ディストラクション）テスト",how:"仰臥位または座位で、頭部をゆっくり上方へ牽引する。",pos:"症状が軽くなる → 神経根の圧迫が関与。"},
   {name:"ショルダーデプレッションテスト",how:"頸部を健側へ側屈させ、患側の肩を下方へ押し下げる。",pos:"患側の頸部〜上肢に痛み・放散痛 → 神経根への牽引ストレス・癒着。"},
   {name:"アドソンテスト",how:"患側の橈骨動脈を触れながら、上肢を伸展・外転し、頸部を後屈・患側へ回旋して深く息を吸う。",pos:"脈拍の減弱・消失、症状の誘発 → 斜角筋部での胸郭出口の圧迫。"},
   {name:"ライトテスト",how:"上肢を過外転（約120°以上）・外旋して脈拍を触れる。",pos:"脈拍の減弱・症状の誘発 → 小胸筋下の圧迫（過外転症候群）。"},
   {name:"ルースの3分間挙上負荷テスト",how:"肩を外転90°・外旋、肘90°屈曲で、手を3分間ゆっくり握って開く。",pos:"しびれ・だるさで続けられない → 胸郭出口症候群を疑う。"}],
  points:["頸の症状は大きく4つのパターンで考える：①神経根型（上肢の放散痛・しびれ、頸の後屈・側屈で増悪）②筋・筋膜型（局所のこり・圧痛、関連痛、上肢の神経症状なし）③胸郭出口型（腕を上げる・荷物を持つと症状）④脊髄型（両手のしびれ・細かい動作の障害・歩行のふらつき）。","④の脊髄型（頸髄症）が疑われるときは、ホフマン徴候・腱反射の亢進などを確認し、医療機関への受診を勧める。","頸部の強い後屈・回旋・牽引は、めまい・失神・しびれの悪化がないかを確認しながら行う。症状が出たらすぐ中止する。"],
  clinical:"頸のテストは、上肢のしびれが「どの指に出ているか」（親指側＝C6、中指＝C7、小指側＝C8）とセットで解釈する。陽性でも、画像所見がなくても、神経症状の経過（広がる・悪化する）を見ながら紹介のタイミングを決める。",
  quiz:[Q("スパーリングテストで陽性と判断するのは？",["患側上肢への放散痛・しびれの誘発","頸部のこりの軽減","脈拍の増加","めまいが消える"],0,"圧迫で患側上肢に放散痛が出れば陽性。"),Q("頸椎牽引テストで症状が軽減したときに示唆されるのは？",["神経根の圧迫","筋肉痛のみ","胸郭出口の動脈圧迫のみ","異常なし"],0,"牽引で楽になる＝神経根圧迫の関与。"),Q("橈骨動脈の脈拍の減弱を見て胸郭出口の圧迫を確認するテストは？",["アドソンテスト・ライトテスト","スパーリングテスト","ホフマン徴候","SLR"],0,"アドソン・ライトは脈拍の変化を見る。"),Q("両手のしびれと細かい動作の障害・歩行のふらつきがあるとき、まず考えるのは？",["頸髄症の可能性として受診を勧める","筋疲労","通常の肩こり","通常の寝違え"],0,"脊髄症状が疑われるため受診を優先。")]},
 {id:"exam3",title:"肩の検査（インピンジメント・腱板・二頭筋・不安定性）",min:30,
  tests:[
   {name:"ペインフルアーク",how:"自動で腕を横から挙上してもらい、痛みの出る角度を確認する。",pos:"60〜120°で痛み、それを過ぎると軽減 → 肩峰下インピンジメント。"},
   {name:"ホーキンス・ケネディテスト",how:"肩を90°屈曲、肘を90°屈曲し、他動的に肩を内旋する。",pos:"肩前外側の痛み → 肩峰下インピンジメント。"},
   {name:"ニアーテスト",how:"肩甲骨を固定し、前腕を回内した腕を他動的に最大屈曲する。",pos:"肩の痛み → 肩峰下インピンジメント。"},
   {name:"ドロップアームサイン",how:"他動的に外転90°にした腕をゆっくり下ろしてもらう。",pos:"ゆっくり下ろせず落ちる → 腱板（特に棘上筋）の大きな断裂を疑う。"},
   {name:"ジョブテスト（empty can）",how:"肩90°外転・水平屈曲30°・内旋位（親指を下）で、上から下方へ抵抗をかける。",pos:"痛み・脱力 → 棘上筋。"},
   {name:"外旋抵抗テスト",how:"肘90°屈曲・上腕を体側につけ、外旋方向に抵抗する。",pos:"痛み・脱力 → 棘下筋・小円筋。"},
   {name:"リフトオフテスト",how:"手の甲を腰に当て、背中から離してもらう（さらに抵抗をかける）。",pos:"離せない・脱力 → 肩甲下筋。"},
   {name:"スピードテスト",how:"肘を伸ばし、前腕を回外して肩を90°屈曲、下方へ抵抗をかける。",pos:"結節間溝の痛み → 上腕二頭筋長頭腱炎。"},
   {name:"ヤーガソンテスト",how:"肘90°屈曲・前腕回内位から、回外に抵抗しながら外旋してもらう。",pos:"結節間溝の痛み → 上腕二頭筋長頭腱。"},
   {name:"アプリヘンションテスト",how:"肩90°外転・外旋位で、前方へ押す方向の力を加える。",pos:"脱臼しそうな不安感・恐怖感 → 肩の前方不安定性。"}],
  points:["肩の痛みは、肩の中（腱板・関節包・二頭筋腱・関節）と、肩の外（頸・胸椎・肩甲骨・内臓）に分けて考える。頸の動きで症状が変わるか、内臓疾患のサイン（冷や汗・胸痛）がないかも確認する。","動きの特徴：凍結肩（五十肩）は自動も他動も可動域が制限される（特に外旋・外転）。腱板断裂は、他動では上がるが自動では上がらない。","年代の目安：若年は不安定性・外傷、中高年は腱板・インピンジメント・凍結肩が多い。","検査の考え方：まず可動域（自動・他動）→痛みの出る動き→腱板テスト（抵抗）→二頭筋腱→不安定性、の順に絞り込む。"],
  clinical:"肩の挙上障害では、肩甲骨の動き（肩甲上腕リズム）と胸椎の伸展も確認する。腱板断裂が疑われる場合（ドロップアーム陽性、急な脱力）は、施術を急がず受診を勧める。",
  quiz:[Q("他動では挙がるが自動では挙がらず、ドロップアームサインが陽性のとき疑うのは？",["腱板断裂","凍結肩","頸椎症のみ","正常"],0,"腱板断裂では他動可・自動不可。"),Q("凍結肩の可動域の特徴は？",["自動・他動の両方が制限される","他動は正常","自動のみ制限","制限はない"],0,"自動・他動の両方で制限（特に外旋）。"),Q("リフトオフテストで主に評価する筋は？",["肩甲下筋","棘上筋","小円筋","大胸筋"],0,"リフトオフは肩甲下筋。"),Q("スピードテスト・ヤーガソンテストで痛む部位は？",["結節間溝（上腕二頭筋長頭腱）","肩鎖関節のみ","肩甲骨下角","肘外側"],0,"結節間溝の上腕二頭筋長頭腱。"),Q("ホーキンス・ケネディテストの陽性が示唆するのは？",["肩峰下インピンジメント","肘部管症候群","手根管症候群","大腿神経障害"],0,"肩峰下インピンジメント。")]},
 {id:"exam4",title:"肘・手首・手の検査",min:25,
  tests:[
   {name:"トムゼンテスト",how:"肘を伸ばし前腕を回内して、手関節を背屈させ、抵抗をかける。",pos:"外側上顆の痛み → 上腕骨外側上顆炎（テニス肘）。"},
   {name:"中指伸展テスト",how:"肘伸展位で、中指の伸展に抵抗する。",pos:"外側上顆の痛み → テニス肘。"},
   {name:"チェアテスト",how:"椅子の背を、肘を伸ばして前腕回内位で持ち上げる。",pos:"外側上顆の痛み → テニス肘。"},
   {name:"手関節屈曲抵抗テスト",how:"前腕回外位で手関節の屈曲に抵抗する。",pos:"内側上顆の痛み → 上腕骨内側上顆炎（ゴルフ肘）。"},
   {name:"外反ストレステスト（肘）",how:"肘を軽く屈曲し、外反方向のストレスをかける。",pos:"内側の痛み・不安定性 → 内側側副靭帯の損傷。"},
   {name:"ティネル徴候",how:"手根管（手関節掌側）、または肘部管を軽く叩く。",pos:"支配領域へ放散するしびれ → 手根管症候群（正中神経）、肘部管症候群（尺骨神経）。"},
   {name:"ファーレンテスト",how:"両手の甲を合わせ、手関節を屈曲して60秒保持する。",pos:"母指〜環指（橈側）のしびれ → 手根管症候群。"},
   {name:"フィンケルシュタインテスト",how:"母指を手の中に入れて握り、手関節を尺屈する。",pos:"橈骨茎状突起部の痛み → ドケルバン腱鞘炎。"},
   {name:"フローマン徴候",how:"母指と示指で紙をはさんで引っ張ってもらう。",pos:"母指の指節間関節が曲がる（代償）→ 尺骨神経麻痺。"}],
  points:["肘の外側の痛み＝伸筋（手首を反らす筋）の付着部、内側の痛み＝屈筋（手首を曲げる筋）の付着部、と整理すると覚えやすい。","しびれは、どの指に出るかで神経を推測する：母指〜環指橈側＝正中神経、環指尺側〜小指＝尺骨神経、母指〜示指の手背側＝橈骨神経。夜間・明け方のしびれは手根管症候群で多い。","手の腱鞘炎は、使いすぎ（スマホ・育児・家事・仕事）の聞き取りが重要。","頸椎からのしびれ（神経根）との鑑別：頸の動きで症状が変わるか、しびれの範囲が神経の支配域か髄節かを確認する。"],
  clinical:"テニス肘・ゴルフ肘では、付着部だけでなく前腕の筋腹・肩甲骨周囲・握り方（作業動作）まで確認する。手のしびれが両側、または急に悪化する場合は、頸椎や全身疾患（糖尿病・甲状腺）の確認も必要。",
  quiz:[Q("手関節の背屈抵抗で肘外側が痛むときに疑うのは？",["上腕骨外側上顆炎","上腕骨内側上顆炎","肘部管症候群","尺骨神経麻痺"],0,"トムゼンテスト陽性＝外側上顆炎。"),Q("夜間・明け方の母指〜環指のしびれ、ファーレンテスト陽性で疑うのは？",["手根管症候群","肘部管症候群","橈骨神経麻痺","胸郭出口症候群"],0,"手根管症候群（正中神経）。"),Q("フィンケルシュタインテストで評価する疾患は？",["ドケルバン腱鞘炎","ばね指","テニス肘","ゴルフ肘"],0,"橈骨茎状突起部の腱鞘炎。"),Q("小指と環指尺側のしびれで疑う神経は？",["尺骨神経","正中神経","橈骨神経","腋窩神経"],0,"尺骨神経（肘部管など）。")]},
 {id:"exam5",title:"腰部・仙腸関節の検査",min:30,
  tests:[
   {name:"SLR（下肢伸展挙上）テスト",how:"仰臥位で膝を伸ばしたまま、下肢をゆっくり挙上する。",pos:"約30〜70°で下肢後面に放散痛 → 坐骨神経（L5・S1）の伸張。70°以上のハムストリングスの突っ張りは非特異的。"},
   {name:"ブラガードテスト",how:"SLRで痛みが出た角度から少し下げ、足関節を背屈させる。",pos:"痛みが再現・増強 → 坐骨神経の伸張（神経由来）。"},
   {name:"FNS（大腿神経伸展）テスト",how:"腹臥位で膝を屈曲する（または股関節を伸展する）。",pos:"大腿前面への放散痛 → 大腿神経（L2〜L4）。"},
   {name:"ケンプテスト",how:"立位または座位で、腰椎を伸展・側屈・回旋する。",pos:"腰痛の誘発 → 椎間関節の関与。下肢への放散痛 → 神経根の関与。"},
   {name:"パトリックテスト（FABER）",how:"仰臥位で、股関節を屈曲・外転・外旋（足を反対の膝に乗せ）、膝を下に押す。",pos:"鼠径部の痛み → 股関節。殿部・後方の痛み → 仙腸関節。"},
   {name:"ゲンスレンテスト",how:"仰臥位でベッドの端から片脚を垂らし、反対の脚を抱え込む。",pos:"仙腸関節部の痛み → 仙腸関節障害。"},
   {name:"前屈・後屈テスト（方向の優位性）",how:"立位で前屈、後屈、側屈、回旋を行い、痛みの方向を確認する。",pos:"前屈で増悪 → 椎間板由来が多い。後屈・歩行で増悪、前屈・座位で軽減 → 脊柱管狭窄症が多い。"}],
  points:["腰痛の分類（考え方）：①筋・筋膜性、②椎間関節性、③椎間板性（前屈・座位で増悪）、④神経根性（下肢への放散痛・しびれ）、⑤脊柱管狭窄（間欠性跛行）、⑥仙腸関節性、⑦内臓・骨折・腫瘍などの重篤なもの。","腰椎分離症：成長期のスポーツ選手で、後屈・回旋で腰痛が出る。疑ったら受診（画像）を勧める。","馬尾症候群（会陰部のしびれ・排尿排便の障害・両下肢の脱力）は緊急受診。","神経根の高さ：L4＝下腿内側・膝蓋腱反射、L5＝足背・母趾背屈、S1＝足外側・つま先立ち・アキレス腱反射。"],
  clinical:"腰痛の評価では、「痛みを出す動き」と「楽になる動き」の両方を見つけて指導に使う。同じSLR陽性でも、神経の症状（しびれ・筋力低下）を伴うか、痛みだけかで対応が変わる。進行性の筋力低下があるときは受診を優先。",
  quiz:[Q("SLRテストで坐骨神経の伸張として陽性と考えやすい角度は？",["約30〜70°","0〜10°","100°以上","角度に関係なく"],0,"約30〜70°で下肢後面への放散痛。"),Q("前屈で増悪する腰痛で多く疑われるのは？",["椎間板性","脊柱管狭窄","股関節症","内臓疾患のみ"],0,"前屈で椎間板内圧が上がる。"),Q("歩くと下肢が痛み、座ると楽になる（間欠性跛行）で疑うのは？",["脊柱管狭窄症","肉離れ","頸椎ヘルニア","足底腱膜炎"],0,"脊柱管狭窄症。"),Q("会陰部のしびれと排尿障害がある場合の対応は？",["緊急で医療機関を受診するよう勧める","ストレッチを指導","様子を見る","強めの施術"],0,"馬尾症候群の可能性、緊急受診。"),Q("FNSテストが示す神経は？",["大腿神経（L2〜L4）","坐骨神経（L5・S1）","腓骨神経","脛骨神経"],0,"大腿神経。")]},
 {id:"exam6",title:"股関節・骨盤の検査",min:25,
  tests:[
   {name:"トーマステスト",how:"仰臥位で片膝を胸に抱え、反対側の大腿が浮くかを見る。",pos:"浮く → 反対側の股関節の屈曲拘縮・腸腰筋の短縮。"},
   {name:"エリーテスト",how:"腹臥位で膝を屈曲していく。",pos:"殿部が持ち上がる → 大腿直筋の短縮。"},
   {name:"オーバーテスト",how:"側臥位で上側の下肢を外転・伸展位から下ろす。",pos:"下がらない → 腸脛靭帯・大腿筋膜張筋の短縮。"},
   {name:"パトリックテスト（FABER）",how:"仰臥位で股関節を屈曲・外転・外旋する。",pos:"鼠径部の痛み → 股関節。後方の痛み → 仙腸関節。"},
   {name:"FADIRテスト",how:"股関節を屈曲・内転・内旋する。",pos:"鼠径部の痛み → 大腿骨寛骨臼インピンジメント（FAI）や関節唇の問題。"},
   {name:"トレンデレンブルグテスト",how:"片脚立ちをしてもらい、骨盤の傾きを見る。",pos:"挙上側（遊脚側）の骨盤が下がる → 立脚側の中殿筋の機能低下。"},
   {name:"脚長差の測定",how:"棘果長（上前腸骨棘〜内果）と転子果長（大転子〜外果）を測る。",pos:"棘果長に差 → 骨盤・股関節の関与。転子果長に差 → 下肢の長さの差。"}],
  points:["股関節の痛みは、鼠径部（前面）が多い。殿部・大腿外側・膝に出る関連痛も多く、「膝の痛み」の原因が股関節ということもある。","高齢者で、鼠径部痛と歩行時の痛み・可動域の低下があれば、変形性股関節症を疑う。転倒後の強い痛みや荷重不能は大腿骨頸部骨折の可能性があり、受診を優先する。","成長期（小児）の股関節・膝の痛み・跛行は、大腿骨頭すべり症やペルテス病などの可能性があり、受診を勧める。","骨盤の評価：左右の腸骨稜・上前腸骨棘・上後腸骨棘の高さ、立位と座位の違い、片脚立ちの安定性を見る。"],
  clinical:"股関節は、可動域（特に内旋・屈曲）の左右差を最初に見る。腰痛・膝痛・足の痛みの評価では、股関節の可動域と中殿筋の機能を必ず確認する。",
  quiz:[Q("トレンデレンブルグテスト陽性が示すのは？",["立脚側の中殿筋の機能低下","大腿四頭筋の短縮","腸腰筋の筋力低下のみ","ハムストリングスの短縮"],0,"遊脚側の骨盤が下がる＝立脚側の中殿筋。"),Q("エリーテストで殿部が持ち上がるときに示唆されるのは？",["大腿直筋の短縮","腸脛靭帯の短縮","腸腰筋の短縮","ハムストリングスの短縮"],0,"大腿直筋の短縮。"),Q("高齢者の転倒後、強い鼠径部痛で荷重ができない場合は？",["医療機関への受診を優先する","ストレッチ","強めの揉みほぐし","温めて様子を見る"],0,"大腿骨頸部骨折の可能性。"),Q("FADIRで鼠径部痛が出るときに疑うのは？",["FAI・関節唇の問題","ドケルバン腱鞘炎","手根管症候群","テニス肘"],0,"FAI・関節唇損傷など。")]},
 {id:"exam7",title:"膝の検査",min:30,
  tests:[
   {name:"ラックマンテスト",how:"膝を20〜30°屈曲し、大腿を固定して脛骨を前方へ引く。",pos:"前方への動揺が大きい・終末の抵抗感がない → 前十字靭帯（ACL）損傷。"},
   {name:"前方引き出しテスト",how:"膝90°屈曲位で、脛骨を前方へ引く。",pos:"前方への移動の増加 → ACL損傷。"},
   {name:"後方引き出しテスト",how:"膝90°屈曲位で、脛骨を後方へ押す。",pos:"後方への移動の増加 → 後十字靭帯（PCL）損傷。"},
   {name:"外反ストレステスト",how:"膝0°と30°で、外反方向のストレスをかける。",pos:"内側の痛み・動揺 → 内側側副靭帯（MCL）損傷。"},
   {name:"内反ストレステスト",how:"膝0°と30°で、内反方向のストレスをかける。",pos:"外側の痛み・動揺 → 外側側副靭帯（LCL）損傷。"},
   {name:"マクマレーテスト",how:"仰臥位で膝を最大屈曲し、下腿を内旋・外旋しながら伸展する。",pos:"クリック音・痛み → 半月板損傷。"},
   {name:"アプレー圧迫テスト",how:"腹臥位で膝を90°屈曲し、足部を圧迫しながら回旋する。",pos:"痛み → 半月板損傷。"},
   {name:"膝蓋跳動（浮球感）",how:"膝蓋上嚢を押さえて膝蓋骨を押し下げる。",pos:"膝蓋骨が浮いて跳ねる → 関節内の水腫（関節液の貯留）。"},
   {name:"膝蓋骨圧迫（グラインド）テスト",how:"膝蓋骨を大腿骨へ押しつけながら動かす。",pos:"痛み・ざらつき → 膝蓋大腿関節の障害。"}],
  points:["膝の問診：受傷機転（接触・非接触、ひねり）、ポップ音、腫れた時間（受傷直後＝関節内出血を疑う）、荷重できるか、ロッキング（膝が伸びない）、膝崩れ感。","受診を優先：受傷直後の大きな腫れ、荷重できない、ロッキング、明らかな変形。","中高年の膝痛：変形性膝関節症が多い。動き始めの痛み、階段（特に下り）、内側の圧痛、O脚。","膝の痛みは、股関節・足部（扁平足・回内足）・体幹の影響を受ける。膝だけを見ない。","成長期のスポーツ選手の膝の痛み：オスグッド・シュラッター病（脛骨粗面）、ジャンパー膝（膝蓋腱）などを考える。"],
  clinical:"ACL損傷が疑われる受傷（非接触でひねる・ポップ音・直後の腫れ）では、ラックマンの結果にかかわらず受診を勧める。慢性の膝痛では、膝周囲の施術に加え、股関節の可動域・中殿筋・足部のアライメントを評価して、再発しにくい動きを指導する。",
  quiz:[Q("ラックマンテストで評価するのは？",["前十字靭帯（ACL）","後十字靭帯（PCL）","内側側副靭帯","半月板"],0,"ラックマンはACL。"),Q("外反ストレスで痛み・動揺がある場合に疑うのは？",["内側側副靭帯損傷","外側側副靭帯損傷","アキレス腱断裂","半月板のみ"],0,"外反ストレス→内側側副靭帯。"),Q("受傷直後に大きく腫れ、荷重できない場合は？",["受診を優先する","強く揉む","温める","様子を見る"],0,"関節内出血・靭帯損傷・骨折の可能性。"),Q("膝蓋跳動が陽性のときに示唆されるのは？",["関節水腫","アキレス腱炎","足底腱膜炎","手根管症候群"],0,"関節内の水腫。")]},
 {id:"exam8",title:"足関節・足部の検査",min:25,
  tests:[
   {name:"前方引き出しテスト（足関節）",how:"足関節を軽度底屈位にして、踵を前方へ引く。",pos:"前方への動揺・痛み → 前距腓靭帯（ATFL）損傷。"},
   {name:"距骨傾斜（内反ストレス）テスト",how:"足関節を内反方向へ傾ける。",pos:"動揺・痛み → 前距腓靭帯・踵腓靭帯損傷。"},
   {name:"トンプソンテスト",how:"腹臥位で膝を曲げ、ふくらはぎ（下腿三頭筋）をつまむ。",pos:"足関節が底屈しない → アキレス腱断裂。"},
   {name:"オタワ足関節ルール",how:"足関節捻挫後に、骨折を疑う所見があるかを確認する。",pos:"次のいずれかがあれば受診（X線）を勧める：外果・内果の後縁（先端から6cm以内）や先端の圧痛、第5中足骨基部の圧痛、舟状骨の圧痛、受傷直後と診察時に4歩連続で荷重できない。"},
   {name:"足底腱膜炎の評価",how:"踵の内側と足底腱膜の圧痛、母趾の背屈（ウィンドラス）を確認する。",pos:"朝の一歩目の痛み・踵の圧痛 → 足底腱膜炎。"},
   {name:"アーチの評価（舟状骨ドロップなど）",how:"立位と座位で、舟状骨の高さ・踵の傾き・扁平足の程度を見る。",pos:"荷重で内側アーチが下がる → 回内足・扁平足。膝・腰への影響を考える。"}],
  points:["足関節捻挫は内反捻挫が多く、外果前方（ATFL）の圧痛・腫脹が典型。骨折・靭帯完全断裂を見逃さないため、オタワ足関節ルールで受診判断をする。","アキレス腱断裂の典型：「後ろから蹴られた」感覚と音、歩行はできてもつま先立ちができない。","小児・成長期のかかと痛みはシーバー病（踵骨骨端症）など。","足部は立位・歩行の土台。アーチ・足趾の使い方・靴を確認する。"],
  clinical:"足関節捻挫は、受傷直後の評価（受診判断）と、回復期の再発予防（バランス・腓骨筋・足関節背屈の可動域）で役割が変わる。慢性の足底痛・膝痛では、足部アライメントとインソール・靴の確認を忘れない。",
  quiz:[Q("アキレス腱断裂の確認に使うテストは？",["トンプソンテスト","ラックマンテスト","SLRテスト","スパーリングテスト"],0,"トンプソンテスト。"),Q("オタワ足関節ルールが陽性の場合は？",["X線の検討（受診）を勧める","そのままマッサージ","様子を見る","強く温める"],0,"骨折を除外するため受診を勧める。"),Q("朝の一歩目で踵が痛むときに疑うのは？",["足底腱膜炎","アキレス腱断裂","外側側副靭帯損傷","テニス肘"],0,"足底腱膜炎の典型。"),Q("足関節捻挫で最も損傷しやすい靭帯は？",["前距腓靭帯（ATFL）","三角靭帯","前十字靭帯","後距腓靭帯"],0,"内反捻挫では前距腓靭帯が最も多い。")]},
 {id:"exam9",title:"神経学的検査（筋力・反射・知覚）",min:30,
  tests:[
   {name:"筋力テスト（MMT 0〜5）",how:"各筋の筋力を段階で評価する。5＝強い抵抗に抗して全可動域、4＝中等度の抵抗に抗する、3＝重力に抗して全可動域、2＝重力を除けば動かせる、1＝筋収縮のみ、0＝収縮なし。",pos:"左右差・髄節で低下 → 神経根・末梢神経の障害を疑う。"},
   {name:"深部腱反射",how:"ハンマーで腱を叩き、反応の左右差と亢進・低下を見る。上腕二頭筋（C5）、腕橈骨筋（C6）、上腕三頭筋（C7）、膝蓋腱（L4）、アキレス腱（S1）。",pos:"低下・消失 → 末梢神経・神経根。亢進 → 上位運動ニューロン（脊髄・脳）の障害。"},
   {name:"知覚検査",how:"触覚・痛覚（軽く触れる・つまむ）を、デルマトームに沿って左右比較する。C6＝母指、C7＝中指、C8＝小指、L4＝下腿内側、L5＝足背・母趾、S1＝足外側。",pos:"しびれ・鈍麻の範囲 → 神経根の高さの推定。"},
   {name:"ホフマン徴候",how:"中指の末節を弾く。",pos:"母指・示指が屈曲する → 錐体路徴候（頸髄症などを疑う）。"},
   {name:"バビンスキー反射",how:"足底の外側を踵から小趾側、母趾球へこする。",pos:"母趾が背屈する → 陽性＝錐体路障害。"}],
  points:["髄節別の筋力（目安）：C5＝三角筋・肘屈曲、C6＝手関節背屈、C7＝肘伸展・手関節屈曲、C8＝手指屈曲、T1＝小指外転。L2＝股屈曲、L3＝膝伸展、L4＝足関節背屈（前脛骨筋）、L5＝母趾背屈、S1＝足関節底屈（つま先立ち）。","神経根症状では、①放散痛・しびれの範囲、②筋力低下、③腱反射の低下、をセットで確認する。","上位運動ニューロン障害のサイン：腱反射の亢進、ホフマン・バビンスキー陽性、歩行の障害。これらがあれば受診を勧める。","評価の記録：テスト名、左右、結果（数値・段階）、症状の再現の有無を書く。"],
  clinical:"施術前後に神経学的な所見が悪化していないかを確認する習慣をつける。しびれが広がる・筋力が落ちる・反射が消える、といった変化は、紹介の判断材料になる。",
  quiz:[Q("アキレス腱反射が主に関わる髄節は？",["S1","C6","L2","T1"],0,"アキレス腱反射はS1。"),Q("L5神経根障害で低下しやすい動作は？",["母趾の背屈","つま先立ち","肘の屈曲","手関節の背屈"],0,"L5は母趾背屈（長母趾伸筋）。"),Q("ホフマン徴候が陽性のときに考えるのは？",["上位運動ニューロン（頸髄症など）の障害","末梢神経の絞扼のみ","筋疲労","異常なし"],0,"錐体路徴候として頸髄症などを疑う。"),Q("MMTで「重力に抗して全可動域を動かせる」は？",["3","1","5","0"],0,"MMT 3。")]},
 {id:"exam10",title:"症例演習A：頸・肩・上肢のパターン",min:30,
  cases:[
   {title:"症例1：45歳女性・デスクワーク",story:"右肩から腕の外側、母指側にしびれ。頸を右に傾けて上を向くと腕に電気が走る。",think:"神経根型を疑う。スパーリング・ジャクソン・牽引テストを行い、C6の筋力（手関節背屈）・上腕二頭筋/腕橈骨筋反射・母指の知覚を確認する。筋力低下が進行する、両側に出る、歩行障害があるなら受診を優先。"},

  points:["検査を選ぶ前に、まず「しびれ・痛みの範囲」「動かすと変わるか」「他動と自動の差」を整理する。","肩の症状は、肩そのもの・頸・胸郭出口・内臓の4方向から確認する。","上肢のしびれは、どの神経・髄節かを知覚の範囲で推定する。"],
  clinical:"症例演習は、答えを覚えるのではなく「次に何を確認するか」を言葉にする練習。検査の結果をカルテにどう書くか（例：右スパーリング陽性・C6知覚鈍麻・上腕二頭筋反射低下）までセットで練習する。",
  quiz:[Q("症例1の初期評価として最も適切な組み合わせは？",["スパーリング・ジャクソン・牽引テストと、C5〜C8の筋力・反射・知覚","SLRとラックマン","トンプソンとオタワルール","ファーレンとフィンケルシュタイン"],0,"頸の神経根症状の評価。"),Q("症例2で最も適切な対応は？",["腱板断裂を疑い、受診を勧める","強いマッサージで挙上を促す","温めて様子を見る","無理に挙上訓練を行う"],0,"腱板断裂が疑われるため受診を優先。"),Q("症例3の可動域の特徴として適切なのは？",["自動・他動ともに制限（特に外旋）","他動は正常","自動のみ制限","制限はない"],0,"凍結肩の特徴。"),Q("夜間・明け方に母指〜環指のしびれが強く、ファーレンテスト陽性。疑うのは？",["手根管症候群","肘部管症候群","テニス肘","頸椎ヘルニア（C8）"],0,"手根管症候群（正中神経）。"),Q("ドアノブをひねる・雑巾をしぼると肘の外側が痛い。まず行う検査は？",["トムゼンテスト","外反ストレステスト","ティネル徴候（肘部管）","フローマン徴候"],0,"外側上顆炎の確認にトムゼンテスト。")]},

   {title:"症例2：72歳男性",story:"歩くと殿部から下肢が痛みしびれ、数百mで休む。座る・前かがみになると楽。後屈で下肢症状が出る。",think:"脊柱管狭窄症（間欠性跛行）を疑う。前屈（楽）・後屈（悪化）、歩行距離、自転車に乗れるかを確認する。血管性の跛行（足の脈拍・冷え）との鑑別も。"},

  points:["腰痛では「痛みの方向（前屈・後屈）」「下肢症状の有無」「歩行・座位での変化」が分類の鍵。","下肢症状のあるときは、髄節ごとの筋力・知覚・反射を必ず確認する。","高齢者・成長期・悪性腫瘍の既往・外傷後は、レッドフラッグを最優先に確認する。"],
  clinical:"腰痛患者では、検査の結果を、動作指導（股関節から曲げる・胸椎を動かす・中殿筋を使う）に変換して伝えると、再発予防につながる。",
  quiz:[Q("症例1のSLR陽性・母趾背屈の低下から、まず考える神経根は？",["L5","C6","T4","S3"],0,"母趾背屈はL5。"),Q("症例2で最も疑われるのは？",["脊柱管狭窄症","腰椎分離症","仙腸関節炎","梨状筋のこりのみ"],0,"間欠性跛行・前屈で軽減。"),Q("症例3で適切な対応は？",["スポーツの休止と受診（画像）を勧める","通常通り練習を継続","強いストレッチ","後屈を繰り返す"],0,"分離症は早期の診断・休止が重要。"),Q("症例4で確認すべき可動域は？",["股関節の内旋・屈曲","手首の背屈","頸の回旋","肘の屈曲"],0,"変形性股関節症では内旋・屈曲が早期に制限される。"),Q("腰痛で緊急受診を勧めるべきサインは？",["会陰部のしびれと排尿障害","朝の軽いこわばり","立ち上がりの痛み","夕方のだるさ"],0,"馬尾症候群のサイン。")]},

   {title:"症例2：45歳女性",story:"階段で膝をひねり、その後しゃがむと内側が痛む。ときどきひっかかる感じ・クリック音。",think:"内側半月板損傷を疑う。マクマレー・アプレー・関節裂隙の圧痛を確認。ロッキングがあれば受診。"},

const LEARNING_TARGET_EMAILS=["sato@ando.jp","hosonaga@ando.jp","tanaka@ando.jp"]; // 基礎知識の学習対象（佐藤・細永・田中）
function LearningPanel({user,isAdmin}){
  const myEmail=(user&&user.email)||"";
  const learners=STAFF_ACCOUNTS.filter(s=>!s.eventOnly);
  const targets=learners.filter(s=>LEARNING_TARGET_EMAILS.includes(s.email));
  const [learnerEmail,setLearnerEmail]=React.useState(()=>{try{const v=localStorage.getItem("learning_learner");if(v&&STAFF_ACCOUNTS.some(s=>s.email===v&&!s.eventOnly))return v;}catch(e){}return myEmail;});
  function pickLearner(v){setLearnerEmail(v);setSubjId(null);setUnitId(null);setQuiz(null);try{localStorage.setItem("learning_learner",v);}catch(e){}}
  const learner=learners.find(s=>s.email===learnerEmail)||{email:learnerEmail,name:(user&&user.name)||learnerEmail};
  const [attempts,setAttempts]=React.useState([]);
  const [showAll,setShowAll]=React.useState(false);
  const [rows,setRows]=React.useState([]); // learning_progress（自分の分。管理者は全員分）
  const [loading,setLoading]=React.useState(true);
  const [tab,setTab]=React.useState("study"); // study | team
  const [subjId,setSubjId]=React.useState(null);
  const [unitId,setUnitId]=React.useState(null);
  const [quiz,setQuiz]=React.useState(null); // {qs:[{q,o,a,e,sel}], submitted, score}
  const [saving,setSaving]=React.useState(false);

  function load(){
    const q="?select=*";
    sb.select("learning_progress",q).then(r=>{setRows(Array.isArray(r)?r:[]);setLoading(false);}).catch(()=>setLoading(false));
    if(isAdmin) sb.select("learning_attempts","?order=created_at.desc&limit=1000").then(r=>setAttempts(Array.isArray(r)?r:[])).catch(()=>{});
  }
  React.useEffect(()=>{load();},[]);

  const mine=React.useMemo(()=>{const m={};rows.filter(r=>r.learner_email===learnerEmail).forEach(r=>{m[r.unit_id]=r;});return m;},[rows,learnerEmail]);
  const totalUnits=CURRICULUM.reduce((s,c)=>s+c.units.length,0);
  const doneUnits=CURRICULUM.reduce((s,c)=>s+c.units.filter(u=>mine[u.id]&&mine[u.id].completed).length,0);
  const subj=CURRICULUM.find(c=>c.id===subjId);
  const unit=subj&&subj.units.find(u=>u.id===unitId);

  function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
  function startQuiz(){
    const qs=unit.quiz.map(x=>{
      const idx=shuffle(x.o.map((_,i)=>i));
      return {q:x.q,o:idx.map(i=>x.o[i]),a:idx.indexOf(x.a),e:x.e,sel:null};
    });
    setQuiz({qs,submitted:false,score:0});
  }
  async function submitQuiz(){
    if(quiz.qs.some(x=>x.sel===null)){window.alert("すべての問題に答えてください");return;}
    const score=quiz.qs.filter(x=>x.sel===x.a).length;
    const total=quiz.qs.length;
    const pass=score>=Math.ceil(total*2/3);
    setQuiz({...quiz,submitted:true,score,pass});
    setSaving(true);
    try{
      const cur=mine[unit.id];
      const now=new Date().toISOString();
      const recBy=(user&&user.name)||myEmail;
      await sb.insert("learning_attempts",{learner_email:learnerEmail,learner_name:learner.name,unit_id:unit.id,score,total,passed:pass,wrong:quiz.qs.filter(x=>x.sel!==x.a).map(x=>x.q),recorded_by:recBy});
      if(cur){
        await sb.update("learning_progress",cur.id,{attempts:(cur.attempts||0)+1,last_score:score,total,best_score:Math.max(cur.best_score||0,score),last_attempt_at:now,completed:cur.completed||pass,completed_at:cur.completed_at||(pass?now:null)});
      }else{
        await sb.insert("learning_progress",{learner_email:learnerEmail,learner_name:learner.name,recorded_by:recBy,unit_id:unit.id,attempts:1,last_score:score,total,best_score:score,last_attempt_at:now,completed:pass,completed_at:pass?now:null});
      }
      load();
    }catch(e){console.error(e);}
    setSaving(false);
  }

  const card={background:"white",borderRadius:12,padding:"14px 16px",boxShadow:"0 1px 4px rgba(0,0,0,.06)",marginBottom:12};
  const bar=(p,c)=>(<div style={{height:7,background:"#f1f5f9",borderRadius:4}}><div style={{height:7,borderRadius:4,background:c,width:Math.min(100,p)+"%"}}/></div>);
  const tabBtn=(id,l)=>(<button onClick={()=>setTab(id)} style={{padding:"7px 16px",borderRadius:10,border:"1.5px solid "+(tab===id?"#1e3a5f":"#e2e8f0"),background:tab===id?"#1e3a5f":"white",color:tab===id?"white":"#374151",fontWeight:800,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>{l}</button>);

  // ===== 単元ページ =====
  if(tab==="study"&&unit){
    const st=mine[unit.id];
    const idx=subj.units.findIndex(u=>u.id===unit.id);
    return(
      <div style={{maxWidth:760,margin:"0 auto"}}>
        <div style={{...card,display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          <button onClick={()=>{setUnitId(null);setQuiz(null);}} style={{border:"1.5px solid #e2e8f0",background:"white",borderRadius:8,padding:"5px 12px",cursor:"pointer",fontWeight:700}}>← {subj.name}の一覧</button>
          <span style={{fontSize:12,color:"#94a3b8"}}>{subj.icon} {subj.name}　単元 {idx+1}/{subj.units.length}　目安 {unit.min}分</span>
          {learnerEmail!==myEmail&&<span style={{fontSize:12,fontWeight:800,color:"#be185d",background:"#fdf2f8",borderRadius:10,padding:"2px 10px"}}>受講者：{learner.name}</span>}
          {st&&st.completed&&<span style={{marginLeft:"auto",fontSize:12,fontWeight:800,color:"#059669",background:"#ecfdf5",borderRadius:10,padding:"2px 10px"}}>✅ 合格済み（最高 {st.best_score}/{st.total}）</span>}
        </div>
        <div style={card}>
          <div style={{fontSize:18,fontWeight:800,color:subj.color,marginBottom:10}}>{unit.title}</div>
          <div style={{fontSize:12,fontWeight:800,color:"#475569",marginBottom:6}}>{unit.tests?"📘 考え方・押さえるポイント":unit.cases?"📘 考え方のポイント":"📘 基礎：ここだけは押さえる"}</div>
          <ul style={{margin:"0 0 14px",paddingLeft:20,fontSize:14,lineHeight:1.85,color:"#1e293b"}}>{unit.points.map((p,i)=><li key={i} style={{marginBottom:4}}>{p}</li>)}</ul>
          {unit.tests&&(<div style={{marginBottom:14}}>
            <div style={{fontSize:12,fontWeight:800,color:"#475569",marginBottom:6}}>🔍 検査の種類（方法 → 陽性の意味）</div>
            {unit.tests.map((t,i)=>(<div key={i} style={{border:"1px solid #e2e8f0",borderLeft:"4px solid "+subj.color,borderRadius:8,padding:"8px 12px",marginBottom:6}}>
              <div style={{fontWeight:800,fontSize:14,color:"#1e293b"}}>{t.name}</div>
              <div style={{fontSize:13,color:"#475569",lineHeight:1.7,marginTop:2}}><b style={{color:"#64748b"}}>やり方：</b>{t.how}</div>
              <div style={{fontSize:13,color:"#9d174d",lineHeight:1.7}}><b>陽性の意味：</b>{t.pos}</div>
            </div>))}
          </div>)}
          {unit.cases&&(<div style={{marginBottom:14}}>
            <div style={{fontSize:12,fontWeight:800,color:"#475569",marginBottom:6}}>📋 症例パターン（まず自分で考えてから「考え方」を開く）</div>
            {unit.cases.map((c,i)=>(<details key={i} style={{border:"1px solid #e2e8f0",borderRadius:8,padding:"8px 12px",marginBottom:6}}>

              <div style={{marginTop:6,fontSize:13,lineHeight:1.8,color:"#065f46",background:"#ecfdf5",borderRadius:8,padding:"8px 10px"}}><b>考え方：</b>{c.think}</div>
            </details>))}

            <div style={{fontSize:12,fontWeight:800,color:"#92400e",marginBottom:4}}>🩺 臨床ポイント（経験者向け）</div>
            <div style={{fontSize:13,lineHeight:1.8,color:"#78350f"}}>{unit.clinical}</div>
          </div>
        </div>
        <div style={card}>
          <div style={{fontSize:14,fontWeight:800,color:"#1e3a5f",marginBottom:8}}>✍️ 確認クイズ（{unit.quiz.length}問中{Math.ceil(unit.quiz.length*2/3)}問以上で合格）</div>
          {!quiz&&<button onClick={startQuiz} style={{width:"100%",padding:12,borderRadius:10,border:"none",background:subj.color,color:"white",fontWeight:800,fontSize:14,cursor:"pointer"}}>クイズに挑戦する</button>}
          {quiz&&quiz.qs.map((x,qi)=>(
            <div key={qi} style={{marginBottom:14}}>
              <div style={{fontSize:14,fontWeight:700,marginBottom:6}}>Q{qi+1}. {x.q}</div>
              {x.o.map((o,oi)=>{
                const chosen=x.sel===oi,right=quiz.submitted&&oi===x.a,wrong=quiz.submitted&&chosen&&oi!==x.a;
                return(<button key={oi} disabled={quiz.submitted} onClick={()=>setQuiz({...quiz,qs:quiz.qs.map((y,yi)=>yi===qi?{...y,sel:oi}:y)})}
                  style={{display:"block",width:"100%",textAlign:"left",padding:"9px 12px",marginBottom:5,borderRadius:9,fontSize:13,cursor:quiz.submitted?"default":"pointer",fontFamily:"inherit",
                    border:"2px solid "+(right?"#059669":wrong?"#dc2626":chosen?subj.color:"#e2e8f0"),background:right?"#ecfdf5":wrong?"#fef2f2":chosen?"#eff6ff":"white"}}>{right?"⭕ ":wrong?"❌ ":""}{o}</button>);
              })}
              {quiz.submitted&&<div style={{fontSize:12,color:"#475569",background:"#f8fafc",borderRadius:8,padding:"6px 10px"}}>💡 {x.e}</div>}
            </div>))}
          {quiz&&!quiz.submitted&&<button onClick={submitQuiz} style={{width:"100%",padding:12,borderRadius:10,border:"none",background:"#1e3a5f",color:"white",fontWeight:800,fontSize:14,cursor:"pointer"}}>採点する</button>}
          {quiz&&quiz.submitted&&(
            <div style={{textAlign:"center",padding:12,borderRadius:10,background:quiz.pass?"#ecfdf5":"#fef2f2"}}>
              <div style={{fontSize:20,fontWeight:800,color:quiz.pass?"#059669":"#dc2626"}}>{quiz.score}/{quiz.qs.length}　{quiz.pass?"合格 🎉":"もう少し！"}</div>
              <div style={{display:"flex",gap:8,justifyContent:"center",marginTop:8,flexWrap:"wrap"}}>
                <button onClick={startQuiz} style={{padding:"8px 16px",borderRadius:9,border:"1.5px solid #1e3a5f",background:"white",fontWeight:700,cursor:"pointer"}}>もう一度</button>
                {idx+1<subj.units.length&&<button onClick={()=>{setUnitId(subj.units[idx+1].id);setQuiz(null);window.scrollTo(0,0);}} style={{padding:"8px 16px",borderRadius:9,border:"none",background:"#1e3a5f",color:"white",fontWeight:700,cursor:"pointer"}}>次の単元へ →</button>}
              </div>
            </div>)}
        </div>
      </div>);
  }

  // ===== スタッフ別進捗（管理者） =====
  if(tab==="team"&&isAdmin){
    const list=showAll?learners:targets;
    const fmtD=d=>d?String(d).slice(0,10).replace(/-/g,"/"):"—";
    const daysAgo=d=>d?Math.floor((Date.now()-new Date(d).getTime())/86400000):null;
    return(
      <div style={{maxWidth:980,margin:"0 auto"}}>
        <div style={{...card,display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>{tabBtn("study","学習する")}{tabBtn("team","スタッフ別の進捗")}

        {list.map(s=>{
          const rs=rows.filter(r=>r.learner_email===s.email);
          const byUnit={};rs.forEach(r=>{byUnit[r.unit_id]=r;});
          const done=CURRICULUM.reduce((a,c)=>a+c.units.filter(u=>byUnit[u.id]&&byUnit[u.id].completed).length,0);
          const last=rs.reduce((m,r)=>r.last_attempt_at&&(!m||r.last_attempt_at>m)?r.last_attempt_at:m,null);
          const att=attempts.filter(a=>a.learner_email===s.email);
          const wrongCount={};att.forEach(a=>(Array.isArray(a.wrong)?a.wrong:[]).forEach(q=>{wrongCount[q]=(wrongCount[q]||0)+1;}));

          return(
          <div key={s.email} style={card}>
            <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",marginBottom:8}}>
              <div style={{width:34,height:34,borderRadius:10,background:s.color||"#64748b",color:"white",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800}}>{s.initial||s.name.charAt(0)}</div>

              <div style={{fontWeight:800,fontSize:18,color:"#1e3a5f"}}>{Math.round(done/totalUnits*100)}%<span style={{fontSize:12,fontWeight:600,color:"#94a3b8",marginLeft:6}}>{done}/{totalUnits}単元</span></div>
              <div style={{marginLeft:"auto",fontSize:12,color:ago!==null&&ago>=7?"#dc2626":"#64748b",fontWeight:700}}>最終学習：{fmtD(last)}{ago!==null?`（${ago===0?"今日":ago+"日前"}）`:"（未着手）"}</div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:8,marginBottom:8}}>
              {CURRICULUM.map(c=>{const n=c.units.filter(u=>byUnit[u.id]&&byUnit[u.id].completed).length;return(
                <div key={c.id}><div style={{fontSize:11,fontWeight:700,display:"flex",justifyContent:"space-between"}}><span>{c.icon}{c.name}</span><span style={{color:n===c.units.length?"#059669":"#64748b"}}>{n}/{c.units.length}</span></div>{bar(n/c.units.length*100,c.color)}</div>);})}
            </div>
            <details>
              <summary style={{cursor:"pointer",fontSize:12,fontWeight:800,color:"#2563eb"}}>単元ごとの状況を開く（○合格　△挑戦中　・未着手）</summary>
              {CURRICULUM.map(c=>(<div key={c.id} style={{marginTop:8}}>
                <div style={{fontSize:12,fontWeight:800,color:c.color}}>{c.icon}{c.name}</div>
                {c.units.map(u=>{const r=byUnit[u.id];return(<div key={u.id} style={{display:"flex",gap:8,fontSize:12,padding:"2px 0",color:"#334155"}}>
                  <span style={{width:16,fontWeight:800,color:r&&r.completed?"#059669":r?"#d97706":"#cbd5e1"}}>{r&&r.completed?"○":r?"△":"・"}</span>
                  <span style={{flex:1}}>{u.title}</span>
                  <span style={{color:"#94a3b8"}}>{r?`最高 ${r.best_score}/${r.total}　${r.attempts}回　${fmtD(r.last_attempt_at)}`:""}</span>
                </div>);})}
              </div>))}
            </details>
            {(weak.length>0||stuck.length>0)&&(<div style={{marginTop:8,fontSize:12,background:"#fff7ed",borderRadius:8,padding:"8px 10px",color:"#7c2d12",lineHeight:1.7}}>
              {stuck.length>0&&<div><b>合格できていない単元：</b>{stuck.join("、")}</div>}
              {weak.length>0&&<div><b>間違いが多い問題：</b>{weak.map(q=>`「${q}」（${wrongCount[q]}回）`).join("　")}</div>}
            </div>)}
          </div>);})}
        <div style={{fontSize:11,color:"#94a3b8",margin:"0 4px"}}>各単元のクイズ合格で完了。「学習する」タブで受講者を選べば、管理者の画面からその方の分として受講・記録もできます（共有タブレット用）。</div>
      </div>);
  }

  // ===== 科目の単元一覧 =====
  if(subj){
    return(
      <div style={{maxWidth:760,margin:"0 auto"}}>
        <div style={{...card,display:"flex",alignItems:"center",gap:8}}>
          <button onClick={()=>setSubjId(null)} style={{border:"1.5px solid #e2e8f0",background:"white",borderRadius:8,padding:"5px 12px",cursor:"pointer",fontWeight:700}}>← 科目一覧</button>
          <div style={{fontWeight:800,fontSize:16,color:subj.color}}>{subj.icon} {subj.name}</div>
        </div>
        <div style={{fontSize:13,color:"#64748b",margin:"0 4px 10px"}}>{subj.desc}</div>
        {subj.units.map((u,i)=>{const st=mine[u.id];return(
          <div key={u.id} onClick={()=>{setUnitId(u.id);setQuiz(null);window.scrollTo(0,0);}} style={{...card,cursor:"pointer",display:"flex",alignItems:"center",gap:12,marginBottom:8}}>
            <div style={{width:32,height:32,borderRadius:16,background:st&&st.completed?"#059669":"#e2e8f0",color:st&&st.completed?"white":"#64748b",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800}}>{st&&st.completed?"✓":i+1}</div>
            <div style={{flex:1}}><div style={{fontWeight:800,fontSize:14,color:"#1e293b"}}>{u.title}</div><div style={{fontSize:11,color:"#94a3b8"}}>目安 {u.min}分　クイズ{u.quiz.length}問{st?`　最高 ${st.best_score}/${st.total}（${st.attempts}回挑戦）`:""}</div></div>
            <span style={{color:"#cbd5e1"}}>›</span>
          </div>);})}
      </div>);
  }

  // ===== トップ（科目一覧） =====
  return(
    <div style={{maxWidth:900,margin:"0 auto"}}>
      <div style={{...card,display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
        <div style={{fontWeight:800,fontSize:16,color:"#1e3a5f",marginRight:6}}>📚 学習カリキュラム</div>
        {tabBtn("study","学習する")}{isAdmin&&tabBtn("team","スタッフ別の進捗")}
        {(<span style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:6,fontSize:12,fontWeight:700}}>受講者（自分を選ぶ）：
          <select value={learnerEmail} onChange={e=>pickLearner(e.target.value)} style={{padding:"6px 10px",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:13,fontFamily:"inherit"}}>
            {targets.length>0&&<optgroup label="基礎知識の学習対象">{targets.map(s=><option key={s.email} value={s.email}>{s.name}</option>)}</optgroup>}
            <optgroup label="その他のスタッフ">{learners.filter(s=>!LEARNING_TARGET_EMAILS.includes(s.email)).map(s=><option key={s.email} value={s.email}>{s.name}</option>)}</optgroup>
          </select></span>)}
      </div>
      <div style={card}>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:13,fontWeight:700,marginBottom:6}}><span>{learnerEmail===myEmail?"あなたの進捗":learner.name+"さんの進捗"}</span><span>{doneUnits}/{totalUnits}単元　{Math.round(doneUnits/totalUnits*100)}%</span></div>
        {bar(doneUnits/totalUnits*100,"#1e3a5f")}
        <div style={{fontSize:11,color:"#94a3b8",marginTop:6}}>各単元の解説を読み、確認クイズに合格すると完了になります（基礎編。経験者向けの臨床ポイント付き）。</div>
      </div>
      {loading&&<div style={{color:"#94a3b8",fontSize:13,padding:8}}>読み込み中...</div>}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(260px,1fr))",gap:12}}>
        {CURRICULUM.map(c=>{
          const d=c.units.filter(u=>mine[u.id]&&mine[u.id].completed).length;
          const next=c.units.find(u=>!(mine[u.id]&&mine[u.id].completed));
          return(
          <div key={c.id} onClick={()=>setSubjId(c.id)} style={{background:"white",borderRadius:14,padding:"16px 16px",boxShadow:"0 1px 4px rgba(0,0,0,.06)",cursor:"pointer",borderTop:"4px solid "+c.color}}>
            <div style={{fontSize:28}}>{c.icon}</div>
            <div style={{fontWeight:800,fontSize:16,color:c.color,margin:"4px 0"}}>{c.name}</div>
            <div style={{fontSize:12,color:"#64748b",lineHeight:1.6,minHeight:38}}>{c.desc}</div>
            <div style={{margin:"10px 0 4px",fontSize:12,fontWeight:700,display:"flex",justifyContent:"space-between"}}><span>{d}/{c.units.length}単元</span>{d===c.units.length&&<span style={{color:"#059669"}}>完了 🎉</span>}</div>
            {bar(d/c.units.length*100,c.color)}
            {next&&<div style={{fontSize:11,color:"#94a3b8",marginTop:6}}>次：{next.title}</div>}
          </div>);})}
      </div>
    </div>
  );
}


function DailyReportPanel({bookings,payments,stores,todayStr}){
  const fmt=n=>"¥"+Number(n||0).toLocaleString();
  const DAYS_JP=["日","月","火","水","木","金","土"];
  const firstStoreId=(stores&&stores[0]&&stores[0].id)||1;
  const [storeId,setStoreId]=React.useState(firstStoreId);
  const [ym,setYm]=React.useState(todayStr.slice(0,7)); // "2026-10"
  const [copied,setCopied]=React.useState(false);

  function shiftMonth(delta){
    const [y,m]=ym.split("-").map(Number);
    const d=new Date(y,m-1+delta,1);
    setYm(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`);
  }

  const rows=React.useMemo(()=>{
    const [y,m]=ym.split("-").map(Number);
    const days=new Date(y,m,0).getDate();
    const storeBookings=bookings.filter(b=>(b.store_id||firstStoreId)===storeId);
    const bookingById={};
    storeBookings.forEach(b=>{bookingById[b.id]=b;});
    // 患者ごとの初回来院日（キャンセルを除く予約のうち一番古い日）→ 新患／再診の判定に使う
    const patientKey=b=>(b.phone||"")+"|"+(b.patient_name||"");
    const firstDate={};
    const datesByPatient={}; // 患者ごとの来院日（キャンセル除く）
    storeBookings.filter(b=>!b.cancelled).forEach(b=>{
      const k=patientKey(b);
      if(!firstDate[k]||b.date<firstDate[k]) firstDate[k]=b.date;
      (datesByPatient[k]=datesByPatient[k]||[]).push(b.date);
    });
    // 再診＝前回の来院から1ヶ月以上空いた方（前回来院日の1ヶ月後の日付以降に来院）
    const addMonth=ds=>{const d=new Date(ds+"T00:00:00");d.setMonth(d.getMonth()+1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
    const blank=()=>({sales:0,ins:0,jifee:0,insCount:0,juCount:0,hariCount:0,jihiOnlyCount:0,visits:0,newPt:0,returnPt:0,monthFirst:0,keepPt:0,
      makiNew:0,makiCont:0,makiSales:0,jibaiNew:0,jibaiCont:0,jibaiSales:0,cancel:0,booked:0});
    const out=[];
    for(let d=1;d<=days;d++){
      const ds=`${ym}-${String(d).padStart(2,"0")}`;
      const r=blank();
      r.date=ds; r.dow=new Date(ds+"T00:00:00").getDay();
      const dayPays=payments.filter(p=>p.payment_date===ds&&bookingById[p.booking_id]);
      const paidIds=new Set();
      const karteIds=new Set(); // 当日カルテ管理料をいただいた会計（今月初の判定に使う）
      dayPays.forEach(p=>{
        if(!p.is_refund&&Array.isArray(p.jifee_items)&&p.jifee_items.some(it=>String((it&&it.label)||"").includes("カルテ管理料"))) karteIds.add(p.booking_id);
        if(p.is_refund){ r.sales+=p.total_amount||0; r.ins+=p.insurance_amount||0; r.jifee+=p.jifee_amount||0; return; }
        r.sales+=p.total_amount||0;
        r.ins+=p.insurance_amount||0;
        r.jifee+=p.jifee_amount||0;
        if(p.insurance_type){
          // 会計画面で施術区分（保険診療／鍼灸併用／鍼灸のみ）を選んだ会計だけを保険として数える
          r.insCount++;
          if(String(p.insurance_type).startsWith("鍼灸")) r.hariCount++; else r.juCount++;
        }else{
          // 区分が未選択の会計は「自費のみ」として数える
          r.jihiOnlyCount++;
        }
        paidIds.add(p.booking_id);
        (Array.isArray(p.jifee_items)?p.jifee_items:[]).forEach(it=>{
          const label=String(it.label||""),amt=parseInt(it.amount)||0;
          if(label.startsWith("巻き爪")){
            if(label.includes("継続")) r.makiCont++; else r.makiNew++;
            r.makiSales+=amt;
          }else if(label.startsWith("自賠")){
            if(label.includes("継続")) r.jibaiCont++; else r.jibaiNew++;
            r.jibaiSales+=amt;
          }
        });
      });
      r.visits=paidIds.size;
      paidIds.forEach(id=>{
        const b=bookingById[id];
        if(!b) return;
        const k=patientKey(b);
        if(firstDate[k]===ds){ r.newPt++; return; }
        const prevDates=(datesByPatient[k]||[]).filter(x=>x<ds).sort();
        const prev=prevDates[prevDates.length-1];
        if(prev&&addMonth(prev)<=ds) r.returnPt++;                       // 再診：前回から1ヶ月以上空いた
        else if(karteIds.has(id)) r.monthFirst++;                         // 今月初：当日カルテ管理料をいただいた方（新患・再診以外）
        else r.keepPt++;                                                  // 月内2回目以降（カルテ管理料なし）
      });
      const dayBookings=storeBookings.filter(b=>b.date===ds);
      r.booked=dayBookings.length;
      r.cancel=dayBookings.filter(b=>b.cancelled).length;
      out.push(r);
    }
    return out;
  },[bookings,payments,storeId,ym,firstStoreId]);

  const sumKeys=["sales","ins","jifee","insCount","juCount","hariCount","jihiOnlyCount","visits","newPt","returnPt","monthFirst","keepPt","makiNew","makiCont","makiSales","jibaiNew","jibaiCont","jibaiSales","cancel","booked"];
  const total={};
  sumKeys.forEach(k=>{total[k]=rows.reduce((s,r)=>s+(r[k]||0),0);});
  const cancelRate=r=>r.booked>0?(r.cancel/r.booked*100).toFixed(1)+"%":"-";

  const COLS=[
    {h:"総売上",f:r=>fmt(r.sales)},
    {h:"保険窓口",f:r=>fmt(r.ins)},
    {h:"自費合計",f:r=>fmt(r.jifee)},
    {h:"保険対応件数",f:r=>r.insCount},
    {h:"保険施術（柔整）件数",f:r=>r.juCount},
    {h:"鍼灸保険件数",f:r=>r.hariCount},
    {h:"新患数",f:r=>r.newPt},
    {h:"再診数",f:r=>r.returnPt},
    {h:"今月初",f:r=>r.monthFirst},
    {h:"月内2回目以降",f:r=>r.keepPt},
    {h:"総来院数",f:r=>r.visits},
    {h:"巻き爪（新規）",f:r=>r.makiNew},
    {h:"巻き爪（継続）",f:r=>r.makiCont},
    {h:"巻き爪（売上）",f:r=>fmt(r.makiSales)},
    {h:"自賠新規",f:r=>r.jibaiNew},
    {h:"自賠継続",f:r=>r.jibaiCont},
    {h:"自賠売上",f:r=>fmt(r.jibaiSales)},
    {h:"キャンセル数",f:r=>r.cancel},
    {h:"キャンセル率",f:cancelRate},
    {h:"自費のみ件数",f:r=>r.jihiOnlyCount},
  ];

  function copyForSheet(){
    // スプレッドシートに貼り付けやすいよう、タブ区切り（日付＋上の表と同じ並び、数値は¥・カンマなし）で出力
    const num=(c,r)=>{const v=c.f(r);return typeof v==="string"?v.replace(/[¥,]/g,""):v;};
    const header=["日付",...COLS.map(c=>c.h.replace(/[（）]/g,""))].join("\t");
    const lines=rows.map(r=>[`${Number(r.date.slice(5,7))}/${Number(r.date.slice(8,10))}`,...COLS.map(c=>num(c,r))].join("\t"));
    const totalLine=["合計",...COLS.map(c=>num(c,total))].join("\t");
    const text=[header,...lines,totalLine].join("\n");
    try{
      navigator.clipboard.writeText(text).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000);});
    }catch(e){ alert("コピーできませんでした"); }
  }

  const th={padding:"8px 8px",fontSize:11,fontWeight:800,color:"#475569",background:"#f1f5f9",whiteSpace:"nowrap",borderBottom:"1px solid #e2e8f0",textAlign:"right"};
  const td={padding:"7px 8px",fontSize:12,color:"#1e293b",whiteSpace:"nowrap",borderBottom:"1px solid #f1f5f9",textAlign:"right"};

  return(
    <div className="card" style={{padding:16}}>
      <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",marginBottom:12}}>
        <span style={{fontWeight:800,fontSize:16,color:"#1e3a5f"}}>📋 日計表（自動集計）</span>
        <select value={storeId} onChange={e=>setStoreId(Number(e.target.value))} style={{padding:"6px 10px",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:13}}>
          {(stores||[]).map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
        </select>
        <button onClick={()=>shiftMonth(-1)} style={{padding:"5px 10px",borderRadius:8,border:"1.5px solid #e2e8f0",background:"white",cursor:"pointer"}}>◀</button>
        <span style={{fontWeight:800,fontSize:14}}>{ym.replace("-","年")}月</span>
        <button onClick={()=>shiftMonth(1)} style={{padding:"5px 10px",borderRadius:8,border:"1.5px solid #e2e8f0",background:"white",cursor:"pointer"}}>▶</button>
        <button onClick={copyForSheet} style={{marginLeft:"auto",padding:"6px 14px",borderRadius:8,border:"none",background:copied?"#059669":"#1e3a5f",color:"white",fontSize:12,fontWeight:700,cursor:"pointer"}}>
          {copied?"✓ コピーしました":"スプレッドシート貼り付け用にコピー"}
        </button>
      </div>
      <div style={{fontSize:11,color:"#94a3b8",marginBottom:10,lineHeight:1.6}}>
        会計（POS）のデータから自動で集計しています。巻き爪・自賠は、会計画面の「巻き爪・自賠」ボタンで追加した分から数えます（導入前の会計は0件になります）。
        保険対応件数＝会計画面で施術区分（保険診療／鍼灸併用／鍼灸のみ）を選んだ会計の件数／自費のみ件数＝施術区分が未選択の会計の件数（右端の列）／新患＝その院で初めて予約した患者様／再診＝前回の来院から1ヶ月以上空いて来院した患者様／今月初＝当日カルテ管理料をいただいた患者様（新患・再診を除く）／月内2回目以降＝それ以外の来院（カルテ管理料なし）。
      </div>
      <div style={{overflowX:"auto",border:"1px solid #e2e8f0",borderRadius:10}}>
        <table style={{borderCollapse:"collapse",width:"100%"}}>
          <thead>
            <tr>
              <th style={{...th,textAlign:"left",position:"sticky",left:0,zIndex:1}}>日付</th>
              {COLS.map(c=><th key={c.h} style={th}>{c.h}</th>)}
            </tr>
          </thead>
          <tbody>
            {rows.map(r=>{
              const isFuture=r.date>todayStr;
              const color=r.dow===0?"#dc2626":r.dow===6?"#7c3aed":"#1e293b";
              return(
                <tr key={r.date} style={{opacity:isFuture?0.35:1,background:r.date===todayStr?"#fffbeb":"white"}}>
                  <td style={{...td,textAlign:"left",fontWeight:700,color,position:"sticky",left:0,background:r.date===todayStr?"#fffbeb":"white"}}>
                    {Number(r.date.slice(5,7))}/{Number(r.date.slice(8,10))}（{DAYS_JP[r.dow]}）
                  </td>
                  {COLS.map(c=><td key={c.h} style={td}>{c.f(r)}</td>)}
                </tr>
              );
            })}
            <tr style={{background:"#fef3c7"}}>
              <td style={{...td,textAlign:"left",fontWeight:800,position:"sticky",left:0,background:"#fef3c7"}}>合計</td>
              {COLS.map(c=><td key={c.h} style={{...td,fontWeight:800}}>{c.f(total)}</td>)}
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  );
}

function StatsPanel({bookings,payments,stores,todayStr}){
  const today=new Date(todayStr+"T00:00:00");
  const fmt=n=>"¥"+Number(n||0).toLocaleString();
  const DAYS_JP=["日","月","火","水","木","金","土"];

  // ===== 店舗フィルタ（全店舗 / 各店舗） =====
  const [selStatsStoreId,setSelStatsStoreId]=React.useState(null); // null = 全店舗
  const [selStatsStaffId,setSelStatsStaffId]=React.useState(null); // null = 全スタッフ
  const [filterTab,setFilterTab]=React.useState("store"); // "store" | "staff"
  const [reportTab,setReportTab]=React.useState("monthly"); // "monthly" | "annual"
  const [listModal,setListModal]=React.useState(null); // {title, items:[{name,sub}]} | null
  const [funnelModal,setFunnelModal]=React.useState(null); // {title, funnel, color} | null
  const [expandedStaffId,setExpandedStaffId]=React.useState(null); // スタッフ別売上タブで、個人レポートを展開中のスタッフID
  const firstStoreId=(stores&&stores.length>0)?stores[0].id:1;
  const scopedBookings=React.useMemo(()=>{
    let list=bookings;
    if(selStatsStoreId!==null) list=list.filter(b=>(b.store_id||firstStoreId)===selStatsStoreId);
    if(selStatsStaffId!==null) list=list.filter(b=>b.staff_id===selStatsStaffId);
    return list;
  },[bookings,selStatsStoreId,selStatsStaffId,firstStoreId]);
  const scopedBookingIds=React.useMemo(()=>new Set(scopedBookings.map(b=>b.id)),[scopedBookings]);
  const scopedPayments=React.useMemo(()=>{
    if(selStatsStoreId===null&&selStatsStaffId===null) return payments;
    return payments.filter(p=>scopedBookingIds.has(p.booking_id));
  },[payments,selStatsStoreId,selStatsStaffId,scopedBookingIds]);

  // 院（店舗全体）の売上・予約 ＝ スタッフ絞り込みを一切含めない集計（個人目標との比較用に別立てで用意）
  const storeOnlyBookings=React.useMemo(()=>{
    if(selStatsStoreId===null) return bookings;
    return bookings.filter(b=>(b.store_id||firstStoreId)===selStatsStoreId);
  },[bookings,selStatsStoreId,firstStoreId]);
  const storeOnlyBookingIds=React.useMemo(()=>new Set(storeOnlyBookings.map(b=>b.id)),[storeOnlyBookings]);
  const storeOnlyPayments=React.useMemo(()=>{
    if(selStatsStoreId===null) return payments;
    return payments.filter(p=>storeOnlyBookingIds.has(p.booking_id));
  },[payments,selStatsStoreId,storeOnlyBookingIds]);

  // 期間設定
  function getRange(type){
    const now=new Date(todayStr+"T00:00:00");
    const pad=n=>String(n).padStart(2,"0");
    const toStr=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    if(type==="today") return{start:todayStr,end:todayStr};
    if(type==="month"){const s=new Date(now.getFullYear(),now.getMonth(),1);const e=new Date(now.getFullYear(),now.getMonth()+1,0);return{start:toStr(s),end:toStr(e)};}
    if(type==="last_month"){const s=new Date(now.getFullYear(),now.getMonth()-1,1);const e=new Date(now.getFullYear(),now.getMonth(),0);return{start:toStr(s),end:toStr(e)};}
    if(type==="3months"){const s=new Date(now.getFullYear(),now.getMonth()-2,1);return{start:toStr(s),end:todayStr};}
    if(type==="6months"){const s=new Date(now.getFullYear(),now.getMonth()-5,1);return{start:toStr(s),end:todayStr};}
    if(type==="1year"){const s=new Date(now.getFullYear()-1,now.getMonth()+1,1);return{start:toStr(s),end:todayStr};}
    return{start:todayStr,end:todayStr};
  }

  const [rangeType,setRangeType]=React.useState("month");
  const [customStart,setCustomStart]=React.useState(todayStr.slice(0,7)+"-01");
  const [customEnd,setCustomEnd]=React.useState(todayStr);

  const range=rangeType==="custom"?{start:customStart,end:customEnd}:getRange(rangeType);
  const inRange=(d)=>d>=range.start&&d<=range.end;

  // ===== 期間の進捗（選んでいる期間のうち、今日までどれだけ経過したか） =====
  const rangeStartDate=new Date(range.start+"T00:00:00");
  const rangeEndDate=new Date(range.end+"T00:00:00");
  const totalRangeDays=Math.max(1,Math.round((rangeEndDate-rangeStartDate)/86400000)+1);
  const todayForRange=new Date(todayStr+"T00:00:00");
  let elapsedRangeDays;
  if(todayForRange<rangeStartDate) elapsedRangeDays=0;
  else if(todayForRange>rangeEndDate) elapsedRangeDays=totalRangeDays;
  else elapsedRangeDays=Math.round((todayForRange-rangeStartDate)/86400000)+1;
  const rangeProgressPct=Math.round(elapsedRangeDays/totalRangeDays*100);

  // ===== 診療日数（実際に営業していた日数）の自動計算 =====
  const [allBusinessHours,setAllBusinessHours]=React.useState([]);
  const [allClosures,setAllClosures]=React.useState([]);
  React.useEffect(()=>{
    Promise.all([
      sb.select("business_hours","?order=store_id.asc,day_of_week.asc"),
      sb.select("temp_closures","?order=store_id.asc,date.asc"),
    ]).then(([bh,tc])=>{
      setAllBusinessHours(Array.isArray(bh)?bh:[]);
      setAllClosures(Array.isArray(tc)?tc:[]);
    }).catch(()=>{});
  },[]);
  // 指定店舗・指定日が営業日かどうか（全店舗合算の時は1つ目の店舗の営業日を基準にする）
  function isBusinessDay(dateStr,storeIdFilter){
    const sid = storeIdFilter!=null ? storeIdFilter : (stores.length>0?stores[0].id:null);
    if(sid==null) return true; // 店舗データが無ければフェイルセーフでカウントする
    const closure=allClosures.find(c=>c.store_id===sid&&c.date===dateStr);
    if(closure) return closure.is_closed===false; // 臨時休業日は除外／営業時間変更日は診療日として数える
    const dow=new Date(dateStr+"T00:00:00").getDay();
    const dh=allBusinessHours.find(h=>h.store_id===sid&&h.day_of_week===dow);
    if(!dh) return true; // 営業時間データが無い店舗はフェイルセーフで診療日扱い
    return dh.is_open!==false;
  }
  function countBusinessDays(startStr,endStr,storeIdFilter){
    let count=0;
    let d=new Date(startStr+"T00:00:00");
    const endD=new Date(endStr+"T00:00:00");
    let guard=0;
    while(d<=endD&&guard<400){
      const ds=fmtDate(d);
      if(ds<=todayStr&&isBusinessDay(ds,storeIdFilter)) count++;
      d.setDate(d.getDate()+1);guard++;
    }
    return count;
  }
  const totalBusinessDaysInRange=(()=>{
    let count=0;
    let d=new Date(range.start+"T00:00:00");
    const endD=new Date(range.end+"T00:00:00");
    let guard=0;
    while(d<=endD&&guard<400){
      if(isBusinessDay(fmtDate(d),selStatsStoreId)) count++;
      d.setDate(d.getDate()+1);guard++;
    }
    return count;
  })();
  const elapsedBusinessDays=countBusinessDays(range.start,range.end,selStatsStoreId);

  // ===== 月間売上目標（院＝店舗全体、個人＝選択中スタッフ、それぞれ別々にブラウザへ保存） =====
  const storeTargetKey=`ando_sales_target_store_${selStatsStoreId||"all"}_${range.start.slice(0,7)}`;
  const [storeSalesTarget,setStoreSalesTarget]=React.useState("");
  React.useEffect(()=>{
    try{ setStoreSalesTarget(localStorage.getItem(storeTargetKey)||""); }catch(e){ setStoreSalesTarget(""); }
  },[storeTargetKey]);
  function updateStoreSalesTarget(val){
    setStoreSalesTarget(val);
    try{ localStorage.setItem(storeTargetKey,val); }catch(e){}
  }

  const staffTargetKey=selStatsStaffId!=null?`ando_sales_target_staff_${selStatsStoreId||"all"}_${selStatsStaffId}_${range.start.slice(0,7)}`:null;
  const [staffSalesTarget,setStaffSalesTarget]=React.useState("");
  React.useEffect(()=>{
    if(!staffTargetKey){ setStaffSalesTarget(""); return; }
    try{ setStaffSalesTarget(localStorage.getItem(staffTargetKey)||""); }catch(e){ setStaffSalesTarget(""); }
  },[staffTargetKey]);
  function updateStaffSalesTarget(val){
    setStaffSalesTarget(val);
    if(!staffTargetKey) return;
    try{ localStorage.setItem(staffTargetKey,val); }catch(e){}
  }

  // 期間内の予約・会計
  const bks=scopedBookings.filter(b=>b.date&&inRange(b.date));
  const pays=scopedPayments.filter(p=>p.payment_date&&inRange(p.payment_date));
  const storeOnlyPays=storeOnlyPayments.filter(p=>p.payment_date&&inRange(p.payment_date));
  const storeTotalSales=storeOnlyPays.reduce((s,p)=>s+(p.total_amount||0),0);

  // === 指標計算 ===
  const totalBk=bks.length;
  const paidBk=pays.filter(p=>!p.is_refund).length;
  const cancelledBk=bks.filter(b=>b.cancelled).length;
  const confirmedBk=totalBk-cancelledBk;
  // 当日キャンセル（予約日そのものにキャンセルされたもの）
  const sameDayCancelList=bks.filter(b=>b.cancelled&&b.cancelled_at&&fmtDate(new Date(b.cancelled_at))===b.date);
  const sameDayCancelCount=sameDayCancelList.length;

  // 売上
  const totalSales=pays.reduce((s,p)=>s+(p.total_amount||0),0);
  const insSales=pays.reduce((s,p)=>s+(p.insurance_amount||0),0);
  const jifeeSales=pays.reduce((s,p)=>s+(p.jifee_amount||0),0);

  // スタッフ別売上（会計に紐づく予約の担当スタッフで集計）
  const bookingByIdForStats=React.useMemo(()=>{
    const map={};
    scopedBookings.forEach(b=>{map[b.id]=b;});
    return map;
  },[scopedBookings]);
  const salesByStaffMap={};
  pays.forEach(p=>{
    const booking=bookingByIdForStats[p.booking_id];
    const sid=(booking&&booking.staff_id)||0;
    if(!salesByStaffMap[sid]) salesByStaffMap[sid]={total:0,insurance:0,jifee:0,count:0};
    salesByStaffMap[sid].total+=(p.total_amount||0);
    salesByStaffMap[sid].insurance+=(p.insurance_amount||0);
    salesByStaffMap[sid].jifee+=(p.jifee_amount||0);
    if(!p.is_refund) salesByStaffMap[sid].count++;
  });
  const salesByStaffList=Object.entries(salesByStaffMap).map(([sid,v])=>{
    const staffInfo=STAFF_ACCOUNTS.find(s=>s.id===Number(sid))||{name:"担当未定",color:"#888",initial:"？"};
    return{staffId:Number(sid),staffInfo,...v};
  }).sort((a,b)=>b.total-a.total);
  const maxStaffSales=Math.max(...salesByStaffList.map(s=>s.total),1);

  // 性別・年代の集計（患者ごとに一番新しい入力値を採用。期間に関わらず店舗/スタッフ絞り込みは反映）
  const patientDemo={};
  [...scopedBookings].sort((a,b)=>a.date.localeCompare(b.date)).forEach(b=>{
    if(!patientDemo[b.patient_name]) patientDemo[b.patient_name]={gender:null,age:null};
    if(b.gender) patientDemo[b.patient_name].gender=b.gender;
    if(b.age!=null && b.age!=="") patientDemo[b.patient_name].age=Number(b.age);
  });
  const demoEntries=Object.values(patientDemo);
  const genderCounts={"女性":0,"男性":0,"回答しない":0,"未回答":0};
  demoEntries.forEach(d=>{
    if(d.gender&&genderCounts[d.gender]!==undefined) genderCounts[d.gender]++;
    else genderCounts["未回答"]++;
  });
  const genderTotal=demoEntries.length;
  const AGE_BANDS=[
    {label:"10代未満",min:0,max:9},
    {label:"10代",min:10,max:19},
    {label:"20代",min:20,max:29},
    {label:"30代",min:30,max:39},
    {label:"40代",min:40,max:49},
    {label:"50代",min:50,max:59},
    {label:"60代",min:60,max:69},
    {label:"70代以上",min:70,max:999},
  ];
  const ageCounts=AGE_BANDS.map(band=>({
    ...band,
    count:demoEntries.filter(d=>d.age!=null&&d.age>=band.min&&d.age<=band.max).length
  }));
  const ageUnknownCount=demoEntries.filter(d=>d.age==null).length;
  const maxAgeCount=Math.max(...ageCounts.map(a=>a.count),1);

  // ユニーク患者
  const uniquePatients=[...new Set(bks.map(b=>b.patient_name))];
  const totalUnique=uniquePatients.length;
  const allPatientDates={};
  scopedBookings.forEach(b=>{if(!allPatientDates[b.patient_name])allPatientDates[b.patient_name]=[];allPatientDates[b.patient_name].push(b.date);});
  let newCount=0,revisitCount=0;
  const newPatientsList=[];
  uniquePatients.forEach(name=>{
    const all=(allPatientDates[name]||[]).sort();
    const first=all[0];
    if(first&&first>=range.start&&first<=range.end){
      newCount++;
      // 累計来院数（キャンセル除く・店舗内の全期間）と、初回担当スタッフを調べる
      const patientVisits=scopedBookings.filter(b=>b.patient_name===name&&!b.cancelled).sort((a,b2)=>a.date.localeCompare(b2.date)||(a.time||"").localeCompare(b2.time||""));
      const totalVisits=patientVisits.length;
      const firstStaffId=patientVisits.length>0?patientVisits[0].staff_id:null;
      newPatientsList.push({name,sub:`初回来院：${first}　累計${totalVisits}回`,totalVisits,staffId:firstStaffId,reached8:totalVisits>=8});
    }
    else revisitCount++;
  });
  const newRate=totalUnique>0?Math.round(newCount/totalUnique*100):0;

  // 新規患者の8回継続数・率（全体・スタッフ別）
  const eightVisitCount=newPatientsList.filter(p=>p.reached8).length;
  const eightVisitRate=newPatientsList.length>0?Math.round(eightVisitCount/newPatientsList.length*100):0;
  // 1〜8回目それぞれで「その回数まで到達した人数」を数える（継続ファネル）
  function buildVisitFunnel(patients){
    const steps=[];
    for(let n=1;n<=8;n++){
      steps.push({step:n,count:patients.filter(p=>p.totalVisits>=n).length});
    }
    return steps;
  }
  const overallFunnel=buildVisitFunnel(newPatientsList);
  const eightByStaff={};
  newPatientsList.forEach(p=>{
    const sid=p.staffId||0;
    if(!eightByStaff[sid]) eightByStaff[sid]={total:0,reached8:0,patients:[]};
    eightByStaff[sid].total++;
    eightByStaff[sid].patients.push(p);
    if(p.reached8) eightByStaff[sid].reached8++;
  });
  const eightByStaffList=Object.entries(eightByStaff).map(([sid,v])=>{
    const staffInfo=STAFF_ACCOUNTS.find(s=>s.id===Number(sid))||{name:"担当未定",color:"#888",initial:"？"};
    return{staffId:Number(sid),staffInfo,total:v.total,reached8:v.reached8,rate:v.total>0?Math.round(v.reached8/v.total*100):0,funnel:buildVisitFunnel(v.patients)};
  }).sort((a,b)=>b.total-a.total);

  // 継続ファネルの棒グラフを描画するヘルパー
  function renderVisitFunnel(funnel,color){
    const max=Math.max(...funnel.map(f=>f.count),1);
    return(
      <div style={{display:"flex",alignItems:"flex-end",gap:6,height:100,padding:"0 2px"}}>
        {funnel.map(f=>{
          const pct=Math.round(f.count/max*100);
          return(
            <div key={f.step} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
              <div style={{fontSize:11,fontWeight:800,color:"#374151"}}>{f.count}</div>
              <div style={{width:"100%",height:`${Math.max(pct,4)}%`,background:color,borderRadius:"4px 4px 0 0",minHeight:4}}/>
              <div style={{fontSize:9,color:"#94a3b8",whiteSpace:"nowrap"}}>{f.step}回目</div>
            </div>
          );
        })}
      </div>
    );
  }

  // 単価・LTV
  const allUnitPrice=paidBk>0?Math.round(totalSales/paidBk):0;
  const ltv=totalUnique>0?Math.round(totalSales/totalUnique):0;

  // 離反（30日以上未来院）
  const cutoff=new Date(today);cutoff.setDate(cutoff.getDate()-30);
  const cutoffStr=cutoff.toISOString().split("T")[0];
  const allUnique=[...new Set(scopedBookings.map(b=>b.patient_name))];
  const churnedNames=allUnique.filter(name=>{
    const last=(allPatientDates[name]||[]).sort().slice(-1)[0];
    return last&&last<cutoffStr&&!bks.some(b=>b.patient_name===name);
  });
  const churnedPatientsList=churnedNames.map(name=>{
    const last=(allPatientDates[name]||[]).sort().slice(-1)[0];
    const daysSince=Math.round((today-new Date(last+"T00:00:00"))/86400000);
    return{name,sub:`最終来院：${last}（${daysSince}日前）`};
  });
  const churnCount=churnedNames.length;
  const churnRate=allUnique.length>0?((churnCount/allUnique.length)*100).toFixed(1):"0";

  // 曜日別
  const dayCount=[0,0,0,0,0,0,0];
  bks.forEach(b=>{if(b.date){const d=new Date(b.date+"T00:00:00");dayCount[d.getDay()]++;}});
  const maxDay=Math.max(...dayCount,1);

  // 時間帯別（時間を取得）
  const hourCount={};
  bks.forEach(b=>{if(b.time){const h=parseInt(b.time.split(":")[0]);hourCount[h]=(hourCount[h]||0)+1;}});
  const hourEntries=Object.entries(hourCount).sort((a,b)=>Number(a[0])-Number(b[0]));
  const maxHour=Math.max(...Object.values(hourCount),1);

  // コース別（menu）
  const menuCount={};
  bks.forEach(b=>{if(b.menu)menuCount[b.menu]=(menuCount[b.menu]||0)+1;});
  const menuEntries=Object.entries(menuCount).sort((a,b)=>b[1]-a[1]);
  const maxMenu=Math.max(...Object.values(menuCount),1);

  // 月別推移（全期間の月別予約数）
  const monthlyMap={};
  scopedBookings.forEach(b=>{if(b.date){const m=b.date.slice(0,7);monthlyMap[m]=(monthlyMap[m]||0)+1;}});
  const monthlyEntries=Object.entries(monthlyMap).sort((a,b)=>a[0].localeCompare(b[0])).slice(-12);
  const maxMonthly=Math.max(...monthlyEntries.map(e=>e[1]),1);

  // インサイト
  const peakDay=dayCount.indexOf(Math.max(...dayCount));
  const peakHour=hourEntries.length>0?hourEntries.reduce((a,b)=>b[1]>a[1]?b:a,hourEntries[0]):null;

  const rangeButtons=[
    {id:"month",label:"今月"},
    {id:"last_month",label:"先月"},
    {id:"3months",label:"3ヶ月"},

  // 色つきの見出し帯（カードの上部に付けて、何のカードかひと目で分かるようにする）
  function SectionTitle({icon,label,color="#1e3a5f",bg="#eff6ff"}){
    return(
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12,paddingBottom:10,borderBottom:`2px solid ${bg}`}}>
        <span style={{width:28,height:28,borderRadius:8,background:bg,color,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,flexShrink:0}}>{icon}</span>

  }
  // 増減を▲▼と色（緑＝プラス／赤＝マイナス）でひと目でわかるように表示するタグ
  function DeltaTag({text,positive,size=12}){
    if(positive===null||positive===undefined){
      return <span style={{fontSize:size,fontWeight:700,color:"#94a3b8"}}>{text}</span>;
    }
    return(
      <span style={{display:"inline-flex",alignItems:"center",gap:3,fontSize:size,fontWeight:800,color:positive?"#059669":"#dc2626",background:positive?"#f0fdf4":"#fef2f2",padding:"2px 9px",borderRadius:20,border:`1px solid ${positive?"#bbf7d0":"#fecaca"}`}}>
        <span>{positive?"▲":"▼"}</span>{text}
      </span>
    );
  }

  // バーチャート（水平）
  function HBar({label,count,max,color="#059669",highlight}){
    const pct=max>0?Math.round(count/max*100):0;
    return(
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>

        <div style={{flex:1,height:18,background:"#f1f5f9",borderRadius:4,overflow:"hidden"}}>
          <div style={{height:"100%",width:`${pct}%`,background:highlight?"#ef4444":color,borderRadius:4,transition:"width .3s"}}/>
        </div>
        <div style={{width:28,fontSize:12,fontWeight:700,color:"#374151",textAlign:"right",flexShrink:0}}>{count}</div>

      </div>
    );

  return(

                    <div style={{display:"flex",gap:5,flexWrap:"wrap",alignItems:"center"}}>

            ))}
                        {stores&&stores.length>0&&(

        </div>
        <div style={{fontSize:11,color:"#94a3b8",marginTop:8,marginBottom:14}}>

      {/* 月間レポート／年間推移 タブ切り替え */}

          <button key={t.id} onClick={()=>setReportTab(t.id)} style={{padding:"9px 20px",borderRadius:10,fontSize:13,fontWeight:800,border:"1.5px solid",borderColor:reportTab===t.id?"#1e3a5f":"#e2e8f0",background:reportTab===t.id?"#1e3a5f":"white",color:reportTab===t.id?"white":"#374151",cursor:"pointer",fontFamily:"inherit"}}>{t.label}</button>

      </div>

      {reportTab==="staffsales"&&(

        const rangeDayList=[];
        {

          const endD=new Date(range.end+"T00:00:00");
          let guard=0;
          while(d<=endD&&guard<400){rangeDayList.push(fmtDate(d));d.setDate(d.getDate()+1);guard++;}
        }
        let cum=0;
        const cumulativeSeries=rangeDayList.map(ds=>{
          if(ds<=todayStr) cum+=(dailySalesMap[ds]||0);
          return{date:ds,cumulative:ds<=todayStr?cum:null};
        });
        const targetNum=Number(storeSalesTarget)||0;
        const dailyAvg=elapsedRangeDays>0?Math.round(storeTotalSales/elapsedRangeDays):0;
        const remainingDays=Math.max(0,totalRangeDays-elapsedRangeDays);
        const projectedTotal=elapsedRangeDays>0?Math.round(storeTotalSales/elapsedRangeDays*totalRangeDays):0;
        const dailyBudget=totalRangeDays>0?Math.round(targetNum/totalRangeDays):0;
        const jifeePct=totalSales>0?Math.round(jifeeSales/totalSales*100):0;
        const insPct=totalSales>0?Math.round(insSales/totalSales*100):0;

        // 追加の単価指標

        const newPatientNames=new Set(newPatientsList.map(p=>p.name));
        const newPatientSales=pays.reduce((s,p)=>{
          const booking=bookingByIdForStats[p.booking_id];
          if(booking&&newPatientNames.has(booking.patient_name)) return s+(p.total_amount||0);
          return s;
        },0);
        const newUnitPrice=newCount>0?Math.round(newPatientSales/newCount):0;
        const continuedVisits=Math.max(0,confirmedBk-newCount);
        const avgVisitCount=totalUnique>0?(confirmedBk/totalUnique).toFixed(1):"0.0";

        // グラフ用スケール
        const maxScale=Math.max(targetNum,cum,1);
        const chartW=600,chartH=160,padL=4,padR=4,padT=10,padB=4;
        const plotW=chartW-padL-padR,plotH=chartH-padT-padB;
        const n=rangeDayList.length||1;
        const barW=Math.max(2,plotW/n-2);

                <div style={{fontSize:10,color:"#94a3b8"}}>※前日までの実績で算出</div>

              <svg viewBox={`0 0 ${chartW} ${chartH}`} style={{width:"100%",height:140,display:"block"}}>

              <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"#94a3b8",marginTop:2}}>

                          <DeltaTag positive={achievePct>=rangeProgressPct} text={`${achievePct>=rangeProgressPct?"+":""}${achievePct-rangeProgressPct}pt（${achievePct>=rangeProgressPct?"順調":"やや遅れ気味"}）`}/>

                  <div style={{fontSize:16,fontWeight:800,color:"#1e3a5f"}}>{c.val}</div>
                </div>
              ))}
            </div>
          </div>
        );
      })()}

      {/* 単価・LTV（離反率・詳細） */}
      <div style={{display:"grid",gridTemplateColumns:"1fr",gap:14,marginBottom:14}}>
        <div style={{background:"white",borderRadius:14,padding:"20px 22px",boxShadow:"0 4px 16px rgba(30,58,95,.1)",border:"1.5px solid #dbeafe"}}>
          <div style={{fontWeight:800,fontSize:16,color:"#1e3a5f",marginBottom:16}}>📊 継続・離反</div>
