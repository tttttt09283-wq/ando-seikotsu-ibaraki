                          background:day===0?"#fff1f2":day===6?"#faf5ff":"#f8fafc"}}>
                          <div>{label}</div>
                          <div style={{fontSize:9,fontWeight:600}}>{"日月火水木金土"[day]}</div>
                        </th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {/* 個人シフトのみ表示 */}
                    {[selStaff].map(s=>{
                      const bal=monthHolidays[s.id]||{有休残:10,振替残:0,祝振替残:0};
                      return(
                        <tr key={s.id}>
                          <td style={{padding:"6px 12px",borderBottom:"1px solid #f1f5f9",fontWeight:700,fontSize:12,background:"white"}}>
                            <div style={{display:"flex",alignItems:"center",gap:5}}>
                              <div style={{width:20,height:20,borderRadius:5,background:s.color,display:"flex",alignItems:"center",justifyContent:"center",color:"white",fontWeight:800,fontSize:10}}>{s.initial}</div>
                              {s.name.replace(" 先生","")}
                            </div>
                          </td>
                          {dates.map(({date,day})=>{
                            const key=`${s.id}_${date}`;
                            const val=monthShifts[key]||"出勤";
                            const color=SHIFT_COLORS[val];
                            const isEditing=editingCell===key;
                            return(
                              <td key={date} style={{padding:2,textAlign:"center",borderBottom:"1px solid #f1f5f9",borderRight:"1px solid #f1f5f9",
                                background:day===0?"#fff8f8":day===6?"#faf8ff":"white"}}>
                                {isEditing?(
                                  <select autoFocus value={val}
                                    onChange={e=>setShiftCell(s.id,date,e.target.value)}
                                    onBlur={()=>setEditingCell(null)}
                                    style={{width:52,fontSize:10,padding:"2px",borderRadius:4,border:`1.5px solid ${color}`,fontFamily:"inherit",background:"white",cursor:"pointer"}}>
                                    {SHIFT_TYPES.map(t=><option key={t} value={t}>{t}</option>)}
                                  </select>
                                ):(
                                  <div onClick={()=>setEditingCell(key)}
                                    style={{width:28,height:26,borderRadius:6,background:color,color:"white",fontSize:10,fontWeight:800,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",margin:"auto",boxShadow:`0 1px 3px ${color}66`}}>
                                    {SHIFT_ABBR[val]}
                                  </div>
                                )}
                              </td>
                            );
                          })}
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
              <div style={{marginTop:16,display:"flex",gap:10}}>
                <button onClick={()=>setShiftTab("weekly")} style={{padding:"9px 16px",background:"white",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit",color:"#374151"}}>← 週固定に戻る</button>
                <button onClick={()=>{setMode("list");setSelStaffId(null);}} style={{padding:"9px 16px",background:"white",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit",color:"#374151"}}>一覧に戻る</button>
              </div>
            </div>
          )}
        </div>
      </div>
    );
  }

  // ===== スタッフ一覧画面 =====
  return(
    <div style={{maxWidth:1300,margin:"0 auto"}}>
      {toast&&<div style={{background:"#f0fdf4",border:"1px solid #86efac",borderRadius:8,padding:"10px 14px",marginBottom:12,color:"#15803d",fontWeight:700,fontSize:13}}>{toast}</div>}
      <div style={{background:"white",borderRadius:12,boxShadow:"0 1px 4px rgba(0,0,0,.06)",border:"1px solid #f1f5f9",overflow:"hidden"}}>
        <div style={{padding:"16px",display:"flex",alignItems:"center",justifyContent:"space-between",borderBottom:"1px solid #f1f5f9"}}>
          <div style={{fontSize:15,fontWeight:800,color:"#1e3a5f"}}>スタッフ一覧</div>
          <button onClick={()=>setShowAddStaff(true)} style={{padding:"8px 16px",background:"linear-gradient(135deg,#059669,#047857)",color:"white",border:"none",borderRadius:8,fontSize:13,fontWeight:800,cursor:"pointer",fontFamily:"inherit"}}>+ スタッフ追加</button>
        </div>
        {/* テーブルヘッダー */}
        <div style={{display:"grid",gridTemplateColumns:"1.4fr 1.8fr 0.9fr 0.9fr 1fr 1.1fr 0.9fr",background:"#f8fafc",borderBottom:"1px solid #e2e8f0"}}>
          {["名前","勤務地","役職","状態","シフト","対応メニュー","操作"].map(h=>(<div key={h} style={{padding:"10px 14px",fontSize:12,fontWeight:700,color:"#64748b"}}>{h}</div>))}
        </div>
        {/* 店舗ごとの固定カラー（店舗の並び順で割り当て） */}
        {(()=>{
          const STORE_COLORS=["#2563eb","#059669","#d97706","#7c3aed","#dc2626","#0891b2","#db2777"];
          function storeColor(storeId){
            const idx=stores.findIndex(st=>st.id===storeId);
            return STORE_COLORS[idx>=0?idx%STORE_COLORS.length:0];
          }
          return STAFF_ACCOUNTS.map(s=>{
            const assignedIds=staffStoreMap[s.id]||stores.map(st=>st.id); // 未設定＝全店舗
            return(
              <div key={s.id} style={{display:"grid",gridTemplateColumns:"1.4fr 1.8fr 0.9fr 0.9fr 1fr 1.1fr 0.9fr",borderBottom:"1px solid #f1f5f9",alignItems:"center"}}>
                <div style={{padding:"14px",display:"flex",alignItems:"center",gap:10}}>
                  <div style={{width:32,height:32,borderRadius:8,background:s.color,display:"flex",alignItems:"center",justifyContent:"center",color:"white",fontWeight:800,fontSize:13,flexShrink:0}}>{s.initial}</div>
                  <span style={{fontWeight:700,fontSize:14,color:"#1e293b"}}>{s.name}</span>
                </div>
                <div style={{padding:"14px",display:"flex",flexWrap:"wrap",gap:5}}>
                  {stores.length===0?<span style={{fontSize:12,color:"#94a3b8"}}>店舗未登録</span>:stores.map(st=>{
                    const active=assignedIds.indexOf(st.id)>-1;
                    const color=storeColor(st.id);
                    return(
                      <button key={st.id} onClick={()=>toggleStaffStore(s.id,st.id)} disabled={savingStore===s.id}
                        style={{padding:"4px 10px",borderRadius:20,border:"1.5px solid "+(active?color:"#e2e8f0"),background:active?color:"white",color:active?"white":"#94a3b8",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit",opacity:savingStore===s.id?0.6:1}}>
                        {st.name}
                      </button>
                    );
                  })}
                </div>
            <div style={{padding:"14px",fontSize:13,color:"#64748b"}}>{s.role==="admin"?"管理者":"スタッフ"}</div>
            <div style={{padding:"14px"}}><span style={{display:"inline-block",padding:"3px 10px",borderRadius:20,fontSize:12,fontWeight:700,background:"#dcfce7",color:"#15803d"}}>有効</span></div>
            <div style={{padding:"14px"}}>
              <button onClick={()=>openShift(s)} style={{padding:"6px 12px",background:"white",border:"1.5px solid #e2e8f0",borderRadius:6,fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",color:"#374151"}}>シフト設定</button>
            </div>
            <div style={{padding:"14px"}}>
              <button onClick={()=>setMenuEditStaff(s)} style={{padding:"6px 12px",background:"white",border:"1.5px solid #e2e8f0",borderRadius:6,fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",color:"#374151"}}>メニュー設定</button>
            </div>
            <div style={{padding:"14px"}}>
              <button style={{padding:"6px 12px",background:"white",border:"1.5px solid #e2e8f0",borderRadius:6,fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",color:"#374151"}}>編集</button>
            </div>
          </div>
          );
        });
        })()}
      </div>
      {showAddStaff&&<AddStaffModal onClose={()=>setShowAddStaff(false)} existingIds={STAFF_ACCOUNTS.map(s=>s.id)}/>}
      {menuEditStaff&&<StaffMenuPermissionsModal staff={menuEditStaff} onClose={(saved)=>{setMenuEditStaff(null);if(saved)showToast("対応メニューを保存しました（反映まで最大30秒かかる場合があります）");}}/>}
    </div>
  );
}
// ===== 店舗管理パネル =====
function StoreMgmtPanel(){
  const [stores,setStores]=React.useState([]);
  const [loading,setLoading]=React.useState(true);
  const [editId,setEditId]=React.useState(null); // null=一覧, "new"=新規, number=編集
  const [form,setForm]=React.useState({name:"",address:"",tel:"",email:"",memo:""});
  const [saving,setSaving]=React.useState(false);
  const [toast,setToast]=React.useState("");
  const [searchQ,setSearchQ]=React.useState("");

  React.useEffect(()=>{loadStores();},[]);

  async function loadStores(){
    setLoading(true);
    try{
      const data=await sb.select("stores","?order=id.asc");
      setStores(Array.isArray(data)?data:[]);
    }catch(e){console.error(e);}
    setLoading(false);
  }

  function showToast(msg){setToast(msg);setTimeout(()=>setToast(""),2500);}

  function openNew(){
    setForm({name:"",address:"",tel:"",email:"",memo:""});
    setEditId("new");
  }

  function openEdit(store){
    setForm({name:store.name||"",address:store.address||"",tel:store.tel||"",email:store.email||"",memo:store.memo||""});
    setEditId(store.id);
  }

  async function saveStore(){
    if(!form.name.trim()){alert("店舗名を入力してください");return;}
    setSaving(true);
    try{
      if(editId==="new"){
        const result=await sb.insert("stores",{name:form.name,address:form.address,tel:form.tel,email:form.email,memo:form.memo,active:true});
        if(Array.isArray(result)&&result.length>0) setStores(prev=>[...prev,result[0]]);
        showToast("店舗を追加しました");
      }else{
        await sb.update("stores",editId,{name:form.name,address:form.address,tel:form.tel,email:form.email,memo:form.memo});
        setStores(prev=>prev.map(s=>s.id===editId?{...s,...form}:s));
        showToast("店舗情報を更新しました");
      }
      setEditId(null);
      loadStores();
    }catch(e){alert("保存に失敗しました："+e.message);}
    setSaving(false);
  }

  async function toggleActive(store){
    try{
      await sb.update("stores",store.id,{active:!store.active});
      setStores(prev=>prev.map(s=>s.id===store.id?{...s,active:!s.active}:s));
      showToast(store.active?"店舗を無効にしました":"店舗を有効にしました");
    }catch(e){alert("更新に失敗しました");}
  }

  const filtered=stores.filter(s=>!searchQ||(s.name&&s.name.includes(searchQ))||(s.address&&s.address.includes(searchQ)));

  if(editId!==null){
    return(
      <div style={{maxWidth:800,margin:"0 auto"}}>
        {toast&&<div style={{background:"#f0fdf4",border:"1px solid #86efac",borderRadius:8,padding:"10px 14px",marginBottom:12,color:"#15803d",fontWeight:700,fontSize:13}}>{toast}</div>}
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:20}}>
          <button onClick={()=>setEditId(null)} style={{background:"none",border:"none",cursor:"pointer",color:"#64748b",fontSize:13,display:"flex",alignItems:"center",gap:4,fontFamily:"inherit"}}>← 一覧に戻る</button>
          <div style={{fontSize:16,fontWeight:800,color:"#1e3a5f"}}>{editId==="new"?"店舗を追加":"店舗情報を編集"}</div>
        </div>
        <div style={{background:"white",borderRadius:12,padding:"20px",boxShadow:"0 1px 4px rgba(0,0,0,.06)",border:"1px solid #f1f5f9"}}>
          {[
            {label:"店舗名 *",key:"name",placeholder:"例：あんど整骨院 香里園駅前院",type:"text"},
            {label:"住所",key:"address",placeholder:"例：大阪府寝屋川市香里園駅前",type:"text"},
            {label:"電話番号",key:"tel",placeholder:"例：072-000-0000",type:"tel"},
            {label:"メールアドレス",key:"email",placeholder:"例：info@ando.jp",type:"email"},
          ].map(f=>(
            <div key={f.key} style={{marginBottom:16}}>
              <label style={{display:"block",fontSize:12,fontWeight:700,color:"#374151",marginBottom:6}}>{f.label}</label>
              <input type={f.type} value={form[f.key]} placeholder={f.placeholder}
                onChange={e=>setForm(prev=>({...prev,[f.key]:e.target.value}))}
                style={{width:"100%",padding:"10px 12px",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:14,fontFamily:"inherit"}}/>
            </div>
          ))}
          <div style={{marginBottom:20}}>
            <label style={{display:"block",fontSize:12,fontWeight:700,color:"#374151",marginBottom:6}}>メモ</label>
            <textarea value={form.memo} placeholder="運営会社・備考など" rows={3}
              onChange={e=>setForm(prev=>({...prev,memo:e.target.value}))}
              style={{width:"100%",padding:"10px 12px",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:14,fontFamily:"inherit",resize:"none"}}/>
          </div>
          <div style={{display:"flex",gap:10}}>
            <button onClick={()=>setEditId(null)} style={{flex:1,padding:"11px",background:"white",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:14,fontWeight:600,cursor:"pointer",fontFamily:"inherit",color:"#374151"}}>キャンセル</button>
            <button onClick={saveStore} disabled={saving} style={{flex:2,padding:"11px",background:"linear-gradient(135deg,#059669,#047857)",color:"white",border:"none",borderRadius:8,fontSize:14,fontWeight:800,cursor:"pointer",fontFamily:"inherit",opacity:saving?0.7:1}}>
              {saving?"保存中...":"💾 保存する"}
            </button>
          </div>
        </div>
      </div>
    );
  }

  return(
    <div style={{maxWidth:1300,margin:"0 auto"}}>
      {toast&&<div style={{background:"#f0fdf4",border:"1px solid #86efac",borderRadius:8,padding:"10px 14px",marginBottom:12,color:"#15803d",fontWeight:700,fontSize:13}}>{toast}</div>}

      {/* ヘッダー */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16,flexWrap:"wrap",gap:10}}>
        <div style={{fontSize:16,fontWeight:800,color:"#1e3a5f"}}>店舗管理</div>
        <button onClick={openNew} style={{padding:"9px 18px",background:"linear-gradient(135deg,#2563eb,#1d4ed8)",color:"white",border:"none",borderRadius:8,fontSize:13,fontWeight:800,cursor:"pointer",fontFamily:"inherit",boxShadow:"0 2px 6px rgba(37,99,235,.3)"}}>
          + 店舗を追加
        </button>
      </div>

      {/* 検索 */}
      <div style={{background:"white",borderRadius:10,padding:"12px 14px",marginBottom:14,boxShadow:"0 1px 4px rgba(0,0,0,.06)",border:"1px solid #f1f5f9"}}>
        <input placeholder="店舗名・住所で検索" value={searchQ} onChange={e=>setSearchQ(e.target.value)}
          style={{width:"100%",padding:"8px 12px",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:13,fontFamily:"inherit"}}/>
      </div>

      {/* 店舗一覧 */}
      {loading?(
        <div style={{textAlign:"center",padding:40,color:"#94a3b8"}}>読み込み中...</div>
      ):filtered.length===0?(
        <div style={{background:"white",borderRadius:12,padding:40,textAlign:"center",boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
          <div style={{fontSize:32,marginBottom:12}}>🏥</div>
          <div style={{fontWeight:700,color:"#374151",marginBottom:6}}>店舗が登録されていません</div>
          <div style={{fontSize:13,color:"#94a3b8",marginBottom:16}}>「店舗を追加」ボタンから登録してください</div>
          <button onClick={openNew} style={{padding:"10px 20px",background:"#2563eb",color:"white",border:"none",borderRadius:8,fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>+ 店舗を追加</button>
        </div>
      ):filtered.map(store=>(
        <div key={store.id} style={{background:"white",borderRadius:12,marginBottom:10,boxShadow:"0 1px 4px rgba(0,0,0,.06)",border:"1px solid #f1f5f9",overflow:"hidden"}}>
          {/* 店舗ヘッダー */}
          <div style={{background:store.active?"linear-gradient(135deg,#1e3a5f,#2d6a9f)":"#9ca3af",padding:"12px 16px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <div style={{fontWeight:800,fontSize:15,color:"white"}}>{store.name}</div>
            <span style={{fontSize:11,fontWeight:700,padding:"2px 8px",borderRadius:12,background:store.active?"rgba(255,255,255,.2)":"rgba(0,0,0,.2)",color:"white"}}>
              {store.active?"営業中":"無効"}
            </span>
          </div>
          {/* 店舗詳細 */}
          <div style={{padding:"14px 16px"}}>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginBottom:14,textAlign:"center"}}>
              {[
                {label:"コース",value:"—"},
                {label:"スタッフ",value:String(5)},
                {label:"今月予約",value:"—"},
              ].map(item=>(
                <div key={item.label} style={{background:"#f8fafc",borderRadius:8,padding:"10px 8px"}}>
                  <div style={{fontSize:18,fontWeight:800,color:"#1e3a5f"}}>{item.value}</div>
                  <div style={{fontSize:11,color:"#94a3b8",fontWeight:600}}>{item.label}</div>
                </div>
              ))}
            </div>
            {store.address&&<div style={{fontSize:13,color:"#64748b",marginBottom:10}}>📍 {store.address}</div>}
            {store.tel&&<div style={{fontSize:13,color:"#64748b",marginBottom:10}}>📞 {store.tel}</div>}
            {store.email&&<div style={{fontSize:13,color:"#64748b",marginBottom:10}}>✉️ {store.email}</div>}
            {store.memo&&<div style={{fontSize:12,color:"#94a3b8",marginBottom:10}}>📝 {store.memo}</div>}
            <div style={{display:"flex",gap:8}}>
              <button onClick={()=>openEdit(store)} style={{flex:2,padding:"9px",background:"linear-gradient(135deg,#059669,#047857)",color:"white",border:"none",borderRadius:8,fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>
                詳細を見る / 編集
              </button>
              <button onClick={()=>toggleActive(store)} style={{flex:1,padding:"9px",background:"white",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit",color:store.active?"#ef4444":"#059669"}}>
                {store.active?"無効にする":"有効にする"}
              </button>
            </div>
          </div>
        </div>
      ))}
    </div>
  );
}

// ===== 患者管理パネル =====
function PatientsPanel({bookings,setView,setForm,setEditId,setConflict,todayStr,selStoreId}){
  const [patientQ,setPatientQ]=React.useState("");
  const [selPatient,setSelPatient]=React.useState(null);
  const [activeTab,setActiveTab]=React.useState("intake");
  const [treatments,setTreatments]=React.useState([]);
  const [loadingDetail,setLoadingDetail]=React.useState(false);
  const [editMode,setEditMode]=React.useState(false);
  const [editForm,setEditForm]=React.useState({name:"",phone:"",address:""});

  const GOJUON=[
    {label:"あ行",chars:["あ","い","う","え","お","ア","イ","ウ","エ","オ"]},
    {label:"か行",chars:["か","き","く","け","こ","カ","キ","ク","ケ","コ"]},
    {label:"さ行",chars:["さ","し","す","せ","そ","サ","シ","ス","セ","ソ"]},
    {label:"た行",chars:["た","ち","つ","て","と","タ","チ","ツ","テ","ト"]},
    {label:"な行",chars:["な","に","ぬ","ね","の","ナ","ニ","ヌ","ネ","ノ"]},
    {label:"は行",chars:["は","ひ","ふ","へ","ほ","ハ","ヒ","フ","ヘ","ホ"]},
    {label:"ま行",chars:["ま","み","む","め","も","マ","ミ","ム","メ","モ"]},
    {label:"や行",chars:["や","ゆ","よ","ヤ","ユ","ヨ"]},
    {label:"ら行",chars:["ら","り","る","れ","ろ","ラ","リ","ル","レ","ロ"]},
    {label:"わ行",chars:["わ","を","ん","ワ","ヲ","ン"]},
    {label:"英数",chars:[]},
  ];

  function getGroup(name){
    if(!name) return "英数";
    const first=name.charAt(0);
    for(const g of GOJUON){
      if(g.label==="英数") continue;
      if(g.chars.includes(first)) return g.label;
    }
    return "英数";
  }

  const pm={};
  bookings.forEach(b=>{
    if(!pm[b.patient_name])pm[b.patient_name]={name:b.patient_name,phone:b.phone,count:0,lastDate:"",lastStaff:null};
    pm[b.patient_name].count++;
    if(b.date>pm[b.patient_name].lastDate){pm[b.patient_name].lastDate=b.date;pm[b.patient_name].lastStaff=b.staff_id;}
  });
  const allPatients=Object.values(pm);

  const q=patientQ.trim().toLowerCase();
  const filtered=allPatients.filter(p=>{
    if(!q) return true;
    return p.name.toLowerCase().includes(q)||(p.phone&&p.phone.replace(/-/g,"").includes(q.replace(/-/g,"")));
  });
  const sorted=[...filtered].sort((a,b)=>a.name.localeCompare(b.name,"ja"));
  const isSearching=q.length>0;
  const groups={};
  if(!isSearching){
    GOJUON.forEach(g=>{groups[g.label]=[];});
    sorted.forEach(p=>{const g=getGroup(p.name);if(groups[g])groups[g].push(p);else groups["英数"].push(p);});
  }

  // 患者選択時に施術録を取得
  async function selectPatient(name){
    setSelPatient(name);
    setActiveTab("intake");
    setLoadingDetail(true);
    const patientBks=bookings.filter(b=>b.patient_name===name);
    if(patientBks.length>0){
      const ids=patientBks.map(b=>b.id).join(",");
      const data=await sb.select("treatments",`?booking_id=in.(${ids})&order=treated_at.desc`);
      setTreatments(Array.isArray(data)?data:[]);
    }else{setTreatments([]);}
    setLoadingDetail(false);
  }

  // 選択中患者の情報
  const selBks=selPatient?bookings.filter(b=>b.patient_name===selPatient).sort((a,b)=>b.date.localeCompare(a.date)):[];
  const firstBk=selBks.length>0?selBks[selBks.length-1]:null;

  function openEdit(){
    if(!firstBk) return;
    setEditForm({name:firstBk.patient_name||"",phone:firstBk.phone||"",address:firstBk.address||""});
    setEditMode(true);
  }

  async function saveEdit(){
    if(!editForm.name.trim()) return;
    try{
      const bkIds=selBks.map(b=>b.id);
      for(const id of bkIds){
        await sb.update("bookings",id,{patient_name:editForm.name,phone:editForm.phone,address:editForm.address});
      }
      setEditMode(false);
      selectPatient(editForm.name);
    }catch(e){alert("更新に失敗しました");}
  }

  function resultBadge(r){
    if(!r) return null;
    const map={"成約":["badge-green","✅ 成約"],"持ち帰り":["badge-yellow","🤔 持ち帰り"],"バツ":["badge-red","❌ バツ"]};
    const[cls,label]=map[r]||["badge-gray",r];
    return <span className={`badge ${cls}`}>{label}</span>;
  }

  const TABS=[
    {id:"intake",label:"問診票"},
    {id:"treatments",label:`施術録（${treatments.length}件）`},
    {id:"history",label:`来院履歴（${selBks.length}回）`},
  ];

  return(
    <div style={{display:"flex",gap:14,height:"calc(100vh - 120px)",minHeight:600}}>

      {/* 左：患者リスト */}
      <div style={{width:300,flexShrink:0,display:"flex",flexDirection:"column",gap:10}}>
        {/* 検索 */}
        <div style={{background:"white",borderRadius:12,padding:"10px 14px",boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
          <div style={{position:"relative"}}>
            <span style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",fontSize:14,color:"#94a3b8",pointerEvents:"none"}}>🔍</span>
            <input className="form-input" placeholder="患者名・電話番号で検索..."
              value={patientQ} onChange={e=>setPatientQ(e.target.value)}
              style={{paddingLeft:32,paddingRight:patientQ?32:12,fontSize:13}}/>
            {patientQ&&<button onClick={()=>setPatientQ("")} style={{position:"absolute",right:8,top:"50%",transform:"translateY(-50%)",background:"#e2e8f0",border:"none",borderRadius:"50%",width:20,height:20,cursor:"pointer",fontSize:11,color:"#64748b",display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>}
          </div>
          <div style={{fontSize:12,color:"#64748b",marginTop:6,fontWeight:600}}>{isSearching?`${sorted.length}名`:`患者数：${allPatients.length}名`}</div>
        </div>

        {/* 患者リスト */}
        <div style={{flex:1,overflowY:"auto"}}>
          {isSearching?(
            sorted.length===0?(
              <div style={{textAlign:"center",padding:30,color:"#94a3b8",fontSize:13}}>該当なし</div>
            ):sorted.map(p=>{
              const s=STAFF_ACCOUNTS.find(x=>x.id===p.lastStaff)||{color:"#888",initial:"？"};
              const isSel=selPatient===p.name;
              return(
                <div key={p.name} onClick={()=>selectPatient(p.name)}
                  style={{background:isSel?"#eff6ff":"white",borderRadius:10,marginBottom:6,padding:"10px 14px",cursor:"pointer",border:`1.5px solid ${isSel?"#2563eb":"#e2e8f0"}`,boxShadow:isSel?"0 2px 8px rgba(37,99,235,.15)":"0 1px 3px rgba(0,0,0,.04)"}}>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <div style={{width:34,height:34,borderRadius:10,background:`linear-gradient(135deg,${s.color},${s.color}99)`,display:"flex",alignItems:"center",justifyContent:"center",color:"white",fontWeight:800,fontSize:14,flexShrink:0}}>{p.name.charAt(0)}</div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{display:"flex",alignItems:"center",gap:5,marginBottom:2}}>
                        <span style={{fontWeight:800,fontSize:13,color:isSel?"#2563eb":"#1e293b"}}>{p.name}</span>
                        {p.count>=2?<span className="badge badge-yellow" style={{fontSize:9}}>{p.count}回</span>:<span className="badge badge-gray" style={{fontSize:9}}>初回</span>}
                      </div>
                      <div style={{fontSize:10,color:"#64748b"}}>最終：{p.lastDate}</div>
                      {p.phone&&<div style={{fontSize:10,color:"#94a3b8"}}>{p.phone}</div>}
                    </div>
                    {isSel&&<span style={{color:"#2563eb",fontSize:16}}>›</span>}
                  </div>
                </div>
              );
            })
          ):(
            GOJUON.map(g=>{
              const patients=groups[g.label]||[];
              if(patients.length===0) return null;
              return(
                <div key={g.label} style={{marginBottom:12}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
                    <div style={{padding:"2px 10px",borderRadius:20,fontWeight:800,fontSize:11,background:"#1e3a5f",color:"white"}}>{g.label}</div>
                    <div style={{flex:1,height:1,background:"#e2e8f0"}}/>
                    <span style={{fontSize:10,color:"#94a3b8"}}>{patients.length}名</span>
                  </div>
                  {patients.map(p=>{
                    const s=STAFF_ACCOUNTS.find(x=>x.id===p.lastStaff)||{color:"#888",initial:"？"};
                    const isSel=selPatient===p.name;
                    return(
                      <div key={p.name} onClick={()=>selectPatient(p.name)}
                        style={{background:isSel?"#eff6ff":"white",borderRadius:10,marginBottom:5,padding:"9px 12px",cursor:"pointer",border:`1.5px solid ${isSel?"#2563eb":"#e2e8f0"}`,boxShadow:isSel?"0 2px 8px rgba(37,99,235,.15)":"0 1px 3px rgba(0,0,0,.04)"}}>
                        <div style={{display:"flex",alignItems:"center",gap:9}}>
                          <div style={{width:32,height:32,borderRadius:9,background:`linear-gradient(135deg,${s.color},${s.color}99)`,display:"flex",alignItems:"center",justifyContent:"center",color:"white",fontWeight:800,fontSize:13,flexShrink:0}}>{p.name.charAt(0)}</div>
                          <div style={{flex:1,minWidth:0}}>
                            <div style={{display:"flex",alignItems:"center",gap:5}}>
                              <span style={{fontWeight:800,fontSize:13,color:isSel?"#2563eb":"#1e293b"}}>{p.name}</span>
                              {p.count>=2?<span className="badge badge-yellow" style={{fontSize:9}}>{p.count}回</span>:<span className="badge badge-gray" style={{fontSize:9}}>初回</span>}
                            </div>
                            <div style={{fontSize:10,color:"#94a3b8"}}>{p.lastDate}　{p.phone}</div>
                          </div>
                          {isSel&&<span style={{color:"#2563eb",fontSize:16}}>›</span>}
                        </div>
                      </div>
                    );
                  })}
                </div>
              );
            })
          )}
        </div>
      </div>

      {/* 右：詳細パネル */}
      <div style={{flex:1,display:"flex",flexDirection:"column",minWidth:0}}>
        {!selPatient?(
          <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:"white",borderRadius:12,boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
            <div style={{fontSize:48,marginBottom:16}}>👈</div>
            <div style={{fontWeight:700,fontSize:15,color:"#374151",marginBottom:6}}>患者を選択してください</div>
            <div style={{fontSize:13,color:"#94a3b8"}}>左のリストから患者名をクリックすると<br/>問診票・施術録・来院履歴が表示されます</div>
          </div>
        ):(
          <div style={{flex:1,display:"flex",flexDirection:"column",background:"white",borderRadius:12,boxShadow:"0 1px 4px rgba(0,0,0,.06)",overflow:"hidden"}}>
            {/* 患者ヘッダー */}
            <div style={{background:"linear-gradient(135deg,#1e3a5f,#2d6a9f)",padding:"14px 18px",flexShrink:0}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
                <div>
                  <div style={{fontWeight:800,fontSize:17,color:"white"}}>{selPatient} 様</div>
                  <div style={{fontSize:12,color:"rgba(255,255,255,.7)",marginTop:2}}>
                    {firstBk?.phone&&<span>📞 {firstBk.phone}</span>}
                    {firstBk?.address&&<span style={{marginLeft:10}}>📍 {firstBk.address}</span>}
                    {firstBk?.line_user_id&&<span style={{marginLeft:8,background:"rgba(6,199,85,.3)",borderRadius:4,padding:"1px 6px",fontSize:10,fontWeight:700}}>LINE連携</span>}
                  </div>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                  {[{label:"来院",val:selBks.length+"回",color:"#60a5fa"},{label:"施術録",val:treatments.length+"件",color:"#34d399"},{label:"成約",val:treatments.filter(t=>t.result==="成約").length+"件",color:"#fbbf24"}].map(item=>(
                    <div key={item.label} style={{textAlign:"center",background:"rgba(255,255,255,.15)",borderRadius:8,padding:"5px 10px"}}>
                      <div style={{fontSize:15,fontWeight:800,color:item.color}}>{item.val}</div>
                      <div style={{fontSize:9,color:"rgba(255,255,255,.6)"}}>{item.label}</div>
                    </div>
                  ))}
                  <button onClick={openEdit}
                    style={{padding:"7px 12px",background:"rgba(255,255,255,.2)",color:"white",border:"1.5px solid rgba(255,255,255,.4)",borderRadius:8,fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap"}}>
                    ✏️ 情報編集
                  </button>
                  <button onClick={()=>window.open(`karte.html?patient=${encodeURIComponent(selPatient)}`,"_blank")}
                    style={{padding:"7px 12px",background:"rgba(255,255,255,.2)",color:"white",border:"1.5px solid rgba(255,255,255,.4)",borderRadius:8,fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap"}}>
                    📋 施術録
                  </button>
                  <button onClick={()=>{
                    setForm({
                      patient_name:selPatient,
                      phone:firstBk?.phone||"",
                      staff_id:1,
                      date:todayStr,
                      time:"10:00",
                      menu:"再診（30分）",
                      line_notify:!!firstBk?.line_user_id,
                      reminded:false,
                      store_id:selStoreId,
                    });
                    setConflict(false);
                    setEditId(null);
                    setView("form");
                  }}
                    style={{padding:"7px 14px",background:"linear-gradient(135deg,#2563eb,#1d4ed8)",color:"white",border:"none",borderRadius:8,fontSize:12,fontWeight:800,cursor:"pointer",fontFamily:"inherit",boxShadow:"0 2px 8px rgba(37,99,235,.4)",whiteSpace:"nowrap"}}>
                    + 予約追加
                  </button>
                </div>
              </div>
            </div>

            {/* 情報編集パネル */}
            {editMode&&(
              <div style={{padding:"16px 18px",background:"#fffbeb",borderBottom:"1px solid #fde68a",flexShrink:0}}>
                <div style={{fontWeight:800,fontSize:13,color:"#92400e",marginBottom:12}}>✏️ 患者情報の編集</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
                  <div>
                    <label style={{display:"block",fontSize:11,fontWeight:700,color:"#374151",marginBottom:4}}>患者名</label>
                    <input value={editForm.name} onChange={e=>setEditForm(p=>({...p,name:e.target.value}))}
                      style={{width:"100%",padding:"8px 10px",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:13,fontFamily:"inherit"}}/>
                  </div>
                  <div>
                    <label style={{display:"block",fontSize:11,fontWeight:700,color:"#374151",marginBottom:4}}>電話番号</label>
                    <input value={editForm.phone} onChange={e=>setEditForm(p=>({...p,phone:e.target.value}))}
                      style={{width:"100%",padding:"8px 10px",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:13,fontFamily:"inherit"}}/>
                  </div>
                </div>
                <div style={{marginBottom:12}}>
                  <label style={{display:"block",fontSize:11,fontWeight:700,color:"#374151",marginBottom:4}}>住所</label>
                  <input value={editForm.address} onChange={e=>setEditForm(p=>({...p,address:e.target.value}))}
                    placeholder="例：大阪府寝屋川市○○町1-2-3"
                    style={{width:"100%",padding:"8px 10px",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:13,fontFamily:"inherit"}}/>
                </div>
                <div style={{display:"flex",gap:8}}>
                  <button onClick={()=>setEditMode(false)} style={{flex:1,padding:"8px",background:"white",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:"inherit",color:"#374151"}}>キャンセル</button>
                  <button onClick={saveEdit} style={{flex:2,padding:"8px",background:"linear-gradient(135deg,#059669,#047857)",color:"white",border:"none",borderRadius:8,fontSize:12,fontWeight:800,cursor:"pointer",fontFamily:"inherit"}}>💾 保存する</button>
                </div>
              </div>
            )}

            {/* タブ */}
            <div style={{display:"flex",borderBottom:"1px solid #e2e8f0",flexShrink:0}}>
              {TABS.map(t=>(
                <button key={t.id} onClick={()=>setActiveTab(t.id)}
                  style={{flex:1,padding:"11px 4px",border:"none",borderBottom:`2px solid ${activeTab===t.id?"#1e3a5f":"transparent"}`,background:"none",fontSize:13,fontWeight:activeTab===t.id?800:600,color:activeTab===t.id?"#1e3a5f":"#64748b",cursor:"pointer",fontFamily:"inherit"}}>
                  {t.label}
                </button>
              ))}
            </div>

            {/* タブコンテンツ */}
            <div style={{flex:1,overflowY:"auto",padding:"14px 18px"}}>
              {loadingDetail?<div style={{textAlign:"center",padding:30,color:"#9ca3af"}}>読み込み中...</div>:(

                activeTab==="intake"?(
                  firstBk?(
                    <div>
                      <div style={{fontSize:12,color:"#64748b",marginBottom:12,padding:"6px 10px",background:"#f8fafc",borderRadius:8}}>初回来院日：{firstBk.date}（{firstBk.menu}）</div>
                      {[
                        {label:"負傷部位",value:firstBk.body_parts},
                        {label:"負傷原因",value:firstBk.injury_cause},
                        {label:"いつから",value:firstBk.pain_when},
                        {label:"痛みの強さ",value:firstBk.pain_level?firstBk.pain_level+"/10":null},
                        {label:"主な症状",value:firstBk.symptoms},
                        {label:"他院受診",value:firstBk.other_clinic},
                        {label:"既往歴",value:firstBk.medical_history},
                        {label:"継続意思",value:firstBk.want_continue},
                        {label:"来院経路",value:firstBk.how_know},
                      ].map(({label,value})=>value?(
                        <div key={label} style={{display:"flex",gap:12,padding:"10px 0",borderBottom:"1px solid #f1f5f9"}}>
                          <div style={{width:80,fontSize:12,fontWeight:700,color:"#94a3b8",flexShrink:0}}>{label}</div>
                          <div style={{fontSize:13,fontWeight:600,color:"#1e293b",flex:1}}>{value}</div>
                        </div>
                      ):null)}
                      {!firstBk.body_parts&&!firstBk.injury_cause&&(
                        <div style={{textAlign:"center",padding:30,color:"#94a3b8"}}>
                          <div style={{fontSize:32,marginBottom:8}}>📋</div>
                          <div style={{fontWeight:700}}>問診情報なし</div>
                          <div style={{fontSize:12,marginTop:4}}>予約フォームで問診情報が入力されていません</div>
                        </div>
                      )}
                    </div>
                  ):<div style={{textAlign:"center",padding:30,color:"#9ca3af"}}>来院記録がありません</div>

                ):activeTab==="treatments"?(
                  treatments.length===0?(
                    <div style={{textAlign:"center",padding:30,color:"#9ca3af"}}>
                      <div style={{fontSize:32,marginBottom:8}}>📝</div>
                      <div>施術記録がありません</div>
                    </div>
                  ):<div>{treatments.map(t=>{
                    const bk=selBks.find(b=>b.id===t.booking_id);
                    const staff=STAFF_ACCOUNTS.find(s=>s.id===bk?.staff_id)||{name:"不明",color:"#888",initial:"？"};
                    return(
                      <div key={t.id} style={{marginBottom:12,borderRadius:10,overflow:"hidden",border:"1px solid #e2e8f0"}}>
                        <div style={{background:"#f8fafc",padding:"9px 14px",display:"flex",justifyContent:"space-between",alignItems:"center",borderBottom:"1px solid #e2e8f0"}}>
                          <span style={{fontWeight:800,fontSize:13,color:"#1e3a5f"}}>{bk?.date||"—"} {bk?.time||""}</span>
                          <div style={{display:"flex",alignItems:"center",gap:5}}>
                            <div style={{width:20,height:20,borderRadius:"50%",background:staff.color,display:"flex",alignItems:"center",justifyContent:"center",color:"white",fontWeight:800,fontSize:9}}>{staff.initial}</div>
                            <span style={{fontSize:11,color:"#374151",fontWeight:600}}>{staff.name}</span>
                          </div>
                        </div>

                            </div>
                          </div>
                          <div style={{fontSize:11,color:"#64748b"}}>{b.menu}</div>
                          {treat&&<div style={{display:"flex",gap:4,marginTop:3,flexWrap:"wrap"}}>{resultBadge(treat.result)}</div>}

                        </div>
                      </div>
                    );
                  })}</div>
                )
              )}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ===== シフト・休日管理パネル =====
function ShiftPanel({currentUser}){
  const today=new Date();
  const [selMonth,setSelMonth]=React.useState(`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}`);
  const [shifts,setShifts]=React.useState({});
  const [holidays,setHolidays]=React.useState({});
  const [toast,setToast]=React.useState("");
  const [editHoliday,setEditHoliday]=React.useState(null);
  // 一括設定
  const [bulkTarget,setBulkTarget]=React.useState("all"); // "all" | staffId
  const [bulkType,setBulkType]=React.useState("出勤");
  const [bulkDayTypes,setBulkDayTypes]=React.useState(["平日"]); // 平日/土/日/全て
  const [editingCell,setEditingCell]=React.useState(null); // "staffId_date"

  const SHIFT_TYPES=["出勤","休み","有休","振替","祝振替"];
  const SHIFT_COLORS={"出勤":"#2563eb","休み":"#9ca3af","有休":"#059669","振替":"#d97706","祝振替":"#7c3aed"};
  const SHIFT_ABBR={"出勤":"勤","休み":"休","有休":"有","振替":"振","祝振替":"祝"};

  const [y,m]=selMonth.split("-").map(Number);
  const lastDay=new Date(y,m,0);
  const daysInMonth=lastDay.getDate();
  const dates=Array.from({length:daysInMonth},(_,i)=>{
    const d=new Date(y,m-1,i+1);
    return {date:`${y}-${String(m).padStart(2,"0")}-${String(i+1).padStart(2,"0")}`,day:d.getDay(),label:i+1};
  });
  const DAYS_JP=["日","月","火","水","木","金","土"];

  React.useEffect(()=>{
    try{
      const s=localStorage.getItem(`shifts_${selMonth}`);
      if(s) setShifts(JSON.parse(s));
      else setShifts({});
      const h=localStorage.getItem("holiday_balance");
      if(h) setHolidays(JSON.parse(h));
      else{const init={};STAFF_ACCOUNTS.forEach(s=>{init[s.id]={有休残:10,振替残:0,祝振替残:0};});setHolidays(init);}
    }catch{}
  },[selMonth]);

  function save(){
    try{
      localStorage.setItem(`shifts_${selMonth}`,JSON.stringify(shifts));
      localStorage.setItem("holiday_balance",JSON.stringify(holidays));
      setToast("保存しました");setTimeout(()=>setToast(""),2000);
    }catch{setToast("エラー");}
  }

  // セル個別変更（プルダウン）
  function setShiftCell(staffId,date,val){
    const key=`${staffId}_${date}`;
    const cur=shifts[key]||"出勤";
    const newH={...holidays};
    if(!newH[staffId]) newH[staffId]={有休残:10,振替残:0,祝振替残:0};
    // 旧値の残高を戻す
    if(cur==="有休") newH[staffId].有休残=(newH[staffId].有休残||0)+1;
    if(cur==="振替") newH[staffId].振替残=(newH[staffId].振替残||0)+1;
    if(cur==="祝振替") newH[staffId].祝振替残=(newH[staffId].祝振替残||0)+1;
    // 新値の残高を減らす
    if(val==="有休") newH[staffId].有休残=Math.max(0,(newH[staffId].有休残||0)-1);
    if(val==="振替") newH[staffId].振替残=Math.max(0,(newH[staffId].振替残||0)-1);
    if(val==="祝振替") newH[staffId].祝振替残=Math.max(0,(newH[staffId].祝振替残||0)-1);
    setHolidays(newH);
    setShifts(prev=>({...prev,[key]:val}));
    setEditingCell(null);
  }

  // 一括設定適用
  function applyBulk(){
    const staffIds=bulkTarget==="all"?STAFF_ACCOUNTS.map(s=>s.id):[parseInt(bulkTarget)];
    const newShifts={...shifts};
    const newH={...holidays};
    dates.forEach(({date,day})=>{
      const isSun=day===0,isSat=day===6,isWeekday=day!==0&&day!==6;
      const match=(bulkDayTypes.includes("全て"))||(bulkDayTypes.includes("平日")&&isWeekday)||(bulkDayTypes.includes("土")&&isSat)||(bulkDayTypes.includes("日")&&isSun);
      if(!match) return;
      staffIds.forEach(sid=>{
        const key=`${sid}_${date}`;
        const cur=newShifts[key]||"出勤";
        if(!newH[sid]) newH[sid]={有休残:10,振替残:0,祝振替残:0};
        if(cur==="有休") newH[sid].有休残=(newH[sid].有休残||0)+1;
        if(cur==="振替") newH[sid].振替残=(newH[sid].振替残||0)+1;
        if(cur==="祝振替") newH[sid].祝振替残=(newH[sid].祝振替残||0)+1;
        if(bulkType==="有休") newH[sid].有休残=Math.max(0,(newH[sid].有休残||0)-1);
        if(bulkType==="振替") newH[sid].振替残=Math.max(0,(newH[sid].振替残||0)-1);
        if(bulkType==="祝振替") newH[sid].祝振替残=Math.max(0,(newH[sid].祝振替残||0)-1);
        newShifts[key]=bulkType;
      });
    });
    setShifts(newShifts);setHolidays(newH);
    setToast(`一括設定しました（${bulkTarget==="all"?"全員":STAFF_ACCOUNTS.find(s=>s.id===parseInt(bulkTarget))?.name}・${bulkDayTypes.join("/")}・${bulkType}）`);
    setTimeout(()=>setToast(""),3000);
  }

  function updateBalance(staffId,key,val){
    setHolidays(prev=>({...prev,[staffId]:{...(prev[staffId]||{}), [key]:Math.max(0,parseInt(val)||0)}}));
  }

  function calcMonthSummary(staffId){
    const result={出勤:0,休み:0,有休:0,振替:0,祝振替:0};
    dates.forEach(({date})=>{const key=`${staffId}_${date}`;const v=shifts[key]||"出勤";result[v]=(result[v]||0)+1;});
    return result;

          style={{padding:"6px 10px",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:14,fontWeight:700}}/>
        <button onClick={save} className="btn btn-primary btn-sm" style={{marginLeft:"auto"}}>💾 保存する</button>
      </div>

      {/* 一括設定カード */}
      <div className="card" style={{marginBottom:14}}>
        <div style={{padding:"12px 16px",borderBottom:"1px solid #f1f5f9",fontWeight:800,fontSize:13,color:"#1e3a5f"}}>⚡ 一括設定</div>
        <div style={{padding:"14px 16px"}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
            {/* 対象スタッフ */}
            <div>
              <div style={{fontSize:12,fontWeight:700,color:"#64748b",marginBottom:6}}>対象スタッフ</div>
              <select value={bulkTarget} onChange={e=>setBulkTarget(e.target.value)}

                <option value="all">🏥 院全体（全員）</option>
                {STAFF_ACCOUNTS.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}

            </div>
            {/* シフト種別 */}
            <div>
              <div style={{fontSize:12,fontWeight:700,color:"#64748b",marginBottom:6}}>シフト種別</div>
              <select value={bulkType} onChange={e=>setBulkType(e.target.value)}
                style={{width:"100%",padding:"8px 10px",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:13,fontFamily:"inherit"}}>
                {SHIFT_TYPES.map(t=><option key={t} value={t}>{t}</option>)}
              </select>
            </div>
          </div>
          {/* 対象曜日 */}
          <div style={{marginBottom:14}}>
            <div style={{fontSize:12,fontWeight:700,color:"#64748b",marginBottom:8}}>対象曜日（複数選択可）</div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              {["平日","土","日","全て"].map(t=>{
                const sel=bulkDayTypes.includes(t);
                return <button key={t} onClick={()=>toggleBulkDayType(t)} className="btn"
                  style={{padding:"6px 16px",borderRadius:20,fontSize:13,fontWeight:700,

          <div style={{fontSize:11,color:"#94a3b8",marginTop:8}}>※ 適用後は「保存する」ボタンで確定してください。</div>
        </div>

      {/* 休日残高カード */}
      <div className="card" style={{marginBottom:14}}>

        <div style={{padding:"10px 16px",fontSize:11,color:"#94a3b8",borderTop:"1px solid #f1f5f9"}}>
          ※ セルをクリックするとプルダウンで変更できます。「保存する」で確定してください。
        </div>
      </div>
    </div>
  );
}

// ===== 来院受付パネル（QRコード読み取り） =====
function CheckInPanel({bookings,onOpenPatient,onCheckedIn}){
  const videoRef=React.useRef(null);
  const canvasRef=React.useRef(null);
  const streamRef=React.useRef(null);
  const rafRef=React.useRef(null);
  const scanningRef=React.useRef(true);

  const [cameraError,setCameraError]=React.useState("");
  const [result,setResult]=React.useState(null); // {booking, isNew, visitCount}
  const [referralInfo,setReferralInfo]=React.useState(null); // {issued, referrerName, count, bonusCount, error}
  const [checkingIn,setCheckingIn]=React.useState(false);
  const [manualId,setManualId]=React.useState("");

  function stopCamera(){
    if(streamRef.current){
      streamRef.current.getTracks().forEach(t=>t.stop());
      streamRef.current=null;
    }
    if(rafRef.current){
      cancelAnimationFrame(rafRef.current);
      rafRef.current=null;
    }
  }

  function extractQRPayload(text){
    try{
      const u=new URL(text);
      const uid=u.searchParams.get("uid");
      const id=u.searchParams.get("id");
      if(uid) return {uid};
      if(id) return {bookingId:id};
      return null;
    }catch(e){
      if(/^\d+$/.test(text.trim())) return {bookingId:text.trim()};
      return null;
    }
  }

  async function handleDecoded(text){
    if(!scanningRef.current) return;
    const payload=extractQRPayload(text);
    if(!payload){
      setCameraError("QRコードの内容を読み取れませんでした");
      return;
    }
    scanningRef.current=false;
    stopCamera();
    await lookupAndCheckIn(payload);
  }

  async function lookupAndCheckIn(payload){
    setCheckingIn(true);
    setCameraError("");
    try{
      let booking=null;
      let visitCount=1;
      if(payload.uid){
        // 患者固定QR：本日の予約を検索
        const todayStr=fmtDate(new Date());
        const todays=await sb.select("bookings",`?line_user_id=eq.${encodeURIComponent(payload.uid)}&date=eq.${todayStr}&order=time.asc`);
        if(!Array.isArray(todays)||todays.length===0){
          setCameraError("本日のご予約が見つかりませんでした。予約状況をご確認ください。");
          setCheckingIn(false);
          return;
        }
        booking=todays[0];
        const all=await sb.select("bookings",`?line_user_id=eq.${encodeURIComponent(payload.uid)}`);
        visitCount=Array.isArray(all)?all.length:1;
      }else{
        // 旧式：予約単位QR（後方互換）
        const found=await sb.select("bookings",`?id=eq.${payload.bookingId}`);
        booking=Array.isArray(found)&&found.length>0?found[0]:null;
        if(!booking){
          setCameraError("予約が見つかりませんでした（QRコードが古い可能性があります）");
          setCheckingIn(false);
          return;
        }
        visitCount=bookings.filter(b=>b.patient_name===booking.patient_name).length;
      }

      const isNew=visitCount<=1;

      try{
        await sb.update("bookings",booking.id,{checked_in_at:new Date().toISOString()});
        if(onCheckedIn) onCheckedIn();
      }catch(e){/* 列が無い場合などは無視 */}

      setResult({booking,isNew,visitCount});
      setCheckingIn(false);

      if(isNew){
        window.open(`intake.html?id=${booking.id}`,"_blank");
        // 紹介経由の初来院であれば、紹介者へ特典を自動発行する
        if((booking.referrer_name||"").trim()){
          const bonusResult=await processReferralBonus(booking,bookings);
          setReferralInfo(bonusResult);
        }
      }
    }catch(e){
      setCameraError("読み取り処理に失敗しました："+e.message);
      setCheckingIn(false);
    }
  }

  function resetScan(){
    setResult(null);
    setReferralInfo(null);
    setCameraError("");
    scanningRef.current=true;
    startCamera();
  }

  function startCamera(){
    if(!window.jsQR){
      setCameraError("QR読み取りライブラリの読み込みに失敗しました。ページを再読み込みしてください。");
      return;
    }
    navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}})
      .then(stream=>{
        streamRef.current=stream;
        if(videoRef.current){
          videoRef.current.srcObject=stream;
          videoRef.current.play();
        }
        tick();
      })
      .catch(e=>{
        setCameraError("カメラを起動できませんでした。ブラウザの設定でカメラへのアクセスを許可してください。");
      });
  }

  function tick(){
    if(!scanningRef.current){return;}
    const video=videoRef.current,canvas=canvasRef.current;
    if(video&&canvas&&video.readyState===video.HAVE_ENOUGH_DATA){
      canvas.width=video.videoWidth;
      canvas.height=video.videoHeight;
      const ctx=canvas.getContext("2d");
      ctx.drawImage(video,0,0,canvas.width,canvas.height);
      const imageData=ctx.getImageData(0,0,canvas.width,canvas.height);
      const code=window.jsQR(imageData.data,imageData.width,imageData.height,{inversionAttempts:"dontInvert"});
      if(code&&code.data){
        handleDecoded(code.data);
        return;
      }
    }
    rafRef.current=requestAnimationFrame(tick);
  }

  React.useEffect(()=>{
    startCamera();
    return ()=>{stopCamera();};
  },[]);

  function submitManualId(){
    if(!manualId.trim()) return;
    scanningRef.current=false;
    stopCamera();
    lookupAndCheckIn({bookingId:manualId.trim()});
  }

  const staff=result?STAFF_ACCOUNTS.find(s=>s.id===result.booking.staff_id):null;

  return(
    <div style={{maxWidth:700,margin:"0 auto"}}>
      <div className="card" style={{marginBottom:14}}>
        <div className="card-header blue">📷 来院受付（QRコード読み取り）</div>
        <div className="card-body">
          {!result&&(
            <div>
              <div style={{position:"relative",borderRadius:12,overflow:"hidden",background:"#000",aspectRatio:"1/1",maxHeight:360}}>
                <video ref={videoRef} playsInline muted style={{width:"100%",height:"100%",objectFit:"cover"}}/>
                <canvas ref={canvasRef} style={{display:"none"}}/>
                {checkingIn&&(
                  <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,.6)",display:"flex",alignItems:"center",justifyContent:"center",color:"white",fontWeight:700}}>
                    確認中...
                  </div>
                )}
              </div>
              <div style={{fontSize:12,color:"#94a3b8",marginTop:10,textAlign:"center"}}>
                患者様のLINEに届いたQRコードを、カメラに映してください
              </div>
              {cameraError&&(
                <div style={{background:"#fef2f2",border:"1.5px solid #fecaca",borderRadius:8,padding:"10px 14px",marginTop:12,color:"#dc2626",fontSize:13,fontWeight:700}}>
                  ⚠ {cameraError}
                </div>
              )}
              <div style={{marginTop:16,paddingTop:16,borderTop:"1px solid #f1f5f9"}}>
                <div style={{fontSize:12,fontWeight:700,color:"#64748b",marginBottom:6}}>カメラが使えない場合：予約IDを直接入力</div>
                <div style={{display:"flex",gap:8}}>
                  <input className="form-input" value={manualId} onChange={e=>setManualId(e.target.value)} placeholder="予約ID"/>
                  <button className="btn btn-outline" onClick={submitManualId}>確認</button>
                </div>
              </div>
            </div>
          )}

          {result&&(
            <div>
              <div style={{textAlign:"center",marginBottom:16}}>
                <div style={{fontSize:40,marginBottom:8}}>{result.isNew?"📋":"✅"}</div>
                <div style={{fontWeight:800,fontSize:17,color:"#1e3a5f"}}>{result.isNew?"初回の患者様です":"来院受付が完了しました"}</div>
                {result.isNew&&<div style={{fontSize:12,color:"#94a3b8",marginTop:4}}>問診票を別タブで開きました</div>}
              </div>
              <div style={{background:"#f8fafc",borderRadius:10,padding:"14px 16px",border:"1px solid #e2e8f0",marginBottom:16}}>
                <div style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:"1px solid #f1f5f9"}}>
                  <span style={{fontSize:12,color:"#94a3b8",fontWeight:700}}>患者名</span>
                  <span style={{fontSize:14,fontWeight:800,color:"#1e293b"}}>{result.booking.patient_name} 様</span>
                </div>
                <div style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:"1px solid #f1f5f9"}}>
                  <span style={{fontSize:12,color:"#94a3b8",fontWeight:700}}>本日の予約</span>
                  <span style={{fontSize:14,fontWeight:700,color:"#1e293b"}}>{result.booking.date} {result.booking.time}</span>
                </div>
                <div style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:"1px solid #f1f5f9"}}>
                  <span style={{fontSize:12,color:"#94a3b8",fontWeight:700}}>担当</span>
                  <span style={{fontSize:14,fontWeight:700,color:staff?staff.color:"#1e293b"}}>{staff?staff.name:"—"}</span>
                </div>
                <div style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:"1px solid #f1f5f9"}}>
                  <span style={{fontSize:12,color:"#94a3b8",fontWeight:700}}>メニュー</span>
                  <span style={{fontSize:14,fontWeight:700,color:"#1e293b"}}>{result.booking.menu}</span>
                </div>
                {result.booking.referrer_name&&(
                  <div style={{display:"flex",justifyContent:"space-between",padding:"6px 0"}}>
                    <span style={{fontSize:12,color:"#94a3b8",fontWeight:700}}>紹介者</span>
                    <span style={{fontSize:14,fontWeight:700,color:"#7c3aed"}}>{result.booking.referrer_name} 様</span>
                  </div>
                )}
              </div>
              {referralInfo&&referralInfo.issued&&(
                <div style={{background:"#faf5ff",border:"1.5px solid #ddd6fe",borderRadius:10,padding:"12px 14px",marginBottom:14}}>
                  <div style={{fontSize:13,fontWeight:800,color:"#6d28d9",marginBottom:2}}>🎉 紹介者「{referralInfo.referrerName}」様に特典を発行しました</div>
                  <div style={{fontSize:12,color:"#7c3aed"}}>累計{referralInfo.count}人紹介　施術1回無料券を発行{referralInfo.bonusCount>0?`（節目ボーナスも${referralInfo.bonusCount}件追加発行）`:""}</div>
                </div>
              )}
              {referralInfo&&referralInfo.error&&(
                <div style={{background:"#fef2f2",border:"1.5px solid #fecaca",borderRadius:10,padding:"12px 14px",marginBottom:14}}>
                  <div style={{fontSize:12,fontWeight:700,color:"#dc2626"}}>⚠ {referralInfo.error}</div>
                </div>
              )}
              <div style={{fontSize:11,color:"#94a3b8",textAlign:"center",marginBottom:14}}>来院{result.visitCount}回目</div>
              <button className="btn btn-primary" style={{width:"100%",justifyContent:"center"}} onClick={resetScan}>次の患者様を受付する</button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ===== 個人週間ビュー =====
function PersonalWeekView({staff,filtered,payments,visitCounts,setBookingPopup,setView,setForm,setEditId,todayStr,isAdmin,user,selStoreId}){
  const DAYS_JP=["日","月","火","水","木","金","土"];
  const today=new Date();
  const [weekBase,setWeekBase]=React.useState(()=>{const d=new Date();d.setHours(0,0,0,0);return d;});
  const weekDays=Array.from({length:7},(_,i)=>{const d=new Date(weekBase);d.setDate(weekBase.getDate()+i);return d;});

  return(
    <div>
      {/* ヘッダー */}
      <div style={{background:`linear-gradient(135deg,${staff.color},${staff.color}cc)`,padding:"12px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:36,height:36,borderRadius:10,background:"rgba(255,255,255,.25)",display:"flex",alignItems:"center",justifyContent:"center",color:"white",fontWeight:800,fontSize:16}}>{staff.initial}</div>
          <div>
            <div style={{color:"white",fontWeight:800,fontSize:15}}>{staff.name}</div>
            <div style={{color:"rgba(255,255,255,.7)",fontSize:11}}>1週間の予約状況</div>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <button onClick={()=>{const d=new Date(weekBase);d.setDate(d.getDate()-7);setWeekBase(d);}}
            style={{background:"rgba(255,255,255,.2)",border:"none",color:"white",borderRadius:8,width:32,height:32,cursor:"pointer",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center"}}>◀</button>
          <input type="date" value={fmtDate(weekBase)} onChange={e=>{if(e.target.value){const d=new Date(e.target.value+"T00:00:00");setWeekBase(d);}}}
            style={{padding:"5px 10px",borderRadius:8,border:"none",fontSize:13,fontWeight:700,background:"rgba(255,255,255,.9)",color:"#1e3a5f"}}/>
          <button onClick={()=>{const d=new Date(weekBase);d.setDate(d.getDate()+7);setWeekBase(d);}}
            style={{background:"rgba(255,255,255,.2)",border:"none",color:"white",borderRadius:8,width:32,height:32,cursor:"pointer",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center"}}>▶</button>
          <button onClick={()=>{const d=new Date(today);d.setHours(0,0,0,0);setWeekBase(d);}}
            style={{background:"rgba(255,255,255,.9)",border:"none",color:staff.color,borderRadius:8,padding:"5px 12px",cursor:"pointer",fontSize:12,fontWeight:800}}>今日</button>
        </div>
      </div>

      {/* 1週間カード */}
      <div style={{padding:"12px"}}>
        {weekDays.map(d=>{
          const dStr=fmtDate(d);
          const isToday=dStr===todayStr;
          const isSun=d.getDay()===0,isSat=d.getDay()===6;
          const isPast=dStr<todayStr;
          const dayBookings=filtered.filter(b=>b.date===dStr&&b.staff_id===staff.id&&!b.cancelled).sort((a,b2)=>a.time.localeCompare(b2.time));
          const dayColor=isSun?"#ef4444":isSat?"#7c3aed":"#1e293b";

          return(
            <div key={dStr} style={{marginBottom:10,borderRadius:12,overflow:"hidden",border:`1.5px solid ${isToday?staff.color:"#e2e8f0"}`,opacity:isPast?0.7:1}}>
              <div style={{background:isToday?staff.color:isSun?"#fff1f2":isSat?"#faf5ff":"#f8fafc",padding:"8px 14px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{fontWeight:800,fontSize:14,color:isToday?"white":dayColor}}>
                    {d.getMonth()+1}/{d.getDate()}（{DAYS_JP[d.getDay()]}）
                  </span>
                  {isToday&&<span style={{background:"rgba(255,255,255,.3)",color:"white",fontSize:10,fontWeight:800,padding:"1px 7px",borderRadius:10}}>今日</span>}
                  {isPast&&!isToday&&<span style={{fontSize:10,color:"#94a3b8",fontWeight:600}}>済</span>}
                </div>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{fontSize:12,fontWeight:700,color:isToday?"rgba(255,255,255,.8)":dayBookings.length>0?"#059669":"#94a3b8"}}>{dayBookings.length}件</span>
                  <button onClick={()=>{
                    setForm({date:dStr,time:"",staff_id:staff.id,patient_name:"",phone:"",menu:"無料施術体験会（約60分・カウンセリング込み）",insurance_rate:"3割",memo:"",line_notify:false,store_id:selStoreId});
                    setEditId(null);setView("form");
                  }} style={{background:isToday?"rgba(255,255,255,.25)":"#eff6ff",border:"none",borderRadius:6,padding:"4px 10px",fontSize:11,fontWeight:700,cursor:"pointer",color:isToday?"white":"#2563eb",fontFamily:"inherit"}}>
                    + 予約追加
                  </button>
                </div>
              </div>
              <div style={{background:"white",padding:dayBookings.length===0?"10px 14px":"6px 10px"}}>
                {dayBookings.length===0?(
                  <div style={{textAlign:"center",color:"#d1d5db",fontSize:12,padding:"4px 0"}}>予約なし</div>
                ):dayBookings.map(b=>{
                  const isPaid=payments.some(p=>p.booking_id===b.id);
                  const cnt=visitCounts[b.id]||1;
                  return(
                    <div key={b.id} onClick={()=>setBookingPopup({booking:b,x:100,y:100})}
                      style={{display:"flex",alignItems:"center",gap:10,padding:"8px 10px",borderRadius:8,marginBottom:4,cursor:"pointer",background:isPaid?"#f0fdf4":"white",border:`1px solid ${isPaid?"#86efac":"#e2e8f0"}`}}>
                      <div style={{width:50,fontWeight:800,fontSize:13,color:staff.color,flexShrink:0}}>{b.time}</div>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontWeight:700,fontSize:13,color:"#1e293b"}}>{b.patient_name}</div>
                        <div style={{fontSize:11,color:"#64748b"}}>{b.menu}</div>
                      </div>
                      <div style={{display:"flex",gap:4,flexShrink:0}}>
                        {isPaid&&<span style={{fontSize:10,fontWeight:700,background:"#dcfce7",color:"#15803d",padding:"1px 6px",borderRadius:4}}>会計済</span>}
                        {b.line_user_id&&<span style={{fontSize:10,fontWeight:700,background:"#f0fdf4",color:"#059669",padding:"1px 6px",borderRadius:4}}>LINE</span>}
                        {cnt===1&&<span style={{fontSize:10,fontWeight:700,background:"#fff7ed",color:"#d97706",padding:"1px 6px",borderRadius:4}}>初回</span>}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ===== 離反防止アラートパネル =====
// 最終来院から指定日数以上経過し、LINE連携済みで、かつ次回予約が入っていない患者を検出し、
// 除外（送信不要）した人を除いて一斉LINE送信できるパネル。
// ===== キャンセル一覧パネル =====
// ===== 姿勢の経過記録 =====
function PostureRecordsPanel({bookings}){
  const [query,setQuery]=React.useState("");
  const [selPatient,setSelPatient]=React.useState(null); // {name, phone}
  const [records,setRecords]=React.useState([]);
  const [loading,setLoading]=React.useState(false);
  const [showAdd,setShowAdd]=React.useState(false);
  const [toast,setToast]=React.useState("");

  // 予約データからユニークな患者一覧を作る（名前＋電話番号）
  const patientList=React.useMemo(()=>{
    const map={};
    bookings.forEach(b=>{
      if(!b.patient_name) return;
      if(!map[b.patient_name]) map[b.patient_name]={name:b.patient_name,phone:b.phone||""};
    });
    return Object.values(map).sort((a,b)=>a.name.localeCompare(b.name,"ja"));
  },[bookings]);

  const filteredPatients=query.trim()
    ? patientList.filter(p=>p.name.includes(query.trim()))
    : [];

  function showToast(msg){setToast(msg);setTimeout(()=>setToast(""),2500);}

  function loadRecords(patientName){
    setLoading(true);
    sb.select("posture_records",`?patient_name=eq.${encodeURIComponent(patientName)}&order=recorded_date.desc`)
      .then(data=>setRecords(Array.isArray(data)?data:[]))
      .catch(()=>setRecords([]))
      .finally(()=>setLoading(false));
  }

  function selectPatient(p){
    setSelPatient(p);
    setQuery("");
    setShowAdd(false);
    loadRecords(p.name);
  }

  return(
    <div style={{maxWidth:1300,margin:"0 auto"}}>
      {toast&&<div style={{background:"#f0fdf4",border:"1px solid #86efac",borderRadius:8,padding:"10px 14px",marginBottom:14,color:"#15803d",fontWeight:700,fontSize:13}}>{toast}</div>}

      <div className="card" style={{marginBottom:14}}>
        <div style={{padding:"14px 16px",borderBottom:"1px solid #f1f5f9",background:"linear-gradient(135deg,#1e3a5f,#2d6a9f)"}}>
          <div style={{color:"white",fontWeight:800,fontSize:15}}>🧍 姿勢の経過記録</div>
          <div style={{color:"rgba(255,255,255,.75)",fontSize:12,marginTop:2}}>患者様ごとに、来院時の姿勢写真とスコアの推移を記録できます</div>
        </div>
        <div style={{padding:16}}>
          <label className="form-label">患者様を検索</label>
          <input className="form-input" value={selPatient?selPatient.name:query}
            placeholder="お名前を入力してください"
            onChange={e=>{setQuery(e.target.value);setSelPatient(null);}}/>
          {filteredPatients.length>0&&!selPatient&&(
            <div style={{border:"1px solid #e2e8f0",borderRadius:8,marginTop:6,maxHeight:220,overflowY:"auto"}}>
              {filteredPatients.slice(0,20).map(p=>(
                <div key={p.name+p.phone} onClick={()=>selectPatient(p)}
                  style={{padding:"9px 12px",cursor:"pointer",borderBottom:"1px solid #f1f5f9",fontSize:13}}>
                  <span style={{fontWeight:700,color:"#1e293b"}}>{p.name}</span>
                  {p.phone&&<span style={{color:"#94a3b8",marginLeft:8,fontSize:12}}>{p.phone}</span>}
                </div>
              ))}
            </div>
          )}
        </div>
      </div>

      {selPatient&&(
        <div style={{display:"grid",gridTemplateColumns:"1fr",gap:16,alignItems:"start"}}>
          <div>
            <div className="card" style={{marginBottom:14}}>
              <div style={{padding:"14px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div>
                  <div style={{fontWeight:800,fontSize:15,color:"#1e3a5f"}}>{selPatient.name} 様</div>
                  <div style={{fontSize:12,color:"#94a3b8"}}>{records.length}件の記録</div>
                </div>
                <button onClick={()=>setShowAdd(v=>!v)} className="btn"
                  style={{padding:"8px 16px",background:showAdd?"#f1f5f9":"#1e3a5f",color:showAdd?"#374151":"white",fontWeight:700,fontSize:13,borderRadius:8}}>
                  {showAdd?"閉じる":"＋ 新規記録を追加"}
                </button>
              </div>
              {showAdd&&(
                <PostureRecordAddForm
                  patient={selPatient}
                  onSaved={()=>{setShowAdd(false);loadRecords(selPatient.name);showToast("記録を保存しました");}}
                />
              )}
            </div>

            {/* スコア推移（2件以上あれば表示） */}
            {records.filter(r=>r.posture_score!=null).length>=2&&(
              <div className="card" style={{padding:16}}>
                <div style={{fontWeight:800,fontSize:13,color:"#1e3a5f",marginBottom:12}}>スコアの推移</div>
                {(()=>{
                  const scored=[...records].filter(r=>r.posture_score!=null).sort((a,b)=>a.recorded_date.localeCompare(b.recorded_date));
                  const max=Math.max(...scored.map(r=>Number(r.posture_score)),1);
                  return(
                    <div style={{display:"flex",alignItems:"flex-end",gap:6,height:100,padding:"0 2px"}}>
                      {scored.map(r=>{
                        const pct=Math.round(Number(r.posture_score)/max*100);
                        return(
                          <div key={r.id} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
                            <div style={{fontSize:11,fontWeight:800,color:"#374151"}}>{r.posture_score}</div>
                            <div style={{width:"100%",height:`${Math.max(pct,4)}%`,background:"#1e3a5f",borderRadius:"4px 4px 0 0",minHeight:4}}/>
                            <div style={{fontSize:9,color:"#94a3b8",whiteSpace:"nowrap"}}>{r.recorded_date.slice(5)}</div>
                          </div>
                        );
                      })}
                    </div>
                  );
                })()}
              </div>
            )}
          </div>

          <div className="card">
            <div style={{padding:"12px 16px",borderBottom:"1px solid #f1f5f9",fontWeight:800,fontSize:13,color:"#1e3a5f"}}>記録の一覧</div>
            <div style={{padding:16}}>
              {loading?(
                <div style={{textAlign:"center",padding:20,color:"#94a3b8"}}>読み込み中...</div>

function PostureRecordAddForm({patient,onSaved}){
  const [date,setDate]=React.useState(new Date().toISOString().split("T")[0]);
  const [staffId,setStaffId]=React.useState(STAFF_ACCOUNTS[0]?.id||1);
  const [score,setScore]=React.useState("");
  const [type,setType]=React.useState("");
  const [notes,setNotes]=React.useState("");
  const [file,setFile]=React.useState(null);
  const [preview,setPreview]=React.useState(null);
  const [saving,setSaving]=React.useState(false);
  const [err,setErr]=React.useState("");

  function onFileChange(e){
    const f=e.target.files&&e.target.files[0];
    if(!f) return;
    setFile(f);
    setPreview(URL.createObjectURL(f));
  }

  async function save(){
    setErr("");
    setSaving(true);
    try{
      let photoUrl=null;
      if(file){
        const ext=(file.name.split(".").pop()||"jpg").toLowerCase();
        const path=`${patient.name}_${Date.now()}.${ext}`;
        const{error:uploadError}=await supabaseClient.storage.from("posture-photos").upload(path,file,{upsert:false});
        if(uploadError) throw new Error("写真のアップロードに失敗しました："+uploadError.message);
        const{data:pub}=supabaseClient.storage.from("posture-photos").getPublicUrl(path);
        photoUrl=pub&&pub.publicUrl?pub.publicUrl:null;
      }
      const result=await sb.insert("posture_records",{
        patient_name:patient.name,
        phone:patient.phone||null,
        staff_id:staffId,
        recorded_date:date,
        photo_url:photoUrl,
        posture_score:score!==""?Number(score):null,
        posture_type:type||null,
        notes:notes||null,
      });
      if(!Array.isArray(result)||result.length===0){
        throw new Error((result&&result.message)||"保存に失敗しました");
      }
      onSaved();
    }catch(e){
      setErr(e.message||"不明なエラー");
    }
    setSaving(false);
  }

  return(
    <div style={{padding:16,borderTop:"1px solid #f1f5f9"}}>
      {err&&<div style={{background:"#fef2f2",border:"1px solid #fecaca",borderRadius:8,padding:"10px 14px",marginBottom:14,color:"#dc2626",fontSize:12,fontWeight:700}}>{err}</div>}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:14}}>
        <div>
          <label className="form-label">記録日</label>
          <input type="date" className="form-input" value={date} onChange={e=>setDate(e.target.value)}/>
        </div>
        <div>
          <label className="form-label">担当スタッフ</label>
          <select className="form-input" value={staffId} onChange={e=>setStaffId(Number(e.target.value))}>
            {STAFF_ACCOUNTS.map(s=>(<option key={s.id} value={s.id}>{s.name}</option>))}
          </select>
        </div>
      </div>
      <div style={{marginBottom:14}}>
        <label className="form-label">姿勢写真</label>
        <input type="file" accept="image/*" onChange={onFileChange} style={{fontSize:13}}/>
        {preview&&<img src={preview} alt="プレビュー" style={{marginTop:8,width:120,height:120,objectFit:"cover",borderRadius:8,border:"1px solid #e2e8f0"}}/>}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 2fr",gap:14,marginBottom:14}}>
        <div>
          <label className="form-label">姿勢スコア</label>
          <input type="number" className="form-input" value={score} onChange={e=>setScore(e.target.value)} placeholder="例：72"/>
        </div>
        <div>
          <label className="form-label">分類（姿勢分析システムの結果）</label>
          <input className="form-input" value={type} onChange={e=>setType(e.target.value)} placeholder="例：猫背傾向、反り腰傾向 など"/>
        </div>
      </div>
      <div style={{marginBottom:16}}>
        <label className="form-label">スタッフのコメント・所見</label>
        <textarea className="form-input" rows={3} value={notes} onChange={e=>setNotes(e.target.value)} placeholder="改善点・気になる点など"/>
      </div>
      <button onClick={save} disabled={saving} className="btn"
        style={{width:"100%",justifyContent:"center",padding:11,fontSize:14,borderRadius:9,background:"#1e3a5f",color:"white",fontWeight:800,opacity:saving?0.6:1}}>
        {saving?"保存中...":"この記録を保存する"}
      </button>
    </div>
  );
}

    setList(list.includes(value)?list.filter(v=>v!==value):[...list,value]);
  }

  async function save(){
    setErr("");

function LineLinkCheckPanel({bookings}){
  const list=React.useMemo(()=>{
    const byPatient={};
    bookings.filter(b=>!b.cancelled&&b.patient_name).forEach(b=>{
      const key=b.patient_name;
      if(!byPatient[key]) byPatient[key]={name:b.patient_name,phone:b.phone||"",visits:[],linked:false};
      byPatient[key].visits.push(b.date);
      if(b.line_user_id) byPatient[key].linked=true;
    });
    return Object.values(byPatient)
      .filter(p=>!p.linked)
      .map(p=>({...p,visitCount:p.visits.length,lastVisit:p.visits.sort().slice(-1)[0]}))
      .sort((a,b)=>(b.lastVisit||"").localeCompare(a.lastVisit||""));
