.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:#64748b;margin-top:8px;align-items:center;}

.ctl label{display:block;font-size:11px;font-weight:800;color:#64748b;margin-bottom:3px;}
/* ログイン */
.login{max-width:380px;margin:60px auto;background:white;border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.12);overflow:hidden;}
.login .lh{background:linear-gradient(135deg,#0f2744,#1e4d8c);color:white;padding:22px;text-align:center;}
.login .lb{padding:22px;display:flex;flex-direction:column;gap:10px;}
.login input{width:100%;padding:11px 12px;font-size:15px;}

@media (max-width:860px){
  .layout{flex-direction:column;}
  .side{width:auto;height:auto;position:sticky;top:0;display:flex;overflow-x:auto;padding:6px;gap:4px;border-right:none;border-bottom:1px solid #e2e8f0;z-index:15;}
  .side button{width:auto;white-space:nowrap;padding:8px 11px;font-size:13px;margin:0;}

}

<body>
<div id="app"><div class="center">読み込み中...</div></div>
<div class="saving" id="saving"></div>
<script>
const SUPABASE_URL = "https://dctlirxcwitcupaewiyt.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRjdGxpcnhjd2l0Y3VwYWV3aXl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzOTI1NTgsImV4cCI6MjA5Nzk2ODU1OH0.ym1WINmz3W7T2HWvtzWkQcKs96RB5JU1JZL7EiMz704";
const LOGIN_ID_DOMAIN = "ando.jp";
// 予約管理システム（別システム）。評価・インセンティブ・学習カリキュラムなどはそちらを別タブで開く
const BOOKING_ORIGIN = "https://ando-seikotsu-ibaraki.vercel.app";
// 本部システムは予約管理とは別の Vercel プロジェクト。アカウント（Supabase）は同じ管理者アカウントを使う
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { storage: window.sessionStorage, persistSession: true, autoRefreshToken: true }
});

const app = document.getElementById("app");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const yen = (v) => (v === null || v === undefined || !isFinite(v)) ? "-" : (v < 0 ? "-¥" : "¥") + Math.abs(Math.round(v)).toLocaleString("ja-JP");
const man = (v) => (v === null || v === undefined || !isFinite(v)) ? "-" : `${(Math.round(v / 1000) / 10).toLocaleString("ja-JP")}万円`;
const pct = (r, d = 1) => (r === null || r === undefined || !isFinite(r)) ? "-" : `${(Math.round(r * 100 * 10 ** d) / 10 ** d).toFixed(d)}%`;
const rateCls = (r) => r === null || r === undefined ? "" : r >= 1 ? "ok" : r >= 0.8 ? "warn" : "ng";
const bar = (r, cls) => r === null || r === undefined ? "" : `<div class="bar ${cls || (r >= 1 ? "ok" : r < 0.8 ? "ng" : "")}"><i style="width:${Math.max(0, Math.min(100, r * 100))}%"></i></div>`;
const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const jstToday = () => new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10);
const todayStr = jstToday();
const thisMonth = todayStr.slice(0, 7);
const monthLabel = (k) => { const [y, m] = k.split("-"); return `${y}年${Number(m)}月`; };

// ===== 状態 =====
const S = {
  user: null, sec: lsGet("hq_sec") || "dashboard",
  model: null, modelErr: null,
  docs: {}, docsErr: null,
  bookings: null, bookingsErr: null, stores: [],
  mandala: null, mandalaErr: null, mandalaMonth: thisMonth,
  fit: null, fitErr: null,
  intake: null, intakeErr: null, intakeBooks: {}, intakeMonth: null,
  wage: null, wageErr: null, wageMonth: null,
  kpi: null, kpiErr: null,
  shift: null, shiftErr: null,
  ui: {},
};
if (!HQ.SECTIONS.some((s) => s.id === S.sec)) S.sec = "dashboard";

// ===== 通信 =====
async function token() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  return session ? session.access_token : null;
}
async function rest(path, opt = {}) {
  const t = await token();
  if (!t) { S.user = null; render(); throw new Error("ログインの有効期限が切れました。ログインし直してください"); }
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    method: opt.method || "GET",
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${t}`, "Content-Type": "application/json", ...(opt.headers || {}) },
    body: opt.body ? JSON.stringify(opt.body) : undefined,
  });
  const text = await res.text();
  const json = text ? JSON.parse(text) : null;
  if (!res.ok) throw new Error((json && (json.message || json.error)) || `HTTP ${res.status}`);
  return json;
}
async function selectAll(table, query) {
  const out = [];
  for (let off = 0; ; off += 1000) {
    const rows = await rest(`${table}?${query}&order=id.asc&limit=1000&offset=${off}`);
    out.push(...rows);
    if (rows.length < 1000) return out;
  }
}
async function apiGet(path) {
  const t = await token();
  const res = await fetch(path, { headers: { Authorization: `Bearer ${t}` } });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.error || `読み込みに失敗しました（HTTP ${res.status}）`);
  return json;
}

// ===== 本部の台帳（hq_docs） =====
// 給与・人件費の台帳は hq_private_docs（clinic_staff.salary_viewer の人だけ読める）
const PRIVATE_DOC_KEYS = ["labor"];
const docTable = (key) => PRIVATE_DOC_KEYS.includes(key) ? "hq_private_docs" : "hq_docs";
const DOC_KEYS = ["org", "people", "fit", "intake", "daily", "accounting", "education", "career", "expansion", "annual", "marketing"];
const saveTimers = {};
function doc(key) {
  if (!S.docs[key]) S.docs[key] = {};
  return S.docs[key];
}
function flash(msg, bad) {
  const el = document.getElementById("saving");
  el.textContent = msg; el.className = "saving show" + (bad ? " bad" : "");
  clearTimeout(flash.t); flash.t = setTimeout(() => { el.className = "saving" + (bad ? " bad" : ""); }, bad ? 5000 : 1400);
}
function saveDoc(key) {
  clearTimeout(saveTimers[key]);
  flash("保存中…");
  saveTimers[key] = setTimeout(async () => {
    try {
      await rest(`${docTable(key)}?on_conflict=key`, {
        method: "POST", headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
        body: { key, data: doc(key), updated_at: new Date().toISOString(), updated_by: S.user ? S.user.name : null },
      });
      flash("✓ 保存しました");
    } catch (e) { flash("保存できませんでした：" + e.message, true); }
  }, 500);
}
// パス "plans.#id.milestones.0.done" をたどる（#id は配列の中の id で探す）
function walk(obj, parts, create) {
  let cur = obj;
  for (const p of parts) {
    if (cur === null || cur === undefined) return undefined;
    if (p.startsWith("#")) cur = Array.isArray(cur) ? cur.find((x) => x && x.id === p.slice(1)) : undefined;
    else {
      if ((cur[p] === undefined || cur[p] === null) && create) cur[p] = {};
      cur = cur[p];
    }
  }
  return cur;
}
function setPath(key, path, value) {
  const parts = path.split(".");
  const last = parts.pop();
  const parent = walk(doc(key), parts, true);
  if (!parent) return;
  if (last.startsWith("#")) return;
  parent[last] = value;
}
function arr(key, path) {
  const parts = path.split(".");
  const last = parts.pop();
  const parent = walk(doc(key), parts, true);
  if (!Array.isArray(parent[last])) parent[last] = [];
  return parent[last];
}
function addItem(key, path, item) { arr(key, path).push(item); saveDoc(key); render(); }
function removeItem(key, path, id, label) {
  if (!confirm(`「${label || "この行"}」を削除しますか？`)) return;
  const a = arr(key, path); const i = a.findIndex((x) => x.id === id);
  if (i >= 0) a.splice(i, 1);
  saveDoc(key); render();
}
// 入力欄（変更したら保存。data-r があれば画面を描き直す）
function inp(key, path, value, o = {}) {
  const type = o.type || "text";
  return `<input type="${type}" data-doc="${key}" data-path="${esc(path)}" ${o.num ? 'data-num="1" inputmode="numeric"' : ""} ${o.r ? 'data-r="1"' : ""} class="${o.cls || (o.num ? "num" : "")}" ${o.ph ? `placeholder="${esc(o.ph)}"` : ""} ${o.style ? `style="${o.style}"` : ""} value="${esc(value ?? "")}"/>`;
}
function sel(key, path, value, options, o = {}) {
  return `<select data-doc="${key}" data-path="${esc(path)}" data-r="1" ${o.style ? `style="${o.style}"` : ""}>${o.blank !== undefined ? `<option value="">${esc(o.blank)}</option>` : ""}${options.map((x) => { const [v, l] = Array.isArray(x) ? x : [x, x]; return `<option value="${esc(v)}" ${String(v) === String(value ?? "") ? "selected" : ""}>${esc(l)}</option>`; }).join("")}</select>`;
}
function chk(key, path, checked) {
  return `<input type="checkbox" data-doc="${key}" data-path="${esc(path)}" data-r="1" ${checked ? "checked" : ""}/>`;
}
function area(key, path, value, ph) {

document.addEventListener("change", (e) => {
  const el = e.target;
  if (!el.dataset || !el.dataset.doc) return;
  let v = el.type === "checkbox" ? el.checked : el.value;
  if (el.dataset.num) v = v === "" ? null : Number(String(v).replace(/[,，¥円\s]/g, ""));
  if (el.dataset.num && v !== null && !isFinite(v)) { alert("数字で入力してください"); return; }
  setPath(el.dataset.doc, el.dataset.path, v);
  saveDoc(el.dataset.doc);
  if (el.dataset.r) render();
});

      .catch((e) => { S.docsErr = /hq_docs/.test(e.message) ? "本部の保存先（hq_docs テーブル）がまだありません。sql/2026-11-11_hq_docs.sql を Supabase で実行してください" : e.message; }),
    rest("rpc/is_salary_viewer", { method: "POST", body: {} }).then((v) => { S.salaryViewer = v === true; }).catch(() => { S.salaryViewer = false; }),
    rest("hq_private_docs?select=key,data").then((rows) => { (rows || []).forEach((r) => { S.docs[r.key] = r.data || {}; }); S.privateErr = null; })
      .catch((e) => { S.privateErr = /hq_private_docs|salary_viewer/.test(e.message) ? "給与・人件費の保存先（hq_private_docs）がまだありません。sql/2026-11-17_hq_private_docs.sql を Supabase で実行してください" : e.message; }),

    loadFit(false),

  ];
  await Promise.all(jobs.map((j) => j.then(render)));

  const table = `<div class="card"><div class="card-h">${esc(monthLabel(mk))}の院別判定</div><div class="card-b scroll"><table>

function fitIssues() { return S.fit ? HQ.mergeIssues(S.fit.org, doc("fit"), fitIssueClinicNames()) : []; }

// ---------- データ取り込み（院の日計表 → 部門へ自動で振り分け） ----------
async function loadIntake(refresh) {
  S.intakeErr = null;
  if (refresh) { S.intake = null; S.intakeBooks = {}; render(); }
  try { S.intake = await apiGet(`/api/intake${refresh ? "?refresh=1" : ""}`); } catch (e) { S.intake = null; S.intakeErr = e.message; }
  render();
  const f = intakeFiles()[0];
  if (f && !S.intakeMonth) loadIntakeBook(f.month);
}
// フォルダの日計表＋本部で追加したURL（月が読めないファイル＝原本などは除く）
function intakeFiles() {
  const out = [];
  const add = (id, name, src, month) => { const m = month || HQ.intakeFileMonth(name); if (m && !out.some((x) => x.id === id)) out.push({ id, name, month: m, src }); };
  ((S.intake && S.intake.files) || []).forEach((f) => add(f.id, f.name, "folder"));
  (doc("intake").extraFiles || []).forEach((f) => add(f.fileId, f.name || "", "added", f.month));
  return out.sort((a, b) => b.month.localeCompare(a.month));
}
async function loadIntakeBook(month, refresh) {
  S.intakeMonth = month;
  const f = intakeFiles().find((x) => x.month === month);
  if (!f) { render(); return; }
  if (S.intakeBooks[f.id] && !refresh) { render(); return; }
  S.intakeBooks[f.id] = "loading"; render();
  try {

      </table></details>`;

  </table><div class="legend"><span class="vtag ok">${Math.round(opt.lowRate * 100)}%以上</span><span class="vtag surplus">${Math.round((opt.lowRate - 0.15) * 100)}〜${Math.round(opt.lowRate * 100)}%</span><span class="vtag short">${Math.round((opt.lowRate - 0.15) * 100)}%未満</span><span>空欄＝稼働率タブに記録なし</span></div></div></div>` : "";
  return head + staffing + controls + shiftNote + tiles + alertsHtml + table + ehDailyProfitCard(book, dates, date, dpList) + (staffHtml ? `<div class="card"><div class="card-h">スタッフ別（${esc(date)}）</div><div class="card-b scroll">${staffHtml}</div></div>` : "") + heat;
}

// ---- KPI推移と昨対比（店舗別KPIダッシュボード） ----
async function loadKpi(refresh) {
  S.kpi = "loading"; S.kpiErr = null; render();
  try {
    const raw = await apiGet(`/api/intake?kpi=1${refresh ? "&refresh=1" : ""}`);
    S.kpi = { url: raw.url, loadedAt: raw.loadedAt, tabs: (raw.tabs || []).map((t) => HQ.parseKpiTab(t.title, t.values)).filter((t) => t.periods.length) };
  } catch (e) { S.kpi = null; S.kpiErr = e.message; }
  render();
}
// 項目ごとの表示（お金・率・回数）
function kpiFmt(item, v, short) {
  if (v === null || v === undefined || !isFinite(v)) return "-";
  if (/率/.test(item)) return pct(v, 1);
  if (/売上|生産性|利益|LTV|予算/.test(item)) return short ? man(v) : yen(v);
  if (/単価/.test(item)) return yen(v);
  return (Math.round(v * 10) / 10).toLocaleString("ja-JP");
}
function kpiYoyFmt(s, v) {
  if (v === null || v === undefined) return "-";
  if (s.rate) return `${v >= 0 ? "+" : "−"}${Math.abs(Math.round(v * 1000) / 10).toFixed(1)}pt`;
  return pct(v, 1);
}
// 「良い方向」：率でも離反率は下がるほど良い
const kpiLowerIsBetter = (item) => /離反/.test(item);
function kpiGood(s, v) {
  if (v === null || v === undefined) return null;
  const up = s.rate ? v > 0 : v > 1;
  const flat = s.rate ? v === 0 : v === 1;
  if (flat) return null;
  return kpiLowerIsBetter(s.item) ? !up : up;
}
let KPI_TIPS = [];
function kpiTip(ev, i) {
  const el = document.getElementById("kpiTip");
  if (!el) return;
  el.innerHTML = KPI_TIPS[i] || "";
  el.style.display = "block";
  const box = ev.currentTarget.ownerSVGElement.getBoundingClientRect();
  const x = ev.clientX - box.left, y = ev.clientY - box.top;
  el.style.left = `${Math.min(Math.max(8, x + 14), box.width - 200)}px`;
  el.style.top = `${Math.max(0, y - 10)}px`;
  document.querySelectorAll(".kpi-cross").forEach((c) => { c.style.opacity = c.dataset.i === String(i) ? 1 : 0; });
}
function kpiTipOff() {
  const el = document.getElementById("kpiTip"); if (el) el.style.display = "none";
  document.querySelectorAll(".kpi-cross").forEach((c) => { c.style.opacity = 0; });
}
function niceTicks(min, max, n) {
  if (min === max) { max = min + 1; }
  const span = max - min, step0 = span / n, mag = 10 ** Math.floor(Math.log10(step0));
  const step = [1, 2, 2.5, 5, 10].map((k) => k * mag).find((k) => span / k <= n) || 10 * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const out = []; for (let v = lo; v <= hi + step / 2; v += step) out.push(Math.round(v * 1e6) / 1e6);
  return out;
}
function kpiCharts(s, curLabel, prevLabel) {
  const W = 760, H = 250, L = 64, R = 86, T = 14, B = 26;
  const vals = [...s.cur, ...s.prev].filter((v) => v !== null);
  if (!vals.length) return `<div class="muted">この項目のデータがありません。</div>`;
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (!s.rate && lo >= 0) lo = 0;
  const ticks = niceTicks(lo, hi, 4);
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const X = (i) => L + (i + 0.5) * ((W - L - R) / 12);
  const Y = (v) => T + (H - T - B) * (1 - (v - y0) / (y1 - y0 || 1));
  const path = (arr) => { let d = "", pen = false; arr.forEach((v, i) => { if (v === null) { pen = false; return; } d += `${pen ? "L" : "M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`; pen = true; }); return d; };
  const lastIdx = (arr) => { for (let i = arr.length - 1; i >= 0; i--) if (arr[i] !== null) return i; return -1; };
  const grid = ticks.map((t) => `<line x1="${L}" x2="${W - R}" y1="${Y(t)}" y2="${Y(t)}" stroke="#e8e6e1" stroke-width="1"/><text x="${L - 8}" y="${Y(t) + 4}" text-anchor="end" font-size="11" fill="#64748b">${esc(kpiFmt(s.item, t, true))}</text>`).join("");
  const xlab = s.months.map((mk, i) => `<text x="${X(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="#64748b">${Number(mk.slice(5))}月</text>`).join("");
  const dots = (arr, color, dashed) => arr.map((v, i) => v === null ? "" : `<circle cx="${X(i)}" cy="${Y(v)}" r="4" fill="${dashed ? "#ffffff" : color}" stroke="${dashed ? color : "#ffffff"}" stroke-width="2"/>`).join("");
  const endLabel = (arr, color, text) => { const i = lastIdx(arr); if (i < 0) return ""; return `<text x="${X(i) + 9}" y="${Y(arr[i]) + 4}" font-size="11.5" font-weight="700" fill="#1e293b">${esc(text)}</text>`; };
  KPI_TIPS = s.months.map((mk, i) => `<b>${esc(monthLabel(mk))}　${esc(s.item)}</b><br><span style="color:#2a78d6">━</span> ${esc(curLabel)}：${esc(kpiFmt(s.item, s.cur[i]))}<br><span style="color:#eb6834">┅</span> ${esc(prevLabel)}：${esc(kpiFmt(s.item, s.prev[i]))}<br>${s.rate ? "前年差" : "昨対比"}：<b>${esc(kpiYoyFmt(s, s.yoy[i]))}</b>`);
  const hit = s.months.map((_, i) => `<line class="kpi-cross" data-i="${i}" x1="${X(i)}" x2="${X(i)}" y1="${T}" y2="${H - B}" stroke="#94a3b8" stroke-width="1" style="opacity:0"/><rect x="${X(i) - (W - L - R) / 24}" y="${T}" width="${(W - L - R) / 12}" height="${H - T - B}" fill="transparent" onmousemove="kpiTip(event,${i})" onmouseleave="kpiTipOff()"/>`).join("");
  const line = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;" role="img" aria-label="${esc(s.item)}の月別推移（${esc(curLabel)}と${esc(prevLabel)}）">
    ${grid}${xlab}
    <path d="${path(s.prev)}" fill="none" stroke="#eb6834" stroke-width="2" stroke-dasharray="6 4"/>
    <path d="${path(s.cur)}" fill="none" stroke="#2a78d6" stroke-width="2"/>
    ${dots(s.prev, "#eb6834", true)}${dots(s.cur, "#2a78d6", false)}
    ${endLabel(s.prev, "#eb6834", prevLabel)}${endLabel(s.cur, "#2a78d6", curLabel)}
    ${hit}</svg>`;
  // 昨対比（100%／0pt を基準に上下の棒）
  const H2 = 150, base = s.rate ? 0 : 1;
  const yv = s.yoy.filter((v) => v !== null);
  let bar = `<div class="muted" style="font-size:12px;">昨対比を出せる月がありません（前年度の同じ月のデータが必要です）。</div>`;
  if (yv.length) {
    const t2 = niceTicks(Math.min(base, ...yv), Math.max(base, ...yv), 3);
    const a = t2[0], b = t2[t2.length - 1];
    const Y2 = (v) => 8 + (H2 - 8 - 22) * (1 - (v - a) / (b - a || 1));
    const bw = Math.min(26, (W - L - R) / 12 - 10);
    const g2 = t2.map((t) => `<line x1="${L}" x2="${W - R}" y1="${Y2(t)}" y2="${Y2(t)}" stroke="${t === base ? "#94a3b8" : "#eeece7"}" stroke-width="1"/><text x="${L - 8}" y="${Y2(t) + 4}" text-anchor="end" font-size="11" fill="#64748b">${s.rate ? `${t > 0 ? "+" : ""}${Math.round(t * 1000) / 10}pt` : `${Math.round(t * 100)}%`}</text>`).join("");
    const bars = s.yoy.map((v, i) => {
      if (v === null) return "";
      const good = kpiGood(s, v);
      const color = good === false ? "#e34948" : "#2a78d6";
      const yTop = Math.min(Y2(v), Y2(base)), h = Math.max(1, Math.abs(Y2(v) - Y2(base)));
      const up = v >= base;
      const r = Math.min(4, h, bw / 2);
      const x = X(i) - bw / 2;
      const d = up ? `M${x},${yTop + h}V${yTop + r}Q${x},${yTop} ${x + r},${yTop}H${x + bw - r}Q${x + bw},${yTop} ${x + bw},${yTop + r}V${yTop + h}Z`
                   : `M${x},${yTop}V${yTop + h - r}Q${x},${yTop + h} ${x + r},${yTop + h}H${x + bw - r}Q${x + bw},${yTop + h} ${x + bw},${yTop + h - r}V${yTop}Z`;
      return `<path d="${d}" fill="${color}"><title>${esc(monthLabel(s.months[i]))}：${esc(kpiYoyFmt(s, v))}</title></path><text x="${X(i)}" y="${up ? yTop - 4 : yTop + h + 12}" text-anchor="middle" font-size="10.5" fill="#334155">${esc(kpiYoyFmt(s, v))}</text>`;
    }).join("");
    const xl2 = s.months.map((mk, i) => `<text x="${X(i)}" y="${H2 - 6}" text-anchor="middle" font-size="11" fill="#64748b">${Number(mk.slice(5))}月</text>`).join("");
    bar = `<svg viewBox="0 0 ${W} ${H2}" style="width:100%;height:auto;display:block;" role="img" aria-label="${esc(s.item)}の${s.rate ? "前年差" : "昨対比"}">${g2}${bars}${xl2}</svg>`;
  }
  return { line, bar };
}

    </table></div><div class="small" style="margin-top:4px;">各セルの下は${"昨対比"}（率の項目は前年差）。▲は良い方向、▼は悪い方向（離反数・離反率は下がるほど良い）。</div></details>`;
  return `<div class="card">${head()}<div class="card-b">${ctl}${tiles}${legend}<div style="position:relative;">${ch.line}<div id="kpiTip" style="display:none;position:absolute;z-index:5;background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.6;box-shadow:0 4px 12px rgba(0,0,0,.12);pointer-events:none;min-width:180px;"></div></div>${yoyLegend}${ch.bar}${table}

    <td><button class="btn-del" onclick="removeItem('accounting','payments','${p.id}','${esc(p.title || "支払い")}')">✕</button></td></tr>`).join("");

    <div class="card"><div class="card-h">スタッフ別の受講状況（受講率の低い順）</div><div class="card-b scroll">${S.model ? `<table><tr><th class="l">氏名</th><th class="l">等級</th><th>対象の研修</th><th>受講</th><th>受講率</th><th></th></tr>${pp.map((p) => `<tr><td class="l">${esc(p.name)}</td><td class="l">${esc(p.grade || "-")}</td><td>${p.target}</td><td>${p.attended}</td><td class="${p.rate < 0.8 ? "ng" : "ok"}"><b>${pct(p.rate, 0)}</b></td><td style="width:140px;">${bar(p.rate)}</td></tr>`).join("") || `<tr><td class="l muted" colspan="6">研修を登録すると表示されます</td></tr>`}</table>` : needModel()}</div></div>
    <div class="card"><div class="card-h">教育方針・技術の標準化メモ</div><div class="card-b">${area("education", "policy", d.policy, "例：入社3ヶ月で基本手技の実技チェック合格、G3は自費フルメニュー、院長は問診指導 など")}</div></div>`;
}
function toggleAttendee(id, key, on) {
  const t = (doc("education").trainings || []).find((x) => x.id === id);
  if (!t) return;
  t.attendees = (t.attendees || []).filter((k) => k !== key);
  if (on) t.attendees.push(key);
  saveDoc("education"); render();
}

      </div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;"><b style="font-size:13px;">マイルストーン ${pr.done}/${pr.total}</b><div style="flex:1;">${bar(pr.rate || 0, "blue")}</div>${pr.next ? `<span class="small">次：${esc(pr.next.title)}${pr.next.due ? "（" + esc(pr.next.due) + "）" : ""}</span>` : ""}</div>
      ${(p.milestones || []).map((m) => `<div class="ms ${m.done ? "done" : !m.done && m.due && m.due < todayStr ? "late" : ""}">${chk("expansion", `plans.#${p.id}.milestones.#${m.id}.done`, m.done)}${inp("expansion", `plans.#${p.id}.milestones.#${m.id}.title`, m.title)}${inp("expansion", `plans.#${p.id}.milestones.#${m.id}.due`, m.due, { type: "date", r: 1 })}<button class="btn-del" onclick="removeItem('expansion','plans.#${p.id}.milestones','${m.id}','${esc(m.title)}')">✕</button></div>`).join("")}
      <button class="btn btn-gray btn-sm" style="margin-top:6px;" onclick="addItem('expansion','plans.#${p.id}.milestones',{id:HQ.uid('m'),title:'',due:'',done:false})">＋ マイルストーン</button>
      <div style="margin-top:10px;">${area("expansion", `plans.#${p.id}.memo`, p.memo, "商圏・競合・物件の条件・資金計画のメモ")}</div>
    </div>`;
  }).join("");
  return head + `<div class="grid g4" style="margin-bottom:14px;">
      <div class="tile"><div class="k">進行中の計画</div><div class="v">${active.length}件</div><div class="s">開業済み ${plans.filter((p) => p.status === "開業済み").length}件</div></div>
      <div class="tile"><div class="k">初期費用の合計（進行中）</div><div class="v">${man(totalCost)}</div></div>
      <div class="tile"><div class="k">月商目標の合計（進行中）</div><div class="v">${man(totalTarget)}</div></div>
      <div class="tile"><div class="k">次の開業</div><div class="v" style="font-size:18px;">${timeline.filter((p) => p.status !== "開業済み" && p.status !== "見送り")[0] ? esc(timeline.filter((p) => p.status !== "開業済み" && p.status !== "見送り")[0].name || "-") : "-"}</div><div class="s">${timeline.filter((p) => p.status !== "開業済み" && p.status !== "見送り")[0] ? esc(timeline.filter((p) => p.status !== "開業済み" && p.status !== "見送り")[0].openDate) : ""}</div></div>
    </div>
    ${timeline.length ? `<div class="card"><div class="card-h">開業スケジュール</div><div class="card-b scroll"><table><tr><th class="l">開業予定日</th><th class="l">院名</th><th class="l">エリア</th><th class="l">状態</th><th>準備の進み具合</th><th></th></tr>${timeline.map((p) => { const pr = HQ.expansionProgress(p, todayStr); return `<tr><td class="l"><b>${esc(p.openDate)}</b></td><td class="l">${esc(p.name || "-")}</td><td class="l">${esc(p.area || "-")}</td><td class="l">${esc(p.status || "構想")}</td><td>${pct(pr.rate, 0)}</td><td style="width:140px;">${bar(pr.rate || 0, "blue")}</td></tr>`; }).join("")}</table></div></div>` : ""}
    <div style="margin-bottom:12px;"><button class="btn btn-blue" onclick="newPlan()">＋ 出店計画を追加</button></div>
    ${cards || `<div class="card"><div class="card-b muted">まだ出店計画がありません。「＋ 出店計画を追加」で、標準のマイルストーン（商圏調査〜開業）付きの計画を作れます。</div></div>`}`;
}
function newPlan() {
  const id = HQ.uid("s");
  addItem("expansion", "plans", { id, name: "", area: "", status: "構想", openDate: "", owner: "", manager: "", initialCost: null, monthlyTarget: null, monthlyProfit: null, memo: "", milestones: HQ.newMilestones(id) });
}

// ---------- 年間計画 ----------
function secAnnual() {
  const d = doc("annual");
  const curFy = HQ.fiscalYearOf(thisMonth);
  const fy = Number(S.ui.fy || curFy);
  const y = (d.years && d.years[fy]) || {};
  const months = HQ.annualByMonth(d.events, fy);
  const all = months.flatMap((m) => m.items);
  const done = all.filter((e) => e.done).length;
  const catF = S.ui.annualCat || "";
  const goals = (y.goals || []).map((g) => `<tr><td class="l">${inp("annual", `years.${fy}.goals.#${g.id}.title`, g.title, { ph: "目標（例：全社売上）", style: "width:220px;" })}</td><td class="l">${inp("annual", `years.${fy}.goals.#${g.id}.target`, g.target, { ph: "目標値（例：2億円）", style: "width:150px;" })}</td><td class="l">${inp("annual", `years.${fy}.goals.#${g.id}.owner`, g.owner, { ph: "責任者", style: "width:110px;" })}</td><td class="l">${inp("annual", `years.${fy}.goals.#${g.id}.result`, g.result, { ph: "結果・進捗", style: "width:200px;" })}</td><td><button class="btn-del" onclick="removeItem('annual','years.${fy}.goals','${g.id}','${esc(g.title)}')">✕</button></td></tr>`).join("");
  const catColor = { 全社: "", 業績: "green", 集客: "blue", 人材: "violet", "経理・事務": "amber", 教育: "violet", 出店: "red", イベント: "blue" };
  const monthCards = months.map((m) => {
    const items = m.items.filter((e) => !catF || e.cat === catF);
    return `<div class="month ${m.month === thisMonth ? "now" : ""}"><div class="mh"><span>${Number(m.month.slice(5))}月 <span class="small">${m.month.slice(0, 4)}</span></span><button class="btn btn-gray btn-sm" onclick="addItem('annual','events',{id:HQ.uid('e'),month:'${m.month}',title:'',cat:'${catF || "全社"}',owner:'',done:false})">＋</button></div>
      ${items.map((e) => `<div class="ev ${e.done ? "done" : ""}">${chk("annual", `events.#${e.id}.done`, e.done)}<select data-doc="annual" data-path="events.#${e.id}.cat" data-r="1" style="width:84px;padding:3px 4px;font-size:11px;" class="tag ${catColor[e.cat] || ""}">${HQ.ANNUAL_CATS.map((c) => `<option ${c === e.cat ? "selected" : ""}>${c}</option>`).join("")}</select>${inp("annual", `events.#${e.id}.title`, e.title, { ph: "予定・施策" })}<button class="btn-del" onclick="removeItem('annual','events','${e.id}','${esc(e.title)}')">✕</button></div>`).join("") || '<div class="muted" style="font-size:12px;">予定なし</div>'}
    </div>`;
  }).join("");
  return head2() + `<div class="card"><div class="card-b" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
      <button class="btn btn-gray btn-sm" onclick="ui('fy',${fy - 1})">◀</button><b style="font-size:16px;">${fy}年度（${fy}年7月〜${fy + 1}年6月）</b><button class="btn btn-gray btn-sm" onclick="ui('fy',${fy + 1})">▶</button>
      ${fy !== curFy ? `<button class="btn btn-gray btn-sm" onclick="ui('fy',${curFy})">今年度</button>` : ""}
      <span class="small" style="margin-left:auto;">予定 ${all.length}件・完了 ${done}件</span><div style="width:140px;">${bar(all.length ? done / all.length : 0, "blue")}</div>
      <button class="btn btn-gray btn-sm noprint" onclick="window.print()">🖨 印刷</button></div></div>
    <div class="grid g2">
      <div class="card"><div class="card-h">年度の方針・スローガン</div><div class="card-b">${area("annual", `years.${fy}.policy`, y.policy, "今年度の全社方針・重点テーマ")}</div></div>
      <div class="card"><div class="card-h"><span>年度の目標</span><button class="btn btn-blue btn-sm" onclick="addItem('annual','years.${fy}.goals',{id:HQ.uid('g'),title:'',target:'',owner:'',result:''})">＋ 目標</button></div><div class="card-b scroll"><table><tr><th class="l">目標</th><th class="l">目標値</th><th class="l">責任者</th><th class="l">結果・進捗</th><th></th></tr>${goals || `<tr><td class="l muted" colspan="5">売上・新患数・出店数・採用数などの年度目標を入れてください</td></tr>`}</table></div></div>
    </div>
    <div class="chips"><button class="chip ${!catF ? "sel" : ""}" onclick="ui('annualCat','')">すべて</button>${HQ.ANNUAL_CATS.map((c) => `<button class="chip ${catF === c ? "sel" : ""}" onclick="ui('annualCat','${c}')">${c}</button>`).join("")}</div>
    <div class="months">${monthCards}</div>`;
  function head2() { return `<div class="h2">🗓 年間計画</div><div class="lead">年度（7月〜翌6月）の方針・目標と、月ごとの予定（全社・業績・集客・人材・経理・教育・出店・イベント）を管理します。今月の未完了はダッシュボードに出ます。</div>`; }
}

// ---------- マンダラチャート ----------
// 会社・院のマンダラ（台帳の「マンダラ」シート）。本部の中でマスの編集と月のチェックができる
const MANDALA_METRICS = {
  company: { company_budget: "全社 売上予算達成率（%）", company_sales: "全社 売上（円）", company_labor: "全社 人件費率（%・以下）" },
  clinic: { clinic_budget: "売上予算達成率（%）", clinic_sales: "売上（円）", clinic_labor: "人件費率（%・以下）", clinic_new_count: "新患数（名）", clinic_new_close: "初回成約率（%）", clinic_new_continue: "継続率（%）", clinic_patient_care: "患者対応チェック実施率（%）" },
};
async function apiPost(path, body) {
  const t = await token();
  if (!t) { S.user = null; render(); throw new Error("ログインの有効期限が切れました。ログインし直してください"); }
  const res = await fetch(path, { method: "POST", headers: { Authorization: `Bearer ${t}`, "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.error || `保存できませんでした（HTTP ${res.status}）`);
  return json;
}
function editMandalaCell(scope, cell) {
  const ch = (S.mandala.charts || []).find((c) => c.scope === scope);
  const c = ch && ch.cells.find((x) => x.cell === cell);
  if (!c) return;
  S.ui.mEdit = { scope, cell, title: c.title || "", metric: c.metric || "", target: c.target ?? "", unit: c.unit || "", direction: c.direction || "以上", owner: c.owner || "", memo: c.memo || "", status: c.status || "未着手", statusMemo: c.statusMemo || "" };
  render();
}
function mDraft(k, v) { if (S.ui.mEdit) S.ui.mEdit[k] = v; }
async function saveMandalaCell() {
  const e = S.ui.mEdit;
  if (!e) return;
  if (!String(e.title).trim()) { alert("タイトルを入れてください"); return; }
  flash("保存中…");
  try {
    const before = (S.mandala.charts || []).find((c) => c.scope === e.scope).cells.find((x) => x.cell === e.cell);
    let json = await apiPost("/api/mandala", { action: "saveCell", month: S.mandalaMonth, scope: e.scope, cell: e.cell, title: e.title, metric: e.metric, target: e.target, unit: e.unit, direction: e.direction, owner: e.owner, memo: e.memo });
    if (e.cell !== 0 && (e.status !== (before.status || "未着手") || e.statusMemo !== (before.statusMemo || ""))) {
      json = await apiPost("/api/mandala", { action: "setStatus", month: S.mandalaMonth, scope: e.scope, cell: e.cell, status: e.status, memo: e.statusMemo });
    }
    S.mandala = json; S.ui.mEdit = null;
    flash("✓ 台帳に保存しました");
  } catch (err) { flash(err.message, true); alert(err.message); }
  render();
}
function mandalaEditor(ch) {
  const e = S.ui.mEdit;
  if (!e || e.scope !== ch.scope) return "";
  const metrics = ch.scope === "会社" ? MANDALA_METRICS.company : MANDALA_METRICS.clinic;
  const f = (k, v, o = {}) => `<input ${o.type ? `type="${o.type}"` : ""} value="${esc(v)}" oninput="mDraft('${k}',this.value)" style="width:100%;" ${o.ph ? `placeholder="${esc(o.ph)}"` : ""}/>`;
  return `<div class="card"><div class="card-h"><span>✏️ ${esc(ch.label)}：${e.cell === 0 ? "中心（目標・KGI）" : `マス${e.cell}`} を編集</span><button class="btn-del" onclick="S.ui.mEdit=null;render()">✕</button></div><div class="card-b">
    <div class="form">
      <div style="grid-column:1/-1;"><label>タイトル（40字まで）</label>${f("title", e.title)}</div>
      <div><label>指標（自動で数字を取る）</label><select onchange="mDraft('metric',this.value);render()" style="width:100%;"><option value="">手入力・数字なし</option>${Object.entries(metrics).map(([k, l]) => `<option value="${k}" ${e.metric === k ? "selected" : ""}>${esc(l)}</option>`).join("")}</select></div>
      <div><label>目標値</label>${f("target", e.target, { ph: "数字" })}</div>
      ${e.metric ? "" : `<div><label>単位</label>${f("unit", e.unit, { ph: "円・%・名・件" })}</div><div><label>向き</label><select onchange="mDraft('direction',this.value)" style="width:100%;"><option ${e.direction !== "以下" ? "selected" : ""}>以上</option><option ${e.direction === "以下" ? "selected" : ""}>以下</option></select></div>`}
      <div><label>担当</label>${f("owner", e.owner)}</div>
      ${e.cell !== 0 ? `<div><label>${monthLabel(S.mandalaMonth)}の状態</label><select onchange="mDraft('status',this.value)" style="width:100%;">${["未着手", "取組中", "達成"].map((x) => `<option ${e.status === x ? "selected" : ""}>${x}</option>`).join("")}</select></div>
      <div style="grid-column:1/-1;"><label>${monthLabel(S.mandalaMonth)}のチェックのメモ</label>${f("statusMemo", e.statusMemo)}</div>` : ""}
      <div style="grid-column:1/-1;"><label>メモ（やること・進め方）</label><textarea oninput="mDraft('memo',this.value)">${esc(e.memo)}</textarea></div>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;"><button class="btn btn-gray" onclick="S.ui.mEdit=null;render()">キャンセル</button><button class="btn btn-blue" onclick="saveMandalaCell()">台帳に保存</button></div>
  </div></div>`;
}
function secMandala() {
  const head = `<div class="h2">🧭 マンダラチャート</div><div class="lead">会社・各院のマンダラ（中心＝目標KGI、周り8マス＝重点の取り組み）。マスを押すと、タイトル・指標・目標・担当と、その月の状態（未着手・取組中・達成）を編集できます。保存先は台帳の「マンダラ」シートです。</div>`;
  if (S.mandala === null && !S.mandalaErr) setTimeout(loadMandala, 0);
  const monthNav = `<div class="card"><div class="card-b" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;"><button class="btn btn-gray btn-sm" onclick="S.mandalaMonth=HQ.shiftMonth(S.mandalaMonth,-1);S.ui.mEdit=null;loadMandala()">◀</button><b>${monthLabel(S.mandalaMonth)}</b><button class="btn btn-gray btn-sm" onclick="S.mandalaMonth=HQ.shiftMonth(S.mandalaMonth,1);S.ui.mEdit=null;loadMandala()">▶</button>
    <span class="small" style="margin-left:auto;">個人KDIの紐づけは<a href="${BOOKING_ORIGIN}/mandala" target="_blank" rel="noopener">マンダラ・KDI管理 ↗</a>で行います</span></div></div>`;
  if (S.mandalaErr) return head + monthNav + `<div class="err">マンダラを読み込めませんでした：${esc(S.mandalaErr)}<br><button class="btn btn-gray btn-sm" style="margin-top:6px;" onclick="loadMandala()">もう一度</button></div>`;
  if (!S.mandala || S.mandala === "loading") return head + monthNav + `<div class="center">読み込み中...</div>`;
  const charts = S.mandala.charts || [];
  const pick = S.ui.mandalaScope || (charts[0] && charts[0].scope);
  const ch = charts.find((c) => c.scope === pick) || charts[0];
  const order = [1, 2, 3, 8, 0, 4, 7, 6, 5]; // 中心を真ん中に、周りを時計回り
  const editing = S.ui.mEdit;
  const cellHtml = (c) => !c ? `<div class="mcell"></div>` : `<div class="mcell edit ${c.cell === 0 ? "c" : ""} ${editing && editing.scope === ch.scope && editing.cell === c.cell ? "sel" : ""}" ${ch.canEdit === false ? "" : `onclick="editMandalaCell('${esc(ch.scope)}',${c.cell})"`}><div class="t">${esc(c.title || "（未設定）")}</div>
    ${c.metric || c.target ? `<div class="n">${c.value === null || c.value === undefined ? "-" : (c.unit === "円" ? yen(c.value) : c.value + (c.unit || ""))}${c.target ? ` / 目標 ${c.unit === "円" ? yen(c.target) : c.target + (c.unit || "")}` : ""}</div>${c.achievement !== null && c.achievement !== undefined ? bar(c.achievement / 100) : ""}` : ""}
    ${c.owner ? `<div class="n">担当：${esc(c.owner)}</div>` : ""}
    ${c.cell !== 0 ? `<div style="display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-top:auto;"><span class="st st-${esc(c.status)}">${esc(c.status)}</span>${c.kdi && c.kdi.length ? `<span class="small">KDI ${c.kdi.length}件${c.kdiRate !== null && c.kdiRate !== undefined ? "・" + c.kdiRate + "%" : ""}</span>` : '<span class="small warn">KDIなし</span>'}</div>` : ""}</div>`;
  const summary = charts.map((c) => {
    const outer = c.cells.filter((x) => x.cell !== 0 && x.title);
    const doneN = outer.filter((x) => x.status === "達成").length;
    const doing = outer.filter((x) => x.status === "取組中").length;
    const center = c.cells.find((x) => x.cell === 0) || {};
    return `<tr style="cursor:pointer;" onclick="S.ui.mEdit=null;ui('mandalaScope','${esc(c.scope)}')"><td class="l"><b>${esc(c.label)}</b></td><td class="l">${esc(center.title || "-")}</td><td class="${center.achievement >= 100 ? "ok" : center.achievement !== null && center.achievement !== undefined ? "ng" : ""}">${center.achievement === null || center.achievement === undefined ? "-" : center.achievement + "%"}</td><td>${doneN}</td><td>${doing}</td><td>${outer.length - doneN - doing}</td><td>${(c.alerts || []).length ? `<span class="tag red">${c.alerts.length}</span>` : "-"}</td></tr>`;
  }).join("");
  return head + monthNav + `<div class="card"><div class="card-h">会社・院のマンダラ一覧（${monthLabel(S.mandalaMonth)}）</div><div class="card-b scroll"><table><tr><th class="l">対象</th><th class="l">中心の目標（KGI）</th><th>達成率</th><th>達成</th><th>取組中</th><th>未着手</th><th>アラート</th></tr>${summary}</table></div></div>
    ${ch ? `<div class="chips">${charts.map((c) => `<button class="chip ${c.scope === ch.scope ? "sel" : ""}" onclick="S.ui.mEdit=null;ui('mandalaScope','${esc(c.scope)}')">${esc(c.label)}</button>`).join("")}</div>
    <div class="grid g2"><div class="card"><div class="card-h">${esc(ch.label)}のマンダラ（${esc(ch.fy)}年度）</div><div class="card-b"><div class="mgrid">${order.map((i) => cellHtml(ch.cells.find((c) => c.cell === i))).join("")}</div></div></div>
    <div>${mandalaEditor(ch)}<div class="card"><div class="card-h">改善アラート</div><div class="card-b">${(ch.alerts || []).map((a) => `<div class="alert ${a.level === "ng" ? "ng" : "warn"}" style="cursor:default;">${esc(a.text)}</div>`).join("") || '<div class="muted">アラートはありません</div>'}</div></div></div></div>` : `<div class="muted">マンダラがありません</div>`}`;
}

// ===== ログイン =====
function renderLogin(err) {
  app.innerHTML = `${topbar()}<div class="login"><div class="lh"><div style="font-size:11px;letter-spacing:2px;opacity:.7;">${esc(HQ.COMPANY_NAME)}</div><div style="font-size:20px;font-weight:800;margin-top:4px;">🏢 本部システム</div></div>
    <form class="lb" onsubmit="event.preventDefault();doLogin()">
      ${err ? `<div class="err">${esc(err)}</div>` : ""}
      <input id="lid" placeholder="ID またはメールアドレス" autocomplete="username"/>
      <input id="lpw" type="password" placeholder="パスワード" autocomplete="current-password"/>
      <button class="btn btn-blue" type="submit" id="lbtn">ログイン</button>
      <div class="small" style="line-height:1.7;">予約管理と同じ管理者アカウント（ID・パスワード）でログインします。本部システムは管理者（社長・本部）だけが使えます。</div>
    </form></div>`;
  setTimeout(() => { const el = document.getElementById("lid"); if (el) el.focus(); }, 0);
}
async function doLogin() {
  let id = document.getElementById("lid").value.trim();
  const pw = document.getElementById("lpw").value;
  if (!id || !pw) return renderLogin("IDとパスワードを入力してください");
  if (!id.includes("@")) id = `${id}@${LOGIN_ID_DOMAIN}`;
  document.getElementById("lbtn").textContent = "確認中…";
  const { error } = await supabaseClient.auth.signInWithPassword({ email: id, password: pw });
  if (error) return renderLogin("IDまたはパスワードが違います");
  await afterLogin();
}
async function afterLogin() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) { S.user = null; render(); return; }
  const email = session.user.email;
  let ok = false, name = email;
  try {
    ok = await rest("rpc/is_hq", { method: "POST", body: {} });
    const me = await rest(`clinic_staff?select=name,role&auth_uid=eq.${session.user.id}`);
    if (me && me[0]) name = me[0].name;
  } catch (e) { ok = false; }
  S.user = { email, name, denied: ok !== true };
  if (ok === true) loadAll(); else render();
}
async function logout() {
  await supabaseClient.auth.signOut();
  S.user = null; S.model = null; S.docs = {}; S.bookings = null; S.mandala = null;
  render();
}

afterLogin();
</script>
