<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;background:#f0f4f8;min-height:100vh;}
.header{background:linear-gradient(135deg,#1e3a5f,#2d6a9f);color:white;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;}
.header h1{font-size:16px;font-weight:800;}
.header p{font-size:11px;opacity:0.75;}
.container{max-width:1400px;margin:0 auto;padding:12px 16px;}
.main-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:start;}
.main-grid .right-col{position:sticky;top:12px;}
@media (max-width:900px){
  .main-grid{display:block;}
  .main-grid .right-col{position:static;}
}
.card{background:white;border-radius:10px;margin-bottom:10px;box-shadow:0 1px 6px rgba(0,0,0,0.07);overflow:hidden;}
.card-header{padding:9px 14px;font-size:12px;font-weight:800;color:white;display:flex;align-items:center;gap:6px;}
.card-header.blue{background:#1e3a5f;}
.card-header.green{background:#059669;}
.card-header.orange{background:#d97706;}
.card-header.purple{background:#7c3aed;}
.card-header.teal{background:#0891b2;}
.card-body{padding:12px 14px;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.ins-input{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.ins-input input{flex:1;padding:8px 10px;border:1.5px solid #ddd;border-radius:8px;font-size:16px;font-weight:700;text-align:right;}
.ins-tab-row{display:flex;gap:5px;margin-bottom:10px;}
.ins-tab-btn{flex:1;padding:7px 4px;border-radius:8px;border:2px solid #e2e8f0;background:white;color:#374151;font-size:11px;font-weight:700;cursor:pointer;text-align:center;}
.ins-tab-btn.sel{border-color:#1e3a5f;background:#1e3a5f;color:white;}
.ins-rate-row{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap;}
.ins-rate-pill{flex:1;min-width:56px;padding:8px 4px;border-radius:20px;border:2px solid #1e3a5f;background:white;color:#1e3a5f;font-size:12px;font-weight:800;cursor:pointer;text-align:center;}
.ins-rate-pill.sel{background:#1e3a5f;color:white;}
.ins-history-box{background:#fdf6ec;border:1.5px solid #e8c88a;border-radius:12px;padding:12px;margin-bottom:10px;}
.ins-history-title{font-size:11px;font-weight:800;color:#92722a;margin-bottom:8px;text-align:center;}
.ins-stepper{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px;}
.ins-stepper-arrow{width:38px;height:38px;border-radius:8px;border:none;background:#c9954a;color:white;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.ins-stepper-arrow:disabled{background:#e5d3b3;cursor:default;}
.ins-stepper-center{text-align:center;min-width:110px;}
.ins-stepper-tier{font-size:13px;font-weight:800;color:#1e3a5f;}
.ins-stepper-amount{font-size:22px;font-weight:800;color:#c9954a;}
.ins-history-list{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.ins-history-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:10px 6px;border-radius:8px;border:1px solid #e8c88a;background:white;cursor:pointer;font-size:11px;text-align:center;}
.ins-history-item.sel{background:#c9954a;color:white;border-color:#c9954a;}
.ins-history-item span:last-child{font-weight:800;font-size:13px;}
.quick-btns{display:flex;gap:5px;flex-wrap:wrap;}
.quick-btn{padding:5px 8px;border-radius:6px;border:1.5px solid #ddd;background:white;cursor:pointer;font-size:11px;font-weight:600;color:#444;}
.jifee-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px;}
.jifee-btn{padding:8px 4px;border-radius:8px;border:1.5px solid #059669;background:white;color:#059669;cursor:pointer;font-size:12px;font-weight:700;text-align:center;line-height:1.4;}
.jifee-item{display:flex;align-items:center;gap:6px;padding:7px 10px;background:#f0fdf4;border-radius:8px;margin-bottom:5px;}
.jifee-item span{font-size:12px;font-weight:700;color:#1e3a5f;flex:1;}
.jifee-item input{width:80px;padding:4px 6px;border:1.5px solid #ddd;border-radius:6px;font-size:13px;text-align:right;}
.jifee-item button{background:#fef2f2;color:#ef4444;border:none;border-radius:5px;padding:3px 7px;cursor:pointer;font-size:11px;}
.summary-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #f5f5f5;font-size:13px;}

}
async function sbGet(t,f){
  const token=await getAuthToken();

  return res.json();

}

  if(!isPreOpenPeriod()) return JIFEE_CATEGORIES;
  const discount10=cat=>({
    ...cat,
    label:cat.label+"（10%OFF）",
    items:cat.items.map(it=>({label:it.label,amount:Math.round(it.amount*0.9/10)*10})),
  });

function calcInsuranceAmount(menuName, rate){

async function saveNextBookings(){
  if(state.savingBookings) return;
  const valid = state.nextBookings.filter(nb=>nb.date&&nb.time);
  if(valid.length===0){alert("日付と時間を入力してください");return;}
  const pastOnes = valid.filter(nb=>nb.date<todayStr());
  if(pastOnes.length>0){alert("過去の日付が含まれています。日付をご確認ください。");return;}
  state.savingBookings=true;render();
  try{
    for(const nb of valid){
      await sbPost("bookings",{patient_name: booking.patient_name,phone: booking.phone,staff_id: nb.staffId,date: nb.date,time: nb.time,menu: nb.menu,insurance_rate: nb.insRate,line_notify: !!booking.line_user_id,line_user_id: booking.line_user_id||null,reminded: false});
    }
    state.bookingsSaved=true;
  }catch(e){alert("予約保存エラー："+e.message);}
  state.savingBookings=false;render();
}

function calcTotal(){return(parseInt(state.insuranceAmount)||0)+state.jifeeItems.reduce((s,i)=>s+i.amount,0);}
function calcPaid(){return state.payments.reduce((s,p)=>s+(parseInt(p.amount)||0),0);}
function calcRemaining(){return calcTotal()-calcPaid();}
function calcChange(){
  const total=calcTotal();
  const nonCash=state.payments.filter(p=>p.method!=="現金").reduce((s,p)=>s+(parseInt(p.amount)||0),0);
  const cashPay=state.payments.find(p=>p.method==="現金");
  if(!cashPay) return 0;
  return (parseInt(cashPay.amount)||0)-Math.max(0,total-nonCash);
}
function addPayment(method){if(state.payments.find(p=>p.method===method)) return;state.payments.push({method,amount:Math.max(0,calcRemaining())});render();}
function removePayment(i){state.payments.splice(i,1);render();}
function updatePaymentAmount(i,val){state.payments[i].amount=parseInt(val)||0;renderSummary();}
function addJifee(label,amount){state.jifeeItems.push({label,amount});render();}

// ===== StarWebPRNTでmPOPに直接印刷する処理 =====
function padRow(left,right,width){
  left=String(left);right=String(right);
  const space=Math.max(1,width-left.length-right.length);
  return left+" ".repeat(space)+right;
}
function buildReceiptText(){
  const total=calcTotal();const ins=parseInt(state.insuranceAmount)||0;const change=calcChange();
  const DAYS_JP=["日","月","火","水","木","金","土"];
  const bd=new Date(booking.date+"T00:00:00");
  const dateLabel=`${bd.getFullYear()}年${String(bd.getMonth()+1).padStart(2,"0")}月${String(bd.getDate()).padStart(2,"0")}日（${DAYS_JP[bd.getDay()]}）`;
  const now=new Date();
  const denNo=String(booking.id).padStart(8,"0");
  const clinicName=(storeInfo&&storeInfo.name)?storeInfo.name:CLINIC_NAME_FALLBACK;
  const clinicAddr=storeInfo&&storeInfo.address?storeInfo.address:"";
  const clinicTel=storeInfo&&storeInfo.tel?storeInfo.tel:"";
  const taxIncluded=Math.round(total*8/108);
  const items=[
    ...(ins>0?[{label:booking.menu||"保険窓口負担",amount:ins}]:[]),
    ...state.jifeeItems.map(i=>({label:i.label,amount:i.amount})),
  ];
  const W=32; // mPOPは58mm幅（半角32文字目安）
  const lines=[];
  lines.push({center:true,bold:true,text:clinicName});
  if(clinicAddr) lines.push({center:true,small:true,text:clinicAddr});
  if(clinicTel) lines.push({center:true,small:true,text:"TEL："+clinicTel});
  lines.push({text:""});
  lines.push({center:true,bold:true,text:"レシート"});
  lines.push({text:"-".repeat(W)});
  lines.push({text:booking.patient_name+" 様"});
  lines.push({text:"-".repeat(W)});
  lines.push({text:padRow("伝票No.",denNo,W)});
  lines.push({text:padRow(dateLabel,booking.time,W)});
  lines.push({text:padRow("主担当",STAFF[booking.staff_id]||"",W)});
  lines.push({text:padRow("来院回数",visitCount+"回目",W)});
  lines.push({text:"-".repeat(W)});
  lines.push({text:"【ご利用メニュー】"});
  if(items.length>0){
    items.forEach(i=>{ lines.push({text:padRow(i.label,fmtPrint(i.amount),W)}); });
  }else{
    lines.push({text:padRow("－","－",W)});
  }
  lines.push({text:"-".repeat(W)});
  lines.push({text:padRow("値引",fmtPrint(0),W)});
  lines.push({text:padRow("小計（税込）",fmtPrint(total),W)});
  lines.push({text:padRow("消費税（内8%対象）",fmtPrint(taxIncluded),W)});
  lines.push({text:"=".repeat(W)});
  // 合計行はdouble-width(width:2)にすると実際の印字幅が2倍になり32桁に収まらず折り返してしまうため、
  // 太字のみ（幅は通常サイズ）にして他の行と同じ32桁の枠内に収める
  lines.push({bold:true,text:padRow("合計",fmtPrint(total),W)});
  lines.push({text:"-".repeat(W)});
  state.payments.forEach(p=>{ lines.push({text:padRow("お預かり（"+p.method+"）",fmtPrint(p.amount),W)}); });
  if(change>0) lines.push({bold:true,text:padRow("お釣り",fmtPrint(change),W)});
  lines.push({text:"-".repeat(W)});
  lines.push({center:true,small:true,text:`${dateLabel} ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")} 発行`});
  lines.push({center:true,text:"ご来院ありがとうございました"});
  return lines;
}
function printReceiptViaWebPRNT(){
  const isInWebPRNTApp=navigator.userAgent.indexOf("webPRNTSupportMessageHandler")>=0;
  if(!isInWebPRNTApp){
    // Star webPRNT Browserアプリの中でなければ従来の印刷（ブラウザの印刷機能）にフォールバックする
    window.print();
    return;
  }
  try{
    const builder=new StarWebPrintBuilder();
    let request="";
    request+=builder.createInitializationElement();
    buildReceiptText().forEach(l=>{
      request+=builder.createAlignmentElement({position:l.center?"center":"left"});
      request+=builder.createTextElement({
        data:l.text+"\n",
        emphasis:l.bold?"true":"false",
        width:l.width||1,
        height:l.width||1,
        codepage:"shift_jis",
      });
    });
    request+=builder.createFeedElement({line:3});
    request+=builder.createCutPaperElement({feed:true});

    const trader=new StarWebPrintTrader({url:"https://localhost:8001/StarWebPRNT/SendMessage"});
    trader.onReceive=function(response){
      if(response.traderSuccess==="true"){
        showPrintToast("🖨️ 印刷しました");
      }else{
        showPrintToast("❌ 印刷に失敗しました（プリンターの状態をご確認ください）");
      }
    };
    trader.onError=function(response){
      showPrintToast("❌ 印刷エラー："+(response.responseText||"接続できませんでした"));
    };
    trader.sendMessage({request:request});
  }catch(e){
    showPrintToast("❌ 印刷処理でエラーが発生しました："+e.message);
  }
}
// ===== mPOPのレシートプリンターに接続されたレジドロアを開ける =====
// 会計確定時（現金の受け渡しがある場合）に自動で呼ばれるほか、両替などレジ操作のためだけに
// 会計を介さず手動で開けたい場合は、画面右上の「レジを開ける」ボタンからmanual=trueで呼ばれる
function openCashDrawer(manual){
  const isInWebPRNTApp=navigator.userAgent.indexOf("webPRNTSupportMessageHandler")>=0;
  if(!isInWebPRNTApp){
    if(manual) showPrintToast("❌ レシートプリンター（Star webPRNT Browser）アプリ内でのみ利用できます");
    return; // レシート印刷と同じく、Star webPRNT Browserアプリ内でなければ開けない
  }
  try{
    const builder=new StarWebPrintBuilder();
    let request="";
    request+=builder.createInitializationElement();
    request+=builder.createPeripheralElement({channel:1,on:200,off:200});

    const trader=new StarWebPrintTrader({url:"https://localhost:8001/StarWebPRNT/SendMessage"});
    trader.onReceive=function(response){
      if(response.traderSuccess==="true"){
        if(manual) showPrintToast("🗄️ レジを開けました");
      }else{
        showPrintToast("❌ レジドロアを開けられませんでした（プリンターの状態をご確認ください）");
      }
    };
    trader.onError=function(response){
      showPrintToast("❌ ドロア開放エラー："+(response.responseText||"接続できませんでした"));
    };
    trader.sendMessage({request:request});
  }catch(e){
    showPrintToast("❌ ドロア開放処理でエラーが発生しました："+e.message);
  }
}
function showPrintToast(msg){
  const el=document.createElement("div");
  el.textContent=msg;
  el.style.cssText="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:white;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:700;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.25);";
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),3500);
}

// 日付ごとの空きスロットをキャッシュ
const slotCache={};
async function getAvailableSlots(date, staffId){
  const key=`${date}_${staffId}`;
  if(slotCache[key]) return slotCache[key];
  try{
    const token=await getAuthToken();
    const [bkRes,brRes]=await Promise.all([
      fetch(`${SUPABASE_URL}/rest/v1/bookings?date=eq.${date}&staff_id=eq.${staffId}`,{headers:{apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${token}`}}).then(r=>r.json()),
      fetch(`${SUPABASE_URL}/rest/v1/staff_breaks?date=eq.${date}&staff_id=eq.${staffId}`,{headers:{apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${token}`}}).then(r=>r.json()),
    ]);
    const booked=(Array.isArray(bkRes)?bkRes:[]).map(b=>b.time);
    const breaks=(Array.isArray(brRes)?brRes:[]).map(b=>b.time);
    const full=[...booked,...breaks];
    slotCache[key]=full;
    return full;
  }catch{return [];}
}

// ===== 営業時間・臨時休業日（休診日）判定 =====
// 管理画面（index.html）や患者様向け予約ページと同じ考え方で、
// 「臨時休業日（temp_closures）」＞「曜日ごとの定休日（business_hours）」の優先順位で判定する。
let businessHours=[],closures=[];
function getDayHoursPos(dayOfWeek){
  return businessHours.find(h=>h.day_of_week===dayOfWeek)||null;
}
function getClosureForDatePos(ds){
  return closures.find(c=>c.date===ds)||null;
}
function isClosedDatePos(ds){
  if(!ds) return false;
  const closureEntry=getClosureForDatePos(ds);
  if(closureEntry&&closureEntry.is_closed!==false) return true; // 臨時休業日として登録されている
  if(closureEntry&&closureEntry.is_closed===false) return false; // 「営業時間だけ変更」の日は休診扱いにしない
  if(businessHours.length===0) return false; // 営業時間データが未設定なら制限しない（フェイルセーフ）
  const d=new Date(ds+"T00:00:00");
  const dh=getDayHoursPos(d.getDay());
  if(!dh) return false;
  return dh.is_open===false;
}
// 選択した日の営業時間帯（開始・終了）を返す。「営業時間だけ変更」の日はその時間を優先する。
function getOpenCloseForDatePos(ds){
  if(!ds) return null;
  const closureEntry=getClosureForDatePos(ds);
  if(closureEntry&&closureEntry.is_closed===false&&closureEntry.open_time&&closureEntry.close_time){
    return {open:closureEntry.open_time,close:closureEntry.close_time};
  }
  if(businessHours.length===0) return null;
  const d=new Date(ds+"T00:00:00");
  const dh=getDayHoursPos(d.getDay());
  if(!dh||dh.is_open===false) return null;
  return {open:dh.open_time||"09:00",close:dh.close_time||"19:00"};
}

// 次回予約のボタン式日付選択に使う、直近45日分の日付一覧（休診日フラグ付き）
function buildUpcomingDateOptionsPos(){
  const days=[];
  const start=new Date();
  start.setHours(0,0,0,0);
  for(let i=0;i<45;i++){
    const d=new Date(start);
    d.setDate(start.getDate()+i);
    const ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    days.push({ds,d,closed:isClosedDatePos(ds)});
  }
  return days;
}

async function onNBDateChange(i, date){
  if(date && date<todayStr()){
    alert("過去の日付は選択できません。今日以降の日付を選んでください。");
    render(); // 入力欄の表示を元の値に戻す

  }
  if(date && isClosedDatePos(date)){
    alert("この日は休診日のため選択できません。別の日付をお選びください。");
    state.nextBookings[i].date="";
    state.nextBookings[i].time="";
    render();
    return;

  state.nextBookings[i].date=date;

  // 空きスロットを事前取得
  if(date) await getAvailableSlots(date, state.nextBookings[i].staffId);
  render();
}

async function save(){
  if(state.saving) return;
  const total=calcTotal();const paid=calcPaid();
  if(state.payments.length===0){alert("支払方法を追加してください");return;}
  if(paid<total&&!confirm(`支払合計(${fmt(paid)})が請求額(${fmt(total)})より少ないですが確定しますか？`)) return;
  state.saving=true;render();
  try{
    const methodStr=state.payments.map(p=>`${p.method}:${fmt(p.amount)}`).join("・");
    const jifeeTotal=state.jifeeItems.reduce((s,i)=>s+i.amount,0);
    const result=await sbPost("payments",{
      booking_id:booking.id,treatment_id:treatment?treatment.id:null,patient_name:booking.patient_name,
      payment_date:booking.date,insurance_amount:parseInt(state.insuranceAmount)||0,jifee_amount:jifeeTotal,
      total_amount:total,payment_method:methodStr,staff_id:booking.staff_id,
      memo:state.jifeeItems.map(i=>i.label).join("・")||null,
      is_training:!!booking.is_training,
    });
    if(result&&result.error){throw new Error(result.message||result.error||"保存に失敗しました");}

    // 会計が確定したタイミングで、現金の受け渡しがある場合だけレジドロアを自動で開ける
    if(state.payments.some(p=>p.method==="現金")){
      openCashDrawer();
    }

    // ===== 回数券・FP購入をpassesテーブルに自動登録 =====
    for(const item of state.jifeeItems){
      // 回数券の判定
      const kaisuMatch=item.label.match(/(.+?)(\d+)回券/);
      if(kaisuMatch){
        const count=parseInt(kaisuMatch[2]);
        // 有効期限：購入日から1年
        const expiry=new Date(booking.date);expiry.setFullYear(expiry.getFullYear()+1);
        const expiryStr=expiry.toISOString().split("T")[0];
        await sbPost("passes",{
          patient_name:booking.patient_name,
          phone:booking.phone||null,
          pass_type:item.label,
          total_count:count,
          remaining_count:count,
          amount:item.amount,
          purchased_date:booking.date,
          expiry_date:expiryStr,
          staff_id:booking.staff_id,
          active:true,
          is_training:!!booking.is_training,
        });
      }
      // FPの判定
      const fpMatch=item.label.match(/FP\s*(\d+)ヶ月/);
      if(fpMatch){
        const months=parseInt(fpMatch[1]);
        const expiry=new Date(booking.date);expiry.setMonth(expiry.getMonth()+months);
        const expiryStr=expiry.toISOString().split("T")[0];
        await sbPost("passes",{
          patient_name:booking.patient_name,
          phone:booking.phone||null,
          pass_type:item.label,
          total_count:months*30, // 日数換算
          remaining_count:months*30,
          amount:item.amount,
          purchased_date:booking.date,
          expiry_date:expiryStr,
          staff_id:booking.staff_id,
          active:true,
          is_training:!!booking.is_training,
        });
      }
    }

    // ===== 回数券消費：会計完了のタイミングで、選択されていた回数券の残数を1減らす =====
    if(booking.consumed_pass_id&&booking.consumed_pass_type==="回数券"){
      try{
        const passRows=await sbGet("passes",`?id=eq.${booking.consumed_pass_id}`);
        const pass=Array.isArray(passRows)&&passRows.length>0?passRows[0]:null;
        if(pass){
          const newRemaining=Math.max(0,(pass.remaining_count||0)-1);
          await sbPatch("passes",pass.id,{
            remaining_count:newRemaining,
            active:newRemaining>0,
          });
        }
      }catch(e){
        console.error("回数券の残数更新に失敗しました",e);
      }
    }

    state.done=true;
  }catch(e){
    alert("保存エラー："+e.message+"\n\nログイン状態が切れている可能性があります。お手数ですが管理画面に戻って再ログインしてから、もう一度お試しください。");
    state.saving=false;
  }
  render();
}

  if(!id){document.getElementById("root").innerHTML='<div style="text-align:center;padding:60px;color:#ef4444;">❌ 予約IDが指定されていません</div>';return;}

    visitCount=Array.isArray(samePatient)?samePatient.length:1;
    document.getElementById("patientBadge").textContent=booking.patient_name+" 様";
    if(booking.is_training){ document.getElementById("trainingBanner").style.display="block"; }
    // レシート発行頻度の希望（問診票または過去の会計時の設定）を読み込む
    try{
      if(booking.phone){
        const prefs=await sbGet("patient_preferences",`?phone=eq.${encodeURIComponent(booking.phone)}&limit=1`);
        if(Array.isArray(prefs)&&prefs.length>0){
          state.receiptFrequency=prefs[0].receipt_frequency;
          state.receiptFrequencyKnown=true;
        }
      }
    }catch(e){}
    state.insuranceAmount=INSURANCE_PRICES[booking.menu]||0;
    if(treatment&&treatment.treatment_types){
      treatment.treatment_types.split("・").forEach(t=>{
        if(JIFEE_PRICES[t]!==undefined&&t!=="保険") state.jifeeItems.push({label:t,amount:JIFEE_PRICES[t]});
      });
    }else{
      // 施術記録がまだ作られていない場合は、予約時に選択されたメニューからそのまま金額を反映する
      const bookingMenus = Array.isArray(booking.menus)&&booking.menus.length>0 ? booking.menus : (booking.menu?[booking.menu]:[]);
      let autoInsurance=0;
      bookingMenus.forEach(name=>{
        if(BOOKING_INSURANCE_MENU_PRICE[name]!==undefined){
          autoInsurance+=BOOKING_INSURANCE_MENU_PRICE[name];
        }else if(BOOKING_JIFEE_MENU_PRICE[name]!==undefined){
          state.jifeeItems.push({label:name,amount:BOOKING_JIFEE_MENU_PRICE[name]});
        }
      });
      if(autoInsurance>0) state.insuranceAmount=autoInsurance;
    }
    // 店舗情報（住所・電話番号）をレシート用に取得。取得できなければ店舗名のみで表示する
    try{
      if(booking.store_id){
        const stores=await sbGet("stores",`?id=eq.${booking.store_id}`);
        storeInfo=Array.isArray(stores)&&stores.length>0?stores[0]:null;
      }
    }catch(e){storeInfo=null;}
    // 営業時間・臨時休業日を取得（次回予約で休診日を選べないようにするため）
    try{
      if(booking.store_id){
        const [bh,tc]=await Promise.all([
          sbGet("business_hours",`?store_id=eq.${booking.store_id}&order=day_of_week.asc`),
          sbGet("temp_closures",`?store_id=eq.${booking.store_id}`),
        ]);
        businessHours=Array.isArray(bh)?bh:[];
        closures=Array.isArray(tc)?tc:[];
      }
    }catch(e){businessHours=[];closures=[];}
    render();
  }catch(e){document.getElementById("root").innerHTML=`<div style="text-align:center;padding:60px;color:#ef4444;">❌ エラー：${e.message}</div>`;}
}

init();
</script>
</body>
</html>
