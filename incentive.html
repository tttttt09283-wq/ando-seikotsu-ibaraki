<!DOCTYPE html>

<head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;background:#eef2f7;color:#1e293b;}
.topbar{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,#1e3a5f,#2d6a9f);color:white;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}

.wrap{max-width:960px;margin:0 auto;padding:16px;}
.card{background:white;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:14px;overflow:hidden;}
.card-h{padding:10px 16px;font-size:13px;font-weight:800;color:#1e3a5f;background:#f8fafc;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
.card-b{padding:14px 16px;}
.scroll{overflow-x:auto;}
label{display:block;font-size:11px;font-weight:700;color:#64748b;margin-bottom:4px;}
input{width:100%;padding:10px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:14px;font-family:inherit;background:white;margin-bottom:12px;}

th,td{border:1px solid #e2e8f0;padding:6px 8px;text-align:right;white-space:nowrap;}
th{background:#f8fafc;font-weight:700;color:#64748b;font-size:11px;}
td.l,th.l{text-align:left;}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;}
.chip{padding:6px 14px;border-radius:20px;border:1.5px solid #e2e8f0;background:white;color:#374151;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.chip.sel{background:#1e3a5f;color:white;border-color:#1e3a5f;}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
.kpi{background:#f8fafc;border-radius:10px;padding:10px 12px;}
.kpi .k{font-size:11px;color:#64748b;font-weight:700;}

.kpi .s{font-size:11px;color:#94a3b8;margin-top:2px;}
.ok{color:#047857;} .ng{color:#b91c1c;} .warn{color:#b45309;}
.bg-ok{background:#ecfdf5;} .bg-ng{background:#fef2f2;}
.banner{border-radius:10px;padding:10px 12px;font-size:13px;font-weight:700;margin-top:12px;line-height:1.6;}
.banner.ok{background:#ecfdf5;border:1px solid #a7f3d0;}
.banner.ng{background:#fef2f2;border:1px solid #fecaca;}
.person{border:1px solid #e2e8f0;border-radius:10px;padding:10px 12px;margin-bottom:10px;}
.person-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;}
.person-h .n{font-weight:800;font-size:14px;}
.inc{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed #e2e8f0;margin-top:8px;flex-wrap:wrap;}
.inc .t{font-size:12px;font-weight:700;}
.inc .d{font-size:11px;color:#64748b;margin-top:2px;}
.inc .amt{font-size:16px;font-weight:800;text-align:right;margin-left:auto;}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:800;margin-left:6px;vertical-align:middle;}
.b-ok{background:#d1fae5;color:#065f46;} .b-ng{background:#fee2e2;color:#991b1b;} .b-run{background:#e0e7ff;color:#3730a3;} .b-wait{background:#f1f5f9;color:#64748b;}
.bar{height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden;margin-top:6px;position:relative;}
.bar>i{display:block;height:100%;background:#2d6a9f;}
.bar.ok>i{background:#059669;}
.dots{display:flex;gap:4px;margin-top:6px;}
.dot{width:26px;height:20px;border-radius:5px;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700;background:#f1f5f9;color:#94a3b8;}
.dot.y{background:#d1fae5;color:#065f46;} .dot.n{background:#fee2e2;color:#991b1b;}
.login{max-width:360px;margin:60px auto;}
input.pay{width:120px;margin:0 6px 0 0;padding:5px 8px;font-size:12px;display:inline-block;}
.btn-save{padding:5px 10px;font-size:12px;background:#1e3a5f;color:white;}
.err{color:#b91c1c;font-size:12px;margin-bottom:10px;white-space:pre-wrap;}
.center{text-align:center;padding:60px 20px;color:#9ca3af;}
.tabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:2px solid #dbe3ee;}
.tab{flex:1;padding:10px 8px;border:none;background:none;font-family:inherit;font-size:14px;font-weight:800;color:#64748b;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;}
.tab.sel{color:#1e3a5f;border-bottom-color:#1e3a5f;}
.monthnav{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.monthnav .m{font-size:16px;font-weight:800;min-width:120px;text-align:center;}
.evrow{cursor:pointer;} .evrow:hover td{background:#f8fafc;}
.item{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px dashed #e2e8f0;flex-wrap:wrap;}
.item .lbl{flex:1;min-width:180px;}
.item .lbl b{font-size:13px;} .item .lbl .d{font-size:11px;color:#64748b;margin-top:2px;}
.item .pts{width:52px;text-align:right;font-weight:800;font-size:13px;}
.item .ctrl{display:flex;align-items:center;gap:8px;margin-left:auto;}
.item input.num{width:130px;margin:0;padding:7px 9px;font-size:13px;}
.score-btns{display:flex;gap:4px;}
.score-btns button{width:34px;height:32px;border-radius:7px;border:1.5px solid #cbd5e1;background:white;font-weight:800;font-family:inherit;cursor:pointer;color:#475569;}
.score-btns button.sel{background:#1e3a5f;border-color:#1e3a5f;color:white;}
.score-btns button:disabled{cursor:default;opacity:.7;}
.autotag{display:inline-block;font-size:10px;font-weight:800;background:#e0e7ff;color:#3730a3;border-radius:6px;padding:1px 6px;margin-left:6px;}
.reqtag{display:inline-block;font-size:10px;font-weight:800;background:#fee2e2;color:#991b1b;border-radius:6px;padding:1px 6px;margin-left:6px;}
.sticky-total{position:sticky;bottom:0;background:white;border-top:2px solid #e2e8f0;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
textarea{width:100%;padding:8px 10px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:13px;font-family:inherit;min-height:70px;}
.ie-card{border:1px solid #e2e8f0;border-radius:10px;padding:10px 12px;margin-bottom:10px;background:#fcfdff;}
.ie-card input,.ie-card select,.ie-card textarea{margin-bottom:8px;}
.ie-card select{width:100%;padding:9px 10px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:13px;font-family:inherit;background:white;}
.ie-head{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
.ie-head .chip{padding:4px 10px;}
.ie-head .chip:disabled{opacity:.4;cursor:default;}
.ie-grid2{display:grid;grid-template-columns:1fr 90px;gap:8px;}
.ie-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;}
.ie-check{display:flex;align-items:center;gap:6px;font-size:12px;color:#475569;font-weight:700;}
.ie-check input{width:auto;margin:0;}
.cand{display:inline-block;margin-left:6px;font-size:10px;font-weight:800;background:#fef3c7;color:#92400e;border-radius:6px;padding:1px 6px;vertical-align:middle;}
.inc-group{border:1px solid #e2e8f0;border-radius:10px;margin-bottom:10px;background:#f8fafc;}
.inc-group>summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.inc-group>summary>span:first-of-type{flex:1;text-align:left;}
.inc-group>summary b{font-size:14px;color:#1e3a5f;}
.inc-group>summary::-webkit-details-marker{display:none;}
.inc-group>summary::before{content:"▾";color:#64748b;margin-right:4px;}
.inc-group:not([open])>summary::before{content:"▸";}
.inc-group>.person{margin:0 10px 10px;background:white;}
select.pick{width:100%;padding:10px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:14px;font-family:inherit;background:white;margin-bottom:12px;}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;letter-spacing:1px;}
@media print{
  body{background:white;}
  .topbar,.tabs,.no-print{display:none!important;}
  .wrap{max-width:100%;padding:0;}
  .card{box-shadow:none;border:1px solid #999;break-inside:avoid;}
}
.lv{display:inline-block;margin-left:6px;font-size:10px;font-weight:800;border-radius:6px;padding:1px 7px;vertical-align:middle;}
.lv-up{background:#d1fae5;color:#065f46;} .lv-keep{background:#f1f5f9;color:#64748b;} .lv-warn{background:#fef3c7;color:#92400e;} .lv-down{background:#fee2e2;color:#991b1b;}
.card.career.lv-border-down{border:2px solid #fca5a5;} .card.career.lv-border-warn{border:2px solid #fcd34d;} .card.career.lv-border-up{border:2px solid #6ee7b7;}
ul.reasons{list-style:none;padding:0;margin:0;font-size:13px;line-height:1.6;}
ul.reasons li{padding:6px 10px;border-radius:8px;margin-bottom:6px;font-weight:700;}
.rs-ng{background:#fef2f2;color:#b91c1c;border-left:4px solid #ef4444;} .rs-warn{background:#fffbeb;color:#92400e;border-left:4px solid #f59e0b;}
.rs-ok{background:#ecfdf5;color:#065f46;border-left:4px solid #10b981;} .rs-muted{background:#f8fafc;color:#475569;border-left:4px solid #cbd5e1;}
table.checks td{font-size:12px;}
.st{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px;white-space:nowrap;}
.st-ok{background:#d1fae5;color:#065f46;} .st-ng{background:#fee2e2;color:#b91c1c;} .st-hit{background:#dc2626;color:white;} .st-warn{background:#fef3c7;color:#92400e;}
.st-unk{background:#f1f5f9;color:#94a3b8;} .st-man{background:#e0e7ff;color:#3730a3;}
tr.st-hit-row td{background:#fef2f2;} tr.st-ng-row td:first-child{color:#b91c1c;font-weight:700;} tr.st-warn-row td{background:#fffbeb;}
.item.neg{background:#fef2f2;border-radius:8px;padding-left:8px;padding-right:8px;} .item.neg .pts{color:#dc2626;}
.item.weak{background:#fffbeb;border-radius:8px;padding-left:8px;padding-right:8px;} .item.weak .pts{color:#b45309;}
.score-btns button.sel.low{background:#dc2626;border-color:#dc2626;}
ul.notes{padding-left:18px;font-size:12px;color:#64748b;line-height:1.7;}
</style>
</head>
<body>
<div class="topbar">
  <div>
    <h1>💰 インセンティブ・人件費42%管理</h1>
    <div class="sub" id="subLabel">読み込み中...</div>
  </div>
  <div class="topbar-actions" id="topActions"></div>
</div>
<div class="wrap" id="root"><div class="center">読み込み中...</div></div>

<script>
const SUPABASE_URL = "https://dctlirxcwitcupaewiyt.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRjdGxpcnhjd2l0Y3VwYWV3aXl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzOTI1NTgsImV4cCI6MjA5Nzk2ODU1OH0.ym1WINmz3W7T2HWvtzWkQcKs96RB5JU1JZL7EiMz704";
const LOGIN_ID_DOMAIN = "ando.jp";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { storage: window.sessionStorage, persistSession: true, autoRefreshToken: true }
});

const TYPE_LABEL = { gm: "GMインセンティブ（年間・決算）", bm: "BMインセンティブ", manager: "院長インセンティブ", staff: "スタッフインセンティブ" };
const SCOPE_LABEL = { all: "全院", block: "担当ブロック", clinic: "自院", self: "自分のみ" };

let data = null;
let halfKey = null;
let clinicFilter = ""; // 複数院を見られる人向けの絞り込み（空＝すべて）
let view = "incentive"; // incentive（インセンティブ） / evaluation（月次評価）

const root = document.getElementById("root");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const yen = (v) => (v === null || v === undefined || !isFinite(v)) ? "-" : (v < 0 ? "-¥" : "¥") + Math.abs(Math.round(v)).toLocaleString("ja-JP");
const man = (v) => (v === null || v === undefined || !isFinite(v)) ? "-" : (Math.round(v / 1000) / 10).toLocaleString("ja-JP") + "万";
const pct = (v) => (v === null || v === undefined || !isFinite(v)) ? "-" : (v * 100).toFixed(1) + "%";

function statusBadge(s) {
  const cls = s === "確定" || s === "達成ペース" ? "b-ok" : s === "未達確定" || s === "未達ペース" ? "b-ng" : s === "集計中" ? "b-run" : "b-wait";
  return `<span class="badge ${cls}">${esc(s)}</span>`;
}

// ===== ログイン =====
// ===== ログイン =====
// 院ID＋院PASS → 名前を選んで個人PASS（スタッフ・院長・BM）／メールアドレス（社長・GM）
const PIN_KEY = "ando_pin_token";
const ssGet = (k) => { try { return sessionStorage.getItem(k); } catch (e) { return null; } };
const ssSet = (k, v) => { try { v === null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) {} };
const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
let loginMode = "clinic";  // clinic（院ID） / email（社長・GM）
let clinicStep = null;     // 院IDが通ったあと { clinic, staff, clinicToken }

async function authHeader() {
  const pin = ssGet(PIN_KEY);
  if (pin) return `Pin ${pin}`;
  const { data: { session } } = await supabaseClient.auth.getSession();
  return session ? `Bearer ${session.access_token}` : null;
}

async function postJson(url, body) {
  const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.error || `エラー（HTTP ${res.status}）`);
  return json;
}

function renderLogin(msg) {
  ssSet(PIN_KEY, null);
  document.getElementById("subLabel").textContent = "ログインしてください";
  document.getElementById("topActions").innerHTML = "";
  const tabs = `<div class="tabs" style="margin-bottom:12px;"><button class="tab ${loginMode === "clinic" ? "sel" : ""}" onclick="loginMode='clinic';clinicStep=null;renderLogin()">院のIDでログイン</button><button class="tab ${loginMode === "email" ? "sel" : ""}" onclick="loginMode='email';renderLogin()">社長・GM</button></div>`;
  const err = msg ? `<div class="err">${esc(msg)}</div>` : "";
  let form;
  if (loginMode === "email") {
    form = `<label>ログインID（メールアドレス）</label><input id="lid" autocomplete="username"/>
      <label>パスワード</label><input id="lpw" type="password" autocomplete="current-password"/>
      <button class="btn btn-blue" id="lbtn">ログイン</button>
      <div class="small" style="margin-top:10px;">予約管理と同じID・パスワードでログインできます</div>`;
  } else if (!clinicStep) {
    form = `<label>院ID</label><input id="cid" autocomplete="username" autocapitalize="off" value="${esc(lsGet("ando_clinic_id") || "")}" placeholder="例：ibaraki"/>
      <label>院PASS（数字4桁）</label><input id="cpw" type="password" inputmode="numeric" maxlength="4" autocomplete="off"/>
      <button class="btn btn-blue" id="lbtn">次へ</button>
      <div class="small" style="margin-top:10px;">院ID・院PASSは院長に確認してください</div>`;
  } else {
    form = `<div style="font-weight:800;margin-bottom:8px;">${esc(clinicStep.clinic)}院</div>
      <label>名前</label><select id="pname" class="pick">${clinicStep.staff.map((p) => `<option value="${esc(p.key)}">${esc(p.name)}</option>`).join("")}</select>
      <label>個人PASS（数字4桁）</label><input id="ppw" type="password" inputmode="numeric" maxlength="4" autocomplete="off"/>
      <button class="btn btn-blue" id="lbtn">ログイン</button>
      <div style="margin-top:10px;"><button class="chip" onclick="clinicStep=null;renderLogin()">‹ 院IDからやり直す</button></div>`;
  }
  root.innerHTML = `<div class="card login"><div class="card-b">${tabs}${err}${form}</div></div>`;
  const btn = document.getElementById("lbtn");
  const go = async () => {
    btn.disabled = true;
    try {
      if (loginMode === "email") {
        const id = document.getElementById("lid").value.trim().toLowerCase();
        const pw = document.getElementById("lpw").value;
        if (!id || !pw) return renderLogin("IDとパスワードを入力してください");
        const email = id.includes("@") ? id : id + "@" + LOGIN_ID_DOMAIN;
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password: pw });
        if (error) return renderLogin("IDまたはパスワードが違います");
        return load();
      }
      if (!clinicStep) {
        const id = document.getElementById("cid").value.trim().toLowerCase();
        const pass = document.getElementById("cpw").value.trim();
        if (!id || !/^\d{4}$/.test(pass)) return renderLogin("院IDと、院PASS（数字4桁）を入力してください");
        const json = await postJson("/api/pin-login", { action: "clinic", id, pass });
        lsSet("ando_clinic_id", id);
        clinicStep = json;
        if (!json.staff.length) { clinicStep = null; return renderLogin("この院でログインできるスタッフがまだ登録されていません。社長・GMに連絡してください"); }
        return renderLogin();
      }
      const pin = document.getElementById("ppw").value.trim();
      if (!/^\d{4}$/.test(pin)) return renderLogin("個人PASS（数字4桁）を入力してください");
      const json = await postJson("/api/pin-login", { action: "person", clinicToken: clinicStep.clinicToken, personKey: document.getElementById("pname").value, pin });
      await supabaseClient.auth.signOut().catch(() => {});
      ssSet(PIN_KEY, json.token);
      clinicStep = null;
      return load();
    } catch (e) {
      if (/やり直/.test(e.message)) clinicStep = null;
      return renderLogin(e.message);
    }
  };
  btn.onclick = go;
  root.querySelectorAll("input").forEach((el) => { el.onkeydown = (e) => { if (e.key === "Enter") go(); }; });
}

async function load(refresh) {
  const auth = await authHeader();
  if (!auth) return renderLogin();
  root.innerHTML = `<div class="center">スプレッドシートを読み込み中...</div>`;
  try {
    const res = await fetch(`/api/incentive${refresh ? "?refresh=1" : ""}`, { headers: { Authorization: auth } });
    const body = await res.json().catch(() => ({}));
    if (res.status === 401) return renderLogin(body.error);
    if (!res.ok) throw new Error(body.error || `読み込みに失敗しました（HTTP ${res.status}）`);
    data = body;
    if (!halfKey) {
      const cur = data.halves.find((h) => h.elapsed.length && !h.complete) || [...data.halves].reverse().find((h) => h.elapsed.length) || data.halves[0];
      halfKey = cur.key;
    }
    render();
  } catch (e) {
    root.innerHTML = `<div class="card"><div class="card-b"><div class="err">${esc(e.message)}</div><button class="btn btn-blue" onclick="load()">もう一度読み込む</button></div></div>`;
  }
}

async function savePayroll(month) {
  const raw = document.getElementById("pay" + month).value.replace(/[,，¥円\s]/g, "");
  if (!raw || !/^\d+$/.test(raw)) return alert("支給合計額を数字で入力してください");
  if (!confirm(`${month}月の支給合計額を ${yen(Number(raw))} で保存します。よろしいですか？`)) return;
  const auth = await authHeader();
  if (!auth) return renderLogin();
  root.innerHTML = `<div class="center">保存中...</div>`;
  try {
    const res = await fetch("/api/incentive", {
      method: "POST",
      headers: { Authorization: auth, "Content-Type": "application/json" },
      body: JSON.stringify({ month, amount: Number(raw) }),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || `保存に失敗しました（HTTP ${res.status}）`);
    data = body;
    render();
  } catch (e) {
    alert(e.message);
    load();
  }
}

async function logout() {
  ssSet(PIN_KEY, null);
  await supabaseClient.auth.signOut().catch(() => {});
  data = null; halfKey = null; evalData = null; evalSelected = null; loginsData = null; view = "incentive";
  renderLogin();
}

// ===== 画面 =====
function render() {
  const v = data.viewer;
  document.getElementById("subLabel").textContent =
    `${data.fiscalYear}年度 ・ ${data.latestMonth ? data.latestMonth + "月分まで反映" : "実績なし"} ・ ${v.name}さん（${SCOPE_LABEL[v.scope]}）`;
  document.getElementById("topActions").innerHTML =
    `<button class="btn btn-outline" onclick="${view === "evaluation" ? "loadEval(true)" : view === "logins" ? "loginsData=null;render()" : "load(true)"}">↻ 最新に更新</button>` +
    `<button class="btn btn-outline" onclick="logout()">ログアウト</button>`;

  const tabs = `<div class="tabs"><button class="tab ${view === "incentive" ? "sel" : ""}" onclick="view='incentive';render()">💰 インセンティブ</button><button class="tab ${view === "evaluation" ? "sel" : ""}" onclick="view='evaluation';render()">📝 月次評価</button>${data.canManageLogins ? `<button class="tab ${view === "logins" ? "sel" : ""}" onclick="view='logins';render()">🔑 ログイン設定</button>` : ""}</div>`;
  if (view === "evaluation") {
    root.innerHTML = tabs + renderEvaluation();
    return;
  }
  if (view === "logins") {
    root.innerHTML = tabs + renderLogins();
    return;
  }
  const half = data.halves.find((h) => h.key === halfKey);
  let html = tabs + `<div class="chip-row" style="margin-bottom:14px;">${data.halves.map((h) =>
    `<button class="chip ${h.key === halfKey ? "sel" : ""}" onclick="halfKey='${h.key}';render()">${esc(h.label)}</button>`).join("")}</div>`;

  if (data.clinics.length > 1) {
    html += `<div class="chip-row" style="margin-bottom:14px;"><button class="chip ${clinicFilter ? "" : "sel"}" onclick="clinicFilter='';render()">すべての院</button>${data.clinics.map((c) =>
      `<button class="chip ${clinicFilter === c.name ? "sel" : ""}" onclick="clinicFilter='${esc(c.name)}';render()">${esc(c.name)}</button>`).join("")}</div>`;
  }
  if (data.company && !clinicFilter) html += companyCard(data.company.find((c) => c.key === halfKey));
  if (data.clinics.length) html += clinicCard(half);
  html += incentiveCard(half);
  html += salesCard();
  html += evaluationCard();
  if (data.notes && data.notes.length) html += `<div class="card"><div class="card-h">データについての注意</div><div class="card-b"><ul class="notes">${data.notes.map((n) => `<li>${esc(n)}</li>`).join("")}</ul></div></div>`;
  html += rulesCard();
  root.innerHTML = html;
}

// 院の絞り込みに合う人・院だけ
const visiblePeople = () => clinicFilter ? data.people.filter((p) => p.clinics.includes(clinicFilter)) : data.people;
const visibleClinics = () => clinicFilter ? data.clinics.filter((c) => c.name === clinicFilter) : data.clinics;

function companyCard(c) {
  if (!c || !c.monthsElapsed) return `<div class="card"><div class="card-h">全社 人件費42%枠</div><div class="card-b muted">この期間の実績はまだありません。</div></div>`;
  const within = c.payableRatio === null || c.payableRatio >= 1;
  const banner = c.incentivePaid === 0
    ? `<div class="banner ${c.roomProjected >= 0 ? "ok" : "ng"}">現時点で支給見込みのインセンティブはありません。42%枠の残り（見込み）：${yen(c.roomProjected)}</div>`
    : within
      ? `<div class="banner ok">✅ インセンティブ見込み ${yen(c.incentiveCost)}（社保込）は、42%枠の残り（見込み）${yen(c.roomProjected)} に収まっています。</div>`
      : `<div class="banner ng">⚠️ 42%枠を超えます。インセンティブ見込み ${yen(c.incentiveCost)}（社保込）に対して、枠の残り（見込み）は ${yen(c.roomProjected)}。<br>42%以内に収めるには、支給額を <b>${pct(c.payableRatio)}</b> に圧縮する必要があります（不足 ${yen(c.incentiveCost - Math.max(0, c.roomProjected))}）。</div>`;
  const payrollCell = (m) => data.isAdmin
    ? `<td><input class="pay" id="pay${m.month}" inputmode="numeric" placeholder="例 9800000" value="${m.paid ?? ""}"/><button class="btn btn-save" onclick="savePayroll(${m.month})">保存</button></td>`
    : "";
  const rows = c.months.map((m) => `<tr><td class="l">${m.month}月</td><td>${yen(m.sales)}</td><td>${yen(m.labor)}${m.laborEstimated ? ' <span class="small warn">推定</span>' : ""}</td><td class="${m.rate > data.laborCapRate ? "ng" : "ok"}">${pct(m.rate)}</td><td>${yen(m.sales * data.laborCapRate - m.labor)}</td>${payrollCell(m)}</tr>`).join("");
  return `<div class="card"><div class="card-h">全社 人件費42%枠（${esc(c.label)}・${c.monthsElapsed}ヶ月経過）</div><div class="card-b">
    <div class="kpis">
      <div class="kpi"><div class="k">売上</div><div class="v">${man(c.sales)}</div></div>
      <div class="kpi"><div class="k">人件費（社保込）</div><div class="v">${man(c.labor)}</div></div>
      <div class="kpi"><div class="k">人件費率</div><div class="v ${c.laborRate > data.laborCapRate ? "ng" : "ok"}">${pct(c.laborRate)}</div><div class="s">上限 ${pct(data.laborCapRate)}</div></div>
      <div class="kpi"><div class="k">42%枠の残り（半期見込み）</div><div class="v ${c.roomProjected >= 0 ? "ok" : "ng"}">${man(c.roomProjected)}</div><div class="s">経過分 ${man(c.room)}</div></div>
      <div class="kpi"><div class="k">インセンティブ見込み</div><div class="v">${man(c.incentivePaid)}</div><div class="s">社保込 ${man(c.incentiveCost)}</div></div>
      <div class="kpi"><div class="k">インセンティブ込み人件費率</div><div class="v ${c.laborRateWithIncentive > data.laborCapRate ? "ng" : "ok"}">${pct(c.laborRateWithIncentive)}</div></div>
    </div>
    ${banner}
    <div class="scroll" style="margin-top:12px;"><table><tr><th class="l">月</th><th>売上</th><th>人件費（社保込）</th><th>人件費率</th><th>42%枠の残り</th>${data.isAdmin ? "<th>人件費を入力<br><span class=\"small\">支給合計額（社保抜き）</span></th>" : ""}</tr>${rows}</table></div>
    ${data.isAdmin ? '<div class="small" style="margin-top:8px;">保存するとキャリア制度台帳の「月次推移ダッシュボード」に書き込まれます（会社売上も院シートの実績合計で更新）。「推定」の月は未入力です。</div>' : ""}
  </div></div>`;
}

function clinicCard(half) {
  const head = half.months.map((m) => `<th>${m}月</th>`).join("");
  const rows = visibleClinics().map((c) => {
    const ms = c.months.filter((m) => half.months.includes(m.month));
    const cells = ms.map((m) => {
      if (m.actual === null || m.actual === undefined) return `<td class="small">予算 ${man(m.budget)}</td>`;
      const ok = m.budget && m.actual >= m.budget;
      return `<td class="${ok ? "bg-ok" : "bg-ng"}"><b>${man(m.actual)}</b><div class="small">${pct(m.rate)}</div></td>`;
    }).join("");
    const budget = ms.reduce((a, m) => a + (m.actual !== null && m.actual !== undefined ? m.budget || 0 : 0), 0);
    const actual = ms.reduce((a, m) => a + (m.actual || 0), 0);
    return `<tr><td class="l"><b>${esc(c.name)}</b><div class="small">${c.manager ? "院長 " + esc(c.manager) : ""}${c.bm ? " ・BM " + esc(c.bm) : ""}</div></td>${cells}
      <td class="${budget && actual >= budget ? "ok" : "ng"}"><b>${budget ? pct(actual / budget) : "-"}</b></td>
      ${data.canSeeLabor ? `<td>${man(c.fixedLabor)}</td><td class="${c.laborRate > data.laborCapRate ? "ng" : "ok"}">${pct(c.laborRate)}</td>` : ""}</tr>`;
  }).join("");
  return `<div class="card"><div class="card-h">院別 売上予算の達成状況（${esc(half.label)}）</div><div class="card-b">
    <div class="scroll"><table><tr><th class="l">院</th>${head}<th>累計達成率</th>${data.canSeeLabor ? '<th>固定人件費</th><th>人件費率<br><span class="small">（最新月）</span></th>' : ""}</tr>${rows}</table></div>
    <div class="small" style="margin-top:8px;">緑＝予算達成、赤＝未達。${data.canSeeLabor ? "固定人件費は台帳の各院査定シートの値（社保込）です。" : ""}</div>
  </div></div>`;
}

function incentiveBody(i) {
  let extra = "";
  if (i.type === "manager") {
    extra = `<div class="dots">${i.monthly.map((m) => `<div class="dot ${m.actual === null ? "" : m.achieved ? "y" : "n"}" title="${m.month}月">${m.month}月</div>`).join("")}</div>`;
  } else if (i.type === "staff" && i.avg !== null) {
    const r = Math.min(1, i.avg / data.rules.staff.threshold);
    extra = `<div class="bar ${r >= 1 ? "ok" : ""}"><i style="width:${(r * 100).toFixed(0)}%"></i></div>`;
  } else if ((i.type === "bm" || i.type === "gm") && i.rate !== null) {
    extra = `<div class="bar ${i.rate >= 1 ? "ok" : ""}"><i style="width:${Math.min(100, i.rate * 100).toFixed(0)}%"></i></div><div class="d">累計達成率 ${pct(i.rate)}</div>`;
  }
  const amount = i.type === "manager"
    ? `${yen(i.earned)}<div class="small">最大 ${yen(i.max)}</div>`
    : `${yen(i.projected)}<div class="small">${i.status === "確定" ? "確定" : "見込み"}（満額 ${yen(i.max)}）</div>`;
  return `<div class="inc"><div style="flex:1;min-width:200px;">
      <div class="t">${TYPE_LABEL[i.type]}${statusBadge(i.status)}</div>
      <div class="d">${esc(i.detail)}</div>
      ${i.profitCondition ? `<div class="d warn">営業利益：${esc(i.profitCondition)}</div>` : ""}
      ${extra}
    </div><div class="amt">${amount}</div></div>`;
}

// インセンティブを院ごとに分けて表示（GM・BMは「全社・エリア」、院長は担当院、スタッフは所属院）
function incentiveCard(half) {
  const amountOf = (i) => (i.half === half.key ? (i.type === "manager" ? i.earned : i.projected) : 0);
  const groups = new Map(); // key → Map(personKey → { p, incs })
  const put = (key, p, i) => {
    if (!groups.has(key)) groups.set(key, new Map());
    const g = groups.get(key);
    if (!g.has(p.key)) g.set(p.key, { p, incs: [] });
    g.get(p.key).incs.push(i);
  };
  const people = [...data.people].sort((a, b) => gradeRankClient(a.grade) - gradeRankClient(b.grade));
  for (const p of people) {
    for (const i of p.incentives.filter((i) => i.half === half.key || i.type === "gm")) {
      if (i.type === "gm" || i.type === "bm") {
        if (!clinicFilter || i.type === "gm" || (i.clinics || []).includes(clinicFilter)) put("__area", p, i);
      } else {
        // 兼務の人は、見ている人の担当院のうち最初の院にまとめる
        const clinic = i.type === "manager" ? i.clinic : p.clinics.find((c) => data.clinics.some((x) => x.name === c)) || p.clinics[0] || "__other";
        if (!clinicFilter || clinic === clinicFilter) put(clinic, p, i);
      }
    }
  }
  const order = ["__area", ...data.clinics.map((c) => c.name), ...[...groups.keys()].filter((k) => k !== "__area" && !data.clinics.some((c) => c.name === k))];
  const sections = order.filter((k) => groups.has(k)).map((k) => {
    const entries = [...groups.get(k).values()];
    const sub = entries.reduce((a, e) => a + e.incs.reduce((s, i) => s + amountOf(i), 0), 0);
    const clinic = data.clinics.find((c) => c.name === k);
    const title = k === "__area" ? "全社・エリア（GM・BM）" : k === "__other" ? "所属院なし" : `${k}院`;
    const sub2 = clinic && clinic.manager ? `院長 ${esc(clinic.manager)}` : "";
    return `<details class="inc-group" open><summary><span><b>${esc(title)}</b> <span class="small">${sub2} ${entries.length}名</span></span><span class="small">見込み ${yen(sub)}</span></summary>
      ${entries.map(({ p, incs }) => `<div class="person">
        <div class="person-h"><div class="n">${esc(p.name)}</div><div class="small">${esc(p.grade)} ${esc(p.role)} ・ ${esc(p.clinics.join("・"))}</div></div>
        ${incs.map(incentiveBody).join("")}
      </div>`).join("")}
    </details>`;
  });
  const total = [...groups.values()].reduce((a, g) => a + [...g.values()].reduce((b, e) => b + e.incs.reduce((s, i) => s + amountOf(i), 0), 0), 0);
  return `<div class="card"><div class="card-h"><span>インセンティブ進捗（${esc(half.label)}）</span>${sections.length ? `<span class="small">表示中の見込み合計 ${yen(total)}</span>` : ""}</div><div class="card-b">${sections.join("") || '<div class="muted">対象のインセンティブはありません。</div>'}
    ${sections.length > 1 ? '<div class="small" style="margin-top:4px;">院の見出しを押すと開閉できます。上の院のボタンで1院だけに絞り込めます。</div>' : ""}</div></div>`;
}

function salesCard() {
  const people = visiblePeople().filter((p) => p.hasSalesData && p.monthlySales.length)
    .sort((a, b) => gradeRankClient(a.grade) - gradeRankClient(b.grade));
  if (!people.length) return "";
  const months = people[0].monthlySales.map((m) => m.month);
  const rows = people.map((p) => {
    const cells = p.monthlySales.map((m) => `<td class="${m.total >= 1000000 ? "ok" : m.total < 650000 ? "muted" : ""}">${man(m.total)}</td>`).join("");
    const ladder = p.ladder.items.map((x) => `<div class="${x.kind === "demotion" ? (x.warn ? "ng" : "muted") : x.ok ? "ok" : "muted"}">${x.ok && x.kind === "promotion" ? "★ " : ""}${esc(x.label)}：${esc(x.value)}</div>`).join("");
    return `<tr><td class="l"><b>${esc(p.name)}</b><div class="small">${esc(p.grade)} ${esc(p.clinics.join("・"))}</div></td>${cells}<td class="l" style="white-space:normal;min-width:220px;font-size:11px;">${ladder || '<span class="small">-</span>'}</td></tr>`;
  }).join("");
  return `<div class="card"><div class="card-h">個人売上（窓口＋保険請求）と昇格・降格チェック</div><div class="card-b">
    <div class="scroll"><table><tr><th class="l">氏名</th>${months.map((m) => `<th>${m}月</th>`).join("")}<th class="l">キャリアラダー（売上要件）</th></tr>${rows}</table></div>
    <div class="small" style="margin-top:8px;">緑＝100万円以上、灰＝65万円未満。昇格には売上以外の要件（技術・行動）もあります。</div>
  </div></div>`;
}

    <div class="small" style="margin-top:8px;">評価点の入力・修正はキャリア制度台帳（スプレッドシート）で行ってください。</div>

// ===== 月次評価 =====
let evalData = null;
let evalMonth = null;     // "2027-01"
let evalSelected = null;  // 開いている人のkey
let evalDraft = null;     // { values, scores, comment }
let evalLoading = false;
let evalDirty = false;    // 個人の評価画面で未保存の入力があるか
let evalCandidateOnly = false; // 一覧を院長候補だけに絞る

const EVAL_START = "2027-01"; // 本運用の開始月

function monthLabel(key) { const [y, m] = key.split("-"); return `${y}年${Number(m)}月`; }
function shiftMonth(key, d) { const [y, m] = key.split("-").map(Number); const t = new Date(y, m - 1 + d, 1); return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}`; }

async function evalFetch(method, body, refresh) {
  const auth = await authHeader();
  if (!auth) { renderLogin(); return null; }
  const url = method === "GET" ? `/api/evaluation?month=${encodeURIComponent(evalMonth || "")}${refresh ? "&refresh=1" : ""}` : "/api/evaluation";
  const res = await fetch(url, {
    method,
    headers: { Authorization: auth, ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const json = await res.json().catch(() => ({}));
  if (res.status === 401) { renderLogin(json.error); return null; }
  if (!res.ok) throw new Error(json.error || `読み込みに失敗しました（HTTP ${res.status}）`);
  return json;
}

async function loadEval(refresh) {
  if (evalLoading) return;
  evalLoading = true;
  if (view === "evaluation") root.innerHTML = `<div class="center">評価を読み込み中...</div>`;
  try {
    const json = await evalFetch("GET", null, refresh);
    if (!json) return;
    evalData = json;
    evalMonth = json.month;
    if (evalSelected && !json.people.some((p) => p.key === evalSelected)) evalSelected = null;
    if (evalSelected) openEval(evalSelected, true);
  } catch (e) {
    evalData = { error: e.message };
  } finally {
    evalLoading = false;
  }
  render();
}

function changeEvalMonth(d) { jumpEvalMonth(shiftMonth(evalMonth, d)); }

// 月を切り替える。個人の評価画面を開いていれば、その人のまま別の月を表示する
function jumpEvalMonth(key) {
  if (key === evalMonth) return;
  if (evalSelected && evalDirty && !confirm("保存していない入力があります。破棄して月を切り替えますか？")) return;
  evalMonth = key;
  evalDraft = null;
  evalDirty = false;
  evalData = null;
  render();
}

async function setupEvalSheets() {
  if (!confirm("キャリア制度台帳に「評価項目」「評価記録」シートを作成します。よろしいですか？")) return;
  root.innerHTML = `<div class="center">シートを作成中...</div>`;
  try {
    evalData = await evalFetch("POST", { action: "setup", month: evalMonth });
  } catch (e) { alert(e.message); }
  render();
}

function openEval(key, keepDraft) {
  const p = evalData.people.find((x) => x.key === key);
  if (!p) return;
  evalSelected = key;
  if (!keepDraft || !evalDraft) {
    const items = p.items || [];
    const values = {};
    for (const it of items) if (it.kind === "数値" && !(it.auto && p.auto[it.auto] !== undefined) && p.values[it.id] !== undefined) values[it.id] = p.values[it.id];
    evalDraft = { values, scores: { ...p.scores }, comment: p.comment || "" };
    evalDirty = false;
  }
  render();
  window.scrollTo(0, 0);
}

function closeEval() {
  if (evalDirty && !confirm("保存していない入力があります。破棄して一覧に戻りますか？")) return;
  evalSelected = null; evalDraft = null; evalDirty = false; render();
}

// サーバーと同じ採点（画面上ですぐ点数を出すため）
function clientScore(items, p, draft) {
  const total = items.reduce((a, it) => a + it.points, 0) || 100;
  let earned = 0, filled = 0, num = 0, beh = 0, bas = 0;
  const pts = {};
  for (const it of items) {
    let v = null;
    if (it.kind === "数値") {
      if (p.hidden && it.id in p.hidden) { // 人件費率（値は非表示・点数だけ）
        pts[it.id] = p.hidden[it.id];
        if (pts[it.id] !== null) { earned += pts[it.id]; filled++; num += pts[it.id]; }
        continue;
      }
      const val = it.auto && p.auto[it.auto] !== undefined ? p.auto[it.auto] : draft.values[it.id];
      const n = val === "" || val === undefined || val === null ? null : Number(String(val).replace(/[,%円¥\s]/g, ""));
      if (n !== null && isFinite(n) && it.target) {
        v = it.direction === "以下" ? (n <= it.target ? it.points : it.points * Math.max(0, 1 - (n - it.target) / 10)) : it.points * Math.max(0, Math.min(1, n / it.target));
      }
    } else if (draft.scores[it.id]) v = it.points * draft.scores[it.id] / 5;
    pts[it.id] = v;
    if (v !== null) { earned += v; filled++; if (it.kind === "数値") num += v; else if (it.kind === "基本") bas += v; else beh += v; }
  }
  const t = filled ? Math.round(earned / total * 1000) / 10 : null;
  const complete = filled === items.length;
  const rank = !complete || t === null ? null : t >= 90 ? "S" : t >= 80 ? "A" : t >= 65 ? "B" : t >= 50 ? "C" : "D";
  return { pts, total: t, rank, complete, filled, count: items.length, num: Math.round(num / total * 1000) / 10, beh: Math.round(beh / total * 1000) / 10, bas: Math.round(bas / total * 1000) / 10 };
}

function fmtVal(v, unit) {
  if (v === null || v === undefined || v === "") return "-";
  if (unit === "円") return yen(Number(v));
  return `${Number(v).toLocaleString("ja-JP")}${unit}`;
}
const rankCls = (r) => r === "S" || r === "A" ? "ok" : r === "D" ? "ng" : r === "C" ? "warn" : "";

function renderEvaluation() {
  if (!evalMonth) { const t = new Date(); evalMonth = `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}`; }
  if (!evalData) { if (!evalLoading) setTimeout(() => loadEval(), 0); return `<div class="center">評価を読み込み中...</div>`; }
  if (evalData.error) return `<div class="card"><div class="card-b"><div class="err">${esc(evalData.error)}</div><button class="btn btn-blue" onclick="evalData=null;render()">もう一度読み込む</button></div></div>`;
  if (itemEditor) return renderItemEditor();

  let html = `<div class="monthnav"><button class="chip" onclick="changeEvalMonth(-1)">‹ 前月</button><div class="m">${monthLabel(evalMonth)}</div><button class="chip" onclick="changeEvalMonth(1)">次月 ›</button></div>`;
  if (evalMonth < EVAL_START) html += `<div class="banner ok" style="margin:0 0 14px;">🧪 本運用は ${monthLabel(EVAL_START)} からです。それまでの月は試しに入力して使い方を確認できます。</div>`;
  if (evalData.setupNeeded) {
    html += evalData.isAdmin
      ? `<div class="card"><div class="card-b"><b>評価を始めるには、台帳に評価用のシートを作成してください。</b><div class="small" style="margin:6px 0 12px;">「評価項目」（等級別の項目・配点・目標値。シート上で自由に編集できます）と「評価記録」（毎月の評価結果）の2つを作成します。</div><button class="btn btn-blue" onclick="setupEvalSheets()">評価シートを準備</button></div></div>`
      : `<div class="card"><div class="card-b muted">管理者が評価シートを準備するまでお待ちください。</div></div>`;
  }
  if (evalData.isAdmin && evalData.legacyItems && !evalData.setupNeeded) {
    html += `<div class="banner ng" style="margin:0 0 14px;">⚠️ 評価項目シートが古い版です（「社会人としての基本」や新患の自動取得が入っていません）。<br><button class="btn btn-save" style="margin-top:8px;" onclick="resetItems()">評価項目を初期値に戻す</button>${evalData.hasRecords ? '<div class="small">保存済みの評価の点数は変わりません。</div>' : ""}</div>`;
  }
  if (evalData.newPatientError && (evalData.isAdmin || evalData.canEditItems)) {
    html += `<div class="banner ng" style="margin:0 0 14px;">⚠️ ${esc(evalData.newPatientError)}<div class="small">共有されるまでは、新患対応数・初回成約率・初回売上は自動で入りません。</div></div>`;
  }
  const candidates = evalData.people.filter((p) => p.candidate);
  if (candidates.length || evalData.people.some((p) => p.canSetCandidate)) {
    html += `<div class="chip-row" style="margin-bottom:14px;"><button class="chip ${evalCandidateOnly ? "" : "sel"}" onclick="evalCandidateOnly=false;render()">全員</button><button class="chip ${evalCandidateOnly ? "sel" : ""}" onclick="evalCandidateOnly=true;render()">⭐ 院長候補のみ（${candidates.length}名）</button></div>`;
  }
  const people = evalCandidateOnly ? candidates : evalData.people;
  const toDo = people.filter((p) => p.canEdit && !p.evaluated).length;
  const rows = people.map((p) => {
    const t = p.result;
    const status = p.evaluated ? `<b class="${rankCls(p.savedRank)}">${p.savedTotal ?? "-"}点 ${p.savedRank || ""}</b>${t.complete ? "" : `<div class="small">${t.filled}/${t.count}項目</div>`}` : `<span class="small">${p.canEdit ? "未評価" : "-"}</span>`;
    const pcScore = p.scores.pc;
    return `<tr class="evrow" onclick="openEval('${esc(p.key)}')"><td class="l"><b>${esc(p.name)}</b>${p.candidate ? '<span class="cand">⭐院長候補</span>' : ""}${levelChip(p.career)}<div class="small">${esc(p.grade)} ${esc(p.clinics.join("・"))} ・ 評価者 ${esc(p.superior)}</div></td>
      <td>${status}</td>
      <td>${p.halfAvg !== null ? `<b class="${rankCls(rankOfClient(p.halfAvg))}">${p.halfAvg}点</b><div class="small">${p.halfMonthsEvaluated}ヶ月分</div>` : "-"}</td>
      <td>${pcScore ? `${pcScore}/5` : "-"}${t.requiredMissed && t.requiredMissed.length ? '<div class="small ng">必須未達</div>' : ""}${t.basicIssues && t.basicIssues.length ? '<div class="small ng">基本に課題</div>' : ""}</td>
      <td>${p.canEdit ? `<button class="btn btn-save">${p.evaluated ? "修正" : "評価する"}</button>` : `<button class="btn btn-save" style="background:#64748b;">見る</button>`}</td></tr>`;
  }).join("");
  if (evalData.canEditItems && !evalData.setupNeeded) html += `<div style="margin-bottom:14px;text-align:right;"><button class="chip" onclick="openItemEditor('共通')">⚙️ 評価項目の設定（クラス別に追加・削除・編集）</button></div>`;
  html += `<div class="card"><div class="card-h"><span>${monthLabel(evalMonth)} の評価</span>${toDo ? `<span class="small ng">あなたの未評価 ${toDo}名</span>` : ""}</div><div class="card-b">
    ${people.length ? `<div class="scroll"><table><tr><th class="l">氏名</th><th>今月</th><th>半期平均</th><th>PC・基本</th><th></th></tr>${rows}</table></div>` : '<div class="muted">表示できる評価対象者がいません。</div>'}
    ${evalData.newPatientUnmatched && evalData.newPatientUnmatched.length ? `<div class="small warn" style="margin-top:8px;">新規集客シートの「初回施術担当者」でスタッフと結びつかなかった名前：${evalData.newPatientUnmatched.map(esc).join("、")}（台帳の評価シートに載っていない人は対象外です）</div>` : ""}
    <div class="small" style="margin-top:8px;">評価は毎月、直属の上司が付けます（スタッフ→院長、院長→BM、BM→GM）。100点満点で S90以上・A80以上・B65以上・C50以上・D50未満。半期平均が台帳の査定の点数になります。</div>
  </div></div>`;
  return html;
}
const rankOfClient = (t) => t >= 90 ? "S" : t >= 80 ? "A" : t >= 65 ? "B" : t >= 50 ? "C" : "D";

function renderEvalDetail() {
  const p = evalData.people.find((x) => x.key === evalSelected);
  const items = p.items || [];
  const ro = !p.canEdit || evalData.setupNeeded;
  const sc = clientScore(items, p, evalDraft);
  const totalPts = items.reduce((a, it) => a + it.points, 0) || 100;
  const scaled = (v) => v === null || v === undefined ? "-" : (Math.round(v / totalPts * 1000) / 10);

  const numItems = items.filter((it) => it.kind === "数値").map((it) => {
    const isHidden = p.hidden && it.id in p.hidden;
    const isAuto = isHidden || (it.auto && p.auto[it.auto] !== undefined);
    const target = it.target !== null && it.target !== undefined ? `目標 ${fmtVal(it.target, it.unit)} ${it.direction}` : "";
    const input = isHidden
      ? `<span class="small">非表示</span>`
      : isAuto
      ? `<b>${fmtVal(p.auto[it.auto], it.unit)}</b>`
      : ro ? `<b>${fmtVal(evalDraft.values[it.id], it.unit)}</b>`
      : `<input class="num" inputmode="decimal" value="${esc(evalDraft.values[it.id] ?? "")}" placeholder="${esc(it.unit)}" oninput="evalDraft.values['${esc(it.id)}']=this.value;evalDirty=true;refreshEvalTotal()"/>`;
    return `<div class="item ${negClass(it, sc.pts[it.id])}" id="item_${esc(it.id)}"><div class="lbl"><b>${esc(it.label)}</b>${isAuto ? '<span class="autotag">自動</span>' : ""}<div class="d">${esc(target)}（配点${it.points}）</div></div><div class="ctrl">${input}<div class="pts" id="pts_${esc(it.id)}">${scaled(sc.pts[it.id])}</div></div></div>`;
  }).join("");
  const scaleItems = (kind) => items.filter((it) => it.kind === kind).map((it) => {
    const cur = evalDraft.scores[it.id] || 0;
    const btns = [1, 2, 3, 4, 5].map((n) => `<button class="${cur === n ? "sel" : ""}${cur === n && n <= 2 ? " low" : ""}" ${ro ? "disabled" : ""} onclick="setEvalScore('${esc(it.id)}',${n})">${n}</button>`).join("");
    return `<div class="item ${negClass(it, sc.pts[it.id])}"><div class="lbl"><b>${esc(it.label)}</b>${it.required ? '<span class="reqtag">必須</span>' : ""}<div class="d">${esc(it.note)}（配点${it.points}）</div></div><div class="ctrl"><div class="score-btns">${btns}</div><div class="pts">${scaled(sc.pts[it.id])}</div></div></div>`;
  }).join("");

  const behItems = scaleItems("行動");
  const basicItems = scaleItems("基本");
  const basicIssues = items.filter((it) => it.kind === "基本" && evalDraft.scores[it.id] && evalDraft.scores[it.id] <= 2);
  const trend = p.trend.map((t) => `<td class="${t.month === evalMonth ? "bg-ok" : ""}" style="cursor:pointer;" onclick="jumpEvalMonth('${t.month}')" title="${monthLabel(t.month)}を開く">${t.evaluated ? `<b class="${rankCls(t.rank)}">${t.total ?? "-"}</b><div class="small">${t.rank || ""}${t.pc ? ` ・PC${t.pc}` : ""}</div>` : '<span class="small">-</span>'}</td>`).join("");
  const reqMissed = items.filter((it) => it.required && evalDraft.scores[it.id] && evalDraft.scores[it.id] < 3);

  return `<div class="monthnav" style="flex-wrap:wrap;"><button class="chip" onclick="closeEval()">‹ 一覧</button><span style="flex:1"></span><button class="chip" onclick="changeEvalMonth(-1)">‹ 前月</button><div class="m" style="min-width:100px;">${monthLabel(evalMonth)}</div><button class="chip" onclick="changeEvalMonth(1)">次月 ›</button></div>
  <div class="card"><div class="card-h"><span>${esc(p.name)}（${esc(p.grade)} ${esc(p.role)} ・ ${esc(p.clinics.join("・"))}）</span><span class="small">評価者：${esc(p.superior)}${p.evaluated ? ` ・ 最終更新 ${esc(p.updatedAt)}（${esc(p.evaluator)}）` : ""}</span></div><div class="card-b">
    <div class="small" style="margin-bottom:6px;">半期の推移（100点満点・月を押すとその月を開きます）${p.halfAvg !== null ? ` ・ 半期平均 <b class="${rankCls(rankOfClient(p.halfAvg))}">${p.halfAvg}点 ${rankOfClient(p.halfAvg)}</b>` : ""}</div>
    <div class="scroll"><table><tr>${p.trend.map((t) => `<th>${Number(t.month.split("-")[1])}月</th>`).join("")}</tr><tr>${trend}</tr></table></div>
  </div></div>
  ${careerCard(p)}
  ${candidateCard(p)}
  ${referenceCard(p)}
  <div class="card"><div class="card-h"><span>社会人としての基本（全員共通・5段階）</span><span class="small">${sc.bas}点</span></div><div class="card-b">${basicItems || '<div class="muted">項目なし</div>'}
    ${basicIssues.length ? `<div class="banner ng">⚠️ 社会人としての基本（${basicIssues.map((it) => esc(it.label)).join("・")}）が2以下です。等級に関係なく、まず改善が必要な項目です。</div>` : ""}</div></div>
  <div class="card"><div class="card-h"><span>数値の評価</span><span class="small" id="numSum">${sc.num}点</span></div><div class="card-b">${numItems || '<div class="muted">項目なし</div>'}
    <div class="small" style="margin-top:8px;">「自動」は進捗売上実績・台帳から自動で入ります。目標「以上」は達成率に応じて、「以下」は目標以下で満点（目標を10ポイント超えると0点）。</div></div></div>
  <div class="card"><div class="card-h"><span>行動の評価（5段階）</span><span class="small">${sc.beh}点</span></div><div class="card-b">${behItems || '<div class="muted">項目なし</div>'}
    <div class="small" style="margin-top:8px;">5＝期待を大きく上回る　4＝上回る　3＝できている　2＝あと一歩　1＝できていない</div>
    ${reqMissed.length ? `<div class="banner ng">⚠️ 必須項目（${reqMissed.map((it) => esc(it.label)).join("・")}）が3未満です。院長以上はPC業務が必須のため、改善指導の対象になります。</div>` : ""}</div></div>
  <div class="card"><div class="card-h">評価者コメント</div><div class="card-b">${ro ? `<div style="white-space:pre-wrap;font-size:13px;">${esc(evalDraft.comment) || '<span class="muted">なし</span>'}</div>` : `<textarea oninput="evalDraft.comment=this.value;evalDirty=true" placeholder="良かった点・次月の課題など">${esc(evalDraft.comment)}</textarea>`}</div>
    <div class="sticky-total"><div id="evalTotal">${totalHtml(sc)}</div>${ro ? "" : `<button class="btn btn-blue" style="width:auto;padding:10px 24px;" onclick="saveEval()">保存する</button>`}</div></div>`;
}

function totalHtml(sc) {
  return `<span class="small">合計</span> <b style="font-size:22px;" class="${rankCls(sc.rank)}">${sc.total ?? "-"}点</b> <b class="${rankCls(sc.rank)}">${sc.rank || ""}</b> <span class="small">（${sc.filled}/${sc.count}項目入力）</span>`;
}

function refreshEvalTotal() {
  const p = evalData.people.find((x) => x.key === evalSelected);
  const items = p.items || [];
  const sc = clientScore(items, p, evalDraft);
  const totalPts = items.reduce((a, it) => a + it.points, 0) || 100;
  for (const it of items) {
    const el = document.getElementById("pts_" + it.id);
    if (el) el.textContent = sc.pts[it.id] === null ? "-" : Math.round(sc.pts[it.id] / totalPts * 1000) / 10;
    const row = document.getElementById("item_" + it.id);
    if (row) { row.classList.remove("neg", "weak"); const c = negClass(it, sc.pts[it.id]); if (c) row.classList.add(c); }
  }
  document.getElementById("evalTotal").innerHTML = totalHtml(sc);
  document.getElementById("numSum").textContent = sc.num + "点";
}

function setEvalScore(id, n) {
  evalDraft.scores[id] = evalDraft.scores[id] === n ? undefined : n;
  evalDirty = true;
  const y = window.scrollY;
  render();
  window.scrollTo(0, y);
}

async function saveEval() {
  const p = evalData.people.find((x) => x.key === evalSelected);
  const items = p.items || [];
  const sc = clientScore(items, p, evalDraft);
  if (!sc.complete && !confirm(`まだ ${sc.count - sc.filled} 項目が未入力です。このまま保存しますか？`)) return;
  root.innerHTML = `<div class="center">保存中...</div>`;
  try {
    const json = await evalFetch("POST", { action: "save", month: evalMonth, personKey: p.key, values: evalDraft.values, scores: evalDraft.scores, comment: evalDraft.comment });
    if (json) { evalData = json; evalSelected = null; evalDraft = null; evalDirty = false; }
  } catch (e) {
    alert(e.message);
  }
  render();
}

// ===== 評価項目の設定（管理者・GM） =====
let itemEditor = null; // { grade, draft: [項目], dirty, saved }

function openItemEditor(grade) {
  if (itemEditor && itemEditor.dirty && grade !== itemEditor.grade && !confirm("保存していない変更があります。破棄してクラスを切り替えますか？")) return;
  itemEditor = { grade, draft: JSON.parse(JSON.stringify(evalData.items[grade] || [])), dirty: false, saved: false };
  render();
  window.scrollTo(0, 0);
}

function closeItemEditor() {
  if (itemEditor && itemEditor.dirty && !confirm("保存していない変更があります。破棄して戻りますか？")) return;
  itemEditor = null;
  render();
}

function itemField(i, field, value) {
  const it = itemEditor.draft[i];
  it[field] = field === "points" ? value : field === "required" ? !!value : value;
  itemEditor.dirty = true;
  itemEditor.saved = false;
  if (field === "kind") { if (value === "数値" && !it.direction) it.direction = "以上"; keepScroll(render); }
  else refreshItemTotal();
}

function itemMove(i, d) {
  const j = i + d, list = itemEditor.draft;
  if (j < 0 || j >= list.length) return;
  [list[i], list[j]] = [list[j], list[i]];
  itemEditor.dirty = true;
  keepScroll(render);
}

function itemDelete(i) {
  const it = itemEditor.draft[i];
  if (!confirm(`「${it.label || "（名前なし）"}」を削除しますか？\n（保存するまでは元に戻せます。過去の評価の点数は変わりません）`)) return;
  itemEditor.draft.splice(i, 1);
  itemEditor.dirty = true;
  keepScroll(render);
}

function itemAdd() {
  const common = itemEditor.grade === "共通";
  itemEditor.draft.push({ kind: common ? "基本" : "行動", id: "", label: "", points: 5, target: null, unit: "", direction: "", auto: "", required: false, note: "" });
  itemEditor.dirty = true;
  render();
  const inputs = document.querySelectorAll(".ie-label");
  if (inputs.length) { inputs[inputs.length - 1].focus(); inputs[inputs.length - 1].scrollIntoView({ block: "center" }); }
}

function keepScroll(fn) { const y = window.scrollY; fn(); window.scrollTo(0, y); }

function itemTotals() {
  const sumOf = (list) => list.reduce((a, it) => a + (Number(it.points) || 0), 0);
  const own = sumOf(itemEditor.draft);
  const common = itemEditor.grade === "共通" ? 0 : sumOf(evalData.items["共通"] || []);
  return { own, common, total: own + common };
}

function totalsHtml() {
  const t = itemTotals();
  if (itemEditor.grade === "共通") {
    return `<span class="small">共通の基本</span> <b style="font-size:20px;">${t.own}点</b> <span class="small">（全クラスの配点に加わります）</span>`;
  }
  const ok = t.total === 100;
  return `<span class="small">このクラス ${t.own}点 ＋ 共通の基本 ${t.common}点 ＝</span> <b style="font-size:20px;" class="${ok ? "ok" : "warn"}">${t.total}点</b>${ok ? "" : ' <span class="small warn">（100点でなくても100点満点に換算されます）</span>'}`;
}

function refreshItemTotal() {
  const el = document.getElementById("itemTotal");
  if (el) el.innerHTML = totalsHtml();
}

function renderItemEditor() {
  const g = itemEditor.grade;
  const labels = evalData.gradeLabels || {};
  const common = g === "共通";
  const chips = Object.entries(labels).map(([k, v]) => `<button class="chip ${k === g ? "sel" : ""}" onclick="openItemEditor('${esc(k)}')">${esc(v)}</button>`).join("");
  const autoOpts = (cur) => `<option value="">手入力</option>` + Object.entries(evalData.autoOptions || {}).map(([k, v]) => `<option value="${esc(k)}" ${cur === k ? "selected" : ""}>自動：${esc(v)}</option>`).join("");
  const cards = itemEditor.draft.map((it, i) => {
    const kindSel = common
      ? `<span class="badge b-run" style="margin:0;">基本</span>`
      : `<select onchange="itemField(${i},'kind',this.value)" style="width:auto;">${["行動", "数値"].map((k) => `<option ${it.kind === k ? "selected" : ""}>${k}</option>`).join("")}</select>`;
    const numFields = it.kind === "数値" ? `
      <div class="ie-grid">
        <div><label>目標値</label><input inputmode="decimal" value="${esc(it.target ?? "")}" oninput="itemField(${i},'target',this.value)" placeholder="例 70"/></div>
        <div><label>単位</label><input value="${esc(it.unit)}" oninput="itemField(${i},'unit',this.value)" placeholder="% / 円 / 名 / 件"/></div>
        <div><label>目標の向き</label><select onchange="itemField(${i},'direction',this.value)"><option value="以上" ${it.direction !== "以下" ? "selected" : ""}>以上が良い</option><option value="以下" ${it.direction === "以下" ? "selected" : ""}>以下が良い</option></select></div>
        <div><label>実績の入れ方</label><select onchange="itemField(${i},'auto',this.value)">${autoOpts(it.auto)}</select></div>
      </div>` : `
      <label class="ie-check"><input type="checkbox" ${it.required ? "checked" : ""} onchange="itemField(${i},'required',this.checked)"/> 必須にする（3未満で警告）</label>`;
    return `<div class="ie-card">
      <div class="ie-head"><span class="small">No.${i + 1}</span>${kindSel}<span style="flex:1"></span>
        <button class="chip" onclick="itemMove(${i},-1)" ${i === 0 ? "disabled" : ""}>↑</button><button class="chip" onclick="itemMove(${i},1)" ${i === itemEditor.draft.length - 1 ? "disabled" : ""}>↓</button><button class="chip" style="color:#b91c1c;" onclick="itemDelete(${i})">🗑 削除</button></div>
      <div class="ie-grid2">
        <div><label>項目</label><input class="ie-label" value="${esc(it.label)}" oninput="itemField(${i},'label',this.value)" placeholder="例：報連相"/></div>
        <div><label>配点</label><input inputmode="numeric" value="${esc(it.points)}" oninput="itemField(${i},'points',this.value)"/></div>
      </div>
      <label>内容（評価のポイント・採点基準）</label>
      <textarea oninput="itemField(${i},'note',this.value)" placeholder="（未入力）評価者が迷わないよう、何ができていれば高い点かを書いてください">${esc(it.note)}</textarea>
      ${numFields}
    </div>`;
  }).join("");

  return `<div class="monthnav"><button class="chip" onclick="closeItemEditor()">‹ 評価一覧に戻る</button><div class="m" style="text-align:left;">⚙️ 評価項目の設定</div></div>
  <div class="chip-row" style="margin-bottom:14px;">${chips}</div>
  ${itemEditor.saved ? '<div class="banner ok" style="margin:0 0 14px;">✅ 保存しました。次の評価から新しい項目が使われます（保存済みの過去の点数は変わりません）。</div>' : ""}
  <div class="card"><div class="card-h"><span>${esc(labels[g] || g)} の評価項目（${itemEditor.draft.length}項目）</span></div><div class="card-b">
    <div class="small" style="margin-bottom:10px;">${common
      ? "ここの項目は全クラス共通で、どのクラスの評価にも表示されます。"
      : "「行動」は上司が5段階で採点、「数値」は目標値に対する実績で自動採点します（実績は手入力、または売上シートから自動）。"}</div>
    ${cards || '<div class="muted">項目がありません。下のボタンから追加してください。</div>'}
    <button class="btn btn-blue" style="background:white;color:#1e3a5f;border:1.5px dashed #94a3b8;margin-top:6px;" onclick="itemAdd()">＋ 項目を追加</button>
  </div>
  ${evalData.isAdmin ? `<div style="padding:0 16px 12px;"><button class="chip" onclick="resetItems()">↺ 全クラスの評価項目を初期値に戻す</button></div>` : ""}
  <div class="sticky-total"><div id="itemTotal">${totalsHtml()}</div><button class="btn btn-blue" style="width:auto;padding:10px 24px;" onclick="saveItems()">保存する</button></div></div>`;
}

async function saveItems() {
  const items = itemEditor.draft;
  const empty = items.findIndex((it) => !String(it.label || "").trim());
  if (empty >= 0) return alert(`${empty + 1}番目の「項目」が空です`);
  if (!confirm(`「${evalData.gradeLabels[itemEditor.grade]}」の評価項目を保存します。よろしいですか？`)) return;
  const grade = itemEditor.grade;
  root.innerHTML = `<div class="center">保存中...</div>`;
  try {
    const json = await evalFetch("POST", { action: "saveItems", month: evalMonth, grade, items });
    if (json) {
      evalData = json;
      itemEditor = { grade, draft: JSON.parse(JSON.stringify(json.items[grade] || [])), dirty: false, saved: true };
    }
  } catch (e) {
    alert(e.message);
  }
  render();
}

// 今月の実績（シートから自動で取得した数字。配点に入っていない数字も参考に表示）
function referenceCard(p) {
  const a = p.auto || {};
  const cells = [
    ["個人売上", a.personal_sales, "円"], ["対応人数", a.personal_visits, "人"], ["平均売上", a.personal_avg, "円"],
    ["新患対応数", a.new_count, "名"], ["初回成約率", a.new_close, "%"], ["初回売上", a.new_sales, "円"],
    ["継続率（初回の通院率）", a.new_continue, "%"], ["初回単価", a.new_first_avg, "円"],
  ].filter(([, v]) => v !== undefined && v !== null);
  if (!cells.length) return "";
  return `<div class="card"><div class="card-h"><span>${monthLabel(evalMonth)}の実績（シートから自動）</span></div><div class="card-b">
    <div class="kpis">${cells.map(([k, v, u]) => `<div class="kpi"><div class="k">${k}</div><div class="v" style="font-size:16px;">${fmtVal(v, u)}</div></div>`).join("")}</div>
    <div class="small" style="margin-top:8px;">売上・対応人数・平均売上は「進捗売上実績」、新患の数字は「あんど新規集客」（初回施術担当者・巻き爪除く）から集計しています。</div>
  </div></div>`;
}

async function resetItems() {
  if (!confirm("評価項目シートを初期値（社会人としての基本・新患の自動取得を含む最新版）に戻します。\nシートで直した項目は元に戻ります。よろしいですか？")) return;
  root.innerHTML = `<div class="center">評価項目を初期値に戻しています...</div>`;
  try {
    const json = await evalFetch("POST", { action: "resetItems", month: evalMonth });
    if (json) { evalData = json; itemEditor = null; }
  } catch (e) { alert(e.message); }
  render();
}

// クラスが高い順（GM → BM → 院長 → 副院長 → 一般 → 新人 → 短時間 → 受付 → その他）
const GRADE_ORDER = ["G6", "G5", "G4", "G3", "G2", "G1", "-S", "-R", "-P"];
function gradeRankClient(g) { const i = GRADE_ORDER.indexOf(g); return i < 0 ? GRADE_ORDER.length : i; }

// ===== 院長候補 =====
function candidateCard(p) {
  if (!p.canSetCandidate && !p.candidate) return "";
  if (!p.canSetCandidate) {
    return `<div class="banner ok" style="margin:0 0 14px;">⭐ 院長候補${p.candidateMemo ? `：${esc(p.candidateMemo)}` : ""}</div>`;
  }
  return `<div class="card"><div class="card-b" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
    <label class="ie-check" style="font-size:14px;margin:0;"><input type="checkbox" id="candChk" ${p.candidate ? "checked" : ""}/> ⭐ 院長候補にする</label>
    <input id="candMemo" style="flex:1;min-width:180px;margin:0;" value="${esc(p.candidateMemo)}" placeholder="メモ（例：2027年度に田口山院の院長候補）"/>
    <button class="btn btn-save" onclick="saveCandidate('${esc(p.key)}')">保存</button>
    <div class="small" style="width:100%;">本人には表示されません。上司・BM・GM・管理者が見られます。</div>
  </div></div>`;
}

async function saveCandidate(key) {
  const candidate = document.getElementById("candChk").checked;
  const memo = document.getElementById("candMemo").value;
  try {
    const json = await evalFetch("POST", { action: "setCandidate", month: evalMonth, personKey: key, candidate, memo });
    if (json) { evalData = json; keepScroll(render); }
  } catch (e) { alert(e.message); }
}

// ===== ログイン設定（社長・GM） =====
let loginsData = null;
let loginsLoading = false;

async function loginsFetch(method, body) {
  const auth = await authHeader();
  if (!auth) { renderLogin(); return null; }
  const res = await fetch("/api/pin-login", {
    method,
    headers: { Authorization: auth, ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.error || `読み込みに失敗しました（HTTP ${res.status}）`);
  return json;
}

async function loadLogins(body) {
  if (loginsLoading) return;
  loginsLoading = true;
  try {
    loginsData = await loginsFetch(body ? "POST" : "GET", body);
  } catch (e) {
    if (body) alert(e.message); else loginsData = { error: e.message };
  } finally {
    loginsLoading = false;
  }
  render();
}

function reissuePin(kind, target, label) {
  if (!confirm(`${label} のPASSを再発行します。\n古いPASSは使えなくなり、${kind === "個人" ? "その人" : "この院の院PASSで入る人"}はログインし直しになります。よろしいですか？`)) return;
  root.innerHTML = `<div class="center">再発行中...</div>`;
  loadLogins(kind === "院" ? { action: "reissue", kind, clinic: target } : { action: "reissue", kind, personKey: target });
}

function generatePins() {
  if (!confirm("まだPASSが無い院・スタッフに、数字4桁のPASSをランダムで作成します。よろしいですか？")) return;
  root.innerHTML = `<div class="center">作成中...</div>`;
  loadLogins({ action: "generate" });
}

function renderLogins() {
  if (!loginsData) { if (!loginsLoading) setTimeout(() => loadLogins(), 0); return `<div class="center">読み込み中...</div>`; }
  if (loginsData.error) return `<div class="card"><div class="card-b"><div class="err">${esc(loginsData.error)}</div><button class="btn btn-blue" onclick="loginsData=null;render()">もう一度読み込む</button></div></div>`;
  const d = loginsData;
  let html = `<div class="card no-print"><div class="card-b" style="font-size:13px;line-height:1.8;">
    スタッフ・院長・BMは「院のIDでログイン」から、<b>院ID → 院PASS → 自分の名前 → 個人PASS</b> の順で入ります。見られる範囲は等級で自動で決まります（スタッフ＝自分だけ／院長＝自院／BM＝管轄エリア）。<br>
    社長・GMは今までどおりメールアドレスでログインします。PASSを${d.maxFails}回まちがえると${d.lockMinutes}分ロックされ、「再発行」で解除できます。<br>
    <b>個人PASSは本人だけに伝えてください。</b>
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
      ${d.missing ? `<button class="btn btn-blue" style="width:auto;" onclick="generatePins()">まだ無いPASSをまとめて作成（${d.missing}件）</button>` : '<span class="small ok">全員分のPASSが作成済みです</span>'}
      <button class="btn btn-save" onclick="window.print()">🖨 印刷</button>
    </div></div></div>`;
  html += d.clinics.map((c) => `<div class="card login-card"><div class="card-h"><span>${esc(c.name)}院</span>
      <span>院ID <b class="mono">${esc(c.clinicId)}</b> ・ 院PASS <b class="mono">${c.pass ? esc(c.pass) : "未作成"}</b>${c.locked ? ' <span class="badge b-ng">ロック中</span>' : ""}
      ${c.pass ? `<button class="chip no-print" onclick="reissuePin('院','${esc(c.name)}','${esc(c.name)}院')">再発行</button>` : ""}</span></div>
    <div class="card-b"><div class="scroll"><table><tr><th class="l">名前</th><th class="l">等級</th><th>個人PASS</th><th class="no-print"></th></tr>
    ${c.staff.map((p) => `<tr><td class="l"><b>${esc(p.name)}</b></td><td class="l">${esc(p.grade || "-")} ${esc(p.role || "")}</td>
      <td><b class="mono">${p.pin ? esc(p.pin) : '<span class="small">未作成</span>'}</b>${p.locked ? ' <span class="badge b-ng">ロック中</span>' : ""}</td>
      <td class="no-print">${p.pin ? `<button class="chip" onclick="reissuePin('個人','${esc(p.key)}','${esc(p.name)}')">再発行</button>` : ""}</td></tr>`).join("") || '<tr><td colspan="4" class="l muted">スタッフがいません</td></tr>'}
    </table></div></div></div>`).join("");
  return html;
}

// ===== 昇格・降格の判定 =====
const LEVEL_LABEL = { up: "昇格候補", keep: "現状維持", warn: "改善指導", down: "降格対象" };
function levelChip(c) {
  if (!c) return "";
  return `<span class="lv lv-${c.level}">${c.level === "up" ? "▲" : c.level === "down" ? "▼" : c.level === "warn" ? "！" : "－"} ${esc(LEVEL_LABEL[c.level])}</span>`;
}

const STATUS = {
  ok: ["st-ok", "✓ 達成"], ng: ["st-ng", "✕ 未達"], hit: ["st-hit", "▼ 該当"], warn: ["st-warn", "！ 注意"],
  unknown: ["st-unk", "－ データなし"], manual: ["st-man", "上司が確認"],
};
function checkRows(list, isDemotion) {
  return list.map((c) => {
    const [cls, label0] = STATUS[c.status] || STATUS.unknown;
    const label = isDemotion && c.status === "ok" ? "✓ 問題なし" : label0;
    return `<tr class="${cls}-row"><td class="l" style="white-space:normal;">${esc(c.label)}</td><td class="l" style="white-space:normal;">${esc(c.detail || "")}</td><td><span class="st ${cls}">${label}</span></td></tr>`;
  }).join("");
}

function careerCard(p) {
  const c = p.career;
  if (!c) return "";
  const reasons = c.reasons.map((r) => `<li class="rs-${r.tone}">${esc(r.text)}</li>`).join("");
  return `<div class="card career lv-border-${c.level}"><div class="card-h"><span>昇格・降格の判定（${esc(c.grade)}）</span>${levelChip(c)}</div><div class="card-b">
    <ul class="reasons">${reasons}</ul>
    ${c.promotion.length ? `<div class="small" style="margin:10px 0 4px;font-weight:800;color:#1e3a5f;">▲ ${esc(c.to)}（${esc(c.toRole)}）への昇格条件</div>
      <div class="scroll"><table class="checks"><tr><th class="l">条件</th><th class="l">いまの数字</th><th>判定</th></tr>${checkRows(c.promotion)}</table></div>` : ""}
    ${c.demotion.length ? `<div class="small" style="margin:12px 0 4px;font-weight:800;color:#991b1b;">▼ 降格・改善指導の条件（${esc(c.grade)}）</div>
      <div class="scroll"><table class="checks"><tr><th class="l">条件</th><th class="l">いまの数字</th><th>判定</th></tr>${checkRows(c.demotion, true)}</table></div>` : ""}
    <div class="small" style="margin-top:8px;">条件の文言は台帳「キャリアラダー＆昇降格規定」、数字は進捗売上実績・あんど新規集客・月次評価から自動で判定しています。最終判断は半期査定で行います。</div>
  </div></div>`;
}

// 点数が配点の6割未満（行動・基本は2以下）を赤、8割未満を黄色に
function negClass(it, pts) {
  if (pts === null || pts === undefined || !it.points) return "";
  const r = Math.round((pts / it.points) * 100) / 100; // 2.4/3 などの小数誤差を丸める
  if (r < 0.6) return "neg";
  if (r < 0.8) return "weak";
  return "";
}
